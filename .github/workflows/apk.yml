name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'icon-512.png', '.github/workflows/apk.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Android projesini olustur
        run: |
          VC=${{ github.run_number }}
          mkdir -p android/app/src/main/java/com/ahmetokkan/ummetatlasi android/app/src/main/assets android/app/src/main/res/drawable-nodpi android/app/src/main/res/values
          cp index.html android/app/src/main/assets/index.html
          cp icon-512.png android/app/src/main/res/drawable-nodpi/ic_launcher.png
          echo "" | base64 -d > android/ummet.jks

          cat > android/settings.gradle <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'UmmetAtlasi'
          include ':app'
          EOT

          cat > android/build.gradle <<'EOT'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOT

          cat > android/gradle.properties <<'EOT'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOT

          cat > android/app/build.gradle <<'EOT'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.ahmetokkan.ummetatlasi'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.ahmetokkan.ummetatlasi'
                  minSdk 23
                  targetSdk 34
                  versionCode VCODE
                  versionName '1.VCODE'
              }
              signingConfigs {
                  release {
                      storeFile file('../ummet.jks')
                      storePassword 'ummetatlasi'
                      keyAlias 'ummet'
                      keyPassword 'ummetatlasi'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOT
          sed -i "s/VCODE/$VC/g" android/app/build.gradle

          cat > android/app/src/main/res/values/strings.xml <<'EOT'
          <resources><string name="app_name">Ümmet Atlası</string></resources>
          EOT

          cat > android/app/src/main/AndroidManifest.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOT

          cat > android/app/src/main/java/com/ahmetokkan/ummetatlasi/MainActivity.java <<'EOT'
          package com.ahmetokkan.ummetatlasi;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setStatusBarColor(Color.parseColor("#0e2238"));
                  getWindow().setNavigationBarColor(Color.parseColor("#0e2238"));
                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#0e2238"));
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          if ("file".equals(u.getScheme())) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) { }
                          return true;
                      }
                  });
                  if (state != null) web.restoreState(state);
                  else web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  web.saveState(out);
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }
          }
          EOT

      - name: APK derle
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: APK adlandir
        run: cp android/app/build/outputs/apk/release/app-release.apk UmmetAtlasi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UmmetAtlasi-apk
          path: UmmetAtlasi.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: Ümmet Atlası APK (sürüm ${{ github.run_number }})
          body: Android telefona indirip kurun. Bilinmeyen kaynaklardan yükleme izni gerekebilir.
          files: UmmetAtlasi.apk
          make_latest: true
