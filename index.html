ık yaptı ve Peygamber bazı seferlerde onu Medine'de yerine vekil bıraktı.","8 (629) yılında Mûte Savaşı'nda Hz. Peygamber'in tayin ettiği ilk komutan olarak sancağı taşıdı ve şehid düştü. Peygamber şehadet haberini Medine'de gözyaşları içinde duyurdu. Kabri, Ürdün'de Mûte savaş alanının yakınındaki el-Mezâr köyünde, Ca'fer-i Tayyâr ve Abdullah b. Revâha'nın türbeleriyle birlikte bulunur."]},{"id":"cafer","ad":"Ca'fer b. Ebû Tâlib (Ca'fer-i Tayyâr)","ulke":"JOR","yer":"Kerek, Mûte yakınında (el-Mezâr)","durum":"kabir","ozet":"Hz. Ali'nin kardeşidir; Habeşistan muhacirlerinin sözcüsü oldu. Mûte Savaşı'nda ikinci komutan olarak şehid düştü.","tdv":"cafer-b-ebu-talib","xy":[501.85,152.14],"uzun":["Ca'fer b. Ebû Tâlib, Hz. Peygamber'in amcası Ebû Tâlib'in oğlu ve Hz. Ali'nin ağabeyidir. 590 yılı civarında Mekke'de doğdu. İslâm'ı ilk kabul edenlerdendir.","Müşriklerin baskıları artınca eşi Esmâ bint Umeys ile birlikte Habeşistan'a hicret etti; Hz. Peygamber onu muhacirlerin başkanı yaptı. Kureyş'in elçileri Necâşî'den Müslümanların geri verilmesini isteyince Ca'fer, Müslümanlar adına İslâm'ı açık ve etkili bir dille anlattı. Bu konuşma üzerine Kureyş elçileri eli boş döndü; rivayete göre Necâşî de bu süreçte Müslüman oldu.","Hudeybiye'den sonra Habeşistan'daki Müslümanlarla birlikte döndü ve Hayber'in fethedildiği günlerde Hz. Peygamber'e ulaştı. Peygamber onu görünce sevincini dile getirip kucakladı. Medine'de Mescid-i Nebevî'nin yakınına yerleşti.","8 (629) yılında Mûte'de Zeyd b. Hârise'nin şehadetinden sonra sancağı aldı ve iki kolu kesildiği hâlde savaşarak şehid oldu. Hz. Peygamber, Allah'ın ona kesilen kolları yerine cennette iki kanat verdiğini bildirdi; bu yüzden \"Tayyâr\" ve \"Zü'l-cenâhayn\" lakaplarıyla anıldı. Kabri, Ürdün'de Mûte yakınındaki el-Mezâr'da bulunur."]},{"id":"revaha","ad":"Abdullah b. Revâha","ulke":"JOR","yer":"Kerek, Mûte yakınında (el-Mezâr)","durum":"kabir","ozet":"Ensâr'dan şair bir sahâbîdir. Mûte Savaşı'nda şehid düşen üçüncü komutandır; üç komutanın türbeleri savaş alanının yakınındadır.","tdv":"abdullah-b-revaha","xy":[501.85,152.14],"uzun":["Abdullah b. Revâha, Hazrec kabilesinin Hâris koluna mensuptur ve Ebû Muhammed künyesiyle anılır. İkinci Akabe Biatı'nda Medineli Müslümanlar tarafından on iki nakibden biri seçildi. Medine'de İslâm'ın yayılmasında öncü olanlardandır.","Bedir, Uhud, Hendek ve Hayber savaşlarına, Hudeybiye ve Umretü'l-kazâ seferlerine katıldı. Hz. Peygamber'in kâtipleri arasında yer aldı ve Bedir zaferinin müjdesini Zeyd b. Hârise ile birlikte Medine'ye ulaştırdı. Bir sefer sırasında Medine'de Peygamber'e vekâlet etti; Hayber'e ve Kurayzaoğulları'na gönderilen heyetlerde görev aldı.","Muhadram şairlerdendir; şiirini Hz. Peygamber'i ve İslâm'ı savunmak, müşrikleri hicvetmek için kullandı. Resûlullah'ın onun şiirlerinin müşrikler üzerinde oklardan daha etkili olduğunu söylediği aktarılır. Şuarâ sûresinde şairleri eleştiren âyetler inince endişelendi; ardından iman edip salih amel işleyen şairleri istisna eden âyet indi.","8 (629) yılındaki Mûte seferinde ordunun üçüncü komutanı olarak tayin edildi. Zeyd b. Hârise ve Ca'fer b. Ebû Tâlib'in şehadetinden sonra sancağı aldı ve o da şehid oldu. Kabri, Ürdün'de Mûte savaş alanının yakınındaki el-Mezâr'da, diğer iki komutanın türbeleriyle birlikte bulunur."]},{"id":"ubade","ad":"Ubâde b. Sâmit","ulke":"PSX","yer":"Kudüs veya Remle","durum":"rivayet","ozet":"Akabe biatlarına ve Hz. Peygamber'in bütün savaşlarına katılan Ensâr'dan sahâbîdir. Suriye'de öğretmenlik ve Kudüs'te kadılık yaptı. 34 (654) yılında Kudüs'te vefat etti.","tdv":"ubade-b-samit","not":"Remle'de defnedildiği de kabrinin Kudüs'te olduğu da rivayet edilir.","xy":[500.58,150.19],"uzun":["Ubâde b. Sâmit, Hazrec kabilesine mensup Ensâr'dan bir sahâbîdir; annesi de Müslüman olup Hz. Peygamber'e biat etmiştir. 621 yılında Birinci Akabe Biatı'na katıldı, ertesi yıl İkinci Akabe Biatı'nda on iki nakibden biri seçildi. Medine'ye dönünce İslâm'ı yaymak için çalıştı.","Hicretten sonra Ebû Mersed ile kardeş ilan edildi. Bedir, Uhud, Hendek ve Hudeybiye dahil bütün gazvelere katıldı. Kur'an'ı ezberleyen Medineli sahâbîlerdendi; Suffe ashabına Kur'an öğretti ve vahiy kâtipleri arasında yer aldı. Hz. Peygamber onu zekât memuru olarak görevlendirdi.","Hz. Ömer döneminde Muâz b. Cebel ve Ebü'd-Derdâ ile birlikte Suriye'ye gönderildi; Humus, Dımaşk ve Filistin'de öğretmenlik yaptı. Kudüs'te kadılık görevini üstlendi ve 17 (638) yılında Lazkiye ile Cebele'nin fethinde bulundu. Doğru bildiğini söylemekten çekinmeyen biriydi; Suriye valisi Muâviye ile bazı meselelerde görüş ayrılığına düştü.","TDV'nin esas aldığı görüşe göre 34 (654) yılında Kudüs'te vefat etti ve Remle'de defnedildi. Kaynaklarda 45 (665) yılında öldüğü yönünde başka görüşler de vardır. Kabrinin Kudüs'teki Bâbürrahme Kabristanı'nda olduğu da rivayet edilir. Eşi Ümmü Harâm, Kıbrıs'ta şehid düşmüştür."]},{"id":"seddad","ad":"Şeddâd b. Evs","ulke":"PSX","yer":"Kudüs, Bâbürrahme Kabristanı","durum":"kabir","ozet":"Şair Hassân b. Sâbit'in yeğenidir. Hz. Ömer onu Humus valisi yaptı. 58 (678) yılında Filistin'de vefat etti; kabri Mescid-i Aksâ yakınındaki kabristandadır.","tdv":"seddad-b-evs","xy":[500.58,150.19],"uzun":["Şeddâd b. Evs, şair sahâbî Hassân b. Sâbit'in yeğenidir; babası Evs b. Sâbit'tir. 603 yılı civarında doğduğu anlaşılmaktadır. Annesi Neccâroğulları'ndandır.","Babası Evs Akabe biatına ve Bedir'e katılmış, Uhud'da şehid düşmüştür. Şeddâd'ın Bedir'de bulunduğuna dair rivayet doğru kabul edilmez; ancak Uhud, Hendek ve sonraki savaşlara katıldığı bilinir. Hz. Peygamber'in ona Şam ve Kudüs'ün fethedileceğini müjdelediği rivayet edilir.","Hz. Ömer onu Humus valisi yaptı. Hz. Osman'ın şehadetinden sonra idari görevleri bırakıp ibadete yöneldi ve Dımaşk'ta bir ev yaptırdı. Ubâde b. Sâmit ve Ebü'd-Derdâ onun ilmini, fıkhını ve ahlakını övmüş; Ebü'd-Derdâ onu \"ümmetin fakihi\" diye nitelemiştir. Rivayetleri Kütüb-i Sitte'de yer alır. Hz. Peygamber'in bir çift ayakkabısını sakladığı ve torunları arasında paylaşıldığı anlatılır.","58 (678) yılında Filistin'de vefat etti; başka tarihler de kaydedilmiştir. Kabri, Kudüs'te Mescid-i Aksâ yakınında birçok sahâbînin yattığı Bâbürrahme Kabristanı'ndadır."]},{"id":"temim","ad":"Temîm ed-Dârî","ulke":"PSX","yer":"Beytcibrîn (Kudüs ile Gazze arası)","durum":"kabir","ozet":"Filistinli bir tüccar iken Müslüman oldu ve Medine'ye yerleşti. Mescid-i Nebevî'de ilk kandili yaktığı rivayet edilir. 40 (661) yılında Filistin'de vefat etti.","tdv":"temim-ed-dari","xy":[499.74,150.78],"uzun":["Temîm ed-Dârî, Filistin'de doğmuş ve Benî Dâr kabilesinden gelmiştir. Ticaretle uğraşır, Müslüman olmadan önce sık sık Mekke'ye giderdi. Hicretin 9 (630) veya 10 (631) yılında, kardeşi Nuaym'ın da bulunduğu on kişilik bir heyetle Medine'ye gelerek Müslüman oldu.","Heyetiyle birlikte Hz. Peygamber'in vefatına kadar Medine'de kaldı. Peygamber'in deccâl hakkındaki \"Cessâse hadisi\" diye bilinen hutbesi, Temîm'in anlattığı deniz yolculuğuna dayanır. Şam'dan getirdiği kandillerle Mescid-i Nebevî'yi aydınlattı ve mescide minber yapılmasını teklif etti. Halil (Hebron) ve çevresindeki bazı köylerin kendisine verildiğine dair belge rivayeti erken dönem kaynaklarında yer alır.","Hz. Ömer, samimiyetini görünce cuma namazından önce Mescid-i Nebevî'de vaaz etmesine izin verdi; Hz. Osman döneminde vaazları haftada iki güne çıkarıldı. Mısır'ın fethine katıldı ve Hz. Ali döneminden itibaren Filistin'e yerleşti. İbadete düşkünlüğüyle tanınırdı.","40 (661) yılında Filistin'de vefat etti. Kabrinin Kudüs ile Gazze arasındaki Beytülcibrîn köyünde olduğu zikredilir. Kaynaklarda on sekiz rivayeti bulunur; Ebû Hüreyre ve Enes b. Mâlik de ondan hadis nakletmiştir."]},{"id":"ali","ad":"Hz. Ali","ulke":"IRQ","yer":"Necef","durum":"rivayet","ozet":"Dördüncü halife, Hz. Peygamber'in amcasının oğlu ve damadıdır. Çocuk yaşta ilk Müslüman olanlardandır. 40 (661) yılında Kûfe'de şehid edildi.","tdv":"ali","not":"Kabrinin yeri tartışmalıdır; yaygın kabule göre Necef'tedir.","xy":[524.65,149.48],"uzun":["Hz. Ali, hicretten yaklaşık 22 yıl önce (600) Mekke'de doğdu. Babası Ebû Tâlib, annesi Fâtıma bint Esed'dir. Mekke'de yaşanan bir kıtlık sırasında Hz. Peygamber'in himayesine verildi ve onun yanında büyüdü. Peygamber'e çocuk yaşta ilk iman edenler arasındadır.","Hicret gecesi Peygamber'in yatağında yatarak müşrikleri oyaladı; emanetleri sahiplerine verdikten sonra Medine'ye hicret etti. Hz. Peygamber onu kendisine kardeş seçti ve 2 (624) yılında kızı Fâtıma ile evlendirdi. Bedir, Uhud, Hendek ve Hayber gibi savaşlarda büyük kahramanlıklar gösterdi.","İlk üç halife döneminde Medine'de ilmî çalışmalarla meşgul oldu. Kur'an ve fıkıh bilgisi sebebiyle Hz. Ebû Bekir ve Hz. Ömer hukukî meselelerde ona danışırdı. Hz. Osman döneminde bazı uygulamaları eleştirdi, fakat isyancıları desteklemedi ve kuşatma günlerinde oğullarını halifeyi korumaya gönderdi.","Hz. Osman'ın şehadetinden sonra 35 (656) yılında halife seçildi. 36 (656) yılında Cemel'de, 37 (657) yılında Sıffîn'de Muâviye ile savaştı; Sıffîn'den sonraki hakem olayı Hâricîlerin ortaya çıkmasına yol açtı.","40 (661) yılı Ramazan ayında Kûfe'de Hâricî İbn Mülcem'in zehirli kılıcıyla yaralandı ve birkaç gün sonra vefat etti. TDV maddesine göre bugünkü Necef'e defnedildi; kabrinin yeri hakkında kaynaklarda farklı rivayetler de bulunur."]},{"id":"huseyin","ad":"Hz. Hüseyin","ulke":"IRQ","yer":"Kerbelâ","durum":"kabir","ozet":"Hz. Peygamber'in torunudur. 61 (680) yılında Kerbelâ'da şehid edildi ve oraya defnedildi.","tdv":"huseyin","not":"Mübarek başının defnedildiği yer hakkında farklı rivayetler vardır. TDV'nin Cennetü'l-Bakī maddesine göre başı Medine'ye gönderilip annesinin yanına defnedilmiştir; Kahire ve Şam'da da başına nispet edilen makamlar vardır.","xy":[523.78,147.48],"uzun":["Hz. Hüseyin, 5 Şaban 4 (10 Ocak 626) tarihinde Medine'de doğdu. Hz. Peygamber'in torunu, Hz. Ali ile Hz. Fâtıma'nın küçük oğludur. Doğduğunda Peygamber kulağına ezan okudu ve adını koydu. Altı yaşındayken dedesini ve annesini kaybetti.","Hz. Osman döneminde Horasan seferine katıldı; kuşatma günlerinde babası tarafından halifeyi korumakla görevlendirildi. Babasının halifeliği sırasında onun seferlerinde bulundu ve vasiyeti üzerine ağabeyi Hz. Hasan'a tâbi oldu. Hasan'ın vefatından sonra ibadet ve takvaya dayalı bir hayat sürdü.","Muâviye oğlu Yezîd'e biat alınmasını isteyince buna karşı çıkanlar arasında yer aldı. Muâviye'nin ölümünden sonra (60/680) Medine valisinin biat talebini kabul etmeyerek ailesiyle Mekke'ye gitti. Kûfe'den gelen davetler üzerine amcasının oğlu Müslim b. Akīl'i Kûfe'ye gönderdi; Müslim öldürüldüğü hâlde yoluna devam ederek 2 Muharrem 61'de Kerbelâ'ya ulaştı.","10 Muharrem 61 (10 Ekim 680) tarihinde Kerbelâ'da Ömer b. Sa'd komutasındaki orduya karşı savaşarak şehid edildi ve bedeni orada defnedildi. Mübarek başı ile esirler Dımaşk'a gönderildi. Başının nereye defnedildiği konusunda farklı rivayetler vardır; TDV'ye göre bunlar arasında Medine'deki Cennetü'l-Bakî rivayeti en güçlü ihtimaldir; Necef, Dımaşk, Rakka ve Kahire de anılır."]},{"id":"selman","ad":"Selmân-ı Fârisî","ulke":"IRQ","yer":"Bağdat yakınında, Selmânıpâk","durum":"kabir","ozet":"Hak dini ararken köle olarak Medine'ye getirildi ve Hz. Peygamber'le tanışınca Müslüman oldu. Hendek'in kazılmasını o önerdi. Hz. Ömer döneminde Medâin valiliği yaptı ve orada vefat etti.","tdv":"selman-i-farisi","not":"Türbesi IV. Murad tarafından yeniden yaptırılmıştır.","xy":[525.22,145.92],"uzun":["Selmân-ı Fârisî, İran'daki Râmhürmüz'de Mecûsî bir ailenin çocuğu olarak doğdu. Babası köyün reisiydi ve onu ateşgedenin ateşini söndürmemekle görevlendirmişti. Hak dini arayışına girdi ve ailesinin karşı çıkmasına rağmen Hristiyan oldu. Dımaşk, Musul, Nusaybin ve Ammûriye'de din adamlarının yanında bulundu.","Ammûriye'deki bir rahip ona Arabistan'da İbrâhim'in dini üzere bir peygamber çıkacağını haber verdi. Arabistan'a giderken yanında bulunduğu kişiler onu köle olarak sattı ve sonunda Medine'ye geldi. Hz. Peygamber Kubâ'ya gelince yanına gitti, rahipten duyduğu alametleri onda görünce Müslüman oldu. Efendisiyle yaptığı anlaşma gereği dikilen hurma fidanları ve ödenen bedelle âzat edildi.","Hendek Gazvesi'nde Medine'nin çevresine hendek kazılmasını o önerdi. Ensâr ve muhacirler onu kendilerinden saymak için tartışınca Hz. Peygamber \"Selmân bizdendir, Ehl-i beyt'tendir\" buyurdu. Hz. Ömer döneminde Medâin valisi oldu; mütevazı yaşayışını sürdürdü ve Irak'taki savaşlara katıldı.","35 (656) yılının sonu veya 36 yılının başında Medâin'de vefat etti. Kabri Bağdat yakınındaki bugünkü Selmânıpâk kasabasındadır; türbesi IV. Murad tarafından yeniden yaptırılmıştır. Remle ve Nusaybin'de de adına makam türbeleri bulunur."]},{"id":"huzeyfe","ad":"Huzeyfe b. Yemân","ulke":"IRQ","yer":"Selmânıpâk (Medâin)","durum":"rivayet","ozet":"Hz. Peygamber'in sırdaşı olarak bilinen sahâbîdir. Medâin valiliği yaptı, Nihâvend Savaşı'nda komutayı devraldı. 36 (656) yılında Medâin'de vefat etti.","tdv":"huzeyfe-b-yeman","not":"Medâin'de vefat ettiği kesindir; kabri Selmân-ı Fârisî türbesinin yanında gösterilir.","xy":[525.22,145.92],"uzun":["Huzeyfe b. Yemân, Medine'de doğmuş bir sahâbîdir ve Ebû Abdullah künyesiyle anılır. Babası Mekke'den Medine'ye gelip Abdüleşheloğulları ile antlaşma yapmış ve \"Yemân\" lakabıyla tanınmıştı. Annesi Evs kabilesindendir. Huzeyfe, babasıyla birlikte Bedir'den önce Müslüman oldu.","Bedir'e giderken müşrikler tarafından yakalandılar ve savaşa katılmayacaklarına söz verince serbest bırakıldılar; Hz. Peygamber sözlerinde durmalarını istedi. Uhud'da babası Müslümanlar tarafından yanlışlıkla öldürüldü; Huzeyfe diyetini yoksul Müslümanlara bağışladı. Hendek'te düşman ordusu hakkında bilgi toplamakla görevlendirildi. Hz. Peygamber'in sırdaşı olarak bilinir; münafıkların kimliklerini ve ileride çıkacak fitneleri bildiği rivayet edilir.","Hz. Ömer döneminde Medâin valisi oldu ve şehri imar etti. Nihâvend Savaşı'nda (21/642) komutayı devralarak zafer kazandı; Dînever, Hemedan ve Rey de onun döneminde fethedildi. Zühdüyle tanınırdı; Medâin'e merkebiyle girdi ve maaş olarak yalnızca geçimine yetecek kadarını istedi.","36 (656) yılında, Hz. Osman'ın şehadetinden ve Hz. Ali'ye biatten kırk gün sonra Medâin'de vefat etti. Ölmeden önce oğullarına Hz. Ali'ye itaat etmelerini öğütledi. TDV kabrinin yerini belirtmez; Selmânıpâk'ta Selmân-ı Fârisî türbesinin yanında gösterilir."]},{"id":"talha","ad":"Talha b. Ubeydullah","ulke":"IRQ","yer":"Basra (Zübeyr kasabası)","durum":"kabir","ozet":"Cennetle müjdelenen on sahâbîden biridir; Uhud'da Hz. Peygamber'i bedeniyle korudu. 36 (656) yılında Cemel Vak'ası sırasında öldürüldü; kabri Basra'nın dışındadır.","tdv":"talha-b-ubeydullah","xy":[533.98,154.34],"uzun":["Talha b. Ubeydullah, Kureyş'in Teym koluna mensuptur ve Ebû Muhammed künyesiyle anılır; nesebi Hz. Peygamber'le Mürre'de birleşir. Mekke'nin önde gelen tüccarlarındandı. Busrâ'da bir rahipten son peygamberin zuhur ettiği haberini aldı, Mekke'ye dönünce Hz. Ebû Bekir aracılığıyla Müslüman oldu. İlk Müslümanlardan ve cennetle müjdelenen on sahâbîdendir.","Hicretten sonra Medine'de Kâ'b b. Mâlik ile kardeş ilan edildi. Bedir sırasında Şam'da bulunduğu için savaşa katılamadı; ancak Peygamber'in onu haber toplamak için gönderdiği ve ganimetten pay verdiği rivayet edilir. Uhud'da Resûlullah'ı korurken pek çok yerinden yaralandı ve eli kalıcı olarak sakat kaldı. Peygamber, onun sırtına basarak kayalığa çıktığında Talha için cennetin vacip olduğunu buyurdu.","Hz. Ebû Bekir'e hemen biat etti ve ridde olaylarının bastırılmasında görev aldı. Hz. Ömer'in belirlediği altı kişilik şûranın üyesiydi; seçim sırasında Medine dışında olduğundan dönüşte Hz. Osman'a biat etti. Osman'ın hilâfetinin ikinci yarısında yönetimi eleştirenler arasında yer aldı; halifenin şehadetinden sonra Hz. Ali'ye biat etti.","Daha sonra Zübeyr ile birlikte Hz. Âişe'nin yanında Basra'ya gitti. Hz. Ali ile görüşüp savaştan vazgeçtiyse de iki ordu arasında Cemel Vak'ası çıktı ve Talha bu sırada Mervân b. Hakem'in attığı okla öldürüldü (36/656). Kabri Basra'nın dışındadır ve bugün Zübeyr kasabası yakınında adına bir türbe bulunur."]},{"id":"zubeyr","ad":"Zübeyr b. Avvâm","ulke":"IRQ","yer":"Basra, Zübeyr kasabası","durum":"rivayet","ozet":"Cennetle müjdelenen on sahâbîden biri ve Hz. Peygamber'in halasının oğludur. Cemel Vak'ası öncesinde savaş alanından ayrıldıktan sonra Vâdissibâ'da namaz kılarken şehid edildi.","tdv":"zubeyr-b-avvam","not":"Irak'taki Zübeyr şehrinde adına bir cami ve türbe bulunur.","xy":[533.98,154.34],"uzun":["Zübeyr b. Avvâm, 594 veya 595 yılında Mekke'de doğdu. Babası Hz. Hatice'nin kardeşi Avvâm b. Huveylid, annesi Hz. Peygamber'in halası Safiyye bint Abdülmuttalib'dir. On altı yaşında, davetin ilk günlerinde Hz. Ebû Bekir'in etkisiyle Müslüman oldu. Amcası onu dininden döndürmek için işkence ettiyse de imanından vazgeçmedi.","İslâm uğruna ilk kılıç çeken kişi olarak anılır. Habeşistan'a iki kez hicret etti, sonra Medine'ye göç etti. Bedir, Uhud, Hendek ve diğer bütün savaşlarda Peygamber'in yanında bulundu. Hz. Peygamber onun için \"Her peygamberin bir havârisi vardır, benim havârim de Zübeyr'dir\" buyurmuştur. Cennetle müjdelenen on sahâbîden biridir.","Hz. Ebû Bekir ve Hz. Ömer dönemlerinde Yermük Savaşı'nda (15/636) öne çıktı. Mısır'ın fethinde, özellikle Babilon ve İskenderiye'nin alınmasında önemli rol oynadı ve Fustat'ın kuruluşuna katıldı. Hz. Osman döneminde Taberistan seferinde (30/650) bulundu; bu yıllarda ticaret ve tarımla büyük bir servet edindi.","Hz. Ali'ye biat etti; ancak Cemel olaylarında Hz. Âişe ve Talha ile birlikte Basra'da karşı safta yer aldı. Savaş sırasında Hz. Ali ile karşılaşınca savaş alanını terk edip Medine'ye dönmek istedi. Yolda Vâdissibâ' denilen yerde namaz kılarken Amr b. Cürmûz tarafından şehid edildi (36/656). Irak'ta adını taşıyan Zübeyr kasabasında camisi ve türbesi bulunur."]},{"id":"kusem","ad":"Kusem b. Abbas","ulke":"UZB","yer":"Semerkant, Şâh-ı Zinde","durum":"kabir","ozet":"Hz. Peygamber'in amcası Abbas'ın oğludur. Hz. Ali döneminde Mekke valiliği yaptı. Muâviye döneminde Horasan fetihlerine katıldı ve Semerkant'ta şehid oldu (57/676).","tdv":"kusem-b-abbas","not":"Merv'de vefat ettiği de rivayet edilir; Semerkant'taki kabri \"Şâh-ı Zinde\" adıyla ziyaret edilir.","xy":[582.02,124.8],"uzun":["Kusem b. Abbas, Hz. Peygamber'in amcası Abbas'ın oğludur. Annesi Ümmü'l-Fazl Lübâbe, Hz. Hatice'den sonra Müslüman olan ilk kadınlardandır ve Peygamber'in eşi Meymûne'nin kız kardeşidir. Kusem, Hz. Hüseyin'in süt kardeşidir ve Hz. Peygamber'den ve babasından hadis rivayet etmiştir.","Hz. Peygamber vefat ettiğinde cenazenin yıkanmasında bulundu ve onu kabre yerleştirenler arasında yer aldı. Kabirden en son çıkan kişi olduğu için Resûlullah'a en son dokunan kişi olarak tanınır. Hz. Ali'nin hilâfeti döneminde Mekke valiliğine getirildi ve 38 (658) yılında hac emirliği yaptı.","Muâviye döneminde Horasan valisi Saîd b. Osman komutasındaki fetihlere katıldı. Savaşta gösterdiği kahramanlık için kendisine ganimetten bin hisse önerildiyse de bunu kabul etmedi. Semerkant seferine de Saîd b. Osman ile birlikte katıldı.","56 (675-76) yılında Semerkant'ta şehid oldu. Kabri zamanla büyük bir ziyaretgâha dönüştü ve çevresinde cami ve medreseler yapıldı. Semerkantlılar onu \"Şâh-ı Zinde\" (yaşayan sultan) diye anar; kabrinin bulunduğu Şâh-ı Zinde külliyesi bugün Özbekistan'ın en önemli ziyaret yerlerindendir."]},{"id":"ebu-zema","ad":"Ebû Zem'a el-Belevî","ulke":"TUN","yer":"Kayrevan, Sîdî Sâhib Zâviyesi","durum":"rivayet","ozet":"Hz. Peygamber'in sohbetinde bulunmuş, Kuzey Afrika fetihlerine katılmış bir sahâbîdir. Kayrevan'daki Sîdî Sâhib (\"sahâbî efendi\") zâviyesinde yattığı kabul edilir.","not":"Hz. Peygamber'in mübarek saçından birkaç teli yanında taşıdığı rivayet edilir.","xy":[435.06,137.59],"uzun":["Ebû Zem'a el-Belevî, Belî kabilesine mensup bir sahâbîdir. Ehl-i sünnet sahâbe kaynaklarına göre Hudeybiye'de ağacın altında Hz. Peygamber'e biat edenler (Bey'atürrıdvân) arasında yer almıştır. Mısır'a yerleşen sahâbîlerdendir.","Muâviye b. Hudeyc komutasında İfrîkıye seferine katıldı. Rivayete göre Hz. Peygamber'in mübarek saçından birkaç teli yanında taşırdı; bu yüzden halk arasında \"Sîdî Sahab\" (Sahâbî efendi) ve \"berber\" diye anılır.","34 (654) yılı civarında İfrîkıye'de şehid oldu ve henüz kurulmamış olan Kayrevan'ın bulunduğu yere defnedildi. Bugün Tunus'un Kayrevan şehrinde bulunan zaviyesi ve türbesi önemli bir ziyaret yeridir."]},{"id":"ruveyfi","ad":"Rüveyfi' b. Sâbit el-Ensârî","ulke":"LBY","yer":"Beyzâ","durum":"rivayet","ozet":"Muâviye döneminde Berka (Doğu Libya) valiliği yapan sahâbîdir. 47 (667) yılında Cerbe adasının fethinde öne çıktı.","not":"Kabrinin Beyzâ'da olduğu kabul edilir.","xy":[465.05,147.02],"uzun":["Rüveyfi' b. Sâbit, Medineli Ensâr'ın Neccâroğulları koluna mensup bir sahâbîdir. Ehl-i sünnet sahâbe kaynaklarından İbnü'l-Esîr'in Üsdü'l-gābe'sinde ve İbn Hacer'in el-İsâbe'sinde yer alır. Hz. Peygamber'den hadis rivayet etmiştir.","Mısır'a yerleşen sahâbîlerdendir. Muâviye döneminde 46 (666) yılında Trablus (bugünkü Libya) bölgesine vali tayin edildi. 47 (667) yılında İfrîkıye'ye ve Cerbe adasına sefer düzenlediği nakledilir.","Kaynaklara göre 56 (676) yılı civarında Berka bölgesinde vali iken vefat etti. Kabri, Libya'nın doğusundaki Beyzâ şehrindedir ve bölgenin en önemli ziyaret yerlerindendir."]},{"id":"ukbe-nafi","ad":"Ukbe b. Nâfi'","ulke":"DZA","yer":"Biskra yakınında, Sîdî Ukbe kasabası","durum":"kabir","ozet":"Kayrevan'ı kuran ve İfrîkıye valiliği yapan komutandır. Amr b. Âs'ın yanında Mısır ve Kuzey Afrika fetihlerine katıldı. 62 (682) yılında Tehûde'de şehid düştü.","tdv":"ukbe-b-nafi","not":"Hz. Peygamber döneminde doğduğu için sahâbî sayılıp sayılmayacağı ihtilaflıdır.","xy":[423.84,140.59],"uzun":["Ukbe b. Nâfi' el-Fihrî, 621 yılında doğdu. Babası Nâfi', Amr b. Âs'ın anne bir kardeşidir; Ukbe de bu sebeple Amr'ın yanında yetişti. Hz. Peygamber zamanında doğduğu için bazı kaynaklarda sahâbîler arasında sayılır; hakkındaki bilgiler daha çok fetih yıllarına aittir.","Amr b. Âs'ın yanında Mısır, Nûbe, Berka ve Trablusgarp fetihlerine katıldı. 20 (641) yılında Nûbe'de güçlü bir direnişle karşılaşınca anlaşma yaparak döndü. Ertesi yıl Zevîle'yi fethetti, Berberî kabileleriyle barış yaptı ve Berka'daki bir ayaklanmayı bastırdı. 27 (647) yılında Abdullah b. Sa'd'ın İfrîkıye seferinde bulundu.","50 (670) yılında İfrîkıye valiliğine getirildi. Bölgenin fethini pekiştirmek ve Mağrib seferlerine üs olmak üzere, Bizans donanmasının saldırılarından uzak bir yerde Kayrevan şehrini kurdu; cami ve hükümet konağıyla başlayan şehir beş yılda tamamlandı. 55 (675) yılında görevden alındı, 62 (681-82) yılında yeniden vali olunca Mağrib-i Aksâ'ya kadar ilerleyerek Atlas Okyanusu kıyısına ulaştı.","Dönüş yolunda Küseyle'nin ordusu yolunu kesti ve Tehûde'de yapılan savaşta az sayıdaki atlısıyla birlikte şehid oldu (63/683). Kabri bugün Cezayir'de kendi adıyla anılan Sîdî Ukbe kasabasındadır; yanındaki cami Kuzey Afrika'nın en eski camilerinden biri olarak önemli bir ziyaret yeridir."]},{"id":"safvan","ad":"Safvân b. Muattal es-Sülemî","ulke":"TUR","yer":"Adıyaman, Samsat","durum":"rivayet","ozet":"Hendek'ten itibaren gazvelere katılan sahâbîdir; İfk hadisesinde Hz. Âişe'yi orduya ulaştıran kişi odur. Hz. Ömer döneminde Suriye ve Anadolu fetihlerinde bulundu.","tdv":"safvan-b-muattal","not":"TDV'ye göre 19 (640) yılında Sümeysât'ta (Samsat) şehid olduğu zikredilir; başka rivayetlere göre Muâviye döneminde 58-60 (678-680) yıllarında vefat etmiştir. Samsat'taki türbesi bu rivayete dayanır.","xy":[509.01,131.46],"uzun":["Safvân b. Muattal, Süleym kabilesinin Zekvân koluna mensup bir sahâbîdir ve Ebû Ömer künyesiyle anılır. 5 (627) yılından önce Müslüman oldu. Hendek Gazvesi'ne ve sonraki gazvelere katıldı.","Ağır uykusu sebebiyle ordunun artçısı olarak görevlendirilir, geride kalan eşyaları sahiplerine ulaştırırdı. Benî Mustalik Gazvesi dönüşünde geride kalan Hz. Âişe'yi bulup devesine bindirerek ordugâha getirdi. Münafıkların başı Abdullah b. Übey'in yaydığı dedikodu bu olayı iftiraya (İfk hadisesi) dönüştürdü; inen âyetlerle ikisinin de suçsuzluğu ilan edildi. Hz. Peygamber âyet inmeden önce de Safvân'ın dürüstlüğüne kefil olmuştu.","Peygamber'in vefatından sonra İyâz b. Ganm komutasında el-Cezîre fetihlerine katıldı. 18 (639) yılında Habîb b. Mesleme ile birlikte Sümeysât'a gönderilen birliklere kumandan tayin edildi. Bu bölgedeki fetihler, onun adının Anadolu'nun güneydoğusuyla anılmasına yol açmıştır.","Vefatı hakkında farklı rivayetler vardır. Bir rivayete göre 19 (640) yılında Sümeysât'ta veya Ermeniye savaşında şehid oldu. Başka rivayetlere göre Muâviye döneminde Bizans'la yapılan bir savaşta yaralandı ve 58-60 (678-680) yılları arasında vefat etti. Adıyaman'daki Samsat yöresinde kabri olarak ziyaret edilen bir yer bulunmaktadır."]},{"id":"tokludede","ad":"Tokludede Haziresi sahabeleri","ulke":"TUR","yer":"İstanbul, Ayvansaray","durum":"rivayet","ozet":"Ebû Şeybe el-Hudrî'nin yakınındaki Tokludede Haziresi çevresinde Hamdullah el-Ensârî, Ahmed el-Ensârî, Muhammed el-Ensârî ve Ka'b adına türbeler bulunur. Emevîler döneminde İstanbul kuşatmalarına katılan sahâbîlere ait olduğu kabul edilir.","not":"İstanbul tarihi araştırmalarına göre kuşatmalarda ölen ve sahâbî olmayan kimselerin de halk arasında sahâbî sayıldığı olmuştur; bu kabirlerin sahâbîlere ait olduğu kesin değildir.","xy":[484.31,120.06]},{"id":"ist-makam","ad":"İstanbul'daki makam türbeler","ulke":"TUR","yer":"İstanbul (çeşitli semtler)","durum":"makam","ozet":"İstanbul'da bazı büyük sahâbîler adına makam (temsilî kabir) yapılmıştır: Câbir b. Abdullah (Atikmustafapaşa Camii), Ebû Zer el-Gıfârî (Ayvansaray), Ebû Saîd el-Hudrî (Edirnekapı), Ebü'd-Derdâ (Eyüp ve Karacaahmet) ve Amr b. Âs (Karaköy Yeraltı Camii).","not":"Bu sahâbîlerin asıl kabirleri başka yerlerdedir: Câbir ve Ebû Saîd Medine'de, Ebû Zer Rebeze'de, Ebü'd-Derdâ Şam'da, Amr b. Âs Mısır'da.","xy":[484.31,120.06]},{"id":"fatima-esed","ad":"Fâtıma bint Esed","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Hz. Ali'nin annesidir. Dedesi ve amcası vefat ettikten sonra Hz. Peygamber'i evinde büyüttü; Peygamber onu \"annemden sonra annem\" diye anardı. Müslüman olup Medine'ye hicret etti.","tdv":"fatima-bint-esed","xy":[512.44,173.85],"uzun":["Fâtıma bint Esed, Hâşimoğulları'ndan bir kadın sahâbîdir ve Hz. Ali'nin annesidir. Eşi, Hz. Peygamber'in amcası Ebû Tâlib'dir. Tâlib, Akīl, Ca'fer ve Ali adında dört oğlu, Ümmü Hânî ve Cümâne adında iki kızı oldu.","Hz. Peygamber, dedesi Abdülmuttalib'in vefatından sonra sekiz yaşında Ebû Tâlib'in himayesine girdi ve Fâtıma ona annelik yaptı. Resûlullah, onun kendi çocuklarından önce kendisini doyurup gözettiğini anlatır ve onu \"annemden sonra annem\" diye anardı. Medine'de onu sık sık ziyaret eder, zaman zaman evinde dinlenirdi.","Peygamberlik geldiğinde hemen Müslüman olmadı; Ebû Tâlib'in ölümünden kısa süre sonra, hicretten yaklaşık iki yıl önce İslâm'ı kabul ettiği tahmin edilir. Medine'ye ilk hicret eden kadınlardandır. Oğlu Ali, Hz. Fâtıma ile evlenince geliniyle aynı evde yaşadı.","Hicretin ilk yıllarında, bazı tarihçilere göre 4 (625-26) yılında Medine'de vefat etti. Hz. Peygamber onun ölümüne çok üzüldü, kendi gömleğini kefen olarak verdi, cenaze namazını kıldırdı ve kabrinin kazılmasıyla bizzat ilgilendi. Kabri Cennetü'l-Bakî'dedir."]},{"id":"zeyneb-nebi","ad":"Hz. Zeyneb (Hz. Peygamber'in kızı)","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Hz. Peygamber ile Hz. Hatice'nin en büyük kızıdır. Mekke'den Medine'ye hicreti sırasında uğradığı saldırı yüzünden rahatsızlandı ve 8 (629) yılında vefat etti.","tdv":"zeyneb","xy":[512.44,173.85],"uzun":["Hz. Zeyneb, Hz. Peygamber'in Hz. Hatice'den olan ilk kızıdır ve hicretten yirmi üç yıl önce Mekke'de doğdu. Teyzesi Hâle bint Huveylid'in oğlu Ebü'l-Âs ile evlendi. Bu evlilikten Ali ve Ümâme adında iki çocuğu oldu.","Annesi ve kardeşleriyle birlikte Müslüman oldu; eşi ise uzun süre İslâm'ı kabul etmedi, fakat onun inancına karışmadı. Bedir'de müşriklerin safında esir düşen kocası için Zeyneb, annesinden kalan gerdanlığı fidye olarak gönderdi. Gerdanlığı gören Hz. Peygamber çok duygulandı ve damadını, Zeyneb'i Medine'ye göndermesi şartıyla serbest bıraktı.","Medine'ye giderken Zûtüvâ'da Hebbâr b. Esved'in saldırısına uğradı, devesinden düşerek yaralandı ve karnındaki çocuğunu kaybetti. Ebü'l-Âs 7 (628) yılında Medine'ye gelerek Müslüman oldu ve Hz. Peygamber önceki nikâhlarıyla evliliklerinin devamına izin verdi.","8 (629) yılının Safer ayında, otuz bir yaşında Medine'de vefat etti; hicret sırasında aldığı yara sebebiyle şehid sayılır. Cenaze namazını Hz. Peygamber kıldırdı ve Cennetü'l-Bakî'ye defnedildi. TDV, Dımaşk veya Kahire'de medfun olduğu yönündeki bilginin doğru olmadığını belirtir."]},{"id":"rukiyye","ad":"Hz. Rukıyye","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Hz. Peygamber'in kızı ve Hz. Osman'ın eşidir. Eşiyle birlikte Habeşistan'a ve Medine'ye hicret etti. 2 (624) yılında, Bedir Gazvesi sırasında vefat etti.","tdv":"rukiyye","xy":[512.44,173.85],"uzun":["Hz. Rukıyye, hicretten yaklaşık yirmi yıl önce Mekke'de doğdu; Hz. Peygamber'in Hz. Hatice'den olan üçüncü çocuğudur. Annesi ve kız kardeşleriyle birlikte Müslüman oldu. Önce Ebû Leheb'in oğlu Utbe ile nikâhlanmıştı; Leheb sûresi inince Ebû Leheb ve eşi bu nikâhı bozdurdu.","Daha sonra Hz. Osman ile evlendi. Mekke'deki baskılar artınca eşiyle birlikte nübüvvetin 5. yılında (615) Habeşistan'a hicret etti. Hz. Peygamber bu hicreti, Lût ve İbrâhim'den sonra ailesiyle Allah yolunda yapılan ilk hicret olarak nitelendirdi. Habeşistan'dan döndükten sonra Medine'ye hicret ettiler.","Oğlu Abdullah iki yaşındayken 4 (625) yılında vefat etti. Rukıyye, Bedir Gazvesi'ne hazırlık günlerinde ağır bir hastalığa yakalandı; Hz. Osman, Peygamber'in izniyle eşinin yanında kalmak için savaşa katılamadı ve Bedir ehlinden sayıldı.","2 (624) yılı Ramazan'ında, yirmi iki yaşlarında Medine'de vefat etti. Bedir zaferinin müjdesi Medine'ye ulaştığında defnedilmişti; bu yüzden Hz. Peygamber cenazesinde bulunamadı. Kabri Cennetü'l-Bakî'dedir."]},{"id":"safiyye-am","ad":"Safiyye bint Abdülmuttalib","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Hz. Peygamber'in halası ve Zübeyr b. Avvâm'ın annesidir. Hendek Gazvesi'nde kadınların bulunduğu kaleye yaklaşan bir düşmanı öldürmesiyle tanınır. 20 (641) yılında Medine'de vefat etti.","tdv":"safiyye-bint-abdulmuttalib","xy":[512.44,173.85],"uzun":["Safiyye bint Abdülmuttalib, Hz. Peygamber'in altı halasından biridir ve 567 yılı civarında Mekke'de doğdu. Annesi Hâle bint Vüheyb, Hz. Âmine'nin amcasının kızıdır. Câhiliye döneminde önce Hâris b. Harb ile, onun ölümünden sonra Avvâm b. Huveylid ile evlendi. Eşinin vefatından sonra çocuklarının, özellikle oğlu Zübeyr b. Avvâm'ın yetişmesiyle bizzat ilgilendi.","Oğlu Zübeyr ile birlikte ilk Müslümanlar arasında sayılır. Yakın akrabaları uyarma âyeti inince Hz. Peygamber'in topladığı akrabalar arasındaydı; Ebû Leheb'in hakaretlerine karşı yeğenini savundu. Müslüman olduktan sonra oğluyla birlikte Medine'ye hicret etti.","Uhud Gazvesi'nde elinde mızrakla savaş alanına gitti ve geri çekilen bazı Müslümanlara müdahale etti. Kardeşi Hz. Hamza'nın şehid edilen bedenini görmek istediğinde Resûlullah izin verdi; sabırla dayandığı nakledilir. Hendek sırasında kadınların sığındığı eve girmeye çalışan bir düşmanı öldürdüğü de anlatılır. Savaşlarda yaralıların tedavisinde ve geri hizmetlerde görev aldı.","20 (641) yılında Medine'de vefat etti. Cenaze namazını Hz. Ömer kıldırdı ve Cennetü'l-Bakî'ye defnedildi."]},{"id":"hafsa","ad":"Hz. Hafsa","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Hz. Ömer'in kızı ve Hz. Peygamber'in eşidir. Hz. Ebû Bekir döneminde toplanan Kur'an nüshası ona emanet edildi. 45 (665) yılında Medine'de vefat etti.","tdv":"hafsa","xy":[512.44,173.85],"uzun":["Hz. Hafsa, Hz. Ömer'in kızıdır ve 605 yılında Mekke'de doğdu; annesi Zeyneb bint Maz'ûn da sahâbîdir. İlk eşi, ilk Müslümanlardan Huneys b. Huzâfe idi. Huneys, Bedir dönüşünde hastalanıp Medine'de vefat edince Hafsa dul kaldı.","Hz. Ömer kızını önce Hz. Osman'a, sonra Hz. Ebû Bekir'e teklif etti; ikisi de olumlu cevap vermedi. Hz. Peygamber, Hafsa'nın Osman'dan daha hayırlı biriyle evleneceğini söyledi ve 3 (625) yılının Şaban ayında onunla evlendi. Hz. Osman da Resûlullah'ın kızı Ümmü Gülsüm ile evlendi.","Hz. Ebû Bekir döneminde bir araya getirilen Kur'an'ın asıl nüshası önce Hz. Ömer'de kaldı, onun vefatından sonra Hafsa'ya geçti. Hz. Osman mushafları çoğaltırken bu nüshayı ondan aldı ve iş bitince geri verdi. Hafsa'ya okuma yazmayı Şifâ bint Abdullah öğretmişti; hafız olduğu da rivayet edilir. Hz. Peygamber'den ve babasından altmış hadis rivayet etmiştir.","45 (665) yılının Şaban ayında Medine'de vefat etti; kaynaklarda 41 (661) ve 27 (647-48) tarihleri de verilir. Cenaze namazını Medine valisi Mervân b. Hakem kıldırdı ve Cennetü'l-Bakî'ye defnedildi."]},{"id":"ummu-seleme","ad":"Hz. Ümmü Seleme","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Hz. Peygamber'in eşidir; ilk muhacirlerden olup Habeşistan'a ve Medine'ye hicret etti. Hudeybiye'deki isabetli görüşüyle bilinir. Ezvâc-ı tâhirâtın en son vefat edenidir.","tdv":"ummu-seleme","xy":[512.44,173.85],"uzun":["Hz. Ümmü Seleme'nin asıl adı Hind bint Ebû Ümeyye'dir ve Kureyş'in Mahzûm koluna mensuptur. Amcasının oğlu Ebû Seleme ile evlendi; ikisi de ilk Müslümanlardandır. Birlikte Habeşistan'a hicret ettiler ve asılsız bir haber üzerine Mekke'ye döndüler. Medine'ye hicret etmek istediğinde ailesi onu oğlundan ayırarak engelledi; sonunda izin alıp oğluyla yola çıktı ve Medine'ye hicret eden ilk kadınlardan biri oldu.","Ebû Seleme, Uhud'da aldığı yaranın nüksetmesiyle 4 (625) yılında vefat etti. Hz. Peygamber'in evlenme teklifine Ümmü Seleme yaşının, kıskançlığının ve çocuklarının çokluğunu öne sürdü; Peygamber kıskançlığının gitmesi için dua edeceğini söyledi. 4 (626) yılının Şevval ayında evlendiler. Hayber ve Tâif seferlerine katıldı ve Resûlullah'ın sık sık görüşüne başvurduğu eşlerinden oldu.","Hudeybiye Antlaşması'ndan sonra Müslümanlar üzüntüden kurban kesme ve tıraş olma emrini yerine getirmekte duraksayınca, Ümmü Seleme'nin tavsiyesiyle Peygamber önce kendisi kurbanını kesti ve tıraş oldu; sahâbîler de hemen onu izledi. Hz. Âişe'den sonra en çok hadis rivayet eden eşlerdendir; yaklaşık 378 hadis nakletmiştir. Necâşî'nin huzurundaki konuşmaları en ayrıntılı aktaran odur.","Hz. Hüseyin'in Kerbelâ'da şehid edildiğini duyunca bayıldığı rivayet edilir; bu da onun 61 (680) yılının sonlarından önce ölmediğini gösterir. TDV'ye göre 62 (681) yılında Medine'de vefat etti ve Cennetü'l-Bakî'ye defnedildi."]},{"id":"zeyneb-cahs","ad":"Hz. Zeyneb bint Cahş","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Hz. Peygamber'in halasının kızı ve eşidir. Cömertliği ve el emeğiyle kazandığını dağıtmasıyla tanınır. 20 (641) yılında vefat etti; Peygamber'den sonra vefat eden ilk eşidir.","tdv":"zeyneb-bint-cahs","xy":[512.44,173.85],"uzun":["Hz. Zeyneb bint Cahş, Kureyş'in müttefiki Esed b. Huzeyme kabilesine mensuptur. Annesi Ümeyme bint Abdülmuttalib, Hz. Peygamber'in halasıdır. Ailesinin bütün fertleri Müslüman olup Medine'ye hicret etti; Mekke'deki mallarına Kureyş el koydu. Kardeşi Abdullah b. Cahş Uhud'da şehid düşmüştür.","Hz. Peygamber onu azatlısı ve evlatlığı Zeyd b. Hârise ile evlendirmek istedi. Zeyneb ve kardeşi önce itiraz ettiyse de Ahzâb sûresinin 36. âyeti inince evliliği kabul etti; bu evlilikle hür ile azatlı arasında evliliğin sakıncası olmadığı gösterilmek istenmişti. Eşler arasında geçimsizlik olduğundan evlilik bir yıl kadar sürdü ve boşanma ile sona erdi.","Ardından Hz. Peygamber onunla evlendi. Ahzâb sûresinin 37-38. âyetleri bu evliliği meşru kılarak evlatlığın boşadığı kadınla evlenmeyi yasaklayan Câhiliye âdetini kaldırdı. Düğünden sonra inen 53. âyet, Peygamber'in evine giriş ve misafirlik âdabını belirledi. Zeyneb, nikâhının Allah tarafından kıyıldığını söyleyerek övünürdü.","El emeğiyle kazandığını Allah yolunda harcayan cömert bir hanımdı; Hz. Ömer'in kendisine ayırdığı yıllık 12.000 dirhemi dağıtarak bitirdi. Hz. Peygamber'in vefatından sonra eşleri arasında ilk vefat eden oldu (20/641). Cenaze namazını Hz. Ömer kıldırdı ve Cennetü'l-Bakî'ye defnedildi; Hz. Ömer kabrinin üzerine bir gölgelik yaptırdı."]},{"id":"zeyneb-huzeyme","ad":"Hz. Zeyneb bint Huzeyme","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Hz. Peygamber'in eşidir; yoksullara yardımı sebebiyle \"Ümmü'l-mesâkîn\" (yoksulların annesi) diye anıldı. Evliliğinden birkaç ay sonra 4 (625) yılında vefat etti.","tdv":"zeyneb-bint-huzeyme","xy":[512.44,173.85],"uzun":["Hz. Zeyneb bint Huzeyme, Âmir b. Sa'saa kabilesinin Hilâl koluna mensuptur. Câhiliye döneminden beri bilinen cömertliği ve yoksullara düşkünlüğü sebebiyle \"Ümmü'l-mesâkîn\" (yoksulların annesi) lakabıyla anılmıştır. Annesi Hind bint Avf'tır.","Önceki evlilikleri hakkında farklı rivayetler vardır; bir rivayete göre son eşi Bedir'de şehid düşen Ubeyde b. Hâris'tir. Hz. Peygamber onunla 3 (625) yılının Ramazan ayında, Uhud'dan hemen önce evlendi. Bu evlilik, Âmir b. Sa'saa kabilesiyle ilişkileri düzeltme amacıyla da ilgilidir.","Evlilikten yedi-sekiz ay sonra, 4 (625) yılının Rebîülâhir ayında, otuz yaşlarında vefat etti; Hz. Peygamber'in en kısa süren evliliği budur. Hz. Hatice'den sonra Peygamber hayattayken vefat eden tek eşidir. Cenaze namazını Hz. Peygamber kıldırdı ve eşleri arasında Cennetü'l-Bakî'ye ilk defnedilen o oldu."]},{"id":"safiyye-huyey","ad":"Hz. Safiyye bint Huyey","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Hz. Peygamber'in eşidir. Hayber'in fethinden sonra Müslüman oldu. 50 (670) yılı civarında Medine'de vefat etti.","tdv":"safiyye","xy":[512.44,173.85],"uzun":["Hz. Safiyye, muhtemelen 610 yılında Medine'de doğdu. Babası Benî Nadîr'in reisi Huyey b. Ahtab, annesi Berre bint Semev'el'dir; Hz. Hârûn'un soyundan geldiği kabul edilir. Önce Sellâm b. Mişkem ile, sonra Kinâne b. Rebî' ile evlenmişti.","Hayber'in fethinde (7/628) kocası öldürüldü ve kendisi esir düştü. Hz. Peygamber, Müslüman olması hâlinde onunla evleneceğini bildirdi; Safiyye İslâm'ı kabul edince onu azat etti ve hürriyetini mehir saydı. Hayber dönüşünde yolda evlendiler.","Akıllı, faziletli, ibadete düşkün, cömert ve cesur bir hanımdı; evini hayatında sadaka olarak bağışladı. Hz. Osman'ın evi asiler tarafından kuşatıldığında ona yiyecek götürmek istedi; engellenince evinden uzattığı bir tahta ile halifeye su ve yemek ulaştırdı.","50 (670) yılının Ramazan ayında veya 52 (672) yılında Medine'de vefat etti. Cenaze namazını Muâviye (veya Saîd b. Âs) kıldırdı ve Cennetü'l-Bakî'ye defnedildi."]},{"id":"mariye","ad":"Mâriye","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Mısır'dan Hz. Peygamber'e gönderilen ve oğlu İbrâhim'in annesi olan sahâbiyedir. 16 (637) yılında Medine'de vefat etti; cenaze namazını Hz. Ömer kıldırdı.","tdv":"mariye","xy":[512.44,173.85],"uzun":["Mâriye el-Kıbtiyye, Mısır'ın Saîd bölgesinden, Kıptî bir aileden gelmektedir; annesinin Rum olduğu da belirtilir. 7 (628) yılında Hz. Peygamber'in İslâm'a davet mektubuna karşılık İskenderiye valisi Mukavkıs, onu kız kardeşi Sîrîn ve başka hediyelerle birlikte Medine'ye gönderdi.","Hz. Peygamber, Mâriye'yi yanına aldı, Sîrîn'i ise şair Hassân b. Sâbit'e verdi. Mâriye önce Ümmü Süleym'in evinde misafir edildi, sonra Medine'nin Avâlî semtinde bir eve yerleştirildi. Peygamber'in ona gösterdiği ilgi diğer eşlerin kıskançlığına yol açtı ve bu olaylar Tahrîm sûresinin ilk âyetlerinin nüzul sebepleri arasında anılır.","8 (630) yılının Zilhicce ayında oğlu İbrâhim dünyaya geldi. Hz. Hatice dışındaki eşlerinden çocuğu olmayan Peygamber için bu büyük bir sevinç oldu. İbrâhim küçük yaşta vefat etti ve Bakî'ye defnedildi.","16 (637) yılında Medine'de vefat etti. Cenaze namazını Hz. Ömer kıldırdı ve Cennetü'l-Bakî'ye defnedildi. Hz. Peygamber, Mâriye sebebiyle Mısırlıları akraba saydığı için fethedilecek Mısır halkına iyi davranılmasını tavsiye etmişti."]},{"id":"halime","ad":"Halîme es-Sa'diyye","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"rivayet","ozet":"Hz. Peygamber'in sütannesidir; Peygamber çocukluğunu Benî Sa'd yurdunda onun yanında geçirdi. Peygamber ona her zaman büyük saygı gösterdi.","tdv":"halime","not":"Müslüman olup olmadığı ve kabrinin yeri konusunda farklı görüşler vardır; Bakî'de ona nispet edilen bir kabir bulunur.","xy":[512.44,173.85],"uzun":["Halîme es-Sa'diyye, Hevâzin kabilesinin Sa'd b. Bekir koluna mensuptur ve Ümmü Kebşe künyesiyle de anılır. Eşi Hâris b. Abdüluzzâ'dır. Çocukları Abdullah, Üneyse ve Şeymâ, Hz. Peygamber'in süt kardeşleridir.","Mekke'de bir kıtlık yılında (569) zengin bir aile çocuğu bulamayınca yetim Muhammed'i süt oğlu olarak aldı. Onu iki yıl emzirdi; bu dönemde ailesinin bolluğa kavuştuğu ve şakk-ı sadr gibi olağanüstü olayların yaşandığı nakledilir. Annesi Âmine, çöl havasının çocuğa iyi geldiğini görünce onu bir süre daha Halîme'nin yanında bıraktı; beş yaşına gelince ailesine teslim edildi.","Bir kıtlık yılında Hz. Peygamber'i ziyaret ettiğinde Hz. Hatice ona kırk koyun ve bir deve verdi. Kaynaklar onun Müslüman olduğunda birleşir; süt kardeşleri de Müslüman olmuştur.","Ölüm tarihi kesin olarak bilinmemekle birlikte, bi'setten sonra ve Mekke'nin fethinden (8/630) önce vefat ettiği tahmin edilir. TDV kabri hakkında bilgi vermez; geleneksel olarak Cennetü'l-Bakî'de ziyaret edilen bir kabri gösterilir."]},{"id":"esad-zurare","ad":"Es'ad b. Zürâre","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Medine'de İslâm'ı ilk kabul edenlerdendir ve Akabe biatlarında bulundu. Mus'ab b. Umeyr'i evinde misafir etti. Hicretin ilk yılında vefat etti; Bakî'e defnedilen ilk Ensârîdir.","tdv":"esad-b-zurare","xy":[512.44,173.85],"uzun":["Ebû Ümâme Es'ad b. Zürâre, Hazrec kabilesinin Neccâroğulları koluna mensup Medineli bir sahâbîdir; kardeşi Sa'd b. Zürâre de sahâbîdir. Hicretten üç yıl önce Mekke'ye gittiğinde Hz. Peygamber ile tanıştı ve Müslüman oldu. Medine'ye dönünce İslâm'ı tanıtmaya başladı.","Akabe'de Peygamber'le buluşan Hazrecli altı kişilik grup arasında yer aldı. Birinci ve İkinci Akabe biatlarında (621-622) bulundu; ikinci biatta Peygamber'e ilk biat eden o oldu. Hz. Peygamber onu Neccâroğulları'nın nakibi seçti. Mus'ab b. Umeyr ile birlikte çalışarak Üseyd b. Hudayr ve Sa'd b. Muâz gibi ileri gelenlerin Müslüman olmasına vesile oldu.","Hicretten önce Medine'de yaptırdığı bir mescidde vakit namazlarını ve Medine'de kılınan bilinen ilk cuma namazını kıldırdı; bu namaza kırk kişi katıldı. Hicretten sonra Mus'ab'ın bulunmadığı zamanlarda imamlık görevini sürdürdü. Vefatından önce kızlarını Hz. Peygamber'e emanet etti.","1 (623) yılının Şevval ayında, Mescid-i Nebevî inşa edilirken hastalanarak vefat etti. Hz. Peygamber cenazesini yıkayıp kefenledi, namazını kıldırdı ve kabre kadar eşlik etti. Cennetü'l-Bakî'ye defnedilen ilk Ensârî sahâbîdir."]},{"id":"ibn-mesud","ad":"Abdullah b. Mes'ûd","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"İlk Müslümanlardandır; Kur'an'ı Mekke'de açıktan okuyan ilk sahâbîdir. Kur'an ve fıkıh bilgisiyle Kûfe'nin hocası oldu. 32 (652-53) yılında Medine'de vefat etti.","tdv":"abdullah-b-mesud","xy":[512.44,173.85],"uzun":["Abdullah b. Mes'ûd, Hüzeyl kabilesinden fakir bir ailenin çocuğudur ve Ebû Abdurrahman künyesiyle anılır. Babası Zühreoğulları ile antlaşmalı olduğu için bu kabileyle birlikte anılmıştır. Çocukluğunda Ukbe b. Ebû Muayt'ın koyunlarını güderken Hz. Peygamber'le tanıştı ve kendisini altıncı Müslüman olarak nitelendirdi.","Mekke'de işkencelere maruz kaldı ve Habeşistan hicretine katıldı. Hz. Peygamber'den sonra Kâbe'nin yanında Kur'an'ı açıktan okuyan ilk sahâbîdir. Medine'ye ilk hicret edenlerdendir ve bütün gazvelere katıldı. Bedir'de yaralı hâlde bulduğu Ebû Cehil'i öldürdü.","Hz. Ömer onu Kûfe'ye kadı ve beytülmâl sorumlusu olarak gönderdi. Kûfe'de yetiştirdiği öğrencilerle tefsir, kıraat ve fıkıh alanında bir ekolün temellerini attı. Re'y ve kıyasa önem veren Irak fıkıh ekolünün, dolayısıyla Hanefî mezhebinin dayandığı ilmî geleneğin kurucusu kabul edilir.","Hz. Osman onu Medine'ye çağırdı ve o halifenin emrine uyarak döndü. 32 (652-53) yılında altmış yaşını aşmış olarak Medine'de vefat etti. Cenaze namazını Hz. Osman veya Ammâr kıldırdı ve Cennetü'l-Bakî'ye defnedildi."]},{"id":"suheyb","ad":"Suheyb b. Sinân er-Rûmî","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"İlk Müslümanlardandır. Medine'ye hicret edebilmek için bütün malını Mekkelilere bıraktı. Hz. Ömer vasiyetiyle cenaze namazını ona kıldırttı. 38 (659) yılında vefat etti.","tdv":"suheyb-b-sinan","xy":[512.44,173.85],"uzun":["Ebû Yahyâ Suheyb b. Sinân, Musul yakınlarında doğmuş bir Araptır. Küçük yaşta Bizanslıların bir baskınında esir alınıp Bizans topraklarında büyüdüğü için \"er-Rûmî\" lakabıyla tanınır. Gençliğinde köle olarak Mekke'ye getirildi; Abdullah b. Cüd'ân onu satın alıp azat etti.","Dârülerkam'da Müslüman oldu ve imanını açıkça ilan eden ilk yedi kişiden biri sayıldı. Koruyacak kabilesi olmadığı için ağır işkencelere uğradı. Hicret ederken müşrikler malını elinden aldı; Hz. Peygamber onun bu fedakârlığını kârlı bir alışveriş olarak övdü. Medine'ye ulaştıktan sonra bütün savaşlara katıldı.","Hz. Ömer'in güvendiği sahâbîlerdendi. Ömer, yaralandıktan sonra yeni halife seçilinceye kadar namazları kıldırmak üzere onu vekil bıraktı; Hz. Ömer'in cenaze namazını da o kıldırdı ve üç günlük şûra süresince imamlık yaptı.","38 (659) yılının Şevval ayında Medine'de vefat etti; cenaze namazını Sa'd b. Ebû Vakkās kıldırdı ve Cennetü'l-Bakî'ye defnedildi. Çorum'da adına bir türbe bulunur; TDV, Medine'de vefat ettiği kesin olduğundan bu yerin ancak bir makam olabileceğini belirtir."]},{"id":"ebu-hureyre","ad":"Ebû Hüreyre","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Suffe ashabındandır ve en çok hadis rivayet eden sahâbîdir. Hayber'in fethi sırasında Medine'ye geldi ve Peygamber'den hiç ayrılmadı. 57-59 (677-679) yıllarında vefat etti.","tdv":"ebu-hureyre","xy":[512.44,173.85],"uzun":["Ebû Hüreyre'nin adı Abdurrahman b. Sahr ed-Devsî'dir ve Yemen'deki Ezd kabilesinin Devs koluna mensuptur. Câhiliye dönemindeki adını Hz. Peygamber Abdurrahman veya Abdullah olarak değiştirdi. \"Kedicik babası\" anlamına gelen künyesi, koyun güderken bulduğu kedi yavrusuyla oynamasından gelir.","7 (628) yılının başında Tufeyl b. Amr ed-Devsî aracılığıyla Müslüman oldu ve Medine'ye geldi. Kendini tamamen ilme verdi; açlığa rağmen Mescid-i Nebevî'deki Suffe'den ayrılmadı. Hayber'in fethine ve sonraki gazvelerin çoğuna katıldı.","Hz. Peygamber'in yanından hiç ayrılmadığı için en çok hadis rivayet eden sahâbîdir; rivayetleri tekrarlarıyla birlikte beş bin civarındadır. Ondan hadis nakleden sahâbî ve tâbiîlerin sayısı çok fazladır.","Hz. Peygamber'in vefatından sonra Bahreyn'de görev yaptı; Hz. Ömer onu iki kez Bahreyn valisi tayin etti. Muâviye döneminde Medine'de vekâleten namaz kıldırdı ve davalara baktı. 58 (678) yılında yetmiş sekiz yaşlarında Medine'de vefat etti ve Cennetü'l-Bakî'ye defnedildi."]},{"id":"ibn-cahs","ad":"Abdullah b. Cahş","ulke":"SAU","yer":"Medine, Uhud (Hz. Hamza'nın kabri)","durum":"kabir","ozet":"Hz. Peygamber'in halasının oğlu ve Hz. Zeyneb bint Cahş'ın kardeşidir. İki hicrete de katıldı. Uhud'da şehid düştü; TDV'ye göre kabri Hz. Hamza'nın türbesindedir.","tdv":"abdullah-b-cahs","xy":[512.44,173.85],"uzun":["Abdullah b. Cahş, Esed b. Huzeyme kabilesine mensuptur ve Ebû Muhammed künyesiyle anılır. Annesi Ümeyme bint Abdülmuttalib, Hz. Peygamber'in halasıdır; kız kardeşi Zeyneb bint Cahş Peygamber'in eşidir. Dârülerkam döneminden önce iki kardeşiyle birlikte Müslüman oldu.","Habeşistan'a yapılan iki hicrete de katıldı, sonra ailesiyle birlikte Medine'ye göç etti. Hz. Peygamber onu Âsım b. Sâbit ile kardeş ilan etti. Hicretin on yedinci ayında Nahle'ye gönderilen seriyyenin komutanı oldu; bu yüzden \"emîrü'l-mü'minîn\" diye anılan ilk kişi olarak bilinir.","Nahle seriyyesinde Kureyş'e ait bir kervanla karşılaşıldı ve çatışma çıktı. Olay Recep ayında gerçekleştiği için müşrikler haram ayda savaşıldığını yaydı; Hz. Peygamber de emri olmadığı için ganimetten pay almadı. Ardından inen Bakara sûresinin 217. âyeti, Allah yolundan alıkoymanın daha büyük bir günah olduğunu bildirdi.","Bedir'e ve Uhud'a katıldı. Uhud'da (3/625) kahramanca savaşarak kırk yaşlarında şehid oldu; müşrikler naaşına müsle yaptı. Dayısı Hz. Hamza ile aynı kabre defnedildi; kabri Uhud şehidliğindedir."]},{"id":"hanzala","ad":"Hanzala b. Ebû Âmir (Gasîlü'l-melâike)","ulke":"SAU","yer":"Medine, Uhud","durum":"kabir","ozet":"Düğününün ertesi sabahı Uhud'a koşup şehid düşen sahâbîdir. Cenazesini meleklerin yıkadığı haber verildiği için \"Gasîlü'l-melâike\" diye anılır.","tdv":"hanzale-b-ebu-amir","xy":[512.44,173.85],"uzun":["Hanzala b. Ebû Âmir, Evs kabilesinden Ensâr'a mensup bir sahâbîdir. Babası Câhiliye döneminde \"Râhib\" diye bilinen Ebû Âmir Amr'dır; önce hanîf olduğu söylenen bu kişi sonradan İslâm'ın azılı düşmanlarından oldu. Hanzala'nın ise hicretten sonra Müslüman olduğu tahmin edilir.","Uhud Gazvesi'nden bir gün önce Abdullah b. Übey'in Müslüman kızı Cemîle ile evlendi. Hz. Peygamber'in Uhud'a çıktığını duyunca gusül abdesti almaya vakit bulamadan orduya katıldı. Savaş sırasında müşrik ordusunun komutanı Ebû Süfyân'ı atından düşürdü.","Ebû Süfyân'ın yardım istemesi üzerine Şeddâd b. Esved onu mızrakla şehid etti (3/625). Hz. Peygamber, naaşını meleklerin yıkadığını haber verdi; bu yüzden \"Gasîlü'l-melâike\" (meleklerin yıkadığı) lakabıyla anıldı. TDV kabri hakkında bilgi vermez; Uhud şehidleri arasında defnedildiği kabul edilir."]},{"id":"ibn-cubeyr","ad":"Abdullah b. Cübeyr","ulke":"SAU","yer":"Medine, Uhud","durum":"kabir","ozet":"Uhud'da okçuların komutanıdır. Hz. Peygamber'in emri üzerine tepeden ayrılmayan birkaç arkadaşıyla birlikte Hâlid b. Velîd'in baskınında şehid düştü.","tdv":"abdullah-b-cubeyr","xy":[512.44,173.85],"uzun":["Abdullah b. Cübeyr, Evs kabilesine mensup Medineli bir sahâbîdir ve Ebü'l-Münzir künyesiyle anılır. Birinci Akabe Biatı'ndan sonra Müslüman oldu. Medineli yetmiş kişiyle birlikte Mekke'ye gelerek İkinci Akabe Biatı'nda Hz. Peygamber'e biat etti.","Bedir'e katıldı. Uhud'da (3/625) Hz. Peygamber, ordunun arkasından gelebilecek bir saldırıyı önlemek için Ayneyn tepesine yaklaşık elli okçu yerleştirdi ve onların komutanlığına Abdullah'ı getirdi. Savaşın başında Müslümanlar üstün gelince okçuların çoğu ganimet için yerlerini bıraktı; Abdullah, Peygamber'in emrini hatırlatarak onları durdurmaya çalıştıysa da başaramadı.","Yanında kalan on kadar kişiyle Hâlid b. Velîd komutasındaki süvarilere karşı önce okla, sonra mızrakla, en son kılıçla savaştı ve şehid oldu. Âl-i İmrân sûresinin 152. âyeti, Peygamber'in emrine bağlı kalan bu sahâbîleri över. TDV kabri hakkında bilgi vermez; Uhud şehidleri arasında, okçular tepesinin (Cebel-i Rumât) eteğindeki şehidlikte defnedildiği kabul edilir."]},{"id":"bedir","ad":"Bedir şehidleri","ulke":"SAU","yer":"Bedir (Medine–Mekke yolu)","durum":"kabir","ozet":"Hicretin 2. yılında (624) yapılan Bedir Gazvesi'nde şehid düşen on dört sahâbî savaş alanının yakınında defnedildi. Ubeyde b. Hâris, Umeyr b. Ebû Vakkās ve Hârise b. Sürâka bunlar arasındadır.","tdv":"bedir-gazvesi","xy":[510.25,176.08],"uzun":["Bedir Gazvesi, Ramazan 2 (Mart 624) tarihinde Müslümanlarla Mekkeli müşrikler arasında yapılan ilk büyük savaştır. Ebû Süfyân yönetiminde Suriye'den dönen büyük bir Kureyş kervanı sebebiyle Hz. Peygamber 12 Ramazan'da Medine'den yola çıktı. Ebû Süfyân yardım isteyince Kureyş, Ebû Cehil komutasında büyük bir ordu hazırladı.","Müslüman ordusu 305 kişi, 70 deve ve iki attan oluşuyordu; Kureyş ordusu ise yaklaşık 1000 asker, 700 deve ve 100 attan meydana geliyordu. 17 Ramazan 2 (13 Mart 624) günü önce teke tek çarpışmalar yapıldı, ardından genel savaş ikindiye doğru Müslümanların kesin zaferiyle sonuçlandı. Müşriklerden yetmiş kişi öldürüldü, yetmiş kişi esir alındı.","Bedir zaferi, İslâm toplumuna Medine'de ve bütün Arap yarımadasında büyük itibar kazandırdı. Esirlerin çoğu fidye karşılığında veya Müslüman çocuklara okuma yazma öğretme şartıyla serbest bırakıldı. Bedir'e katılan sahâbîler \"Ehl-i Bedir\" diye anılır ve günahlarının bağışlandığı müjdesiyle şereflendirilmiştir; isimleri asırlardır dua ve tevessülle okunur.","Müslümanlar bu savaşta on dört şehid verdi; Ubeyde b. Hâris yaralarının etkisiyle dönüş yolunda vefat etti. Hz. Peygamber şehidlerin cenaze namazını kıldırarak onları savaş alanında defnettirdi. Şehidlerin kabirleri bugün Suudi Arabistan'daki Bedir kasabasında, duvarla çevrili Bedir Şehitliği'ndedir."]},{"id":"ibn-omer","ad":"Abdullah b. Ömer","ulke":"SAU","yer":"Mekke","durum":"kabir","ozet":"Hz. Ömer'in oğludur; sünnete bağlılığı ve çok sayıda hadis rivayetiyle tanınır. Fitne dönemlerinde tarafsız kaldı. 73 (693) yılında Mekke'de vefat etti.","tdv":"abdullah-b-omer","not":"Mekke'de defnedildiği yerin Fah veya Zûtuvâ olduğu rivayet edilir.","xy":[513.13,183.71],"uzun":["Abdullah b. Ömer, Hz. Ömer'in oğludur ve Ebû Abdurrahman künyesiyle anılır; Hz. Peygamber'in eşi Hafsa'nın kardeşidir. Nübüvvetin üçüncü yılında (613) Mekke'de doğdu ve küçük yaşta babasıyla birlikte Müslüman oldu. Babasıyla birlikte Medine'ye hicret etti.","Bedir'e ve on üç yaşındayken Uhud'a katılmak istedi; Hz. Peygamber yaşının küçüklüğü sebebiyle izin vermedi. On beş yaşında Hendek Gazvesi'ne (5/627) katıldı; ardından Bey'atürrıdvân, Hayber, Mekke'nin fethi ve Huneyn'de bulundu. Sonraki yıllarda Suriye, Irak, Nihâvend ve Mısır fetihlerine ve 49 (669) yılındaki İstanbul seferine katıldı.","Hz. Peygamber'in sünnetine son derece bağlıydı; onun namaz kıldığı ve konakladığı yerleri bile takip ederdi. Müslümanlar arasındaki iç çatışmalardan uzak durdu ve ancak ümmetin üzerinde birleştiği kişiye biat etti. 2630 rivayetle Ebû Hüreyre'den sonra en çok hadis nakleden sahâbîdir ve yaklaşık altmış yıl fetva verdi.","73 (693) yılının hac mevsiminde Minâ'da bir mızrakla yaralandı ve seksen beş yaşlarında Mekke'de vefat etti. TDV kabrinin yerini belirtmez; Mekke'de, Fah veya Cennetü'l-Muallâ kabristanında defnedildiği rivayet edilir."]},{"id":"esma","ad":"Esmâ bint Ebû Bekir","ulke":"SAU","yer":"Mekke","durum":"kabir","ozet":"Hz. Ebû Bekir'in kızıdır. Hicret sırasında Sevr mağarasına azık taşıdığı için \"Zâtü'n-nitâkayn\" diye anılır. Oğlu Abdullah b. Zübeyr'in şehadetinden kısa süre sonra 73 (692) yılında Mekke'de vefat etti.","tdv":"esma-bint-ebu-bekir","xy":[513.13,183.71],"uzun":["Esmâ bint Ebû Bekir, Hz. Ebû Bekir'in kızı, Hz. Âişe'nin baba bir kardeşi ve Abdullah b. Zübeyr'in annesidir. Hicretten yirmi yedi yıl önce (595) Mekke'de doğdu ve ilk Müslümanlar arasında yer aldı. Zübeyr b. Avvâm ile evlendi.","Hz. Peygamber ile babası hicrete çıkarken Esmâ ve Âişe yol azığını hazırladılar. Azık torbasının ağzını bağlayacak ip bulunamayınca Esmâ belindeki kuşağı ikiye ayırdı; bu sebeple Peygamber ona \"Zâtü'n-nitâkayn\" (iki kuşaklı) lakabını verdi. Sevr mağarasındaki Peygamber ile babasına yiyecek taşıdığı da bilinir.","Medine'ye hicret ettikten sonra Kubâ'da oğlu Abdullah'ı dünyaya getirdi; Abdullah, muhacirlerin Medine'de doğan ilk çocuğudur. Oğlu yıllar sonra halifeliğini ilan edip Haccâc tarafından Mekke'de kuşatılınca, Esmâ ona teslim olmamasını ve onurlu bir ölümü seçmesini öğütledi. Oğlunun ölümünden sonra kendisine gelen Haccâc'a sert bir dille karşılık verdi.","Oğlu Abdullah'ın 14 Cemâziyelevvel 73 (1 Ekim 692) tarihinde şehid edilmesinden birkaç gün sonra, yüz yaşlarında Mekke'de vefat etti. Muhacir kadınlar arasında en son vefat edendir. TDV kabrinin yerini belirtmez; Mekke'deki Cennetü'l-Muallâ'da defnedildiği kabul edilir."]},{"id":"ibn-zubeyr","ad":"Abdullah b. Zübeyr","ulke":"SAU","yer":"Mekke","durum":"kabir","ozet":"Hicretten sonra Medine'de doğan ilk Muhâcir çocuğudur. Hilâfetini ilan ederek Hicaz, Irak ve Mısır'a hâkim oldu. 73 (692) yılında Haccâc'ın kuşatması sırasında Mekke'de şehid edildi.","tdv":"abdullah-b-zubeyr","xy":[513.13,183.71],"uzun":["Abdullah b. Zübeyr, 2 (624) yılının Zilkade ayında Medine'de doğdu. Babası Zübeyr b. Avvâm, annesi Hz. Ebû Bekir'in kızı Esmâ'dır. Muhacirlerin Medine'de doğan ilk çocuğu olduğu için doğumu büyük sevinçle karşılandı ve adını Hz. Peygamber koydu.","Gençliğinde babasıyla birlikte Yermük Savaşı'nda ve Mısır'ın fethinde bulundu. 27 (647) yılındaki İfrîkıye seferinde Bizans valisi Gregorios'u bizzat öldürerek zaferde önemli rol oynadı. 30 (650) yılında Taberistan ve Cürcân seferinde de yararlılık gösterdi.","Muâviye'nin oğlu Yezîd'i veliaht yapmasına karşı çıktı ve Mekke'ye çekildi. Yezîd halife olunca ona biat etmedi; Kerbelâ'dan sonra Emevî karşıtlarının başlıca lideri oldu. Yezîd'in ölümünden sonra 64 (683) yılında halifeliğini ilan etti ve Hicaz ile doğu eyaletlerinde hâkimiyet kurdu.","Abdülmelik'in gönderdiği Haccâc b. Yûsuf 72 (692) yılında Mekke'yi kuşattı. Uzun kuşatma ve kıtlık yüzünden taraftarları onu terk etti; annesi Esmâ'nın öğüdüyle teslim olmadı ve 73 (692) yılında savaşarak şehid oldu. Cesedi bir süre darağacında bırakıldı, ardından annesinin isteğiyle defnedildi. TDV kabrinin yerini belirtmez; Mekke'de defnedildiği bilinir."]},{"id":"fedale","ad":"Fedâle b. Ubeyd","ulke":"SYR","yer":"Şam, Bâbüssağîr Kabristanı","durum":"kabir","ozet":"Ensâr'dan ve Suffe ashabındandır; Uhud, Hendek ve Rıdvan biatında bulundu. Suriye fetihlerinden sonra Dımaşk'a yerleşip kadılık yaptı. 53 (673) yılında Dımaşk'ta vefat etti.","tdv":"fedale-b-ubeyd","xy":[503.39,144.6],"uzun":["Fedâle b. Ubeyd, Medine'de Evs kabilesinin Amr b. Avf koluna mensup bir sahâbîdir ve Ebû Muhammed künyesiyle anılır. İlk Müslümanlardan ve Suffe ehlindendir; annesi de sahâbîdir.","Uhud ve Hendek başta olmak üzere Hz. Peygamber'in bütün gazvelerine ve Bey'atürrıdvân'a katıldı. Peygamber'in vefatından sonra Suriye fetihlerinde bulundu, Mısır seferine komutan olarak katıldı. 49 (669) yılında Tunus kıyısındaki Cerbe adasını fethettiği ve orada bir kış geçirdiği rivayet edilir.","Suriye'nin fethinden sonra Dımaşk'a yerleşti ve Ebü'd-Derdâ'nın tavsiyesiyle 32 (652) yılında Dımaşk kadısı oldu. Muâviye merkezden uzak kaldığında onu yerine vekil bırakırdı. Deniz işleriyle de ilgilendi ve Bizans'a yapılan bir deniz seferine komuta etti.","53 (673) yılında Dımaşk'ta vefat etti ve Bâbüssağîr Kabristanı'na defnedildi. Rivayete göre cenazesini Muâviye bizzat taşıdı."]},{"id":"zeyneb-ali","ad":"Hz. Zeyneb bint Ali","ulke":"SYR","yer":"Şam, Seyyide Zeyneb","durum":"rivayet","ozet":"Hz. Ali ile Hz. Fâtıma'nın büyük kızı ve Hz. Peygamber'in torunudur. Kerbelâ'dan sonra Kûfe ve Dımaşk'taki konuşmalarıyla ve ailesini korumasıyla öne çıktı.","tdv":"zeyneb-bint-ali","not":"TDV'ye göre Şam'daki türbe ona nispet edilir ve önemli bir ziyaretgâhtır; ancak gerçek kabrinin Medine'de olması gerektiği belirtilir. Kahire'de de ona nispet edilen bir makam vardır.","xy":[503.39,144.6],"uzun":["Hz. Zeyneb, Hz. Ali ile Hz. Fâtıma'nın büyük kızıdır ve 4 (627) yılının Şaban ayında Medine'de doğdu. Babasının yanında bilgili, akıllı ve basiretli bir hanım olarak yetişti; \"Âkıletü Benî Hâşim\" (Hâşimoğulları'nın akıllısı) diye anıldı. Amcası Ca'fer b. Ebû Tâlib'in oğlu Abdullah ile evlendi.","Kerbelâ'da (61/680) ailenin en yaşlı kadını olarak yaralıların bakımını ve kadınlarla çocukların korunmasını üstlendi. Kûfe valisi Ubeydullah b. Ziyâd yeğeni Zeynelâbidîn'i öldürmek isteyince onun üzerine kapanarak hayatını kurtardı.","Esirlerle birlikte götürüldüğü Kûfe'de halka hitap ederek Hz. Ali ve Hz. Hüseyin'e yapılan vefasızlığı dile getirdi. Dımaşk'ta Yezîd'in huzurunda da davalarının haklılığını cesaretle savundu. Erkek önderlerin kalmadığı bu dönemde Ehl-i beyt'in önderi konumuna geldi.","Vefat tarihi ve yeri hakkında farklı rivayetler vardır; 62 (682) veya 65 (684) yılında Medine, Dımaşk veya Kahire'de vefat ettiği söylenir. TDV, Dımaşk'taki türbenin küçük kız kardeşi Zeyneb'e, Kahire'dekinin başka birine ait olabileceğini ve gerçek kabrinin Medine'de olması gerektiğini de nakleder. Buna rağmen Dımaşk'taki Seyyide Zeyneb makamı büyük bir ziyaretgâh olmayı sürdürmektedir."]},{"id":"bureyde","ad":"Büreyde b. Husayb el-Eslemî","ulke":"TKM","yer":"Mary (Merv)","durum":"kabir","ozet":"Hicret yolculuğunda Hz. Peygamber'le karşılaşıp kabilesiyle Müslüman olan sahâbîdir. Hudeybiye'de ve birçok gazvede bulundu. Horasan fetihlerine katıldı ve Merv'de vefat etti.","tdv":"bureyde-b-husayb","not":"Merv'deki iki sahâbî türbesi XV. yüzyılda Şâhruh tarafından yeniden yaptırılmıştır ve bugün de ayaktadır.","xy":[569.45,131.39],"uzun":["Büreyde b. Husayb, Eslem kabilesinin Sehmoğulları koluna mensuptur ve Ebû Abdullah künyesiyle anılır. Hicret sırasında müşriklerin vaat ettiği ödül için Hz. Peygamber'i yakalamak üzere yola çıktı; ancak onunla konuşunca etkilenerek adamlarıyla birlikte Müslüman oldu. Peygamber'in Medine'ye bayrakla girmesi için sarığını mızrağına bağladı.","Bedir ve Uhud'da bulunamadı, fakat sonraki on altı gazveye katıldı. Müreysî' öncesinde haber toplama görevi yaptı, Hudeybiye'ye giden orduya kılavuzluk etti. Mekke'nin fethinde Eslem kabilesinin sancaklarından birini taşıdı; zekât memurluğu yaptı ve Üsâme ordusunun sancağını taşıdı.","Hz. Ömer döneminde komutan olarak görev aldı ve Basra kurulunca oraya yerleşti. Hz. Osman zamanında Horasan'ın fethine katıldı. Yezîd döneminde ömrünün sonuna kadar Merv'de yaşadı.","62 (681-82) veya 63 (682-83) yılında Merv'de vefat etti. Kabri bugün Türkmenistan'daki Merv'de, Hakem b. Amr el-Gıfârî'nin kabrinin yanındadır; iki sahâbînin kabirleri önemli bir ziyaret yeridir."]},{"id":"hakem","ad":"Hakem b. Amr el-Gıfârî","ulke":"TKM","yer":"Mary (Merv)","durum":"kabir","ozet":"Hz. Peygamber'in sohbetinde bulunmuş Gıfâr kabilesinden bir sahâbîdir. Muâviye döneminde Horasan valiliği yaptı ve Mâverâünnehir'e seferler düzenledi. 50 (670) yılı civarında Merv'de vefat etti.","tdv":"hakem-b-amr","xy":[569.45,131.39],"uzun":["Hakem b. Amr el-Gıfârî, Gıfâr kabilesine mensup bir sahâbîdir ve babasının lakabından dolayı Hakem b. Akra' diye de tanınır. Kardeşleri Râfi' ve Atıyye de sahâbîdir.","Hz. Peygamber'in vefatına kadar onun sohbetinde bulundu, ardından Basra'ya yerleşti. Müslümanlar arasındaki iç çatışmalara karışmadı.","45 (665) yılında Irak valisi Ziyâd b. Ebîh tarafından Horasan valiliğine gönderildi. Herat ve Merv bölgelerinde fetihler yaptı, 47 (667) yılında Gur ve Ferâvende'yi aldı ve Ceyhun'un ötesine kadar ilerledi. Ganimetlerin tamamını Muâviye'ye göndermeyi reddettiği için azledildi.","50 (670) yılında Merv'de vefat etti; 45 (665) ve 51 (671) tarihleri de kaydedilmiştir. TDV'ye göre kabri, Merv'deki Tennûrkerân mevkiinde Büreyde b. Husayb'ın kabrinin yanındadır."]},{"id":"amir-vakkas","ad":"Âmir b. Ebû Vakkās","ulke":"JOR","yer":"Ürdün Vadisi","durum":"rivayet","ozet":"Sa'd b. Ebû Vakkās'ın kardeşi ve ilk Müslümanlardandır; Habeşistan'a hicret etti. Suriye fetihlerine katıldı.","not":"Ürdün Vadisi'nde ona nispet edilen bir türbe bulunur.","xy":[501.58,148.84]}],"lists":{"turk":["TUR","CYN","AZE","KAZ","UZB","TKM","KGZ","DTR"],"islam":["AFG","ALB","BHR","BGD","ARE","BIH","BRN","BFA","DZA","DJI","TCD","IDN","MAR","PSX","GMB","GIN","IRQ","QAT","COM","KOS","KWT","LBY","LBN","MDV","MLI","MYS","EGY","MRT","NER","PAK","SEN","SLE","SOM","SDN","SYR","SAU","TJK","TUN","OMN","JOR","YEM"]},"tb":[{"k":"p","ad":"Hz. Yunus A.S.","il":"Hatay","u":"TUR","oz":"Ninova halkını uyarmak için gönderilen, balığın karnında kalıp kurtulan peygamberdir.","not":"TDV'ye göre kabri muhtemelen doğduğu yer olan Gathefer'dedir. Buradaki makam farklı bir rivayete dayanır.","q":"Yunus","xy":[503.19,134.98],"uzun":["Hz. Yûnus, Kur'ân-ı Kerîm'de adı geçen peygamberlerdendir; Yûnus b. Mettâ, Zünnûn (balık sahibi) ve Sâhibü'l-hût adlarıyla anılır. İsrâiloğulları'ndandır ve Asur'un başkenti Ninova halkına peygamber olarak gönderilmiştir. Kur'an'da onun adını taşıyan bir sûre (Yûnus sûresi) vardır.","Kur'an'daki kıssaya göre Yûnus, kavminin iman etmemesine öfkelenerek onların yanından ayrıldı ve yüklü bir gemiye bindi. Çekilen kurada adı çıkınca denize atıldı ve bir balık tarafından yutuldu. Balığın karnında \"Senden başka ilâh yoktur, seni tenzih ederim, ben zalimlerden oldum\" diye dua edince Allah duasını kabul etti ve onu karaya çıkardı; üzerine gölge veren bir bitki bitirildi.","Daha sonra yüz bin veya daha fazla kişiden oluşan kavmine yeniden gönderildi. Kavmi iman etti ve kendilerine bildirilen azaptan kurtuldu; Kur'an onları azap gelmeden önce iman ederek kurtulan tek topluluk olarak anar. Kıssa, Allah'ın rahmetinin genişliğini, tövbenin değerini ve öfkeyle acele davranmamak gerektiğini öğretir.","Kabrinin yeri hakkında farklı rivayetler bulunmaktadır. TDV, kabrinin doğduğu yer olan Gathefer'de olabileceğini nakleder; Musul'daki Nebî Yûnus Camii de asırlarca onun makamı olarak ziyaret edilmiştir. Hatay'daki bu makam da halk arasında Hz. Yûnus'a nispet edilen ziyaret yerlerindendir."]},{"k":"p","ad":"Hz. Zülkif A.S.","il":"Diyarbakır","u":"TUR","oz":"Kur'an'da Enbiyâ ve Sâd sûrelerinde adı geçen, çoğu müfessire göre peygamber olan bir şahsiyettir; kimliği tartışmalıdır.","not":"Farklı rivayetler bulunmaktadır.","q":"Zülkif","xy":[513.62,130.02],"uzun":["Zülkifl, Kur'ân-ı Kerîm'de İsmâil, İdrîs ve Elyesa' gibi peygamberlerle birlikte iki âyette (Enbiyâ 21/85; Sâd 38/48) anılır. Bu âyetlerde onun sabredenlerden ve hayırlı kullardan olduğu bildirilir; hayatına dair başka ayrıntı verilmez.","Kimliği konusunda farklı görüşler vardır. Fahreddin er-Râzî ve İbn Kesîr, âyetlerin bağlamına dayanarak onun bir peygamber olduğunu kabul eder; Mücâhid gibi bazı âlimler ise onu sâlih bir kul olarak görür. İsim, \"nasip veya kefalet sahibi\" anlamına gelir.","Rivayetlerde lakabın sebebi olarak, Elyesa'nın yerine geçmek için konulan şartları (gündüzleri oruç tutmak, geceleri ibadet etmek ve öfkelenmemek) üstlenip yerine getiren bir zâttan söz edilir. Bu kefaleti yerine getirdiği için \"Zülkifl\" diye anıldığı nakledilir.","TDV maddesinde kabri hakkında bilgi yoktur. Irak'ta Kifl kasabasında ve Diyarbakır Eğil'de ona nispet edilen makamlar bulunur; Eğil'deki bu makam halk arasında Hz. Zülkifl ve Hz. Elyesa' kabirleri olarak ziyaret edilir. Farklı rivayetler bulunmaktadır."]},{"k":"p","ad":"Hz. Elyasa A.S.","il":"Diyarbakır","u":"TUR","oz":"Kur'an'da adı geçen, İlyâs peygamberin halefi olarak bilinen peygamberdir.","not":"Farklı rivayetler bulunmaktadır.","q":"Elyasa","xy":[513.62,130.02],"uzun":["Hz. Elyesa', Kur'ân-ı Kerîm'de En'âm (6/86) ve Sâd (38/48) sûrelerinde İsmâil, Yûnus, Lût ve Zülkifl ile birlikte anılır. Âyetlerde onun âlemlere üstün kılındığı ve hayırlı kullardan olduğu bildirilir. İslâmî kaynaklarda şeceresi Elyesa' b. Ahtûb olarak verilir.","Hz. İlyâs'ın yardımcısı ve halefidir. Rivayete göre İlyâs onu tarlada çiftçilik yaparken bulmuş, kendisine halef seçildiğini bildirmiş; Elyesa' da ondan ayrılmayarak hizmet etmiştir. İlyâs'tan sonra İsrâiloğulları'na peygamberlik yapmıştır.","Kaynaklarda acı suyu tatlı hale getirmesi, hastaları iyileştirmesi ve ihtiyaç sahiplerine bereket getirmesi gibi mucizelerinden söz edilir. İsrâil hükümdarlarına Allah'ın emirlerini tebliğ ettiği ve hastalanarak vefat ettiği nakledilir.","TDV maddesinde kabrinin yerine dair bilgi yoktur. Diyarbakır Eğil'deki bu makam, halk arasında Hz. Elyesa' ve Hz. Zülkifl'e nispet edilen önemli bir ziyaret yeridir; farklı rivayetler bulunmaktadır."]},{"k":"p","ad":"Hz. Yuşa A.S.","il":"İstanbul","u":"TUR","oz":"Hz. Mûsâ'dan sonra İsrâiloğulları'nın önderi olan peygamberdir.","not":"TDV'ye göre Beykoz'daki kabir en yaygın inançtır ve Yahyâ Efendi tarafından keşfedildiği rivayet edilir; ancak madde bu kabrin Tevrat'taki Yeşu'ya ait olmasını mümkün görmez. Ahd-i Atîk'e göre Filistin'de Timnatserah'a defnedilmiştir.","q":"Yuşa","xy":[484.31,120.06],"uzun":["Hz. Yûşa' b. Nûn, Hz. Mûsâ'dan sonra İsrâiloğulları'na peygamberlik yapmıştır. Önceleri Hz. Mûsâ'nın yardımcısı idi; onun vefatından sonra İsrâiloğulları'nın başına geçti ve peygamberlik görevini üstlendi.","Kur'ân-ı Kerîm'de adı geçmez, ancak iki yerde ona işaret edildiği kabul edilir. Mâide sûresinde (5/23) Allah'ın emrine uyulmasını isteyen iki kişiden biri olarak anılır. Kehf sûresinde (18/60-63) Hz. Mûsâ'nın Hızır'ı aramaya çıktığı yolculukta yanındaki genç (fetâ) olarak geçen kişinin de Yûşa' olduğu tefsirlerde ifade edilir.","Hz. Mûsâ'nın vefatından sonra İsrâiloğulları'nı vaat edilen topraklara soktu. Rivayetlere göre bir savaşta güneşin batmaması için dua etti ve fethedilen toprakları kabileler arasında paylaştırdı; yüz on yaşında vefat ettiği nakledilir.","Kabrinin yeri hakkında farklı rivayetler bulunmaktadır; kaynakların çoğu Filistin'i gösterir. İstanbul Beykoz'daki Yûşa Tepesi'ndeki kabrin ona ait olduğu halk arasında yaygın bir inançtır ve Yahyâ Efendi tarafından keşfedildiği rivayet edilir. TDV, Yûşa'nın Filistin'de vefat ettiğini, Ayvansarâyî'nin de bu kabrin bir evliyaya ait olabileceğini belirttiğini nakleder."]},{"k":"p","ad":"Hz. Eyüp A.S.","il":"Şanlıurfa","u":"TUR","oz":"Sabrın ve tahammülün simgesi olan, Kur'an'da adı geçen peygamberdir.","not":"Farklı rivayetler bulunmaktadır.","q":"Eyüp","xy":[510.5,132.3],"uzun":["Hz. Eyyûb, Kur'ân-ı Kerîm'de adı geçen peygamberlerdendir. Rivayetlere göre baba tarafından Hz. İshak'ın, anne tarafından Hz. Lût'un soyundandır. Allah'tan korkan, doğru ve zengin bir kul olarak tanınır.","Kur'an, ona vahiy gönderildiğini ve hidayete erdirildiğini bildirir. Ağır bir hastalığa ve mal, evlat kaybına uğradığında sabretti ve Rabbine \"Bu dert beni sardı, sen merhametlilerin en merhametlisisin\" diye dua etti. Allah duasını kabul etti; ayağını yere vurmasıyla çıkan soğuk suyla yıkanıp içerek şifa buldu, ailesi ve nimetleri kat kat kendisine geri verildi. Kur'an onu \"ne güzel kul, daima Allah'a yönelen\" diye över.","Tefsirlere göre eşinin adı Rahme (Rahime) olup Hz. Yûsuf'un soyundandır; bazı rivayetlerde Hz. Ya'kūb'un kızı olduğu söylenir. Hastalığı boyunca eşinin ona sadakatle hizmet ettiği anlatılır. Bir hatası sebebiyle eşine vurmaya yemin etmiş, Allah ona bir demet sapla vurarak yeminini yerine getirmesini bildirmiştir. Hastalığının on sekiz yıl sürdüğü rivayet edilir.","TDV maddesinde kabri hakkında bilgi yoktur; kabrinin yeri hakkında farklı rivayetler bulunmaktadır. Şanlıurfa'nın Eyyübnebi köyündeki türbe, sabır makamı (mağara) ve şifalı olduğuna inanılan kuyusuyla Anadolu'nun en çok ziyaret edilen yerlerindendir. Sabrı, Türk edebiyatında asırlardır tahammülün timsali olarak anılır."]},{"k":"p","ad":"Hz. Şit A.S. ( Makam)","il":"Mersin","u":"TUR","oz":"Hz. Âdem'in oğlu olan peygamberdir.","not":"Farklı rivayetler bulunmaktadır.","q":"Şit","xy":[496.95,134.42],"uzun":["Hz. Şît, Hâbil'in şehid edilmesinden sonra dünyaya gelen Hz. Âdem'in oğludur ve İslâmî kaynaklarda peygamber olarak kabul edilir. Adının \"Allah'ın bağışı\" anlamına geldiği, Hâbil'in yerine verilmiş bir armağan olduğu nakledilir.","Rivayetlere göre Hz. Âdem'in vefatından sonra Allah ona sahifeler indirmiştir; Taberî bunların elli sahife olduğunu kaydeder. Bu sahifelerde hikmete ve çeşitli ilimlere dair bilgiler bulunduğu nakledilir.","Soyu oğlu Yaniş (Enûş) vasıtasıyla devam etmiştir. Nûh tûfanından sonra Hz. Âdem'den sonra insanlığın ikinci atası sayılmış, Hz. Peygamber'in soy kütüğünde de yer almıştır.","Taberî'ye göre dokuz yüz on iki yaşında vefat etmiş ve Mekke'de Ebûkubeys dağına defnedilmiştir. TDV, ona nispet edilen türbenin Suriye'deki Maarretünnu'mân'da olduğunu belirtir. Mersin'deki bu yer onun adına bir makam olarak ziyaret edilmektedir; farklı rivayetler bulunmaktadır."]},{"k":"p","ad":"Hz. Lokman A.S. ( Makam)","il":"Mersin","u":"TUR","oz":"Kur'an'da adına bir sûre bulunan hikmet sahibi zattır; peygamber olup olmadığı ihtilaflıdır.","not":"Farklı rivayetler bulunmaktadır.","q":"Lokman","xy":[496.95,134.42],"uzun":["Hz. Lokmân, Kur'ân-ı Kerîm'in 31. sûresi olan Lokmân sûresinde adıyla anılır. Âyetlerde (31/12-19) ona hikmet verildiği bildirilir ve oğluna yaptığı öğütler aktarılır. Câhiliye Araplarında da bilgeliği ve hikmetli sözleriyle tanınırdı.","Peygamber mi yoksa hikmet sahibi bir veli mi olduğu konusunda görüş ayrılığı vardır. İkrime ve Şa'bî onun peygamber olduğunu söylerken, Katâde ve Mücâhid peygamber değil hakîm olduğunu belirtir. Ehl-i sünnet âlimlerinin çoğunluğu ikinci görüşü benimser.","Oğluna öğütleri; Allah'a ortak koşmamak, anne babaya iyilik etmek, namazı kılmak, iyiliği emredip kötülükten sakındırmak, musibetlere sabretmek, kibirlenmemek ve yürüyüşte, seste ölçülü olmak gibi iman, ibadet ve ahlâka dair esasları içerir. Ona verilen hikmet; ilim, isabetli söz ve davranış ile ilim-amel uyumu olarak açıklanır.","Kabri hakkında farklı rivayetler bulunmaktadır. Bir rivayete göre Ahkāf'ta Hz. Hûd'un kabrinin yakınına defnedilmiştir; Yâkūt ise kabrinin Taberiye Gölü'nün doğusunda, Remle'de veya Yemen'de olabileceğini aktarır. Mersin'deki bu yer onun adına bir makam olarak ziyaret edilmektedir."]},{"k":"p","ad":"Hz. Nebi Harun-ı Asefi A.S.","il":"Diyarbakır","u":"TUR","oz":"Hârûn-ı Âsefî adlı bir zata nispet edilir.","not":"Farklı rivayetler bulunmaktadır.","q":"Nebi Harun-ı Asefi","xy":[513.62,130.02]},{"k":"p","ad":"Hz. İlyas A.S.","il":"Şanlıurfa","u":"TUR","oz":"Kavmini Ba'l putperestliğine karşı uyaran peygamberdir.","not":"TDV'ye göre ölmeden göğe yükseltildiği rivayet edilir ve göğe çıkarıldığı yer bilinmez.","q":"İlyas","xy":[510.5,132.3],"uzun":["Hz. İlyâs, Kur'ân-ı Kerîm'de adı geçen peygamberlerdendir; En'âm (6/85) ve Sâffât (37/123) sûrelerinde İlyâs, Sâffât 37/130'da İlyâsîn adıyla anılır. Bazı rivayetler onun soyunu Hz. Hârûn'a bağlar. İsrâiloğulları'na peygamber olarak gönderilmiştir.","Kavmi Ba'l adlı puta tapıyordu. Hz. İlyâs onları bu inançtan vazgeçirmek ve tek Allah'a ibadete çağırmak için mücadele etti. Kur'an onun mümin kullardan olduğunu ve sonraki nesiller arasında hayırla anıldığını bildirir.","Halk inançlarında Hızır ile birlikte anılır; Hıdrellez geleneği bu iki ismin buluşmasına dayanır. TDV, Kur'an ve sahih hadislerde Hızır ile İlyâs'ın aynı kişi olduğuna dair bir işaret bulunmadığını belirtir. Bazı rivayetlerde ateşten bir atla semaya yükseltildiği ve hâlâ hayatta olduğu anlatılsa da İbnü'l-Cevzî bu rivayetleri uydurma saymış, âlimlerin çoğu onun vefat ettiği görüşündedir.","TDV maddesinde kabri veya makamı hakkında bilgi yoktur. Şanlıurfa'daki bu makam halk arasında Hz. İlyâs'a nispet edilen ziyaret yerlerindendir; farklı rivayetler bulunmaktadır."]},{"k":"p","ad":"Hz. Şuayp A.S.","il":"Şanlıurfa","u":"TUR","oz":"Medyen halkını adaletli ölçü ve tartıya çağıran peygamberdir.","not":"TDV'ye göre bazı rivayetlerde ona inananlarla birlikte Mekke'ye gidip orada vefat ettiği belirtilir.","q":"Şuayp","xy":[510.5,132.3],"uzun":["Hz. Şuayb, Hz. İbrâhim'in soyundan gelen bir peygamberdir; soyu ve babasının adı hakkında farklı rivayetler vardır. Kur'ân-ı Kerîm'de adı on bir yerde geçer ve Medyen halkına gönderildiği bildirilir. Âlimlerin çoğu, Kur'an'da anılan Eyke halkının da aynı kavim olduğunu kabul eder.","Kavmini yalnız Allah'a kulluğa çağırdı; ölçü ve tartıyı doğru yapmalarını, insanların hakkını eksik vermemelerini ve yeryüzünde bozgunculuk çıkarmamalarını emretti. Önceki kavimlerin, özellikle Lût kavminin akıbetini hatırlatarak onları uyardı. Güzel ve etkili konuşması sebebiyle \"Hatîbü'l-enbiyâ\" (peygamberlerin hatibi) diye anıldığı rivayet edilir.","Kavmi uyarılarına kulak asmayınca şiddetli bir sarsıntı, korkunç bir ses ve \"gölge günü\" azabıyla helâk edildi; yalnızca ona inananlar kurtuldu. Hz. Mûsâ'nın Medyen'de yardım ettiği kızların babasının Şuayb olup olmadığı tartışmalıdır; İbn Abbas ve Hasan-ı Basrî gibi âlimler bu kişinin başka biri olduğu görüşündedir.","TDV maddesinde kabri hakkında bilgi yoktur; helâkten sonra Şuayb ve ona inananların Mekke'ye gidip orada vefat ettikleri de nakledilir. Şanlıurfa Viranşehir yakınındaki antik Şuayb şehri ve buradaki makam, halk arasında ona nispet edilen ziyaret yerlerindendir; farklı rivayetler bulunmaktadır."]},{"k":"p","ad":"Hz. Enüş A.S.","il":"Diyarbakır","u":"TUR","oz":"Hz. Şît'in oğlu Enûş'a nispet edilir.","not":"Farklı rivayetler bulunmaktadır.","q":"Enüş","xy":[513.62,130.02]},{"k":"p","ad":"Hz. Rahime Valide ( Eyüp Peygamber'in Zevcesi)","il":"Şanlıurfa","u":"TUR","oz":"Halk geleneğinde Rahime adıyla anılan, Hz. Eyyûb'un sabırlı eşidir.","not":"Farklı rivayetler bulunmaktadır.","q":"Rahime Valide","xy":[510.5,132.3]},{"k":"p","ad":"Hz. Sam A.S. (Nuh A.S. oğlu)","il":"Aksaray","u":"TUR","oz":"Hz. Nûh'un oğlu Sâm'a nispet edilir.","not":"Farklı rivayetler bulunmaktadır.","q":"Sam","xy":[497.1,128.96]},{"k":"p","ad":"Hz. Danyal A.S.","il":"Mersin","u":"TUR","oz":"Bâbil sürgünü döneminde yaşadığı kabul edilen peygamberdir.","not":"Kabrinin İran'daki Sûs şehrinde olduğu da rivayet edilir.","q":"Danyal","xy":[496.95,134.42]},{"k":"p","ad":"Hz. Şem’un Nebi A.S.","il":"Kilis","u":"TUR","oz":"Şem'ûn adlı bir nebiye nispet edilir.","not":"Farklı rivayetler bulunmaktadır.","q":"Şem’un Nebi","xy":[505.2,133.87]},{"k":"p","ad":"Hz. Zekeriyya A.S.","il":"Halep","u":"SYR","oz":"Hz. Yahyâ'nın babası ve Hz. Meryem'in hâmisi olan peygamberdir.","not":"Halep Ulu Camii'nde ona nispet edilen makam bulunur. Farklı rivayetler bulunmaktadır.","q":"Zekeriyya","xy":[505.62,135.91],"uzun":["Hz. Zekeriyyâ, Kur'ân-ı Kerîm'de adı geçen ve İsrâiloğulları'na gönderilen bir peygamberdir. Kur'an'da Yahyâ, Îsâ ve İlyâs ile birlikte sâlih kullar arasında anılır. Hz. Hârûn'un soyundan geldiği kabul edilir.","Annesi tarafından mabede adanan Hz. Meryem'in himayesi için kura çekildi ve kura ona çıktı. Meryem'in mihrabına her girdiğinde yanında mevsim dışı rızıklar buldu; Meryem bunların Allah katından olduğunu söyledi. Bu durum Zekeriyyâ'yı, Allah'ın yaşlılıkta da evlat verebileceği ümidiyle duaya yöneltti.","Eşinin kısır, kendisinin de çok yaşlı olmasına rağmen Allah'tan hayırlı bir evlat istedi ve kendisine Yahyâ müjdelendi. Bir alamet isteyince, üç gün insanlarla işaret dışında konuşamayacağı bildirildi. Meryem sûresi bu duayı ve müjdeyi anlatarak başlar.","İslâmî kaynaklara göre oğlu Yahyâ gibi şehid edildi. Rivayete göre Yahyâ'nın şehadetinden sonra bir ağacın kovuğuna saklandı; düşmanları ağacı keserek onu da şehid etti. TDV'ye göre türbesinin Halep Ulucamii'nin bitişiğinde olduğu rivayet edilir."]},{"k":"p","ad":"Hz. Yahya A.S.","il":"Şam","u":"SYR","oz":"Hz. Zekeriyyâ'nın oğlu, Hz. Îsâ'yı tasdik eden peygamberdir.","not":"Şam Emevî Camii'ndeki makamda mübarek başının bulunduğu rivayet edilir.","q":"Yahya","xy":[503.39,144.6],"uzun":["Hz. Yahyâ, Hz. Zekeriyyâ'nın oğlu ve Hz. Meryem'in teyzesinin oğludur. Yaşlı ve çocuksuz anne babasına melekler tarafından müjdelendi; adı, \"yaşamak\" anlamındaki kökten gelir ve kendisinden önce bu adı taşıyan olmamıştır. Hristiyanlar onu Vaftizci Yahyâ olarak tanır.","Kur'an onun kişiliğini över: çocukken kendisine hikmet, kalp yumuşaklığı ve temizlik verildiğini, Allah'tan sakınan ve anne babasına iyi davranan biri olduğunu bildirir. Hadislerde yumuşak huylu ve güzel yüzlü olarak anlatılır. Hz. Peygamber'in mi'rac gecesinde onunla ikinci kat semada görüştüğü nakledilir.","Hz. Îsâ'yı tasdik eden ve onu müjdeleyen peygamberdir. Zamanın yöneticisinin gayrimeşru evliliğini eleştirdiği için tutuklandı ve başı kesilerek şehid edildi. Bazı müfessirler, İsrâiloğulları'nın onu şehid etmesini Kur'an'da bildirilen büyük bozgunculuklardan biri olarak yorumlar.","Kabri ve mübarek başının yeri hakkında farklı rivayetler bulunmaktadır. Dımaşk'taki Emevî Camii'nde başının medfun olduğuna inanılan türbe asırlardır ziyaret edilir. TDV, kol ve kafatası kemiklerinin İstanbul'da Topkapı Sarayı'ndaki Mukaddes Emanetler arasında bulunduğunun ileri sürüldüğünü de nakleder."]},{"k":"p","ad
