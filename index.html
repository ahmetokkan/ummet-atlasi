<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ümmet Atlası</title>
<meta name="description" content="Türk ve İslâm dünyası haritası: ülkelerin dinî yapısı ve kabri bulunan sahabeler.">
<meta name="theme-color" content="#0e2238">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ümmet Atlası">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@700&display=swap">
<style>html,body{margin:0} :root{padding-top:0} body{min-height:100vh} [hidden]{display:none!important} img{max-width:100%}</style>
</head>
<body>
<style>
/* Layout: phone-first atlas — map card on top, lists below; a country opens as a full page, a sahâbî as a bottom sheet. Single deliberate night-blue and gold look, matching the wall poster. */
:root {
  color-scheme: dark;
  --ground: #0e2238;
  --panel: #142c47;
  --panel-2: #1a3657;
  --sea: #16324f;
  --grat: #22456a;
  --line: #2a4a6e;
  --land: #d9d1bf;
  --ink: #f3ecdc;
  --muted: #b3aa93;
  --gold: #c9a24a;
  --gold-soft: #8a6f35;
  --tr: #e30a17;
  --turk: #3a8ef0;
  --islam: #26a269;
  --font-display: "Lora", Georgia, "Times New Roman", serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--ground); }
button { font: inherit; color: inherit; }
a { color: var(--gold); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(14,34,56,.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 860px; margin: 0 auto; min-height: 56px; display: flex; align-items: center; gap: 12px; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; font: 700 22px/1 var(--font-display); letter-spacing: .01em; }
.brand svg { flex: none; }
.back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 12px 0 4px; margin-left: -4px; border: 0; background: none; color: var(--gold); font-weight: 600; font-size: 16px; cursor: pointer; }
.bar-title { font: 700 18px/1.2 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

.wrap { max-width: 860px; margin: 0 auto; padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px; }

.mapcard { position: relative; background: var(--sea); border: 1px solid var(--gold-soft); border-radius: 14px; overflow: hidden; }
#map { display: block; width: 100%; height: auto; aspect-ratio: 1000 / 497; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
#map path[data-id], #map circle[data-id] { cursor: pointer; }
#map .hit { stroke: #f6d27a; stroke-width: 1.6px; }
.zoom { position: absolute; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
.zoom button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--gold-soft); background: rgba(14,34,56,.88); color: var(--ink); font-size: 22px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
.maphint { position: absolute; left: 10px; top: 8px; font-size: 12.5px; color: var(--ink); background: rgba(14,34,56,.78); padding: 4px 10px; border-radius: 999px; pointer-events: none; }

.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 14px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.sw { width: 14px; height: 14px; border-radius: 4px; flex: none; display: inline-block; }

.search { position: relative; }
.search input { width: 100%; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 16px var(--font-body); padding: 0 14px 0 42px; }
.search input::placeholder { color: var(--muted); }
.search svg { position: absolute; left: 14px; top: 14px; color: var(--muted); }
.results { display: flex; flex-direction: column; margin-top: 8px; background: var(--panel); border-radius: 12px; overflow: hidden; }
.results button { text-align: left; min-height: 46px; padding: 0 14px; border: 0; border-top: 1px solid var(--line); background: none; cursor: pointer; display: flex; align-items: center; gap: 10px; }
.results button:first-child { border-top: 0; }

h2 { font: 700 20px/1.25 var(--font-display); margin: 0 0 10px; display: flex; align-items: center; gap: 10px; text-wrap: balance; }
h2 .n { font: 600 13px var(--font-body); color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; }
.chip .sw { width: 10px; height: 10px; border-radius: 50%; }
.chip.tr { border-color: var(--tr); }

.sahlist { display: flex; flex-direction: column; background: var(--panel); border-radius: 14px; overflow: hidden; }
.row { width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 56px; }
.row:first-child { border-top: 0; }
.row:active { background: var(--panel-2); }
.row .t { flex: 1; min-width: 0; }
.row .t b { display: block; font-weight: 600; }
.row .t small { display: block; color: var(--muted); font-size: 13.5px; }
.row .chev { color: var(--gold); flex: none; }
.cnt { flex: none; min-width: 30px; height: 26px; border-radius: 999px; background: var(--panel-2); color: var(--gold); font: 700 13px/26px var(--font-body); text-align: center; font-variant-numeric: tabular-nums; }
.badge { display: inline-block; font: 600 11.5px/1 var(--font-body); letter-spacing: .04em; text-transform: uppercase; padding: 4px 7px; border-radius: 6px; vertical-align: 2px; margin-left: 6px; }
.badge.riv { background: rgba(201,162,74,.18); color: var(--gold); }
.mine { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--gold-soft); color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 600; }
.mine svg { color: var(--gold); }
.mine .cnt { min-width: 22px; height: 22px; line-height: 22px; font-size: 12px; }
.visit { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 12px; border: 1px solid var(--gold-soft); background: none; color: var(--ink); font-weight: 600; cursor: pointer; padding: 0 14px; }
.visit svg { color: var(--gold); opacity: .5; }
.visit.on { background: var(--islam); border-color: var(--islam); color: #fff; }
.visit.on svg { color: #fff; opacity: 1; }
.row.visited .t b::after { content: "✓"; color: var(--islam); margin-left: 8px; font-weight: 700; }
.ph { margin: 0; border-radius: 12px; overflow: hidden; background: var(--panel-2); }
.ph img { display: block; width: 100%; max-height: 260px; object-fit: cover; }
.ph figcaption { font-size: 12px; color: var(--muted); padding: 6px 10px; }
.ph figcaption a { color: var(--muted); }
.results button .t { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 6px 0; }
.results button .t b { font-weight: 600; }
.results button .t small { color: var(--muted); font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--gold); color: var(--ground); border-color: var(--gold); }
.chip .n { opacity: .7; font-size: 13px; }
.tbk { margin-bottom: 8px; }
.ilgroups { display: flex; flex-direction: column; gap: 8px; }
.ilgroups details { background: var(--panel); border-radius: 12px; overflow: hidden; }
.ilgroups summary { list-style: none; cursor: pointer; min-height: 50px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 14px; font-weight: 600; }
.ilgroups summary::-webkit-details-marker { display: none; }
.ilgroups details[open] summary { border-bottom: 1px solid var(--line); color: var(--gold); }
.ilgroups .sahlist { border-radius: 0; }
#tb .src { margin: 0 0 10px; }
.sahgroups { display: flex; flex-direction: column; gap: 10px; }
.gh { margin: 8px 0 0; font: 600 14px/1.3 var(--font-body); color: var(--gold); display: flex; gap: 8px; align-items: baseline; }
.gh .n { color: var(--muted); font-weight: 500; font-size: 13px; }

/* country page */
.hero { display: flex; flex-direction: column; gap: 10px; }
.hero h1 { font: 700 34px/1.1 var(--font-display); margin: 0; text-wrap: balance; }
.tag { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: var(--panel); }
.card { background: var(--panel); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card h3 { margin: 0; font: 600 13px/1.2 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
.relbar { display: flex; height: 18px; border-radius: 6px; overflow: hidden; background: var(--panel-2); }
.relbar i { display: block; height: 100%; }
.rels { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.rels li { display: flex; align-items: center; gap: 10px; font-size: 16px; }
.rels li .l { flex: 1; min-width: 0; }
.rels li .v { font-weight: 700; font-variant-numeric: tabular-nums; }
.rels li:first-child { font-size: 18px; }
.part + .part { border-top: 1px solid var(--line); padding-top: 12px; }
.part h4 { margin: 0 0 8px; font-size: 15px; }
.src { font-size: 12.5px; color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.fact { background: var(--panel); border-radius: 12px; padding: 12px 14px; }
.fact small { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.fact b { font: 600 17px/1.3 var(--font-body); }
.prose { margin: 0; font-size: 16px; line-height: 1.6; max-width: 65ch; }
.more { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; font-weight: 600; text-decoration: none; }
.empty { color: var(--muted); font-size: 15px; margin: 0; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(4,12,22,.6); z-index: 40; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 86vh; overflow: auto; background: var(--panel); border-radius: 18px 18px 0 0; border-top: 2px solid var(--gold); padding-block: 10px calc(24px + env(safe-area-inset-bottom, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.sheet-in { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.grip { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 6px; }
.sheet h2 { font-size: 24px; margin: 0; }
.place { display: flex; align-items: flex-start; gap: 8px; color: var(--muted); font-size: 15px; }
.place svg { flex: none; margin-top: 3px; color: var(--gold); }
.note { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--panel-2); font-size: 14.5px; color: var(--ink); }
.close { align-self: stretch; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; font-weight: 600; }

footer.src { line-height: 1.6; border-top: 1px solid var(--line); padding-top: 14px; }
@media (min-width: 700px) { .hero h1 { font-size: 42px; } }
@media (prefers-reduced-motion: no-preference) { .sheet:not([hidden]) { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(30px); opacity: .4; } } }
</style>

<header class="bar"><div class="bar-in" id="barIn"></div></header>

<main class="wrap" id="home">
  <div class="mapcard">
    <svg id="map" viewBox="0 0 1000 497" role="img" aria-label="Dünya haritası: Türkiye kırmızı, Türk devletleri mavi, Müslüman ülkeler yeşil. Bir ülkeye dokununca sayfası açılır."></svg>
    <span class="maphint">Bir ülkeye dokunun</span>
    <div class="zoom">
      <button type="button" id="zin" aria-label="Yakınlaştır">+</button>
      <button type="button" id="zout" aria-label="Uzaklaştır">−</button>
      <button type="button" id="zreset" aria-label="Haritayı sıfırla"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
    </div>
  </div>
  <div class="legend" aria-hidden="true">
    <span><i class="sw" style="background:var(--tr)"></i>Türkiye</span>
    <span><i class="sw" style="background:var(--turk)"></i>Türk devletleri</span>
    <span><i class="sw" style="background:var(--islam)"></i>Müslüman ülkeler</span>
    <span><i class="sw" style="background:var(--land)"></i>Diğer ülkeler</span>
  </div>

  <div class="search">
    <label for="q" class="sr" style="position:absolute;left:-9999px">Ülke, şehir, kişi veya mekân ara</label>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Ülke, şehir, kişi veya mekân ara…" autocomplete="off">
    <div class="results" id="results" hidden></div>
  </div>

  <section><h2>Sahabe Kabirleri <span class="n" id="sahN"></span></h2><div class="sahlist" id="sahCountries"></div></section>
  <section><h2>Türk Devletleri</h2><div class="chips" id="turkChips"></div></section>
  <section><h2>Müslüman Ülkeler</h2><div class="chips" id="islamChips"></div></section>

  <footer class="src">
    Din oranları: CIA World Factbook. Ülke ve sahabe bilgileri: TDV İslâm Ansiklopedisi (islamansiklopedisi.org.tr). Harita: Natural Earth.
  </footer>
</main>

<main class="wrap" id="page" hidden></main>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></div>

ld Factbook"},"pop":"85 bin (2024 tahmini)"},"DZA":{"id":"DZA","ad":"Cezayir","g":"islam","rel":{"rows":[["Müslüman",99.0,""],["Diğer / belirtilmemiş",0.5,"<1"]],"yr":"2012","src":"CIA World Factbook"},"pop":"47,7 milyon (2025 tahmini)","cap":"Cezayir","oz":"Akdeniz'den Büyük Sahrâ'ya uzanan, Afrika'nın en büyük ülkelerinden biridir. Arap fatihler VII. yüzyılın ortalarından itibaren bölgeye geldi ve Berberîler zamanla Müslüman oldu. Halkın çoğunluğu Mâlikîdir; Osmanlı döneminde şehirlerde Hanefî fıkhı da güçlendi.","tdv":"cezayir","sah":["ukbe-nafi"]},"ALB":{"id":"ALB","ad":"Arnavutluk","g":"islam","rel":{"rows":[["Müslüman",58.8,""],["Hristiyan",16.8,""],["Dinsiz / ateist",2.5,""],["Diğer / belirtilmemiş",21.9,""]],"yr":"2011","src":"CIA World Factbook"},"pop":"2,6 milyon (2025 tahmini)","cap":"Tiran","oz":"Balkanların batısında, Adriyatik kıyısında bir Avrupa ülkesidir. İslâm, Osmanlı fetihleriyle bölgeye girdi; fetih 1571'de tamamlandı. Müslümanların çoğu Sünnî-Hanefî, bir kısmı Bektaşîdir.","tdv":"arnavutluk"},"AFG":{"id":"AFG","ad":"Afganistan","g":"islam","rel":{"rows":[["Müslüman",99.7,""],["Diğer / belirtilmemiş",0.3,"<0,3"]],"yr":"2009","src":"CIA World Factbook"},"pop":"49,5 milyon (2025 tahmini)","cap":"Kâbil","oz":"Denize kıyısı olmayan, başşehri Kâbil olan bir Orta Asya ülkesidir. İslâm, Hz. Osman veya Muâviye döneminde Abdurrahman b. Semüre'nin seferleriyle bölgeye ulaştı. Halkın neredeyse tamamı Müslümandır; çoğunluk Hanefî Sünnî, %15-20 kadarı Şiîdir.","tdv":"afganistan"},"KAS":{"id":"KAS","ad":"Siachen Buzulu","g":"other","rel":{"rows":[],"note":"Bu bölge için din dağılımı verisi bulunamadı.","src":""},"pop":""},"SXM":{"id":"SXM","ad":"Sint Maarten","g":"other","rel":{"rows":[["Hristiyan",82.2,""],["Dinsiz / ateist",7.9,""],["Hindu",5.2,""],["Müslüman",1.1,""],["Diğer / belirtilmemiş",3.7,""]],"yr":"2011","src":"CIA World Factbook"},"pop":"47 bin (2025 tahmini)"},"TUV":{"id":"TUV","ad":"Tuvalu","g":"other","rel":{"rows":[["Hristiyan",94.2,""],["Bahâî",1.5,""],["Dinsiz / ateist",0.4,""],["Diğer / belirtilmemiş",3.9,""]],"yr":"2017","src":"CIA World Factbook"},"pop":"12 bin (2025 tahmini)"},"DTR":{"id":"DTR","ad":"Doğu Türkistan","g":"turk","rel":{"rows":[["Müslüman halklar (Uygur, Kazak, Hui, Kırgız…)",56],["Han Çinlileri ve diğerleri",44]],"note":"Çin 2020 nüfus sayımındaki etnik dağılıma göre yaklaşık değer; Çin resmî din istatistiği yayımlamaz.","src":"Çin 2020 nüfus sayımı (etnik dağılım)"},"pop":"25,9 milyon (2020 sayımı)","cap":"Urumçi","oz":"Tarım havzası ve Taklamakan Çölü'nü içine alan, Uygur ve Kazak Türklerinin yurdu olan geniş bir bölgedir. Karahanlıların Müslüman olmasıyla Türkler İslâm medeniyet dairesine girdi; Kaşgar önemli bir ilim merkezi oldu. Bölge 1884'te Sincan adıyla Çin'e bağlandı ve 1955'ten beri Sincan Uygur Özerk Bölgesi adıyla Çin Halk Cumhuriyeti'nin yönetimindedir.","tdv":"turkistan"}},"sahabe":[{"id":"ebu-eyyub","ad":"Ebû Eyyûb el-Ensârî (Eyüp Sultan)","ulke":"TUR","yer":"İstanbul, Eyüp","durum":"kabir","ozet":"Medine'ye hicretinde Hz. Peygamber'i yedi ay evinde misafir eden Ensâr'dan sahâbîdir. Bedir'den itibaren gazvelere katıldı. İlk İstanbul kuşatmasında hastalanarak 49 (669) yılında vefat etti ve vasiyeti üzerine surlara yakın bir yere defnedildi.","tdv":"ebu-eyyub-el-ensari","not":"Kabrin yerinin fetihten sonra Akşemseddin tarafından tespit edildiği rivayet edilir."},{"id":"ebu-seybe","ad":"Ebû Şeybe el-Hudrî","ulke":"TUR","yer":"İstanbul, Ayvansaray","durum":"kabir","ozet":"Hz. Peygamber'in sohbetinde bulunmuş bir sahâbîdir. İstanbul kuşatmasına katılarak burada şehid oldu. Kabri Ayvansaray'da, surların içindedir.","tdv":"ebu-seybe-el-hudri"},{"id":"diyarbakir","ad":"Diyarbakır şehidleri","ulke":"TUR","yer":"Diyarbakır, Hz. Süleyman Camii","durum":"rivayet","ozet":"Hz. Ömer döneminde Diyarbakır'ın fethinde şehid düşen Hâlid b. Velîd'in oğlu Süleyman ile birlikte yirmi yedi sahâbînin Hz. Süleyman Camii'nin yanındaki türbede yattığı rivayet edilir.","not":"Bu bilgi halk arasındaki rivayete dayanır; TDV İslâm Ansiklopedisi'nde doğrulayan bir madde bulunamadı."},{"id":"ummu-haram","ad":"Ümmü Harâm bint Milhân (Hala Sultan)","ulke":"CYP","yer":"Larnaka, Hala Sultan Tekkesi","durum":"kabir","ozet":"Enes b. Mâlik'in teyzesi ve Ubâde b. Sâmit'in eşidir. Hz. Osman döneminde Kıbrıs'a giden ilk İslâm donanmasıyla adaya çıkarken bindiği hayvandan düşerek vefat etti. Kabri Larnaka yakınındaki Tuzla'da, Hala Sultan Tekkesi'ndedir.","tdv":"ummu-haram"},{"id":"ebu-bekir","ad":"Hz. Ebû Bekir","ulke":"SAU","yer":"Medine, Ravza-i Mutahhara","durum":"kabir","ozet":"İlk halife ve Hz. Peygamber'in hicret arkadaşıdır; \"Sıddîk\" lakabıyla anılır. 13 (634) yılında Medine'de vefat etti ve Hz. Peygamber'in yanına defnedildi.","tdv":"ebu-bekir"},{"id":"omer","ad":"Hz. Ömer","ulke":"SAU","yer":"Medine, Ravza-i Mutahhara","durum":"kabir","ozet":"İkinci halifedir; \"Fârûk\" lakabıyla anılır. Döneminde Suriye, Irak, İran ve Mısır fethedildi. 23 (644) yılında şehid edildi ve Hz. Peygamber ile Hz. Ebû Bekir'in yanına defnedildi.","tdv":"omer"},{"id":"osman","ad":"Hz. Osman","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Üçüncü halifedir; Hz. Peygamber'in iki kızıyla evlendiği için \"Zinnûreyn\" diye anılır. Kur'an-ı Kerîm'i çoğaltarak İslâm beldelerine gönderdi. 35 (656) yılında evinde şehid edildi ve Bakî'de defnedildi.","tdv":"osman"},{"id":"hamza","ad":"Hz. Hamza","ulke":"SAU","yer":"Medine, Uhud","durum":"kabir","ozet":"Hz. Peygamber'in amcasıdır; \"Seyyidü'ş-şühedâ\" (şehidlerin efendisi) diye anılır. 3 (625) yılında Uhud Savaşı'nda şehid düştü ve Uhud'da defnedildi.","tdv":"hamza"},{"id":"musab","ad":"Mus'ab b. Umeyr","ulke":"SAU","yer":"Medine, Uhud","durum":"kabir","ozet":"Akabe biatından sonra Hz. Peygamber'in Medine'ye öğretmen olarak gönderdiği sahâbîdir. Uhud'da sancağı taşırken şehid düştü.","tdv":"musab-b-umeyr"},{"id":"hatice","ad":"Hz. Hatice","ulke":"SAU","yer":"Mekke, Cennetü'l-Muallâ","durum":"kabir","ozet":"Hz. Peygamber'in ilk eşi ve ilk Müslümandır. Hicretten yaklaşık üç yıl önce Mekke'de vefat etti ve Hacûn'daki Muallâ kabristanına defnedildi.","tdv":"hatice"},{"id":"fatima","ad":"Hz. Fâtıma","ulke":"SAU","yer":"Medine","durum":"rivayet","ozet":"Hz. Peygamber'in kızı, Hz. Ali'nin eşi, Hz. Hasan ve Hz. Hüseyin'in annesidir. Hz. Peygamber'den birkaç ay sonra 11 (632) yılında Medine'de vefat etti.","tdv":"fatima","not":"Kabrinin Cennetü'l-Bakî'de mi yoksa kendi evinde mi olduğu konusunda farklı rivayetler vardır."},{"id":"abbas","ad":"Hz. Abbas","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Hz. Peygamber'in amcasıdır. Mekke'nin fethinden önce Müslüman oldu. 32 (653) yılında Medine'de vefat etti.","tdv":"abbas-b-abdulmuttalib"},{"id":"hasan","ad":"Hz. Hasan","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Hz. Peygamber'in torunu, Hz. Ali ile Hz. Fâtıma'nın büyük oğludur. Halifeliği Muâviye'ye bırakarak Müslümanlar arasında barışı sağladı. 49 (669) yılında Medine'de vefat etti.","tdv":"hasan"},{"id":"aise","ad":"Hz. Âişe","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Hz. Peygamber'in eşi, Hz. Ebû Bekir'in kızıdır. En çok hadis rivayet eden sahâbîlerdendir. 58 (678) yılında Medine'de vefat etti.","tdv":"aise"},{"id":"osman-mazun","ad":"Osman b. Maz'ûn","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"İlk Müslümanlardan ve Habeşistan muhacirlerindendir. Hicretin 2. yılında vefat etti; Bakî'e defnedilen ilk muhacirdir.","tdv":"osman-b-mazun"},{"id":"abdurrahman-avf","ad":"Abdurrahman b. Avf","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Cennetle müjdelenen on sahâbîden biridir. Cömertliği ve ticaretiyle tanındı. 32 (652) yılında Medine'de vefat etti.","tdv":"abdurrahman-b-avf"},{"id":"sad","ad":"Sa'd b. Ebû Vakkās","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Cennetle müjdelenen on sahâbîden ve Kādisiyye fâtihidir. 55 (675) yılında Akīk'teki evinde vefat etti, Medine'ye getirilip Bakî'e defnedildi.","tdv":"sad-b-ebu-vakkas"},{"id":"ibn-abbas","ad":"Abdullah b. Abbas","ulke":"SAU","yer":"Tâif","durum":"kabir","ozet":"Hz. Peygamber'in amcasının oğludur; tefsir ve fıkıhta otoritedir. Hac emirliği ve Basra valiliği yaptı. Yetmiş yaşlarında Tâif'te vefat etti.","tdv":"abdullah-b-abbas"},{"id":"meymune","ad":"Hz. Meymûne","ulke":"SAU","yer":"Mekke yakınında, Serif","durum":"kabir","ozet":"Hz. Peygamber'in eşlerindendir. 51 (671) yılında, nikâhının kıyıldığı Serif'te vefat etti ve oraya defnedildi.","tdv":"meymune"},{"id":"ukbe-amir","ad":"Ukbe b. Âmir el-Cühenî","ulke":"EGY","yer":"Kahire, Mukattam Mezarlığı","durum":"kabir","ozet":"Suffe ashabından, kıraat ve fıkıh bilen bir sahâbîdir. Usta bir okçu ve hadis râvisiydi; Muâviye döneminde Mısır valiliği yaptı. Mukattam Mezarlığı'ndaki kabri bugün de ziyaret edilir.","tdv":"ukbe-b-amir"},{"id":"amr-as","ad":"Amr b. Âs","ulke":"EGY","yer":"Kahire, Mukattam eteği","durum":"rivayet","ozet":"Mısır'ı fethedip valisi olan sahâbîdir. Filistin fethinde de büyük rol oynadı. Doksan yaşını aşmış olarak Mısır'da vefat etti.","tdv":"amr-b-as","not":"Mısır'da vefat ettiği kesindir; kabrinin Mukattam eteğinde olduğu rivayet edilir."},{"id":"halid","ad":"Hâlid b. Velîd","ulke":"SYR","yer":"Humus","durum":"kabir","ozet":"Hz. Peygamber'den \"Seyfullah\" (Allah'ın kılıcı) unvanını aldı. Irak ve Suriye fetihlerinde, Ecnâdeyn ve Yermük zaferlerinde komutandı. Humus'ta vefat etti; kabri oradadır.","tdv":"halid-b-velid"},{"id":"bilal","ad":"Bilâl-i Habeşî","ulke":"SYR","yer":"Şam, Bâbüssağîr Kabristanı","durum":"kabir","ozet":"Hz. Peygamber'in ilk müezzinidir. İşkencelere rağmen imanından dönmedi; Hz. Ebû Bekir onu satın alıp âzat etti. Peygamber'in vefatından sonra Suriye'ye gitti ve Dımaşk'ta vefat etti.","tdv":"bilal-i-habesi"},{"id":"ebud-derda","ad":"Ebü'd-Derdâ","ulke":"SYR","yer":"Şam, Bâbüssağîr Kabristanı","durum":"kabir","ozet":"Ensâr'dan, Kur'an'ı Hz. Peygamber hayattayken ezberleyen sahâbîdir. Dımaşk'ın ilk kadısı oldu. 32 (652) yılında Dımaşk'ta vefat etti.","tdv":"ebud-derda","not":"İstanbul'da Eyüp ve Üsküdar'da adına birer makam kabir vardır."},{"id":"muaviye","ad":"Muâviye b. Ebû Süfyân","ulke":"SYR","yer":"Şam, Bâbüssağîr Kabristanı","durum":"kabir","ozet":"Vahiy kâtiplerinden biridir; uzun yıllar Suriye valiliği yaptı ve Emevî Devleti'ni kurdu. İlk İslâm donanmasını kurdurdu. 60 (680) yılında Dımaşk'ta vefat etti.","tdv":"muaviye-i"},{"id":"ammar","ad":"Ammâr b. Yâsir","ulke":"SYR","yer":"Rakka yakınında, Sıffîn","durum":"kabir","ozet":"İlk Müslümanlardan Yâsir ile Sümeyye'nin oğludur; ailesiyle birlikte ağır işkencelere uğradı. Hz. Ömer döneminde Kûfe valisi oldu. Hz. Ali'nin safında Sıffîn Savaşı'nda şehid edildi ve oraya defnedildi.","tdv":"ammar-b-yasir"},{"id":"ebu-ubeyde","ad":"Ebû Ubeyde b. Cerrâh","ulke":"JOR","yer":"Ürdün Vadisi, Ebû Ubeyde köyü","durum":"kabir","ozet":"Cennetle müjdelenen on sahâbîden biridir; Hz. Peygamber ona \"Emînü'l-ümme\" (ümmetin güvenilir kişisi) dedi. Suriye ordularının başkomutanı olarak Dımaşk ve Kudüs'ün fethinde bulundu. 18 (639) yılında Amvâs vebasında vefat etti.","tdv":"ebu-ubeyde-b-cerrah"},{"id":"muaz","ad":"Muâz b. Cebel","ulke":"JOR","yer":"İrbid, Muâz b. Cebel köyü","durum":"kabir","ozet":"Kur'an ve fıkıh bilgisiyle tanınan Ensâr'dan sahâbîdir. Hz. Peygamber onu Yemen'e elçi, zekât memuru ve kadı olarak gönderdi. 18 (639) yılında Amvâs vebasında vefat etti.","tdv":"muaz-b-cebel"},{"id":"surahbil","ad":"Şürahbîl b. Hasene","ulke":"JOR","yer":"Ürdün Vadisi, Vâdilyâbis köyü","durum":"kabir","ozet":"Habeşistan muhacirlerindendir; Hz. Peygamber'in vahiy kâtipliğini yaptı. Ecnâdeyn ve Yermük'te komutandı. 18 (639) yılında Amvâs vebasında vefat etti.","tdv":"surahbil-b-hasene","not":"Kabrinin Kilis'te olduğu yönündeki rivayetler TDV'ye göre doğru değildir."},{"id":"dirar","ad":"Dırâr b. Ezver","ulke":"JOR","yer":"Ürdün Vadisi, Dırâr köyü","durum":"kabir","ozet":"Esedoğulları'ndan, 630'da Medine'ye gelip Müslüman olan sahâbîdir. Hâlid b. Velîd'in ordusunda Ridde savaşları ve fetihlerde yer aldı. Kabri Dırâr köyünde küçük bir mescidin içindedir.","tdv":"dirar-b-ezver"},{"id":"zeyd-harise","ad":"Zeyd b. Hârise","ulke":"JOR","yer":"Kerek, Mûte yakınında (el-Mezâr)","durum":"kabir","ozet":"Hz. Peygamber'in âzatlısı ve evlatlığıdır; adı Kur'an'da geçen tek sahâbîdir. 8 (629) yılında Mûte Savaşı'nda ordunun ilk komutanı olarak şehid düştü.","tdv":"zeyd-b-harise"},{"id":"cafer","ad":"Ca'fer b. Ebû Tâlib (Ca'fer-i Tayyâr)","ulke":"JOR","yer":"Kerek, Mûte yakınında (el-Mezâr)","durum":"kabir","ozet":"Hz. Ali'nin kardeşidir; Habeşistan muhacirlerinin sözcüsü oldu. Mûte Savaşı'nda ikinci komutan olarak şehid düştü.","tdv":"cafer-b-ebu-talib"},{"id":"revaha","ad":"Abdullah b. Revâha","ulke":"JOR","yer":"Kerek, Mûte yakınında (el-Mezâr)","durum":"kabir","ozet":"Ensâr'dan şair bir sahâbîdir. Mûte Savaşı'nda şehid düşen üçüncü komutandır; üç komutanın türbeleri savaş alanının yakınındadır.","tdv":"abdullah-b-revaha"},{"id":"ubade","ad":"Ubâde b. Sâmit","ulke":"PSX","yer":"Kudüs veya Remle","durum":"rivayet","ozet":"Akabe biatlarına ve Hz. Peygamber'in bütün savaşlarına katılan Ensâr'dan sahâbîdir. Suriye'de öğretmenlik ve Kudüs'te kadılık yaptı. 34 (654) yılında Kudüs'te vefat etti.","tdv":"ubade-b-samit","not":"Remle'de defnedildiği de kabrinin Kudüs'te olduğu da rivayet edilir."},{"id":"seddad","ad":"Şeddâd b. Evs","ulke":"PSX","yer":"Kudüs, Bâbürrahme Kabristanı","durum":"kabir","ozet":"Şair Hassân b. Sâbit'in yeğenidir. Hz. Ömer onu Humus valisi yaptı. 58 (678) yılında Filistin'de vefat etti; kabri Mescid-i Aksâ yakınındaki kabristandadır.","tdv":"seddad-b-evs"},{"id":"temim","ad":"Temîm ed-Dârî","ulke":"PSX","yer":"Beytcibrîn (Kudüs ile Gazze arası)","durum":"kabir","ozet":"Filistinli bir tüccar iken Müslüman oldu ve Medine'ye yerleşti. Mescid-i Nebevî'de ilk kandili yaktığı rivayet edilir. 40 (661) yılında Filistin'de vefat etti.","tdv":"temim-ed-dari"},{"id":"ali","ad":"Hz. Ali","ulke":"IRQ","yer":"Necef","durum":"rivayet","ozet":"Dördüncü halife, Hz. Peygamber'in amcasının oğlu ve damadıdır. Çocuk yaşta ilk Müslüman olanlardandır. 40 (661) yılında Kûfe'de şehid edildi.","tdv":"ali","not":"Kabrinin yeri tartışmalıdır; yaygın kabule göre Necef'tedir."},{"id":"huseyin","ad":"Hz. Hüseyin","ulke":"IRQ","yer":"Kerbelâ","durum":"kabir","ozet":"Hz. Peygamber'in torunudur. 61 (680) yılında Kerbelâ'da şehid edildi ve oraya defnedildi.","tdv":"huseyin","not":"Mübarek başının defnedildiği yer hakkında farklı rivayetler vardır. TDV'nin Cennetü'l-Bakī maddesine göre başı Medine'ye gönderilip annesinin yanına defnedilmiştir; Kahire ve Şam'da da başına nispet edilen makamlar vardır."},{"id":"selman","ad":"Selmân-ı Fârisî","ulke":"IRQ","yer":"Bağdat yakınında, Selmânıpâk","durum":"kabir","ozet":"Hak dini ararken köle olarak Medine'ye getirildi ve Hz. Peygamber'le tanışınca Müslüman oldu. Hendek'in kazılmasını o önerdi. Hz. Ömer döneminde Medâin valiliği yaptı ve orada vefat etti.","tdv":"selman-i-farisi","not":"Türbesi IV. Murad tarafından yeniden yaptırılmıştır."},{"id":"huzeyfe","ad":"Huzeyfe b. Yemân","ulke":"IRQ","yer":"Selmânıpâk (Medâin)","durum":"rivayet","ozet":"Hz. Peygamber'in sırdaşı olarak bilinen sahâbîdir. Medâin valiliği yaptı, Nihâvend Savaşı'nda komutayı devraldı. 36 (656) yılında Medâin'de vefat etti.","tdv":"huzeyfe-b-yeman","not":"Medâin'de vefat ettiği kesindir; kabri Selmân-ı Fârisî türbesinin yanında gösterilir."},{"id":"talha","ad":"Talha b. Ubeydullah","ulke":"IRQ","yer":"Basra (Zübeyr kasabası)","durum":"kabir","ozet":"Cennetle müjdelenen on sahâbîden biridir; Uhud'da Hz. Peygamber'i bedeniyle korudu. 36 (656) yılında Cemel Vak'ası sırasında öldürüldü; kabri Basra'nın dışındadır.","tdv":"talha-b-ubeydullah"},{"id":"zubeyr","ad":"Zübeyr b. Avvâm","ulke":"IRQ","yer":"Basra, Zübeyr kasabası","durum":"rivayet","ozet":"Cennetle müjdelenen on sahâbîden biri ve Hz. Peygamber'in halasının oğludur. Cemel Vak'ası öncesinde savaş alanından ayrıldıktan sonra Vâdissibâ'da namaz kılarken şehid edildi.","tdv":"zubeyr-b-avvam","not":"Irak'taki Zübeyr şehrinde adına bir cami ve türbe bulunur."},{"id":"kusem","ad":"Kusem b. Abbas","ulke":"UZB","yer":"Semerkant, Şâh-ı Zinde","durum":"kabir","ozet":"Hz. Peygamber'in amcası Abbas'ın oğludur. Hz. Ali döneminde Mekke valiliği yaptı. Muâviye döneminde Horasan fetihlerine katıldı ve Semerkant'ta şehid oldu (57/676).","tdv":"kusem-b-abbas","not":"Merv'de vefat ettiği de rivayet edilir; Semerkant'taki kabri \"Şâh-ı Zinde\" adıyla ziyaret edilir."},{"id":"ebu-zema","ad":"Ebû Zem'a el-Belevî","ulke":"TUN","yer":"Kayrevan, Sîdî Sâhib Zâviyesi","durum":"rivayet","ozet":"Hz. Peygamber'in sohbetinde bulunmuş, Kuzey Afrika fetihlerine katılmış bir sahâbîdir. Kayrevan'daki Sîdî Sâhib (\"sahâbî efendi\") zâviyesinde yattığı kabul edilir.","not":"Hz. Peygamber'in mübarek saçından birkaç teli yanında taşıdığı rivayet edilir."},{"id":"ruveyfi","ad":"Rüveyfi' b. Sâbit el-Ensârî","ulke":"LBY","yer":"Beyzâ","durum":"rivayet","ozet":"Muâviye döneminde Berka (Doğu Libya) valiliği yapan sahâbîdir. 47 (667) yılında Cerbe adasının fethinde öne çıktı.","not":"Kabrinin Beyzâ'da olduğu kabul edilir."},{"id":"ukbe-nafi","ad":"Ukbe b. Nâfi'","ulke":"DZA","yer":"Biskra yakınında, Sîdî Ukbe kasabası","durum":"kabir","ozet":"Kayrevan'ı kuran ve İfrîkıye valiliği yapan komutandır. Amr b. Âs'ın yanında Mısır ve Kuzey Afrika fetihlerine katıldı. 62 (682) yılında Tehûde'de şehid düştü.","tdv":"ukbe-b-nafi","not":"Hz. Peygamber döneminde doğduğu için sahâbî sayılıp sayılmayacağı ihtilaflıdır."},{"id":"safvan","ad":"Safvân b. Muattal es-Sülemî","ulke":"TUR","yer":"Adıyaman, Samsat","durum":"rivayet","ozet":"Hendek'ten itibaren gazvelere katılan sahâbîdir; İfk hadisesinde Hz. Âişe'yi orduya ulaştıran kişi odur. Hz. Ömer döneminde Suriye ve Anadolu fetihlerinde bulundu.","tdv":"safvan-b-muattal","not":"TDV'ye göre 19 (640) yılında Sümeysât'ta (Samsat) şehid olduğu zikredilir; başka rivayetlere göre Muâviye döneminde 58-60 (678-680) yıllarında vefat etmiştir. Samsat'taki türbesi bu rivayete dayanır."},{"id":"tokludede","ad":"Tokludede Haziresi sahabeleri","ulke":"TUR","yer":"İstanbul, Ayvansaray","durum":"rivayet","ozet":"Ebû Şeybe el-Hudrî'nin yakınındaki Tokludede Haziresi çevresinde Hamdullah el-Ensârî, Ahmed el-Ensârî, Muhammed el-Ensârî ve Ka'b adına türbeler bulunur. Emevîler döneminde İstanbul kuşatmalarına katılan sahâbîlere ait olduğu kabul edilir.","not":"İstanbul tarihi araştırmalarına göre kuşatmalarda ölen ve sahâbî olmayan kimselerin de halk arasında sahâbî sayıldığı olmuştur; bu kabirlerin sahâbîlere ait olduğu kesin değildir."},{"id":"ist-makam","ad":"İstanbul'daki makam türbeler","ulke":"TUR","yer":"İstanbul (çeşitli semtler)","durum":"makam","ozet":"İstanbul'da bazı büyük sahâbîler adına makam (temsilî kabir) yapılmıştır: Câbir b. Abdullah (Atikmustafapaşa Camii), Ebû Zer el-Gıfârî (Ayvansaray), Ebû Saîd el-Hudrî (Edirnekapı), Ebü'd-Derdâ (Eyüp ve Karacaahmet) ve Amr b. Âs (Karaköy Yeraltı Camii).","not":"Bu sahâbîlerin asıl kabirleri başka yerlerdedir: Câbir ve Ebû Saîd Medine'de, Ebû Zer Rebeze'de, Ebü'd-Derdâ Şam'da, Amr b. Âs Mısır'da."},{"id":"fatima-esed","ad":"Fâtıma bint Esed","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Hz. Ali'nin annesidir. Dedesi ve amcası vefat ettikten sonra Hz. Peygamber'i evinde büyüttü; Peygamber onu \"annemden sonra annem\" diye anardı. Müslüman olup Medine'ye hicret etti.","tdv":"fatima-bint-esed"},{"id":"zeyneb-nebi","ad":"Hz. Zeyneb (Hz. Peygamber'in kızı)","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Hz. Peygamber ile Hz. Hatice'nin en büyük kızıdır. Mekke'den Medine'ye hicreti sırasında uğradığı saldırı yüzünden rahatsızlandı ve 8 (629) yılında vefat etti.","tdv":"zeyneb"},{"id":"rukiyye","ad":"Hz. Rukıyye","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Hz. Peygamber'in kızı ve Hz. Osman'ın eşidir. Eşiyle birlikte Habeşistan'a ve Medine'ye hicret etti. 2 (624) yılında, Bedir Gazvesi sırasında vefat etti.","tdv":"rukiyye"},{"id":"safiyye-am","ad":"Safiyye bint Abdülmuttalib","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Hz. Peygamber'in halası ve Zübeyr b. Avvâm'ın annesidir. Hendek Gazvesi'nde kadınların bulunduğu kaleye yaklaşan bir düşmanı öldürmesiyle tanınır. 20 (641) yılında Medine'de vefat etti.","tdv":"safiyye-bint-abdulmuttalib"},{"id":"hafsa","ad":"Hz. Hafsa","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Hz. Ömer'in kızı ve Hz. Peygamber'in eşidir. Hz. Ebû Bekir döneminde toplanan Kur'an nüshası ona emanet edildi. 45 (665) yılında Medine'de vefat etti.","tdv":"hafsa"},{"id":"ummu-seleme","ad":"Hz. Ümmü Seleme","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Hz. Peygamber'in eşidir; ilk muhacirlerden olup Habeşistan'a ve Medine'ye hicret etti. Hudeybiye'deki isabetli görüşüyle bilinir. Ezvâc-ı tâhirâtın en son vefat edenidir.","tdv":"ummu-seleme"},{"id":"zeyneb-cahs","ad":"Hz. Zeyneb bint Cahş","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Hz. Peygamber'in halasının kızı ve eşidir. Cömertliği ve el emeğiyle kazandığını dağıtmasıyla tanınır. 20 (641) yılında vefat etti; Peygamber'den sonra vefat eden ilk eşidir.","tdv":"zeyneb-bint-cahs"},{"id":"zeyneb-huzeyme","ad":"Hz. Zeyneb bint Huzeyme","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Hz. Peygamber'in eşidir; yoksullara yardımı sebebiyle \"Ümmü'l-mesâkîn\" (yoksulların annesi) diye anıldı. Evliliğinden birkaç ay sonra 4 (625) yılında vefat etti.","tdv":"zeyneb-bint-huzeyme"},{"id":"safiyye-huyey","ad":"Hz. Safiyye bint Huyey","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Hz. Peygamber'in eşidir. Hayber'in fethinden sonra Müslüman oldu. 50 (670) yılı civarında Medine'de vefat etti.","tdv":"safiyye"},{"id":"mariye","ad":"Mâriye","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Mısır'dan Hz. Peygamber'e gönderilen ve oğlu İbrâhim'in annesi olan sahâbiyedir. 16 (637) yılında Medine'de vefat etti; cenaze namazını Hz. Ömer kıldırdı.","tdv":"mariye"},{"id":"halime","ad":"Halîme es-Sa'diyye","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"rivayet","ozet":"Hz. Peygamber'in sütannesidir; Peygamber çocukluğunu Benî Sa'd yurdunda onun yanında geçirdi. Peygamber ona her zaman büyük saygı gösterdi.","tdv":"halime","not":"Müslüman olup olmadığı ve kabrinin yeri konusunda farklı görüşler vardır; Bakî'de ona nispet edilen bir kabir bulunur."},{"id":"esad-zurare","ad":"Es'ad b. Zürâre","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Medine'de İslâm'ı ilk kabul edenlerdendir ve Akabe biatlarında bulundu. Mus'ab b. Umeyr'i evinde misafir etti. Hicretin ilk yılında vefat etti; Bakî'e defnedilen ilk Ensârîdir.","tdv":"esad-b-zurare"},{"id":"ibn-mesud","ad":"Abdullah b. Mes'ûd","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"İlk Müslümanlardandır; Kur'an'ı Mekke'de açıktan okuyan ilk sahâbîdir. Kur'an ve fıkıh bilgisiyle Kûfe'nin hocası oldu. 32 (652-53) yılında Medine'de vefat etti.","tdv":"abdullah-b-mesud"},{"id":"suheyb","ad":"Suheyb b. Sinân er-Rûmî","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"İlk Müslümanlardandır. Medine'ye hicret edebilmek için bütün malını Mekkelilere bıraktı. Hz. Ömer vasiyetiyle cenaze namazını ona kıldırttı. 38 (659) yılında vefat etti.","tdv":"suheyb-b-sinan"},{"id":"ebu-hureyre","ad":"Ebû Hüreyre","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Suffe ashabındandır ve en çok hadis rivayet eden sahâbîdir. Hayber'in fethi sırasında Medine'ye geldi ve Peygamber'den hiç ayrılmadı. 57-59 (677-679) yıllarında vefat etti.","tdv":"ebu-hureyre"},{"id":"ibn-cahs","ad":"Abdullah b. Cahş","ulke":"SAU","yer":"Medine, Uhud (Hz. Hamza'nın kabri)","durum":"kabir","ozet":"Hz. Peygamber'in halasının oğlu ve Hz. Zeyneb bint Cahş'ın kardeşidir. İki hicrete de katıldı. Uhud'da şehid düştü; TDV'ye göre kabri Hz. Hamza'nın türbesindedir.","tdv":"abdullah-b-cahs"},{"id":"hanzala","ad":"Hanzala b. Ebû Âmir (Gasîlü'l-melâike)","ulke":"SAU","yer":"Medine, Uhud","durum":"kabir","ozet":"Düğününün ertesi sabahı Uhud'a koşup şehid düşen sahâbîdir. Cenazesini meleklerin yıkadığı haber verildiği için \"Gasîlü'l-melâike\" diye anılır.","tdv":"hanzale-b-ebu-amir"},{"id":"ibn-cubeyr","ad":"Abdullah b. Cübeyr","ulke":"SAU","yer":"Medine, Uhud","durum":"kabir","ozet":"Uhud'da okçuların komutanıdır. Hz. Peygamber'in emri üzerine tepeden ayrılmayan birkaç arkadaşıyla birlikte Hâlid b. Velîd'in baskınında şehid düştü.","tdv":"abdullah-b-cubeyr"},{"id":"bedir","ad":"Bedir şehidleri","ulke":"SAU","yer":"Bedir (Medine–Mekke yolu)","durum":"kabir","ozet":"Hicretin 2. yılında (624) yapılan Bedir Gazvesi'nde şehid düşen on dört sahâbî savaş alanının yakınında defnedildi. Ubeyde b. Hâris, Umeyr b. Ebû Vakkās ve Hârise b. Sürâka bunlar arasındadır.","tdv":"bedir-gazvesi"},{"id":"ibn-omer","ad":"Abdullah b. Ömer","ulke":"SAU","yer":"Mekke","durum":"kabir","ozet":"Hz. Ömer'in oğludur; sünnete bağlılığı ve çok sayıda hadis rivayetiyle tanınır. Fitne dönemlerinde tarafsız kaldı. 73 (693) yılında Mekke'de vefat etti.","tdv":"abdullah-b-omer","not":"Mekke'de defnedildiği yerin Fah veya Zûtuvâ olduğu rivayet edilir."},{"id":"esma","ad":"Esmâ bint Ebû Bekir","ulke":"SAU","yer":"Mekke","durum":"kabir","ozet":"Hz. Ebû Bekir'in kızıdır. Hicret sırasında Sevr mağarasına azık taşıdığı için \"Zâtü'n-nitâkayn\" diye anılır. Oğlu Abdullah b. Zübeyr'in şehadetinden kısa süre sonra 73 (692) yılında Mekke'de vefat etti.","tdv":"esma-bint-ebu-bekir"},{"id":"ibn-zubeyr","ad":"Abdullah b. Zübeyr","ulke":"SAU","yer":"Mekke","durum":"kabir","ozet":"Hicretten sonra Medine'de doğan ilk Muhâcir çocuğudur. Hilâfetini ilan ederek Hicaz, Irak ve Mısır'a hâkim oldu. 73 (692) yılında Haccâc'ın kuşatması sırasında Mekke'de şehid edildi.","tdv":"abdullah-b-zubeyr"},{"id":"fedale","ad":"Fedâle b. Ubeyd","ulke":"SYR","yer":"Şam, Bâbüssağîr Kabristanı","durum":"kabir","ozet":"Ensâr'dan ve Suffe ashabındandır; Uhud, Hendek ve Rıdvan biatında bulundu. Suriye fetihlerinden sonra Dımaşk'a yerleşip kadılık yaptı. 53 (673) yılında Dımaşk'ta vefat etti.","tdv":"fedale-b-ubeyd"},{"id":"zeyneb-ali","ad":"Hz. Zeyneb bint Ali","ulke":"SYR","yer":"Şam, Seyyide Zeyneb","durum":"rivayet","ozet":"Hz. Ali ile Hz. Fâtıma'nın büyük kızı ve Hz. Peygamber'in torunudur. Kerbelâ'dan sonra Kûfe ve Dımaşk'taki konuşmalarıyla ve ailesini korumasıyla öne çıktı.","tdv":"zeyneb-bint-ali","not":"TDV'ye göre Şam'daki türbe ona nispet edilir ve önemli bir ziyaretgâhtır; ancak gerçek kabrinin Medine'de olması gerektiği belirtilir. Kahire'de de ona nispet edilen bir makam vardır."},{"id":"bureyde","ad":"Büreyde b. Husayb el-Eslemî","ulke":"TKM","yer":"Mary (Merv)","durum":"kabir","ozet":"Hicret yolculuğunda Hz. Peygamber'le karşılaşıp kabilesiyle Müslüman olan sahâbîdir. Hudeybiye'de ve birçok gazvede bulundu. Horasan fetihlerine katıldı ve Merv'de vefat etti.","tdv":"bureyde-b-husayb","not":"Merv'deki iki sahâbî türbesi XV. yüzyılda Şâhruh tarafından yeniden yaptırılmıştır ve bugün de ayaktadır."},{"id":"hakem","ad":"Hakem b. Amr el-Gıfârî","ulke":"TKM","yer":"Mary (Merv)","durum":"kabir","ozet":"Hz. Peygamber'in sohbetinde bulunmuş Gıfâr kabilesinden bir sahâbîdir. Muâviye döneminde Horasan valiliği yaptı ve Mâverâünnehir'e seferler düzenledi. 50 (670) yılı civarında Merv'de vefat etti.","tdv":"hakem-b-amr"},{"id":"amir-vakkas","ad":"Âmir b. Ebû Vakkās","ulke":"JOR","yer":"Ürdün Vadisi","durum":"rivayet","ozet":"Sa'd b. Ebû Vakkās'ın kardeşi ve ilk Müslümanlardandır; Habeşistan'a hicret etti. Suriye fetihlerine katıldı.","not":"Ürdün Vadisi'nde ona nispet edilen bir türbe bulunur."}],"lists":{"turk":["TUR","CYN","AZE","KAZ","UZB","TKM","KGZ","DTR"],"islam":["AFG","ALB","BHR","BGD","ARE","BIH","BRN","BFA","DZA","DJI","TCD","IDN","MAR","PSX","GMB","GIN","IRQ","QAT","COM","KOS","KWT","LBY","LBN","MDV","M     } else {
      var byC = {}; keys.forEach(function (k) { var u = V[k].u || "TUR"; (byC[u] = byC[u] || []).push(k); });
      var cs = Object.keys(byC).sort(function (a, b) { return byC[b].length - byC[a].length; });
      h += '<div class="facts">' + '<div class="fact"><small>Toplam</small><b>' + keys.length + ' yer</b></div><div class="fact"><small>Ülke</small><b>' + cs.length + "</b></div></div>";
      h += cs.map(function (u) {
        return '<section><h2>' + esc(C[u] ? C[u].ad : u) + ' <span class="n">' + byC[u].length + '</span></h2><div class="sahlist">' + byC[u].map(function (k) {
          var v = V[k];
          return '<button type="button" class="row visited" data-vgo="' + esc(k) + '"><span class="t"><b>' + esc(v.ad) + "</b><small>" + esc(v.k + " · " + v.yer + " · " + trDate(v.d)) + "</small></span>" + CHV + "</button>";
        }).join("") + "</div></section>";
      }).join("");
      h += '<p class="src">İşaretlerin yalnızca bu cihazda saklanır.</p>';
    }
    page.innerHTML = h; home.hidden = true; page.hidden = false; window.scrollTo(0, 0);
  }
  page.addEventListener("click", function (e) {
    var b = e.target.closest("[data-vgo]"); if (!b) return;
    var k = b.getAttribute("data-vgo"), v = V[k]; if (!v) return;
    if (k.indexOf("s:") === 0) goCountry(v.u, null, { sah: k.slice(2) });
    else if (TBKEY[k] != null) goCountry(TB[TBKEY[k]].u, null, { tb: TBKEY[k] });
  });

  /* ---------- routing ---------- */
  var homeScroll = 0;
  function route() {
    closeSheet();
    var m = /^#u-([A-Z]{3})$/.exec(location.hash);
    if (location.hash === "#ziyaretlerim") { if (!home.hidden) homeScroll = window.scrollY; fromHome = true; renderVisits(); }
    else if (m && C[m[1]]) { if (!home.hidden) homeScroll = window.scrollY; renderCountry(m[1]); }
    else { page.hidden = true; home.hidden = false; homeBar(); window.scrollTo(0, homeScroll); fromHome = false; }
  }
  window.addEventListener("hashchange", route);
  route();

  if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude/.test(location.hostname)) {
    try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}
  }
})();
</script>

</html>
