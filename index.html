<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ümmet Atlası</title>
<meta name="description" content="Türk ve İslâm dünyası haritası: ülkelerin dinî yapısı ve kabri bulunan sahabeler.">
<meta name="theme-color" content="#0e2238">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ümmet Atlası">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@700&display=swap">
<style>html,body{margin:0} :root{padding-top:0} body{min-height:100vh} [hidden]{display:none!important} img{max-width:100%}</style>
</head>
<body>
<style>
/* Layout: phone-first atlas — map card on top, lists below; a country opens as a full page, a sahâbî as a bottom sheet. Single deliberate night-blue and gold look, matching the wall poster. */
:root {
  color-scheme: dark;
  --ground: #0e2238;
  --panel: #142c47;
  --panel-2: #1a3657;
  --sea: #16324f;
  --grat: #22456a;
  --line: #2a4a6e;
  --land: #d9d1bf;
  --ink: #f3ecdc;
  --muted: #b3aa93;
  --gold: #c9a24a;
  --gold-soft: #8a6f35;
  --tr: #e30a17;
  --turk: #3a8ef0;
  --islam: #26a269;
  --font-display: "Lora", Georgia, "Times New Roman", serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--ground); }
button { font: inherit; color: inherit; }
a { color: var(--gold); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(14,34,56,.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 860px; margin: 0 auto; min-height: 56px; display: flex; align-items: center; gap: 12px; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; font: 700 22px/1 var(--font-display); letter-spacing: .01em; }
.brand svg { flex: none; }
.back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 12px 0 4px; margin-left: -4px; border: 0; background: none; color: var(--gold); font-weight: 600; font-size: 16px; cursor: pointer; }
.bar-title { font: 700 18px/1.2 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

.wrap { max-width: 860px; margin: 0 auto; padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 22px; }

.mapcard { position: relative; background: var(--sea); border: 1px solid var(--gold-soft); border-radius: 14px; overflow: hidden; }
#map { display: block; width: 100%; height: auto; aspect-ratio: 1000 / 497; max-width: 100%; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
#map path[data-id], #map circle[data-id] { cursor: pointer; }
#map .hit { stroke: #f6d27a; stroke-width: 1.6px; }
.zoom { position: absolute; right: 8px; bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
.zoom button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--gold-soft); background: rgba(14,34,56,.88); color: var(--ink); font-size: 22px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
.maphint { position: absolute; left: 10px; top: 8px; font-size: 12.5px; color: var(--ink); background: rgba(14,34,56,.78); padding: 4px 10px; border-radius: 999px; pointer-events: none; }

.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 14px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 8px; }
.sw { width: 14px; height: 14px; border-radius: 4px; flex: none; display: inline-block; }

.search { position: relative; }
.search input { width: 100%; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 16px var(--font-body); padding: 0 14px 0 42px; }
.search input::placeholder { color: var(--muted); }
.search svg { position: absolute; left: 14px; top: 14px; color: var(--muted); }
.results { display: flex; flex-direction: column; margin-top: 8px; background: var(--panel); border-radius: 12px; overflow: hidden; }
.results button { text-align: left; min-height: 46px; padding: 0 14px; border: 0; border-top: 1px solid var(--line); background: none; cursor: pointer; display: flex; align-items: center; gap: 10px; }
.results button:first-child { border-top: 0; }

h2 { font: 700 20px/1.25 var(--font-display); margin: 0 0 10px; display: flex; align-items: center; gap: 10px; text-wrap: balance; }
h2 .n { font: 600 13px var(--font-body); color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 15px; }
.chip .sw { width: 10px; height: 10px; border-radius: 50%; }
.chip.tr { border-color: var(--tr); }

.sahlist { display: flex; flex-direction: column; background: var(--panel); border-radius: 14px; overflow: hidden; }
.row { width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 56px; }
.row:first-child { border-top: 0; }
.row:active { background: var(--panel-2); }
.row .t { flex: 1; min-width: 0; }
.row .t b { display: block; font-weight: 600; }
.row .t small { display: block; color: var(--muted); font-size: 13.5px; }
.row .chev { color: var(--gold); flex: none; }
.cnt { flex: none; min-width: 30px; height: 26px; border-radius: 999px; background: var(--panel-2); color: var(--gold); font: 700 13px/26px var(--font-body); text-align: center; font-variant-numeric: tabular-nums; }
.badge { display: inline-block; font: 600 11.5px/1 var(--font-body); letter-spacing: .04em; text-transform: uppercase; padding: 4px 7px; border-radius: 6px; vertical-align: 2px; margin-left: 6px; }
.badge.riv { background: rgba(201,162,74,.18); color: var(--gold); }
.mine { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--gold-soft); color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 600; }
.mine svg { color: var(--gold); }
.mine .cnt { min-width: 22px; height: 22px; line-height: 22px; font-size: 12px; }
.visit { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 12px; border: 1px solid var(--gold-soft); background: none; color: var(--ink); font-weight: 600; cursor: pointer; padding: 0 14px; }
.visit svg { color: var(--gold); opacity: .5; }
.visit.on { background: var(--islam); border-color: var(--islam); color: #fff; }
.visit.on svg { color: #fff; opacity: 1; }
.row.visited .t b::after { content: "✓"; color: var(--islam); margin-left: 8px; font-weight: 700; }
.visitbox { display: flex; flex-direction: column; gap: 8px; }
.vdate { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--panel-2); border-radius: 12px; padding: 8px 12px; font-size: 15px; }
.vdate input { font: 16px var(--font-body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 44px; }
.visitbox .src { margin: 0; }
.vmap svg { display: block; width: 100%; height: auto; aspect-ratio: 1.6; }
#map path, #map circle { vector-effect: non-scaling-stroke; }
#provs path.hit { fill: rgba(246,210,122,.35); }
.ph { margin: 0; border-radius: 12px; overflow: hidden; background: var(--panel-2); }
.ph img { display: block; width: 100%; max-height: 260px; object-fit: cover; }
.ph figcaption { font-size: 12px; color: var(--muted); padding: 6px 10px; }
.ph figcaption a { color: var(--muted); }
.results button .t { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 6px 0; }
.results button .t b { font-weight: 600; }
.results button .t small { color: var(--muted); font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--gold); color: var(--ground); border-color: var(--gold); }
.chip .n { opacity: .7; font-size: 13px; }
.tbk { margin-bottom: 8px; }
.ilgroups { display: flex; flex-direction: column; gap: 8px; }
.ilgroups details { background: var(--panel); border-radius: 12px; overflow: hidden; }
.ilgroups summary { list-style: none; cursor: pointer; min-height: 50px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 14px; font-weight: 600; }
.ilgroups summary::-webkit-details-marker { display: none; }
.ilgroups details[open] summary { border-bottom: 1px solid var(--line); color: var(--gold); }
.ilgroups .sahlist { border-radius: 0; }
#tb .src { margin: 0 0 10px; }
.sahgroups { display: flex; flex-direction: column; gap: 10px; }
.gh { margin: 8px 0 0; font: 600 14px/1.3 var(--font-body); color: var(--gold); display: flex; gap: 8px; align-items: baseline; }
.gh .n { color: var(--muted); font-weight: 500; font-size: 13px; }

/* country page */
.hero { display: flex; flex-direction: column; gap: 10px; }
.hero h1 { font: 700 34px/1.1 var(--font-display); margin: 0; text-wrap: balance; }
.tag { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: var(--panel); }
.card { background: var(--panel); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card h3 { margin: 0; font: 600 13px/1.2 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
.relbar { display: flex; height: 18px; border-radius: 6px; overflow: hidden; background: var(--panel-2); }
.relbar i { display: block; height: 100%; }
.rels { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.rels li { display: flex; align-items: center; gap: 10px; font-size: 16px; }
.rels li .l { flex: 1; min-width: 0; }
.rels li .v { font-weight: 700; font-variant-numeric: tabular-nums; }
.rels li:first-child { font-size: 18px; }
.part + .part { border-top: 1px solid var(--line); padding-top: 12px; }
.part h4 { margin: 0 0 8px; font-size: 15px; }
.src { font-size: 12.5px; color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.fact { background: var(--panel); border-radius: 12px; padding: 12px 14px; }
.fact small { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.fact b { font: 600 17px/1.3 var(--font-body); }
.prose { margin: 0; font-size: 16px; line-height: 1.6; max-width: 65ch; }
.prose + .prose { margin-top: 12px; }
.more { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; font-weight: 600; text-decoration: none; }
.empty { color: var(--muted); font-size: 15px; margin: 0; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(4,12,22,.6); z-index: 40; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 86vh; overflow: auto; background: var(--panel); border-radius: 18px 18px 0 0; border-top: 2px solid var(--gold); padding-block: 10px calc(24px + env(safe-area-inset-bottom, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.sheet-in { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.grip { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 6px; }
.sheet h2 { font-size: 24px; margin: 0; }
.place { display: flex; align-items: flex-start; gap: 8px; color: var(--muted); font-size: 15px; }
.place svg { flex: none; margin-top: 3px; color: var(--gold); }
.note { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--panel-2); font-size: 14.5px; color: var(--ink); }
.close { align-self: stretch; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; font-weight: 600; }

footer.src { line-height: 1.6; border-top: 1px solid var(--line); padding-top: 14px; }
@media (min-width: 700px) { .hero h1 { font-size: 42px; } }
@media (prefers-reduced-motion: no-preference) { .sheet:not([hidden]) { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(30px); opacity: .4; } } }
</style>

<header class="bar"><div class="bar-in" id="barIn"></div></header>

<main class="wrap" id="home">
  <div class="mapcard">
    <svg id="map" viewBox="0 0 1000 497" role="img" aria-label="Dünya haritası: Türkiye kırmızı, Türk devletleri mavi, Müslüman ülkeler yeşil. Bir ülkeye dokununca sayfası açılır."></svg>
    <span class="maphint">Bir ülkeye dokunun</span>
    <div class="zoom">
      <button type="button" id="zin" aria-label="Yakınlaştır">+</button>
      <button type="button" id="zout" aria-label="Uzaklaştır">−</button>
      <button type="button" id="zreset" aria-label="Haritayı sıfırla"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
    </div>
  </div>
  <div class="legend" aria-hidden="true">
    <span><i class="sw" style="background:var(--tr)"></i>Türkiye</span>
    <span><i class="sw" style="background:var(--turk)"></i>Türk devletleri</span>
    <span><i class="sw" style="background:var(--islam)"></i>Müslüman ülkeler</span>
    <span><i class="sw" style="background:var(--land)"></i>Diğer ülkeler</span>
  </div>

  <div class="search">
    <label for="q" class="sr" style="position:absolute;left:-9999px">Ülke, şehir, kişi veya mekân ara</label>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Ülke, şehir, kişi veya mekân ara…" autocomplete="off">
    <div class="results" id="results" hidden></div>
  </div>

  <section><h2>Sahabe Kabirleri <span class="n" id="sahN"></span></h2><div class="sahlist" id="sahCountries"></div></section>
  <section><h2>Türk Devletleri</h2><div class="chips" id="turkChips"></div></section>
  <section><h2>Müslüman Ülkeler</h2><div class="chips" id="islamChips"></div></section>

  <footer class="src">
    Din oranları: CIA World Factbook. Ülke ve sahabe bilgileri: TDV İslâm Ansiklopedisi (islamansiklopedisi.org.tr). Harita: Natural Earth.
  </footer>
</main>

<main class="wrap" id="page" hidden></main>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></div>

 döneminde yayıldı. Resûlullah, Muâz b. Cebel'i Yemen'e kadı ve öğretmen olarak gönderdi ve birçok kabile onun gayretiyle Müslüman oldu; Hz. Ali de 10 (631) yılında Yemen'e gönderildi. Hz. Peygamber'in Yemen halkını iman ve hikmet ehli olarak övdüğü hadisler meşhurdur.","Osmanlılar XVI. yüzyılda Portekiz tehdidine karşı Kızıldeniz'e yöneldi ve 1539'da Yemen beylerbeyiliğini kurdu. Hâkimiyet kesintilerle sürdü; XIX. yüzyılda yeniden kurulan Osmanlı idaresi Birinci Dünya Savaşı'na kadar devam etti. \"Yemen türküsü\"nün hatırlattığı gibi Anadolu'dan pek çok asker bu topraklarda şehid düştü.","Osmanlıların çekilmesinden sonra kuzeyde Zeydî imamlık, güneyde İngiliz yönetimindeki Aden ortaya çıktı; iki Yemen 1990'da birleşti. Nüfusun yaklaşık yüzde 70'i Şâfiî mezhebinden Sünnî, yüzde 30'u Zeydî'dir. Ülke son yıllarda ağır bir iç savaş ve insanî kriz yaşamaktadır."]},"VNM":{"id":"VNM","ad":"Vietnam","g":"other","rel":{"rows":[["Dinsiz / ateist",86.3,""],["Hristiyan",7.1,""],["Budist",5.8,""],["Diğer / belirtilmemiş",0.8,""]],"yr":"2019","src":"CIA World Factbook"},"pop":"106,7 milyon (2025 tahmini)"},"VEN":{"id":"VEN","ad":"Venezuela","g":"other","rel":{"rows":[["Hristiyan",81.1,""],["Dinsiz / ateist",13.7,""],["Yerel/geleneksel inançlar",0.7,""],["Diğer / belirtilmemiş",4.2,""]],"yr":"2023","src":"CIA World Factbook"},"pop":"31,8 milyon (2025 tahmini)"},"VAT":{"id":"VAT","ad":"Vatikan","g":"other","rel":{"rows":[],"note":"Roma Katolik.","src":"CIA World Factbook"},"pop":"1 bin (2024 tahmini)"},"VUT":{"id":"VUT","ad":"Vanuatu","g":"other","rel":{"rows":[["Hristiyan",56.1,""],["Dinsiz / ateist",1.4,""],["Diğer / belirtilmemiş",15.2,""],["Verisi yok / belirtilmemiş",27.3,""]],"yr":"2020","src":"CIA World Factbook"},"pop":"318 bin (2024 tahmini)"},"UZB":{"id":"UZB","ad":"Özbekistan","g":"turk","rel":{"rows":[["Müslüman",88.0,""],["Hristiyan",9.0,""],["Diğer / belirtilmemiş",3.0,""]],"yr":"","src":"CIA World Factbook"},"pop":"37,0 milyon (2025 tahmini)","cap":"Taşkent","oz":"Başşehri Taşkent olan Özbekistan, Buhara ve Semerkant gibi İslâm medeniyetinin büyük merkezlerini barındırır. İslâm, 707-715 yıllarında Kuteybe b. Müslim'in Mâverâünnehir ve Hârizm'i fethiyle bölgeye girdi. Halkın büyük çoğunluğu Hanefî mezhebine bağlı Sünnî Müslümandır.","tdv":"ozbekistan","sah":["kusem"],"uzun":["Özbekistan, Orta Asya'da yaklaşık 447 bin km² yüzölçümüne sahip bir ülkedir; başşehri Taşkent'tir. Topraklarının büyük bölümü ova ve platolardan oluşur, karasal ve çöl iklimi hâkimdir. Halkın çoğunluğunu Özbek Türkleri oluşturur.","Mâverâünnehir'de İslâm, 707-715 yıllarında Kuteybe b. Müslim'in fetihleriyle yayılmaya başladı. Sâmânîlerden itibaren Buhara ve Semerkant medreseleri, kütüphaneleri ve rasathaneleriyle İslâm dünyasının en parlak ilim merkezlerine dönüştü. İmam Buhârî, İmam Mâtürîdî, Tirmizî ve Bahâeddin Nakşibend gibi büyük âlim ve veliler bu topraklarda yetişti; Hanefî mezhebi ve Mâtürîdî akidesi burada kök saldı.","Moğol istilasından sonra Emîr Timur, Semerkant'ı muhteşem eserlerle donattı; Timurlulardan sonra Şeybânîler, ardından Buhara, Hîve ve Hokand hanlıkları hüküm sürdü. XIX. yüzyılda bölge Rus hâkimiyetine girdi; Sovyet döneminde âlimler ve dindarlar ağır baskılara maruz kaldı.","31 Ağustos 1991'de bağımsızlığını ilan eden Özbekistan'da dinî hayat yeniden canlandı. Binlerce cami, Taşkent İslâm Üniversitesi ve medreseler faaliyet göstermektedir. Semerkant'taki Şâh-ı Zinde (Kusem b. Abbas), Buhara'daki Bahâeddin Nakşibend ve Semerkant yakınındaki İmam Buhârî türbeleri en çok ziyaret edilen yerlerdir."]},"URY":{"id":"URY","ad":"Uruguay","g":"other","rel":{"rows":[["Dinsiz / ateist",48.9,""],["Hristiyan",42.3,""],["Yerel/geleneksel inançlar",2.8,""],["Diğer / belirtilmemiş",6.2,""]],"yr":"","src":"CIA World Factbook"},"pop":"3,4 milyon (2025 tahmini)"},"FSM":{"id":"FSM","ad":"Mikronezya","g":"other","rel":{"rows":[["Hristiyan",97.3,""],["Dinsiz / ateist",0.7,""],["Diğer / belirtilmemiş",2.0,""]],"yr":"2010","src":"CIA World Factbook"},"pop"  işlerini denetledi. İngilizlerin 1971'de Körfez'den çekilmesiyle altı emirlik 2 Aralık 1971'de Birleşik Arap Emirlikleri'ni kurdu; Re'sülhayme 1972'de katıldı.","Petrol gelirleriyle büyük bir kalkınma süreci yaşandı. Resmî din İslâm, resmî dil Arapçadır; vatandaşların çoğunluğu Sünnî Müslüman olup Mâlikî ve Şâfiî mezhepleri yaygındır. Abu Dabi'deki Şeyh Zâyid Camii dünyanın en büyük camilerinden biridir."]},"UKR":{"id":"UKR","ad":"Ukrayna","g":"other","rel":{"rows":[],"note":"Çoğunluk Ortodoks Hristiyan; Grek Katolik, Roma Katolik, Protestan, Müslüman ve Yahudi azınlıklar vardır.","src":"CIA World Factbook"},"pop":"35,7 milyon (2024 tahmini)"},"UGA":{"id":"UGA","ad":"Uganda","g":"other","rel":{"rows":[["Hristiyan",84.4,""],["Müslüman",13.7,""],["Dinsiz / ateist",0.2,""],["Diğer / belirtilmemiş",1.6,""]],"yr":"2014","src":"CIA World Factbook"},"pop":"50,9 milyon (2025 tahmini)"},"TKM":{"id":"TKM","ad":"Türkmenistan","g":"turk","rel":{"rows":[["Müslüman",93.0,""],["Hristiyan",6.4,""],["Budist",0.5,"<1"],["Yerel/geleneksel inançlar",0.5,"<1"],["Yahudi",0.5,"<1"],["Diğer / belirtilmemiş",1.0,""]],"yr":"2020","src":"CIA World Factbook"},"pop":"5,7 milyon (2024 tahmini)","cap":"Aşkabat","oz":"27 Ekim 1991'de bağımsızlığını kazanan Türkmenistan'ın başşehri Aşkabat'tır. İslâm, Hz. Osman döneminde (31/651) Abdullah b. Âmir'in Horasan fetihleriyle bölgeye girdi; Merv, Orta Asya fetihlerinin üssü oldu. Nüfusun büyük çoğunluğu Sünnî-Hanefî Müslüman Türkmenlerdir.","tdv":"turkmenistan","sah":["bureyde","hakem"],"uzun":["Türkmenistan, kuzeyinde Kazakistan ve Özbekistan, güneyinde İran ve Afganistan, batısında Hazar Denizi bulunan bir Orta Asya ülkesidir. Topraklarının büyük bölümü Karakum Çölü ile kaplıdır. Nüfusun büyük çoğunluğu Sünnî-Hanefî Türkmenlerdir.","İslâm, Hz. Osman döneminde 31 (651) yılından itibaren Horasan fetihleriyle bölgeye ulaştı. Merv, Orta Asya fetihlerinin yönetildiği önemli bir üs oldu; Büreyde b. Husayb ve Hakem b. Amr el-Gıfârî gibi sahâbîler burada vefat etti. 1040 Dandanakan Zaferi'nden sonra kurulan Büyük Selçuklu Devleti'nin Merv önemli merkezlerinden biri oldu ve Sultan Sencer'in türbesi burada yükselir.","Rus işgali 1860'lardan itibaren hız kazandı; Göktepe direnişinin ardından Aşkabat 1881'de Rus kontrolüne girdi. Sovyet döneminde dil ve kültür üzerinde baskı uygulandı, 1917'de beş yüz civarında olan camilerin neredeyse tamamı yıkıldı veya kapatıldı.","Türkmenistan 27 Ekim 1991'de bağımsızlığını kazandı ve İslâm İşbirliği Teşkilâtı'na üye oldu. Bağımsızlıktan sonra camiler yeniden açıldı; Merv'deki sahâbe kabirleri ve Selçuklu eserleri önemli ziyaret yerleri olarak korunmaktadır."]},"TUR":{"id":"TUR","ad":"Türkiye","g":"tr","rel":{"rows":[["Müslüman",99.8,""],["Diğer / belirtilmemiş",0.2,""]],"yr":"","src":"CIA World Factbook"},"pop":"84,6 milyon (2025 tahmini)","cap":"Ankara","oz":"Asya ile Avrupa'yı birleştiren Türkiye, hem Avrupalı hem Ortadoğulu hem de Akdenizli olan tek ülkedir. Anadolu'nun İslâmlaşması 1071 Malazgirt Zaferi'nden sonra Selçuklularla hızlandı; Osmanlı Devleti altı asır boyunca İslâm dünyasının merkezi oldu. Cumhuriyet döneminde dinî hizmetleri Diyanet İşleri Başkanlığı yürütür; halkın büyük çoğunluğu Sünnî-Hanefî Müslümandır.","tdv":"turkiye","sah":["ebu-eyyub","ebu-seybe","diyarbakir","safvan","tokludede","ist-makam"],"uzun":["Türkiye, yaklaşık 780 bin km² yüzölçümüyle Asya ile Avrupa arasında köprü konumundadır; üç tarafı Karadeniz, Ege ve Akdeniz ile çevrilidir. Başşehri Ankara, en kalabalık şehri İstanbul'dur. Nüfusun büyük çoğunluğu Anadolu'da, bir kısmı da Trakya'da yaşar.","Anadolu'nun İslâm'la tanışması Hz. Muâviye döneminden itibaren yapılan seferlerle başladı; Ebû Eyyûb el-Ensârî gibi sahâbîler İstanbul surları önünde şehid düştü. 1071 Malazgirt Zaferi'nden sonra Türkler Anadolu'yu yurt edindi; Anadolu Selçukluları ve beylikler döneminde şehirler camiler, medreseler, kervansaraylar ve tekkelerle donatıldı.","Osmanlı Devleti XIV. yüzyıldan itibaren Balkanlar'dan Hicaz'a, Kuzey Afrika'dan Kafkasya'ya uzanan bir cihan devletine dönüştü. 1453'te İstanbul'un fethiyle Hz. Peygamber'in müjdesi gerçekleşti; 1517'den sonra hilâfet ve Haremeyn hizmeti Osmanlı padişahlarına geçti. Asırlar boyunca İslâm dünyasının siyasî ve kültürel merkezi oldu.","Cumhuriyet'in ilanından sonra 3 Mart 1924'te hilâfet kaldırıldı, medreseler kapatıldı ve din hizmetlerini yürütmek üzere Diyanet İşleri Reisliği (bugünkü Diyanet İşleri Başkanlığı) kuruldu. 1925'te tekke ve zâviyeler kapatıldı, 1937'de laiklik anayasaya girdi. Çok partili hayata geçişle birlikte din eğitimi yeniden yaygınlaştı; İmam-Hatip okulları ve ilâhiyat fakülteleri açıldı.","Bugün nüfusun büyük çoğunluğu Müslümandır ve çoğunluk Hanefî mezhebine, doğu ve güneydoğuda önemli bir kesim Şâfiî mezhebine bağlıdır. Diyanet İşleri Başkanlığı'na bağlı seksen bini aşkın camiyle Türkiye, İslâm dünyasının en köklü dinî teşkilatlarından birine sahiptir. Eyüp Sultan başta olmak üzere sahâbe kabirleri, peygamber makamları ve evliya türbeleri yurt sathında yoğun biçimde ziyaret edilir."]},"TUN":{"id":"TUN","ad":"Tunus","g":"islam","rel":{"rows":[["Müslüman",99.0,""],["Diğer / belirtilmemiş",0.5,"<1"]],"yr":"","src":"CIA World Factbook"},"pop":"12,0 milyon (2025 tahmini)","cap":"Tunus","oz":"Kuzey Afrika'nın en küçük ülkesidir. İslâm, Hz. Osman döneminde başlayan fetihlerle girdi; Ukbe b. Nâfi 50/670'te Kayrevan'ı kurarak Mağrib fetihlerinin üssü yaptı. Nüfusun büyük çoğunluğu Sünnî (Mâlikî) Müslümandır.","tdv":"tunus","sah":["ebu-zema"],"uzun":["Tunus, Kuzey Afrika'nın en küçük ülkesidir ve yaklaşık 163 bin km² yüzölçümüne sahiptir. Nüfusun büyük çoğunluğu Arap ve Sünnî Müslümandır; halk ağırlıklı olarak kıyı kuşağında yaşar.","Ukbe b. Nâfi' 50 (670) yılında Kayrevan şehrini kurarak bölgede İslâm'ın yayılması için bir üs oluşturdu. Kayrevan, Ukbe Camii ve Ebû Zem'a el-Belevî'nin türbesiyle Kuzey Afrika'nın ilk büyük ilim merkezi oldu; İmam Sahnûn'un el-Müdevvene'si burada yazıldı. Ağlebîler döneminde (800-909) ribâtlar ve camiler inşa edildi.","Osmanlı denizcileri XVI. yüzyılın başında bölgeye geldi; 1574'te Tunus kesin olarak Osmanlı topraklarına katıldı. Eyalet daha sonra dayılar ve beyler tarafından yönetildi; Hüseynî ailesi uzun süre idareyi elinde tuttu ve Tunus hilâfete bağlı kaldı.","1881 Bardo Antlaşması ile Fransız himayesi başladı; Tunus 20 Mart 1956'da bağımsız oldu. Zeytûne Camii ve medresesi asırlarca Mâlikî fıkhının ve Arap dilinin önemli bir merkezi olmuştur. Halkın çoğunluğu Mâlikî mezhebine bağlıdır."]},"TTO":{"id":"TTO","ad":"Trinidad ve Tobago","g":"other","rel":{"rows":[["Hristiyan",55.2,""],["Hindu",18.2,""],["Müslüman",5.0,""],["Dinsiz / ateist",2.2,""],["Diğer / belirtilmemiş",19.5,""]],"yr":"2011","src":"CIA World Factbook"},"pop":"1,4 milyon (2025 tahmini)"},"TON":{"id":"TON","ad":"Tonga","g":"other","rel":{"rows":[["Hristiyan",97.3,""],["Dinsiz / ateist",0.6,""],["Diğer / belirtilmemiş",2.2,""]],"yr":"2021","src":"CIA World Factbook"},"pop":"105 bin (2025 tahmini)"},"TGO":{"id":"TGO","ad":"Togo","g":"other","rel":{"rows":[["Hristiyan",42.3,""],["Yerel/geleneksel inançlar",36.9,""],["Müslüman",14.0,""],["Dinsiz / ateist",6.2,""],["Hindu",0.5,"<1"],["Budist",0.5,"<1"],["Yahudi",0.5,"<1"],["Diğer / belirtilmemiş",0.5,"<1"]],"yr":"2020","src":"CIA World Factbook"},"pop":"9,1 milyon (2025 tahmini)"},"TLS":{"id":"TLS","ad":"Doğu Timor","g":"other","rel":{"rows":[["Hristiyan",92.6,""],["Diğer / belirtilmemiş",8.1,""]],"yr":"2022","src":"CIA World Factbook"},"pop":"1,4 milyon (2025 tahmini)"},"THA":{"id":"THA","ad":"Tayland","g":"other","rel":{"rows":[["Budist",92.5,""],["Müslüman",5.4,""],["Hristiyan",1.2,""],["Diğer / belirtilmemiş",0.9,""]],"yr":"2021","src":"CIA World Factbook"},"pop":"70,0 milyon (2025 tahmini)"},"TZA":{"id":"TZA","ad":"Tanzanya","g":"other","rel":{"rows":[["Hristiyan",63.1,""],["Müslüman",34.1,""],["Yerel/geleneksel inançlar",1.1,""],["Budist",0.5,"<1"],["Hindu",0.5,"<1"],["Yahudi",0.5,"<1"],["Diğer / belirtilmemiş",2.1,""]],"yr":"2020","src":"CIA World Factbook"},"pop":"69,1 milyon (2025 tahmini)"},"TJK":{"id":"TJK","ad":"Tacikistan","g":"islam","rel":{"rows":[["Müslüman",98.0,""],["Diğer / belirtilmemiş",2.0,""]],"yr":"2014","src":"CIA World Factbook"},"pop":"10,6 milyon (2025 tahmini)","cap":"Duşanbe","oz":"Başşehri Duşanbe olan Tacikistan'a İslâm, VII. yüzyılın ikinci yarısında Araplarla girdi ve IX. yüzyılda Sâmânîler döneminde yaygınlaştı. Müslümanların büyük çoğunluğu Hanefîdir; Bedahşan'da İsmâilîler yaşar.","tdv":"tacikistan","uzun":["Tacikistan, Orta Asya'da Kırgızistan, Çin, Afganistan ve Özbekistan ile çevrili, yaklaşık 143 bin km² yüzölçümüne sahip bir ülkedir. Topraklarının büyük bölümü Pamir ve Tanrı dağlarına ait yüksek alanlardır. Nüfusun çoğunluğunu Farsça konuşan Tacikler, ikinci büyük topluluğu Özbekler oluşturur.","İslâm, Emevîler döneminde Kuteybe b. Müslim'in fetihleriyle bölgeye ulaştı ve Abbâsîler döneminde hızla yayıldı. Buhara merkezli Sâmânî Devleti bu bölgede İslâm kültürünün gelişmesine büyük katkı sağladı; Karahanlılar 999'da bu devlete son verdi.","Rusya 1860'larda bölgeyi ele geçirdi; 1929'da Tacikistan Sovyet cumhuriyeti kuruldu ve dinî hayat ağır kısıtlamalara maruz kaldı. 9 Eylül 1991'de bağımsızlığını ilan eden ülke 1992-1997 yılları arasında yıkıcı bir iç savaş yaşadı.","Müslümanların büyük çoğunluğu Hanefî mezhebine bağlıdır ve Nakşibendiyye en yaygın tarikattır. Dağlık Bedahşan bölgesinde İsmâilîler yaşar."]},"TWN":{"id":"TWN","ad":"Çin Cumhuriyeti","g":"other","rel":{"rows":[["Budist",35.3,""],["Taocu",33.2,""],["Dinsiz / ateist",18.2,""],["Yerel/geleneksel inançlar",10.0,""],["Hristiyan",3.9,""]],"yr":"2005","src":"CIA World Factbook"},"pop":"23,6 milyon (2025 tahmini)"},"SYR":{"id":"SYR","ad":"Suriye","g":"islam","rel":{"rows":[["Müslüman",87.0,""],["Hristiyan",10.0,""],["Dürzî",3.0,""]],"yr":"","src":"CIA World Factbook"},"pop":"24,3 milyon (2025 tahmini)","cap":"Şam","oz":"Başşehri Şam olan Suriye, Emevî hilâfetinin merkeziydi. Hz. Ebû Bekir döneminde başlayan fetihler, Hz. Ömer döneminde Şam'ın alınması ve Yermük zaferiyle tamamlandı. Nüfusun büyük çoğunluğu Müslüman, yaklaşık %10'u Hristiyandır.","tdv":"suriye","sah":["halid","bilal","ebud-derda","muaviye","ammar","fedale","zeyneb-ali"],"uzun":["Suriye, kuzeyde Türkiye, doğuda Irak, güneyde Ürdün, batıda Lübnan ve Filistin ile çevrili, Akdeniz'e kıyısı olan bir ülkedir. Batıdaki dağlık alanlar doğuya doğru geniş çöllere dönüşür. Nüfusun büyük çoğunluğu Sünnî Müslümandır.","Hz. Ömer döneminde Ecnâdeyn ve Yermük zaferleriyle Suriye'nin fethi tamamlandı; Dımaşk 14 (635) yılında Müslümanların eline geçti. Hz. Muâviye'nin valiliği ve 661'de Emevî Devleti'nin kurulmasıyla Dımaşk İslâm dünyasının başşehri oldu; Emevî Camii bu dönemin şaheseridir. Bilâl-i Habeşî, Ebü'd-Derdâ ve Hâlid b. Velîd gibi pek çok sahâbî bu topraklarda medfundur.","1079'da Selçuklular bölgeye hâkim oldu; Nûreddin Zengî medreseler ve hastaneler kurdu, Selâhaddin-i Eyyûbî Hıttîn'de Haçlıları yenerek Kudüs'ü fethetti. Memlükler Moğolları Aynicâlût'ta durdurdu. Yavuz Sultan Selim'in 1516 Mercidâbık Zaferi'nden sonra Suriye dört asır Osmanlı idaresinde kaldı.","Birinci Dünya Savaşı'ndan sonra Fransız mandası altına giren Suriye 1946'da bağımsız oldu. 1963'ten itibaren Baas Partisi, 1970'ten itibaren Esed ailesi ülkeyi yönetti; 2011'de başlayan iç savaş milyonlarca insanın yerinden edilmesine yol açtı ve Esed yönetimi Aralık 2024'te sona erdi. Sünnî çoğunluğun yanında Nusayrî, Dürzî ve Hristiyan topluluklar da yaşar."]},"CHE":{"id":"CHE","ad":"İsviçre","g":"other","rel":{"rows":[["Hristiyan",62.6,""],["Dinsiz / ateist",29.4,""],["Müslüman",5.4,""],["Diğer / belirtilmemiş",2.6,""]],"yr":"2020","src":"CIA World Factbook"},"pop":"8,9 milyon (2025 tahmini)"},"SWE":{"id":"SWE","ad":"İsveç","g":"other","rel":{"rows":[["Hristiyan",53.9,""],["Dinsiz / ateist",37.2,""],["Diğer / belirtilmemiş",8.9,""]],"yr":"2021","src":"CIA World Factbook"},"pop":"10,6 milyon (2025 tahmini)"},"SWZ":{"id":"SWZ","ad":"Esvatini","g":"other","rel":{"rows":[["Hristiyan",90.0,""],["Müslüman",2.0,""],["Diğer / belirtilmemiş",8.0,""]],"yr":"2015","src":"CIA World Factbook"},"pop":"1,1 milyon (2025 tahmini)"},"SUR":{"id":"SUR","ad":"Surinam","g":"other","rel":{"rows":[["Hristiyan",49.6,""],["Hindu",22.3,""],["Müslüman",13.8,""],["Dinsiz / ateist",7.5,""],["Yerel/geleneksel inançlar",1.8,""],["Diğer / belirtilmemiş",4.9,""]],"yr":"2012","src":"CIA World Factbook"},"pop":"654 bin (2025 tahmini)"},"SDS":{"id":"SDS","ad":"Güney Sudan","g":"other","rel":{"rows":[["Hristiyan",60.5,""],["Yerel/geleneksel inançlar",32.9,""],["Müslüman",6.2,""],["Dinsiz / ateist",0.5,"<1"],["Diğer / belirtilmemiş",0.5,"<1"]],"yr":"2020","src":"CIA World Factbook"},"pop":"12,7 milyon (2024 tahmini)"},"SDN":{"id":"SDN","ad":"Sudan","g":"islam","rel":{"rows":[],"note":"Sünnî Müslüman; küçük bir Hristiyan azınlık vardır.","src":"CIA World Factbook"},"pop":"50,5 milyon (2024 tahmini)","cap":"Hartum","oz":"Başşehri Hartum olan Sudan'a İslâm, Mısır'ın fethinden sonra VII. yüzyılın ortalarında girdi; Arap kabilelerinin göçü, ticaret ve tasavvufla yayıldı. Müslümanların çoğu Mâlikîdir.","tdv":"sudan","uzun":["Sudan, Afrika'nın büyük ülkelerinden biridir; kuzeyde çöller, güneyde savanlar uzanır ve Nil nehri ülkeyi boydan boya geçer. 2011'de güney bölgesinin ayrılmasından sonra nüfusun tamamına yakını Müslüman olmuştur.","Mısır'ın fethinden kısa süre sonra Müslümanlar Nûbe'ye yöneldi ve yapılan antlaşmalarla ticaret yolları açıldı. İslâm, Arap kabilelerinin göçleri ve tasavvufî hareketlerle yavaş yavaş yayıldı; 1504'te kurulan Fung Sultanlığı İslâm'ın geniş halk kitlelerine ulaşmasını sağladı.","XVI. yüzyılda Kızıldeniz kıyısında Sevâkin merkezli Osmanlı Habeş eyaleti kuruldu. 1821'de Kavalalı Mehmed Ali Paşa'nın ordusu bölgeyi ele geçirdi; 1880'lerde Muhammed Ahmed el-Mehdî'nin hareketi bu yönetimi sona erdirdi ve 1899'da İngiliz-Mısır ortak yönetimi kuruldu.","Sudan 1 Ocak 1956'da bağımsız oldu, ancak uzun süren iç savaşlar ve siyasî istikrarsızlık yaşadı. Dinî hayatta Mâlikî mezhebi yaygındır; Kādiriyye, Şâzeliyye, Semmâniyye ve Mîrganiyye tarikatları toplum hayatında derin izler bırakmıştır."]},"LKA":{"id":"LKA","ad":"Sri Lanka","g":"other","rel":{"rows":[["Budist",70.2,""],["Hindu",12.6,""],["Müslüman",9.7,""],["Hristiyan",7.4,""],["Diğer / belirtilmemiş",0.1,""]],"yr":"2012","src":"CIA World Factbook"},"pop":"22,1 milyon (2025 tahmini)"},"ESP":{"id":"ESP","ad":"İspanya","g":"other","rel":{"rows":[["Hristiyan",58.2,""],["Dinsiz / ateist",37.5,""],["Diğer / belirtilmemiş",4.4,""]],"yr":"2021","src":"CIA World Factbook"},"pop":"47,3 milyon (2024 tahmini)"},"KOR":{"id":"KOR","ad":"Güney Kore","g":"other","rel":{"rows":[["Dinsiz / ateist",60.0,""],["Hristiyan",23.0,""],["Budist",16.0,""]],"yr":"2021","src":"CIA World Factbook"},"pop":"51,5 milyon (2025 tahmini)"},"ZAF":{"id":"ZAF","ad":"Güney Afrika Cumhuriyeti","g":"other","rel":{"rows":[["Hristiyan",86.0,""],["Yerel/geleneksel inançlar",5.4,""],["Dinsiz / ateist",5.2,""],["Müslüman",1.9,""],["Diğer / belirtilmemiş",1.5,""]],"yr":"2015","src":"CIA World Factbook"},"pop":"61,1 milyon (2025 tahmini)"},"SOM":{"id":"SOM","ad":"Somali","g":"islam","rel":{"rows":[["Müslüman",99.9,""],["Yerel/geleneksel inançlar",0.1,""]],"yr":"2020","src":"CIA World Factbook"},"pop":"20,3 milyon (2025 tahmini)","cap":"Mogadişu","oz":"Afrika Boynuzu'nda, başşehri Mogadişu olan bir ülkedir. İslâm, VIII. yüzyıldan itibaren Arap kabilelerinin kıyılara yerleşmesiyle yayıldı. Halkın yaklaşık %99'u Şâfiî Sünnî Müslümandır.","tdv":"somali","uzun":["Somali, Afrika Boynuzu'nda Aden Körfezi ile Hint Okyanusu arasında yer alır; başşehri Mogadişu'dur. Kurak bir iklime sahiptir. Nüfusun tamamına yakını Sünnî Müslümandır.","Bölge, Hz. Peygamber döneminde Habeşistan'a yapılan hicretlerden itibaren İslâm'la tanışan coğrafyaya komşudur. VIII. yüzyıldan itibaren Arap kabilelerinin sahillere yerleşmesiyle İslâm yayıldı; Zeyla' önemli bir merkez oldu, Müslüman tüccarların X. yüzyılda kurduğu Mogadişu XIII-XIV. yüzyıllarda büyük gelişme gösterdi.","XIX. yüzyılda ülke İngiltere, İtalya ve Fransa arasında paylaşıldı. Seyyid Muhammed Abdullah Hasan önderliğinde 1899'da başlayan direniş yirmi yıl sürdü. Somali 1 Temmuz 1960'ta bağımsızlığını ilan etti.","Şâfiî mezhebi yaygındır; Kādiriyye en yaygın tarikat olup Ahmediyye-İdrîsiyye ve Sâlihiyye de etkilidir. Dinî liderler eğitim ve toplumsal anlaşmazlıklarda önemli rol oynar. Türkiye son yıllarda Somali ile yakın kardeşlik ilişkileri kurmuştur."]},"SLB":{"id":"SLB","ad":"Solomon Adaları","g":"other","rel":{"rows":[["Hristiyan",95.9,""],["Diğer / belirtilmemiş",4.1,""]],"yr":"2009","src":"CIA World Factbook"},"pop":"739 bin (2025 tahmini)"},"SVK":{"id":"SVK","ad":"Slovakya","g":"other","rel":{"rows":[["Hristiyan",66.7,""],["Dinsiz / ateist",23.8,""],["Diğer / belirtilmemiş",9.5,""]],"yr":"2021","src":"CIA World Factbook"},"pop":"5,6 milyon (2024 tahmini)"},"SVN":{"id":"SVN","ad":"Slovenya","g":"other","rel":{"rows":[["Hristiyan",74.0,""],["Dinsiz / ateist",18.0,""],["Müslüman",3.0,""],["Diğer / belirtilmemiş",5.0,""]],"yr":"2019","src":"CIA World Factbook"},"pop":"2,1 milyon (2024 tahmini)"},"SGP":{"id":"SGP","ad":"Singapur","g":"other","rel":{"rows":[["Budist",31.1,""],["Dinsiz / ateist",20.0,""],["Hristiyan",18.9,""],["Müslüman",15.6,""],["Taocu",8.8,""],["Hindu",5.0,""],["Diğer / belirtilmemiş",0.6,""]],"yr":"2020","src":"CIA World Factbook"},"pop":"6,1 milyon (2025 tahmini)"},"SLE":{"id":"SLE","ad":"Sierra Leone","g":"islam","rel":{"rows":[["Müslüman",77.1,""],["Hristiyan",22.9,""]],"yr":"2019","src":"CIA World Factbook"},"pop":"9,3 milyon (2025 tahmini)","cap":"Freetown","oz":"Batı Afrika'da, başşehri Freetown olan bir ülkedir. İslâm, XI. yüzyılda Müslüman tüccarlarla geldi; asıl yayılış XVIII. yüzyıldan itibaren oldu. Nüfusun çoğunluğu Sünnî Müslümandır.","tdv":"sierra-leone","uzun":["Sierra Leone, Batı Afrika'da Atlas Okyanusu kıyısında, yaklaşık 72 bin km² yüzölçümüne sahip bir ülkedir. Yağışlı tropikal iklim hâkimdir. Nüfusun yaklaşık dörtte üçü Müslümandır; başlıca etnik gruplar Temne ve Mende'dir.","Müslüman tüccarlar XI. yüzyılda bölgeye ulaştı; ancak İslâm'ın asıl yayılışı XVIII. yüzyıldan itibaren Mandingo, Susu ve Fulani gruplarının ticaret ve akrabalık bağlarıyla gerçekleşti. Bu dönemde Kur'an kursları ve medreseler yaygınlaştı.","İngiliz sömürgesi olan ülke 27 Nisan 1961'de bağımsızlığını kazandı; 1991-2002 yılları arasında yıkıcı bir iç savaş yaşadı. Bugün Yüksek İslâm Konseyi gibi kuruluşlar ve Ticâniyye ile Kādiriyye tarikatları faaliyetlerini sürdürür; Müslümanların çoğu Sünnî ve Mâlikî'dir."]},"SYC":{"id":"SYC","ad":"Seyşeller","g":"other","rel":{"rows":[["Hristiyan",90.2,""],["Hindu",2.4,""],["Müslüman",1.6,""],["Dinsiz / ateist",0.9,""],["Diğer / belirtilmemiş",4.8,""]],"yr":"2010","src":"CIA World Factbook"},"pop":"98 bin (2024 tahmini)"},"SRB":{"id":"SRB","ad":"Sırbistan","g":"other","rel":{"rows":[["Hristiyan",85.0,""],["Müslüman",4.2,""],["Dinsiz / ateist",1.1,""],["Diğer / belirtilmemiş",8.8,""]],"yr":"2022","src":"CIA World Factbook"},"pop":"6,7 milyon (2024 tahmini)"},"SEN":{"id":"SEN","ad":"Senegal","g":"islam","rel":{"rows":[["Müslüman",97.2,""],["Hristiyan",2.7,""]],"yr":"2019","src":"CIA World Factbook"},"pop":"18,8 milyon (2024 tahmini)","cap":"Dakar","oz":"Afrika'nın en batısında, başşehri Dakar olan bir ülkedir. İslâm, XI. yüzyılda Sahrâ'dan gelen Müslüman tüccarlar ve Tekrûr hükümdarının Müslüman olmasıyla yayıldı. Müslümanlar Mâlikîdir; Mürîdiyye, Ticâniyye ve Kādiriyye tarikatları güçlüdür.","tdv":"senegal","uzun":["Senegal, Afrika'nın en batısında Atlas Okyanusu kıyısında yer alan alçak ve düz bir ülkedir. En kalabalık topluluk Voloflardır. Nüfusun yüzde 95'ten fazlası Müslümandır.","İslâm'la ilk temas X-XI. yüzyıllarda Sahra üzerinden gelen Müslüman tüccarlar aracılığıyla gerçekleşti. Tekrûr hükümdarı Vâr Câbî'nin Müslüman olduğu rivayet edilir. Murâbıtlar hareketi ve ardından Kādiriyye'nin yayılması İslâm'ı ülkenin dört bir yanına ulaştırdı.","Fransa uzun bir rekabetten sonra bölgeye hâkim oldu ve dinî kurumlar üzerinde sıkı bir denetim kurdu. Senegal Eylül 1960'ta bağımsızlığını ilan etti.","XIX. yüzyılda güçlenen Ticâniyye ve Ahmed Bamba'nın kurduğu Mürîdiyye tarikatları dinî hayatta belirleyicidir. Ticâniyye'nin merkezi Tivaouane, Mürîdiyye'nin merkezi Tûbâ'dır. Halkın çoğunluğu Mâlikî mezhebine bağlıdır."]},"SAU":{"id":"SAU","ad":"Suudi Arabistan","g":"islam","rel":{"rows":[],"note":"İslâm resmî dindir. Vatandaşların tamamı Müslümandır (%85-90 Sünnî, %10-12 Şiî); yabancı işçiler arasında Hristiyan, Hindu, Budist ve diğer dinlerden kişiler bulunur.","src":"CIA World Factbook"},"pop":"36,5 milyon (2024 tahmini)","cap":"Riyad","oz":"Arap Yarımadası'nın büyük bölümünü kaplayan, Mekke ve Medine'nin bulunduğu ülkedir; başşehri Riyad'dır. Bugünkü devlet 1932'de Suudi Arabistan Krallığı adıyla ilan edildi. Nüfusun tamamına yakını Müslümandır; doğuda önemli bir Şiî nüfus yaşar.","tdv":"suudi-arabistan","sah":["ebu-bekir","omer","osman","hamza","musab","hatice","fatima","abbas","hasan","aise","osman-mazun","abdurrahman-avf","sad","ibn-abbas","meymune","fatima-esed","zeyneb-nebi","rukiyye","safiyye-am","hafsa","ummu-seleme","zeyneb-cahs","zeyneb-huzeyme","safiyye-huyey","mariye","halime","esad-zurare","ibn-mesud","suheyb","ebu-hureyre","ibn-cahs","hanzala","ibn-cubeyr","bedir","ibn-omer","esma","ibn-zubeyr"],"uzun":["Suudi Arabistan, Arap yarımadasının büyük bölümünü kaplayan, yaklaşık 2,15 milyon km² yüzölçümüne sahip bir ülkedir. Topraklarının büyük kısmı çöllerle kaplıdır. Hicaz bölgesindeki Mekke ve Medine, Haremeyn-i Şerîfeyn olarak İslâm'ın en kutsal şehirleridir.","İslâm'ın doğduğu bu topraklarda Hz. Peygamber'in vefatından sonra hilâfet merkezi Medine idi. 1517'den itibaren Haremeyn'in hizmeti Osmanlı padişahlarına geçti; Osmanlılar Mescid-i Harâm ve Mescid-i Nebevî'yi defalarca imar etti ve Hicaz Demiryolu'nu inşa etti. XVIII. yüzyılda Suud ailesi Muhammed b. Abdülvehhâb ile ittifak ederek Necid'de güç kazandı.","Abdülazîz b. Suûd 1902'de Riyad'ı aldı, 1926'da Hicaz'ı topraklarına kattı ve 1932'de Suudi Arabistan Krallığı'nı ilan etti. 1938'de bulunan petrol ülkeyi hızla zenginleştirdi ve büyük altyapı yatırımlarına imkân verdi.","Nüfusun tamamına yakını Müslümandır; doğu bölgesinde bir Şiî nüfus da bulunur. Her yıl milyonlarca Müslüman hac ve umre için Mekke ve Medine'ye gelir. Cennetü'l-Bakî, Cennetü'l-Muallâ ve Uhud şehidliği gibi sahâbe kabirleri bu topraklardadır."]},"STP":{"id":"STP","ad":"São Tomé ve Príncipe","g":"other","rel":{"rows":[["Hristiyan",67.3,""],["Dinsiz / ateist",21.2,""],["Yerel/geleneksel inançlar",2.3,""],["Diğer / belirtilmemiş",9.2,""]],"yr":"2012","src":"CIA World Factbook"},"pop":"224 bin (2024 tahmini)"},"SMR":{"id":"SMR","ad":"San Marino","g":"other","rel":{"rows":[],"note":"Roma Katolik.","src":"CIA World Factbook"},"pop":"35 bin (2025 tahmini)"},"WSM":{"id":"WSM","ad":"Samoa","g":"other","rel":{"rows":[["Hristiyan",94.2,""],["Dinsiz / ateist",0.2,""],["Diğer / belirtilmemiş",5.7,""]],"yr":"2016","src":"CIA World Factbook"},"pop":"210 bin (2025 tahmini)"},"VCT":{"id":"VCT","ad":"Saint Vincent ve Grenadinler","g":"other","rel":{"rows":[["Hristiyan",82.1,""],["Dinsiz / ateist",7.5,""],["Yerel/geleneksel inançlar",1.1,""],["Diğer / belirtilmemiş",9.4,""]],"yr":"2012","src":"CIA World Factbook"},"pop":"101 bin (2024 tahmini)"},"LCA":{"id":"LCA","ad":"Saint Lucia","g":"other","rel":{"rows":[["Hristiyan",90.4,""],["Dinsiz / ateist",5.9,""],["Yerel/geleneksel inançlar",1.9,""],["Diğer / belirtilmemiş",1.8,""]],"yr":"2010","src":"CIA World Factbook"},"pop":"168 bin (2025 tahmini)"},"KNA":{"id":"KNA","ad":"Saint Kitts ve Nevis","g":"other","rel":{"rows":[],"note":"Bu bölge için din dağılımı verisi bulunamadı.","src":""},"pop":"55 bin (2025 tahmini)"},"RWA":{"id":"RWA","ad":"Ruanda","g":"other","rel":{"rows":[["Hristiyan",92.2,""],["Dinsiz / ateist",3.0,""],["Müslüman",2.0,""],["Diğer / belirtilmemiş",3.0,""]],"yr":"20 da en büyük pay Gaznelilerindir. Müslümanların çoğunluğu Hanefî Sünnî, yaklaşık dörtte biri Şiîdir.","tdv":"pakistan","uzun":["Pakistan, Güney Asya'da Umman Denizi kıyısında yer alır; Hindistan, Çin, Afganistan ve İran ile komşudur. İndus nehri tarım ve ulaşım için hayati önemdedir. Halkın yaklaşık yüzde 97'si Müslümandır.","Bölge Hulefâ-yi Râşidîn döneminde İslâm'la tanıştı; Muhammed b. Kāsım 92 (711) yılında Sind'i fethetti. Bölgenin İslâmlaşmasında en büyük pay Gazneliler başta olmak üzere Türk devletlerine aittir. Lahor'daki Dâtâ Genc-bahş Hücvîrî gibi mutasavvıflar İslâm'ın halk arasında yayılmasında etkili oldu; Babürlüler döneminde Lahor Bâdşâhî Camii gibi büyük eserler yapıldı.","Muhammed İkbal 1930'da Hindistan Müslümanları için ayrı bir devlet fikrini açıkça dile getirdi; Muhammed Ali Cinnah önderliğindeki mücadele sonucunda Pakistan 14 Ağustos 1947'de kuruldu. İkbal ve Cinnah'ın Türkiye'ye ve Millî Mücadele'ye duyduğu sevgi iki ülke arasındaki kardeşliğin temellerindendir.","1973 anayasasıyla ülke İslâm cumhuriyeti olarak tanımlandı. Nüfusun büyük çoğunluğu Sünnî-Hanefî'dir, yaklaşık beşte biri Şiî'dir; Diyûbendî ve Berelvî gelenekleri ile binlerce medrese dinî hayatın temelini oluşturur."]},"OMN":{"id":"OMN","ad":"Umman","g":"islam","rel":{"rows":[["Müslüman",85.9,""],["Hristiyan",6.4,""],["Hindu",5.7,""],["Dinsiz / ateist",2.0,""]],"yr":"2020","src":"CIA World Factbook"},"pop":"4,0 milyon (2025 tahmini)","cap":"Maskat","oz":"Arap Yarımadası'nın güneydoğusunda, başşehri Maskat olan bir sultanlıktır. İslâm, Hz. Peygamber zamanında Ebû Zeyd el-Ensârî ve Amr b. Âs'ın bölgeye gönderilmesiyle yayıldı. Müslümanların yarısına yakını İbâzıyye mezhebine mensuptur.","tdv":"uman","uzun":["Umman, Arap yarımadasının güneydoğusunda, Umman Körfezi ve Hint Okyanusu kıyısında yer alan bir sultanlıktır. Topraklarının büyük bölümü çöldür ve nüfus kıyılarda toplanmıştır. Başşehri Maskat'tır.","Hz. Peygamber'in İslâm'a davet için gönderdiği Amr b. Âs ve Ebû Zeyd el-Ensârî, Umman'ın yöneticileri tarafından iyi karşılandı ve 8 (630) yılında İslâm bölgede yayılmaya başladı. Peygamber'in vefatından sonraki irtidat hareketleri Hz. Ebû Bekir döneminde bastırıldı.","Umman, İslâm tarihinde İbâzîliğin merkezi olarak bilinir; İbâzî imamlar asırlarca Nizvâ gibi merkezlerde yönetimi sürdürdü. XVI. yüzyılda Portekizliler kıyıları işgal ettiyse de XVII. yüzyılda kovuldular. XVIII. yüzyılın ortasında Bû Saîd hanedanı yönetime geldi ve Umman Doğu Afrika kıyılarına kadar uzanan bir deniz gücü oldu.","Bugün Bû Saîd hanedanından Sultan Heysem b. Târık tarafından yönetilen ülkenin ekonomisi büyük ölçüde petrole dayanır. Nüfusun çoğunluğu İbâzî, önemli bir kısmı Sünnî Müslümandır. Maskat'taki Sultan Kâbûs Camii ülkenin en büyük camisidir."]},"NOR":{"id":"NOR","ad":"Norveç","g":"other","rel":{"rows":[["Hristiyan",74.4,""],["Müslüman",3.1,""],["Diğer / belirtilmemiş",22.5,""]],"yr":"2021","src":"CIA World Factbook"},"pop":"5,5 milyon (2024 tahmini)"},"PRK":{"id":"PRK","ad":"Kuzey Kore","g":"other","rel":{"rows":[],"note":"Geleneksel olarak Budist ve Konfüçyüsçü; az sayıda Hristiyan ve Çondogyo inancına mensup vardır.","src":"CIA World Factbook"},"pop":"26,4 milyon (2025 tahmini)"},"NGA":{"id":"NGA","ad":"Nijerya","g":"other","rel":{"rows":[["Müslüman",53.5,""],["Hristiyan",45.9,""],["Diğer / belirtilmemiş",0.6,""]],"yr":"2018","src":"CIA World Factbook"},"pop":"244,3 milyon (2025 tahmini)"},"NER":{"id":"NER","ad":"Nijer","g":"islam","rel":{"rows":[["Müslüman",95.5,""],["Yerel/geleneksel inançlar",4.1,""],["Hristiyan",0.3,""],["Dinsiz / ateist",0.1,""]],"yr":"2020","src":"CIA World Factbook"},"pop":"27,3 milyon (2025 tahmini)","cap":"Niamey","oz":"Batı Afrika'nın en büyük ülkesi olan Nijer'in başşehri Niamey'dir. İslâm, 46/666'da Ukbe b. Nâfi'in Kavâr'ı almasıyla bölgeye girdi; kalıcı yayılış X. yüzyıldan itibaren oldu. Müslümanların tamamı Mâlikîdir.","tdv":"nijer","uzun":["Nijer, denize kıyısı olmayan ve Batı Afrika'nın en büyük ülkelerinden biridir. Topraklarının büyük bölümü çöldür; güneyde tropikal iklim hâkimdir. Nüfusun yüzde 95'ten fazlası Müslümandır.","Ukbe b. Nâfi' 46 (666) yılında Kavâr bölgesini fethetti; X. yüzyıldan itibaren İslâm Tevârikler aracılığıyla Sahra'da yayıldı. Songay Devleti ve Agadez XV-XVI. yüzyıllarda önemli kültür merkezleri oldu. Sokoto Halifeliği'nin kurucusu Osman dan Fodio'nun hareketi bölgenin İslâm kültürüne büyük katkı sağladı.","Fransız işgali 1904'te başladı ve hac yolculukları engellendi. Nijer 3 Ağustos 1960'ta bağımsızlığını kazandı; ardından Nijer İslâm Derneği ve İslâm İşbirliği Teşkilâtı'nın desteğiyle Say'daki İslâm Üniversitesi kuruldu. Müslümanların tamamına yakını Mâlikî mezhebine bağlıdır."]},"NIC":{"id":"NIC","ad":"Nikaragua","g":"other","rel":{"rows":[["Hristiyan",84.6,""],["Dinsiz / ateist",14.1,""],["Diğer / belirtilmemiş",1.4,""]],"yr":"2020","src":"CIA World Factbook"},"pop":"6,7 milyon (2025 tahmini)"},"NZL":{"id":"NZL","ad":"Yeni Zelanda","g":"other","rel":{"rows":[["Dinsiz / ateist",48.6,""],["Hristiyan",37.3,""],["Hindu",2.7,""],["Budist",1.1,""],["Diğer / belirtilmemiş",9.6,""]],"yr":"2018","src":"CIA World Factbook"},"pop":"5,2 milyon (2024 tahmini)"},"NIU":{"id":"NIU","ad":"Niue","g":"other","rel":{"rows":[["Hristiyan",21.2,""],["Dinsiz / ateist",3.7,""],["Diğer / belirtilmemiş",75.0,""]],"yr":"2017","src":"CIA World Factbook"},"pop":"2 bin (2024 tahmini)"},"COK":{"id":"COK","ad":"Cook Adaları","g":"other","rel":{"rows":[["Hristiyan",79.9,""],["Dinsiz / ateist",15.6,""],["Diğer / belirtilmemiş",4.5,""]],"yr":"2021","src":"CIA World Factbook"},"pop":"8 bin (2025 tahmini)"},"NLD":{"id":"NLD","ad":"Hollanda","g":"other","rel":{"rows":[["Dinsiz / ateist",54.1,""],["Hristiyan",34.9,""],["Müslüman",5.0,""],["Diğer / belirtilmemiş",5.9,""]],"yr":"2019","src":"CIA World Factbook"},"pop":"17,8 milyon (2025 tahmini)"},"ABW":{"id":"ABW","ad":"Aruba","g":"other","rel":{"rows":[["Hristiyan",81.9,""],["Dinsiz / ateist",5.5,""],["Diğer / belirtilmemiş",12.5,""]],"yr":"201 oyundan gelen İdrîs b. Abdullah 788'de İdrîsî Devleti'ni kurdu; oğlu II. İdrîs döneminde Fas şehri başşehir oldu. Fas'taki Karaviyyîn Camii ve Üniversitesi dünyanın hâlâ faaliyette olan en eski eğitim kurumlarından biri kabul edilir.","Murâbıtlar Merakeş'i başşehir yaparak bölgeyi birleştirdi; ardından Muvahhidler, Merînîler, Vattâsîler ve Sa'dîler hüküm sürdü. Bugün de iktidarda olan Alevî (Filâlî) şerifler hanedanı XVII. yüzyılda yönetime geldi. Fas, Osmanlı hâkimiyetine girmeyen tek Kuzey Afrika ülkesidir.","1956'da Fransız ve İspanyol himayesinden kurtularak bağımsızlığını kazanan Fas bugün anayasal monarşiyle yönetilir. Halkın neredeyse tamamı Sünnî ve Mâlikî'dir; Şâzeliyye, Ticâniyye ve Nâsıriyye gibi tarikatlar dinî hayatta önemli yer tutar."]},"SAH":{"id":"SAH","ad":"Batı Sahra","g":"islam","rel":{"rows":[],"note":"Müslüman.","src":"CIA World Factbook"},"pop":"652 bin (2020 tahmini)","cap":"Layun"},"MNE":{"id":"MNE","ad":"Karadağ","g":"other","rel":{"rows":[["Hristiyan",75.5,""],["Müslüman",19.1,""],["Dinsiz / ateist",1.2,""],["Diğer / belirtilmemiş",4.1,""]],"yr":"2011","src":"CIA World Factbook"},"pop":"600 bin (2024 tahmini)"},"MNG":{"id":"MNG","ad":"Moğolistan","g":"other","rel":{"rows":[["Budist",51.8,""],["Dinsiz / ateist",40.6,""],["Müslüman",3.2,""],["Yerel/geleneksel inançlar",2.5,""],["Hristiyan",1.3,""],["Diğer / belirtilmemiş",0.6,""]],"yr":"2020","src":"CIA World Factbook"},"pop":"3,3 milyon (2024 tahmini)"},"MDA":{"id":"MDA","ad":"Moldova","g":"other","rel":{"rows":[["Hristiyan",92.7,""],["Dinsiz / ateist",0.3,""],["Diğer / belirtilmemiş",7.0,""]],"yr":"2014","src":"CIA World Factbook"},"pop":"3,6 milyon (2025 tahmini)"},"MCO":{"id":"MCO","ad":"Monako","g":"other","rel":{"rows":[["Hristiyan",90.0,""],["Diğer / belirtilmemiş",10.0,""]],"yr":"","src":"CIA World Factbook"},"pop":"32 bin (2025 tahmini)"},"MEX":{"id":"MEX","ad":"Meksika","g":"other","rel":{"rows":[["Hristiyan",86.4,""],["Dinsiz / ateist",10.6,""]],"yr":"2020","src":"CIA World Factbook"},"pop":"130,7 milyon (2024 tahmini)"},"MUS":{"id":"MUS","ad":"Mauritius","g":"other","rel":{"rows":[["Hindu",48.5,""],["Hristiyan",32.7,""],["Müslüman",17.3,""],["Dinsiz / ateist",0.7,""],["Diğer / belirtilmemiş",0.7,""]],"yr":"2011","src":"CIA World Factbook"},"pop":"1,3 milyon (2025 tahmini)"},"MRT":{"id":"MRT","ad":"Moritanya","g":"islam","rel":{"rows":[["Müslüman",100.0,""]],"yr":"","src":"CIA World Factbook"},"pop":"5,2 milyon (2025 tahmini)","cap":"Nuakşot","oz":"Afrika'nın kuzeybatısında, başşehri Nuakşot olan bir İslâm ülkesidir. Berberî kabileleri zamanla Müslüman oldu; Murâbıtların kurucusu Abdullah b. Yâsîn bölgede Mâlikî mezhebini yerleştirdi. Halkın yaklaşık %99'u Sünnî Müslümandır.","tdv":"moritanya","uzun":["Moritanya, Afrika'nın kuzeybatısında yer alır ve topraklarının büyük bölümü Büyük Sahra'nın çöllerinden oluşur. Halkın neredeyse tamamı Sünnî Müslümandır; resmî adı Moritanya İslâm Cumhuriyeti'dir.","İslâm'ın bölgeye girişi VIII. yüzyıldaki ticarî ilişkilerle başladı. Murâbıt hareketinin kurucusu Abdullah b. Yâsîn'in çabalarıyla Berberî kabileleri kısa sürede Müslüman oldu ve Mâlikî mezhebi buradan bütün Batı Afrika'ya yayıldı.","Fransızlar 1854'ten itibaren bölgeye girdi ve XX. yüzyılın başında iç kesimlere hâkim oldu. Moritanya 28 Kasım 1960'ta bağımsızlığını ilan etti.","Şinkît (Chinguetti) şehri asırlarca hac kervanlarının durağı ve ilim merkezi oldu; Moritanyalı âlimler İslâm dünyasında \"Şenâkıta\" adıyla tanınır. Kādiriyye, Şâzeliyye ve Ticâniyye tarikatları yaygındır; çöl medreselerindeki (mahdara) Kur'an ve fıkıh eğitimi bugün de sürmektedir."]},"MLT":{"id":"MLT","ad":"Malta","g":"other","rel":{"rows":[["Hristiyan",90.0,""],["Verisi yok / belirtilmemiş",10.0,""]],"yr":"2006","src":"CIA World Factbook"},"pop":"522 bin (2025 tahmini)"},"MLI":{"id":"MLI","ad":"Mali","g":"islam","rel":{"rows":[["Müslüman",93.9,""],["Hristiyan",2.8,""],["Dinsiz / ateist",2.5,""],["Yerel/geleneksel inançlar",0.7,""]],"yr":"2018","src":"CIA World Factbook"},"pop":"22,6 milyon (2025 tahmini)","cap":"Bamako","oz":"Batı Afrika'da denize kıyısı olmayan, başşehri Bamako olan bir ülkedir. İslâm, Gana İmparatorluğu döneminde Arap ve Berberî Müslümanlarla geldi; Timbuktu büyük bir ilim merkezi oldu. Nüfusun yaklaşık %90'ı Müslümandır.","tdv":"mali","uzun":["Mali, Batı Afrika'da denize kıyısı olmayan bir ülkedir; kuzeyi çöl, güneyi savan ve bozkırdır. Nijer nehri ülkenin hayat kaynağıdır. Bambara, Malinke, Songay ve Fulani gibi pek çok etnik grup yaşar ve halkın büyük çoğunluğu Müslümandır.","İslâm, Gana İmparatorluğu döneminde Kuzey Afrikalı tüccarlar ve Murâbıtlar aracılığıyla bölgeye ulaştı. Mali İmparatorluğu'nun hükümdarı Mansa Mûsâ 1324'te yaptığı hac yolculuğunda taşıdığı altınlarla Kahire ve Hicaz'da büyük ün kazandı. Songay döneminde Timbuktu, Sankore Camii ve medreseleri ile Batı Afrika'nın en önemli ilim merkezi oldu.","Fransızlar XIX. yüzyılın sonlarında bölgeyi ele geçirdi; Mali 1960'ta bağımsızlığını ilan etti. Bağımsızlıktan sonra darbeler ve siyasî değişimler yaşandı.","Ulemâ, Mali tarihinde büyük saygı görmüştür; Kādiriyye ve Ticâniyye tarikatları geniş bir etki alanına sahiptir. Timbuktu'nun yazma eserleri İslâm ilim mirasının değerli hazineleri arasındadır. Halkın çoğunluğu Mâlikî mezhebine bağlıdır."]},"MDV":{"id":"MDV","ad":"Maldivler","g":"islam","rel":{"rows":[],"note":"Sünnî Müslüman; İslâm resmî dindir.","src":"CIA World Factbook"},"pop":"389 bin (2024 tahmini)","cap":"Male","oz":"Hint Okyanusu'nda yaklaşık 2000 adadan oluşan bir ülkedir. İslâm, Müslüman tüccar ve denizcilerle geldi ve XII. yüzyıldan itibaren genişçe yayıldı. Halkın tamamı Şâfiî Sünnî Müslümandır.","tdv":"maldivler","uzun":["Maldivler, Hint Okyanusu'nun kuzeyinde, Sri Lanka'nın güneybatısında yaklaşık iki bin adadan oluşan bir ülkedir. Adalar alçaktır; en yüksek nokta yalnızca birkaç metredir. Başşehri Male'dir.","Geleneğe göre Budist hükümdar 548 (1153) yılında Müslüman oldu ve halkı da İslâm'ı kabul etti. Bu süreçte Mağribli âlim Ebü'l-Berekât el-Berberî'nin faaliyetleri öne çıkar; kabri Male'de ziyaret edilir. Sultanlık yönetimi asırlarca sürdü.","1965'te İngiltere'den tam bağımsızlığını kazanan ülke 1968'de cumhuriyet oldu. Vatandaşların tamamı Sünnî ve Şâfiî'dir; anayasaya göre vatandaş olabilmek için Müslüman olmak gerekir."]},"MYS":{"id":"MYS","ad":"Malezya","g":"islam","rel":{"rows":[["Müslüman",63.5,""],["Budist",18.7,""],["Hristiyan",9.1,""],["Hindu",6.1,""],["Dinsiz / ateist",1.8,""],["Diğer / belirtilmemiş",0.9,""]],"yr":"2020","src":"CIA World Factbook"},"pop":"34,9 milyon (2025 tahmini)","cap":"Kuala Lumpur","oz":"Malay Yarımadası ve Borneo'nun kuzeyinde kurulmuş federal bir devlettir. İslâm, ticaret yoluyla Sumatra'dan Malaka'ya ulaştı ve diğer Malay krallıkları da Müslüman oldu. Müslümanların tamamı Sünnî ve Şâfiîdir.","tdv":"malezya","uzun":["Malezya, Malay yarımadası ile Borneo adasının kuzeyinde kurulu federal bir devlettir; başşehri Kuala Lumpur'dur. Halkın yarıdan fazlasını Malaylar oluşturur; Çinliler ve Hintliler önemli azınlıklardır.","İslâm, Sumatra'daki Pasai üzerinden gelen Müslüman tüccarlarla Malay yarımadasına ulaştı. XV. yüzyılda Malaka Sultanlığı güçlü bir ticaret devleti ve Güneydoğu Asya'nın önemli bir İslâm merkezi oldu. Portekizliler 1511'de Malaka'yı ele geçirse de sultanlığın dinî ve kültürel etkisi Malay devletlerinde sürdü.","İngiliz sömürge yönetiminde sultanların yetkileri büyük ölçüde din ve Malay gelenekleriyle sınırlandı. 1957'de Malaya Federasyonu bağımsız oldu ve 1963'te Malezya adını aldı.","Malezya'nın resmî dini İslâm'dır ve Malayların tamamı Müslümandır; çoğunluk Şâfiî mezhebine bağlıdır. Din işleri eyalet sultanları, müftüler ve din işleri konseyleri aracılığıyla yürütülür; Uluslararası İslâm Üniversitesi gibi kurumlar İslâm dünyasının önemli eğitim merkezlerindendir."]},"MWI":{"id":"MWI","ad":"Malavi","g":"other","rel":{"rows":[["Hristiyan",77.3,""],["Müslüman",13.8,""],["Dinsiz / ateist",2.1,""],["Yerel/geleneksel inançlar",1.1,""],["Diğer / belirtilmemiş",5.6,""]],"yr":"2018","src":"CIA World Factbook"},"pop":"21,8 milyon (2024 tahmini)"},"MDG":{"id":"MDG","ad":"Madagaskar","g":"other","rel":{"rows":[["Hristiyan",74.4,""],["Dinsiz / ateist",21.9,""],["Yerel/geleneksel inançlar",1.7,""],["Müslüman",1.4,""],["Diğer / belirtilmemiş",0.6,""]],"yr":"2021","src":"CIA World Factbook"},"pop":"31,3 milyon (2025 tahmini)"},"MKD":{"id":"MKD","ad":"Kuzey Makedonya","g":"other","rel":{"rows":[["Hristiyan",59.3,""],["Müslüman",32.2,""],["Diğer / belirtilmemiş",8.2,""]],"yr":"2021","src":"CIA World Factbook"},"pop":"2,1 milyon (2025 tahmini)"},"LUX":{"id":"LUX","ad":"Lüksemburg","g":"other","rel":{"rows":[["Hristiyan",70.6,""],["Dinsiz / ateist",26.7,""],["Müslüman",2.3,""],["Diğer / belirtilmemiş",0.4,""]],"yr":"2020","src":"CIA World Factbook"},"pop":"671 bin (2024 tahmini)"},"LTU":{"id":"LTU","ad":"Litvanya","g":"other","rel":{"rows":[["Hristiyan",78.7,""],["Dinsiz / ateist",6.1,""],["Diğer / belirtilmemiş",15.2,""]],"yr":"2021","src":"CIA World Factbook"},"pop":"2,8 milyon (2025 tahmini)"},"LIE":{"id":"LIE","ad":"Lihtenştayn","g":"other","rel":{"rows":[["Hristiyan",83.2,""],["Dinsiz / ateist",7.0,""],["Müslüman",5.9,""],["Diğer / belirtilmemiş",4.1,""]],"yr":"2015","src":"CIA World Factbook"},"pop":"41 bin (2025 tahmini)"},"LBY":{"id":"LBY","ad":"Libya","g":"islam","rel":{"rows":[["Müslüman",96.6,""],["Hristiyan",2.7,""],["Budist",0.5,"<1"],["Hindu",0.5,"<1"],["Yahudi",0.5,"<1"],["Yerel/geleneksel inançlar",0.5,"<1"],["Dinsiz / ateist",0.5,"<1"],["Diğer / belirtilmemiş",0.5,"<1"]],"yr":"2020","src":"CIA World Factbook"},"pop":"7,4 milyon (2024 tahmini)","cap":"Trablus","oz":"Akdeniz kıyısında, Afrika'nın en büyük ülkelerinden biridir. İslâm, Amr b. Âs'ın Mısır fethinin ardından 21/642'de bölgeye girdi; Berberîler Mûsâ b. Nusayr döneminde Müslüman oldu. Müslümanların çoğu Mâlikîdir.","tdv":"libya","sah":["ruveyfi"],"uzun":["Libya, Kuzey Afrika'da Akdeniz kıyısında yer alır ve yüzölçümü bakımından Afrika'nın büyük ülkelerindendir. Topraklarının büyük bölümü çöldür; nüfus sahil şeridinde yoğunlaşmıştır. Halkın tamamına yakını Müslümandır.","Hz. Ömer döneminde Amr b. Âs Mısır'dan sonra Berka'yı ve Trablus'u fethetti. Kuzey Afrika'da İslâm hâkimiyetinin kalıcı hâle gelmesi Ukbe b. Nâfi' gibi komutanların çabalarıyla gerçekleşti. Rüveyfi' b. Sâbit el-Ensârî gibi sahâbîler bu topraklarda medfundur.","Turgut Reis 1551'de Trablus'u alarak bölgeyi Osmanlı eyaleti yaptı. 1911'de İtalya'nın saldırısıyla başlayan savaşa Mustafa Kemal ve Enver gibi Osmanlı subayları katıldı; 1912'de Osmanlı askerleri çekildi. Senûsî tarikatı ve Ömer Muhtar önderliğindeki direniş yirmi yıl sürdü; Ömer Muhtar 1931'de İtalyanlar tarafından idam edildi.","Libya 1951'de Kral İdris es-Senûsî önderliğinde bağımsız oldu; 1969 darbesiyle monarşi sona erdi ve 2011'den beri ülke istikrarsızlıkla mücadele etmektedir. Dinî hayatta Mâlikî mezhebi hâkimdir; Osmanlı döneminde Hanefîlik de yayıldı, Cebel-i Nefûsa'da İbâzîler yaşar."]},"LBR":{"id":"LBR","ad":"Liberya","g":"other","rel":{"rows":[["Hristiyan",84.9,""],["Müslüman",12.0,""],["Dinsiz / ateist",2.6,""],["Yerel/geleneksel inançlar",0.5,""],["Diğer / belirtilmemiş",0.1,""]],"yr":"2022","src":"CIA World Factbook"},"pop":"5,6 milyon (2025 tahmini)"},"LSO":{"id":"LSO","ad":"Lesotho","g":"other","rel":{"rows":[["Hristiyan",97.6,""],["Dinsiz / ateist",2.3,""]],"yr":"2014","src":"CIA World Factbook"},"pop":"2,2 milyon (2025 tahmini)"},"LBN":{"id":"LBN","ad":"Lübnan","g":"islam","rel":{"rows":[["Müslüman",67.8,""],["Hristiyan",32.4,""]],"yr":"2020","src":"CIA World Factbook"},"pop":"5,4 milyon (2024 tahmini)","cap":"Beyrut","oz":"Akdeniz kıyısında, Suriye ile komşu bir ülkedir. Yermük Savaşı'ndan sonra Hz. Ömer döneminde İslâm topraklarına katıldı. Ülkede Sünnî ve Şiî Müslümanlar, Dürzîler ve çeşitli Hristiyan cemaatler bir arada yaşar.","tdv":"lubnan","uzun":["Lübnan, Akdeniz kıyısında, kuzeyi ve doğusu Suriye ile çevrili küçük bir ülkedir. Dağlık yapısı, farklı dinî ve mezhebî toplulukların ayrı bölgelerde yaşamasına imkân vermiştir.","Hz. Ömer döneminde başlayan fetihlerle bölge İslâm topraklarına katıldı; Emevîler sahil şehirlerine Müslümanları yerleştirdi. Bölge sırasıyla Abbâsîler, Fâtımîler, Haçlılar ve Memlükler tarafından yönetildi; Memlükler döneminde Sünnîlik güçlendi.","1516'da Osmanlı yönetimine giren Lübnan, yerel emirlikler eliyle idare edildi. 1860 olaylarından sonra 1861'de özel bir mutasarrıflık statüsü verildi ve bu yönetim 1915'e kadar sürdü.","Fransız mandasından sonra 1943'te bağımsız olan Lübnan, 1975-1990 arasında uzun bir iç savaş yaşadı. Siyasî sistem mezhep esaslı bir paylaşıma dayanır. Nüfusun yarıdan fazlası Müslüman (Sünnî ve Şiî), geri kalanı ağırlıkla Mârûnî ve diğer Hristiyanlar ile Dürzîlerdir."]},"LVA":{"id":"LVA","ad":"Letonya","g":"other","rel":{"rows":[["Hristiyan",76.4,""],["Dinsiz / ateist",23.5,""],["Diğer / belirtilmemiş",0.1,""]],"yr":"2017","src":"CIA World Factbook"},"pop":"1,9 milyon (2025 tahmini)"},"LAO":{"id":"LAO","ad":"Laos","g":"other","rel":{"rows":[["Budist",64.7,""],["Dinsiz / ateist",31.4,""],["Hristiyan",1.7,""],["Diğer / belirtilmemiş",2.1,""]],"yr":"2015","src":"CIA World Factbook"},"pop":"8,0 milyon (2024 tahmini)"},"KGZ":{"id":"KGZ","ad":"Kırgızistan","g":"turk","rel":{"rows":[["Müslüman",90.0,""],["Hristiyan",7.0,""],["Diğer / belirtilmemiş",3.0,""]],"yr":"2017","src":"CIA World Factbook"},"pop":"6,2 milyon (2025 tahmini)","cap":"Bişkek","oz":"Kazakistan, Özbekistan, Tacikistan ve Çin arasında dağlık bir Türk cumhuriyetidir. İslâm, VIII. yüzyılda Fergana fetihleriyle bölgeye ulaştı; Karahanlılar döneminde ve tasavvufun etkisiyle yayıldı. Kırgızlar Hanefî mezhebine bağlı Sünnî Müslümandır.","tdv":"kirgizistan","uzun":["Kırgızistan, Kazakistan, Özbekistan, Tacikistan ve Doğu Türkistan ile çevrili, büyük ölçüde dağlık bir ülkedir. Tanrı Dağları'nın yüksek zirveleri nedeniyle \"Asya'nın İsviçresi\" diye anılır. Nüfusun çoğunluğunu Kırgız Türkleri oluşturur.","İslâm, VIII. yüzyılda Fergana fetihleriyle Kırgızlar arasında yayılmaya başladı. Karahanlılar döneminde Balasagun ve Özkent gibi şehirler önemli merkezler oldu; Kutadgu Bilig'in yazarı Yûsuf Has Hâcib Balasagunludur. Daha sonra tasavvufun etkisiyle İslâm bozkır kabileleri arasında da yaygınlaştı ve Kırgızlar Hanefî mezhebine bağlandı.","XVIII. yüzyılda Hokand Hanlığı'nın hâkimiyetine giren Kırgızlar, XIX. yüzyılda Rus işgaline karşı Kurbancan Datha önderliğinde direndi. 1936'da Sovyetler Birliği'ne bağlı bir cumhuriyet oldu ve dinî hayat uzun yıllar baskı altında kaldı.","31 Ağustos 1991'de bağımsızlığını kazanan Kırgızistan'da Kırgızlar, Özbekler ve Uygurlar çoğunlukla Sünnî-Hanefî Müslümandır. Bağımsızlıktan sonra cami sayısı hızla arttı; Oş'taki Süleyman Dağı ve Özkent'teki Karahanlı eserleri önemli ziyaret yerleridir."]},"KWT":{"id":"KWT","ad":"Kuveyt","g":"islam","rel":{"rows":[["Müslüman",74.6,""],["Hristiyan",18.2,""],["Diğer / belirtilmemiş",7.2,""]],"yr":"2013","src":"CIA World Factbook"},"pop":"3,2 milyon (2025 tahmini)","cap":"Kuveyt","oz":"Basra Körfezi'nin kuzeybatı kıyısında bir Arap devletidir. 633'te Hâlid b. Velîd bu yörede Sâsânî kuvvetlerini yendi. Resmî din İslâm'dır.","tdv":"kuveyt","uzun":["Kuveyt, Basra Körfezi'nin kuzeybatı köşesinde, yaklaşık 17.818 km² yüzölçümüne sahip bir Arap devletidir. Sıcak ve kurak çöl iklimi hâkimdir ve içme suyu denizden arıtılarak sağlanır.","XVIII. yüzyılda bir liman şehri olarak gelişen Kuveyt'te Utub kabilesinin Âl-i Sabâh kolu yönetimi ele geçirdi. Petrolün 1938'de bulunmasıyla yoksul bir bölge zengin bir refah devletine dönüştü.","Kuveyt bir dönem Osmanlı'nın Basra vilayetine bağlı bir kazaydı; Şeyh Mübârek es-Sabâh'ın 1899'da İngiltere ile antlaşma yapmasıyla İngiliz himayesine girdi. 19 Haziran 1961'de bağımsızlığını kazandı; Irak'ın 2 Ağustos 1990'daki işgali Körfez Savaşı ile sona erdi.","Resmî din İslâm, resmî dil Arapçadır. Vatandaşların çoğunluğu Sünnî, önemli bir kısmı Şiî Müslümandır. Kuveyt Büyük Camii ve ülkenin hayır kurumları İslâm dünyasındaki yardım faaliyetleriyle tanınır."]},"KOS":{"id":"KOS","ad":"Kosova","g":"islam","rel":{"rows":[["Müslüman",95.6,""],["Hristiyan",3.7,""],["Dinsiz / ateist",0.1,""],["Diğer / belirtilmemiş",0.7,""]],"yr":"2011","src":"CIA World Factbook"},"pop":"2,0 milyon (2024 tahmini)","cap":"Priştine","oz":"Balkanların ortasında, başşehri Priştine olan bir ülkedir. 1389 Kosova Savaşı'ndan sonra Osmanlı hâkimiyeti güçlendi ve 1455'te Fâtih Sultan Mehmed bölgenin tamamını aldı. Müslümanların çoğu Arnavut, önemli bir kısmı Türktür.","tdv":"kosova","uzun":["Kosova, Balkan yarımadasının ortasında, dağlarla çevrili verimli bir ovada yer alır. Nüfusun büyük çoğunluğunu Arnavutlar oluşturur; Sırplar, Türkler, Boşnaklar ve Romanlar da yaşar.","1389 Kosova Savaşı'nda Osmanlılar, Sırp Kralı Lazar öncülüğündeki Haçlı ittifakını yendi ve Balkanlar'da kalıcı olarak yerleşti. Savaşın sonunda şehid düşen Sultan I. Murad'ın iç organlarının defnedildiği yer \"Meşhed-i Hudâvendigâr\" adıyla bugün de ziyaret edilmektedir. 1455'te Fatih Sultan Mehmed döneminde Kosova'nın tamamı Osmanlı idaresine girdi.","Yugoslavya döneminde bölgenin nüfus yapısı değiştirildi; 1919-1941 arasında ve 1953 sonrasında çok sayıda Müslüman Türkiye'ye göç etti. 1974 anayasasıyla tanınan özerklik 1989'da kaldırıldı. 1999'daki savaş ve NATO müdahalesinden sonra bölge BM yönetimine girdi ve Kosova 17 Şubat 2008'de bağımsızlığını ilan etti.","Osmanlı döneminden kalan vakıf eserlerinin büyük kısmı cami ve mescidlerdir; savaş sırasında birçok cami, medrese ve tekke tahrip edildi. Priştine'deki Fatih Camii ve Prizren'deki Sinan Paşa Camii bu mirasın en önemli örneklerindendir. Halkın büyük çoğunluğu Sünnî-Hanefî Müslümandır."]},"KIR":{"id":"KIR","ad":"Kiribati","g":"other","rel":{"rows":[["Hristiyan",96.2,""],["Bahâî",2.1,""],["Diğer / belirtilmemiş",1.7,""]],"yr":"2020","src":"CIA World Factbook"},"pop":"117 bin (2024 tahmini)"},"KEN":{"id":"KEN","ad":"Kenya","g":"other","rel":{"rows":[["Hristiyan",85.5,""],["Müslüman",10.9,""],["Dinsiz / ateist",1.6,""],["Diğer / belirtilmemiş",2.0,""]],"yr":"2019","src":"CIA World Factbook"},"pop":"55,8 milyon (2025 tahmini)"},"KAZ":{"id":"KAZ","ad":"Kazakistan","g":"turk","rel":{"rows":[["Müslüman",69.3,""],["Hristiyan",17.2,""],["Dinsiz / ateist",2.3,""],["Budist",0.1,""],["Diğer / belirtilmemiş",11.1,""]],"yr":"2021","src":"CIA World Factbook"},"pop":"20,4 milyon (2025 tahmini)","cap":"Astana","oz":"Kuzeyde Rusya, doğuda Çin ile komşu, başşehri Astana olan geniş bir Türk cumhuriyetidir. Araplar 893'te Tarâz'ı aldıklarında şehrin büyük kilisesini camiye çevirdiler; X. yüzyılda bölgede birçok İslâmî külliye bulunuyordu. Kazaklar Sünnî-Hanefî Müslümandır; ülkede kalabalık bir Rus Ortodoks nüfus da yaşar.","tdv":"kazakistan","uzun":["Kazakistan, yaklaşık 2,7 milyon km² yüzölçümüyle dünyanın en büyük kara ülkelerinden biridir; kuzeyde Rusya, doğuda Çin, güneyde Özbekistan ve Kırgızistan, batıda Hazar Denizi ile çevrilidir. Topraklarının büyük kısmı bozkırlardan oluşur ve kara iklimi hâkimdir. Kazak Türkleri bugün nüfusun çoğunluğunu oluşturur.","Bölgede İslâm, Arap fetihleri ve Karahanlılarla yayıldı; 893'te alınan Taraz'da kilise camiye çevrildi ve X. yüzyılda şehirde birçok İslâmî yapı bulunuyordu. Türkistan (Yesi) şehrinde Timur'un yaptırdığı Hoca Ahmed Yesevî Türbesi, Türk dünyasının en önemli manevî merkezlerinden biridir.","Moğol hâkimiyetinden sonra Kazak Hanlığı kuruldu; Tevekkel Han Taşkent ve Semerkant'a kadar ilerledi, Tavke Han \"Jeti Jargı\" adlı kanunları yazıya geçirdi. XVIII-XIX. yüzyıllarda Kazaklar Jungarlar ve Ruslarla mücadele etti ve bölge giderek Rus hâkimiyetine girdi. Sovyet döneminde camiler kapatıldı ve din karşıtı politikalar uygulandı.","16 Aralık 1991'de bağımsızlığını ilan eden Kazakistan laik bir devlettir. Bağımsızlıktan sonra yüzlerce cami açıldı ve Müslümanlar Dinî İdaresi kuruldu; Astana'daki büyük camiler bunun simgesidir. Halkın çoğunluğu Sünnî-Hanefî Müslümandır."]},"JOR":{"id":"JOR","ad":"Ürdün","g":"islam","rel":{"rows":[["Müslüman",97.1,""],["Hristiyan",2.1,""],["Budist",0.4,""],["Hindu",0.1,""],["Yahudi",0.1,"<0,1"],["Yerel/geleneksel inançlar",0.1,"<0,1"],["Dinsiz / ateist",0.1,"<0,1"],["Diğer / belirtilmemiş",0.1,"<0,1"]],"yr":"2020","src":"CIA World Factbook"},"pop":"11,3 milyon (2025 tahmini)","cap":"Amman","oz":"Suriye, Irak, Suudi Arabistan ve Filistin arasında bir İslâm ülkesidir. Bölgeye İslâm, 8/629'da Kerek yakınlarındaki Mûte Savaşı'yla girdi; Fihl ve Yermük zaferleriyle tamamen İslâm topraklarına katıldı. Nüfusun %90'dan fazlası Sünnî Müslümandır.","tdv":"urdun","sah":["ebu-ubeyde","muaz","surahbil","dirar","zeyd-harise","cafer","revaha","amir-vakkas"],"uzun":["Ürdün, kuzeyde Suriye, doğuda Irak, güneyde Suudi Arabistan, batıda Filistin ile çevrilidir ve Kızıldeniz'e kısa bir kıyısı vardır. Nüfusun büyük bölümü kuzeybatıda yaşar; doğu ve güney çölleri seyrek yerleşimlidir.","Müslümanların Bizans'la ilk büyük karşılaşması 8 (629) yılında Kerek yakınlarındaki Mûte'de gerçekleşti; bu savaşta Zeyd b. Hârise, Ca'fer-i Tayyâr ve Abdullah b. Revâha şehid düştü ve kabirleri el-Mezâr'dadır. Ecnâdeyn, Fihl ve Yermük zaferleriyle Ürdün tamamen İslâm topraklarına katıldı. Ebû Ubeyde b. Cerrâh, Muâz b. Cebel ve Dırâr b. Ezver gibi sahâbîler de Şeria vadisinde medfundur.","Osmanlı Devleti 1516'da Ürdün'ü topraklarına kattı; bölge hac yolunun güvenliği bakımından önem taşıyordu. Osmanlı yönetimi 1918'de sona erdi.","1946'da İngiliz mandasının sona ermesiyle bağımsız olan ülke 1949'da Ürdün Hâşimî Krallığı adını aldı. Halkın yüzde 90'dan fazlası Sünnî Müslümandır. Ülkedeki sahâbe ve peygamber kabirleri İslâm dünyasının dört bir yanından ziyaretçi çeker."]},"JPN":{"id":"JPN","ad":"Japonya","g":"other","rel":{"rows":[["Şinto",48.6,""],["Budist",46.4,""],["Hristiyan",1.1,""],["Diğer / belirtilmemiş",4.0,""]],"yr":"2021","src":"CIA World Factbook"},"pop":"123,2 milyon (2024 tahmini)"},"JAM":{"id":"JAM","ad":"Jamaika","g":"other","rel":{"rows":[["Hristiyan",68.9,""],["Dinsiz / ateist",21.3,""],["Yerel/geleneksel inançlar",1.1,""],["Diğer / belirtilmemiş",8.8,""]],"yr":"2011","src":"CIA World Factbook"},"pop":"2,9 milyon (2025 tahmini)"},"ITA":{"id":"ITA","ad":"İtalya","g":"other","rel":{"rows":[["Hristiyan",80.8,""],["Dinsiz / ateist",13.4,""],["Müslüman",4.9,""],["Diğer / belirtilmemiş",0.9,""]],"yr":"2020","src":"CIA World Factbook"},"pop":"60,9 milyon (2025 tahmini)"},"PSX":{"id":"PSX","ad":"Filistin","g":"islam","rel":{"parts":[{"label":"Batı Şeria","rows":[["Müslüman",82.5,"80–85"],["Yahudi",13.0,"12–14"],["Hristiyan",1.8,"1–2,5"],["Diğer / belirtilmemiş",0.5,"<1"]],"yr":"2012"},{"label":"Gazze","rows":[["Müslüman",98.5,"98,0–99,0"],["Hristiyan",0.5,"<1,0"],["Diğer / belirtilmemiş",0.5,"<1,0"]],"yr":"2012"}],"src":"CIA World Factbook"},"pop":"","cap":"Kudüs","oz":"Akdeniz'in güneydoğu ucunda, üç büyük dinin kutsal yerlerini barındıran tarihî bölgedir. Ecnâdeyn ve Yermük zaferlerinden sonra Hz. Ömer Kudüs'ü barış yoluyla teslim aldı. Mescid-i Aksâ'nın bulunduğu bu topraklar, Müslümanların ilk kıblesidir.","tdv":"filistin","sah":["ubade","seddad","temim"],"uzun":["Filistin, Akdeniz'in güneydoğu ucunda, Asya ile Afrika arasında köprü konumunda tarihî bir bölgedir. Kıyı şeridi, ortadaki dağlık yayla ve doğudaki Şeria vadisinden oluşur. Kudüs ve Müslümanların ilk kıblesi Mescid-i Aksâ bu topraklardadır; Hz. Peygamber'in İsrâ ve Mi'rac yolculuğu burada gerçekleşmiştir.","Hz. Ömer döneminde Kudüs, Patrik Sophronios ile yapılan antlaşma sonucunda barış yoluyla teslim alındı ve Hz. Ömer şehre bizzat geldi. Emevîler döneminde Kubbetü's-Sahre ve Mescid-i Aksâ inşa edildi. 1099'da Haçlılar Kudüs'ü işgal etti; Selâhaddin-i Eyyûbî 1187'de şehri yeniden fethetti.","Osmanlılar 1516'da Filistin'i yönetimleri altına aldı; Kanûnî Sultan Süleyman Kudüs surlarını yeniletti, Kubbetü's-Sahre'yi onarttı. Dört asır süren Osmanlı yönetimi Birinci Dünya Savaşı'nın sonunda sona erdi.","İngiltere 1917'de Filistin'i işgal etti ve Balfour Bildirisi'yle Yahudi göçünü destekledi. 1948'de Filistin topraklarında işgalci İsrail devleti kuruldu; yüz binlerce Filistinli yurdundan sürüldü ve 1967'de Kudüs, Batı Şeria ve Gazze de işgal edildi. Filistin halkı bugün de işgal altında yaşamakta, Gazze büyük bir insanî felaket yaşamaktadır. Halîl'deki Harem-i İbrâhîmî ve Kudüs'teki Bâbürrahme kabristanı gibi peygamber ve sahâbe kabirleri bu topraklardadır."]},"IRL":{"id":"IRL","ad":"İrlanda","g":"other","rel":{"rows":[["Hristiyan",75.8,""],["Dinsiz / ateist",14.6,""],["Müslüman",1.6,""],["Diğer / belirtilmemiş",8.1,""]],"yr":"2022","src":"CIA World Factbook"},"pop":"5,2 milyon (2024 tahmini)"},"IRQ":{"id":"IRQ","ad":"Irak","g":"islam","rel":{"rows":[["Müslüman",96.5,"95–98"],["Hristiyan",1.0,""],["Diğer / belirtilmemiş",2.5,"1–4"]],"yr":"2015","src":"CIA World Factbook"},"pop":"42,9 milyon (2025 tahmini)","cap":"Bağdat","oz":"Başşehri Bağdat olan Irak, Abbâsî hilâfetinin merkeziydi. İslâm, Hz. Ebû Bekir döneminde başlayan fetihlerle girdi; Hz. Ömer döneminde Kādisiyye (636) ve Nihâvend (642) zaferleriyle bölge tamamen alındı. Müslümanların çoğunluğu Şiî, üçte birinden fazlası Sünnîdir.","tdv":"irak--ulke","sah":["ali","huseyin","selman","huzeyfe","talha","zubeyr"],"uzun":["Irak'ın başşehri Bağdat'tır; Dicle ve Fırat nehirlerinin suladığı topraklarda kurulmuştur ve Basra Körfezi'ne dar bir kıyısı vardır. Nüfusun büyük çoğunluğu Müslümandır; Şiîler çoğunlukta olmakla birlikte Sünnî Araplar ve Kürtler de önemli bir yer tutar.","Hz. Ebû Bekir ve Hz. Ömer dönemlerinde Kādisiye ve Celûlâ savaşlarıyla Sâsânî hâkimiyetine son verildi. Hz. Ömer'in kurdurduğu Basra ve Kûfe kısa sürede ilim merkezlerine dönüştü; Hz. Ali hilâfet merkezini Kûfe'ye taşıdı. Abbâsîler Bağdat'ı kurarak başşehir yaptı ve şehir asırlarca İslâm dünyasının ilim ve kültür merkezi oldu.","1055'te Tuğrul Bey'in Bağdat'a girmesiyle Irak Selçuklu hâkimiyetine girdi. 1258'de Moğolların Bağdat'ı yağmalamasıyla Abbâsî hilâfeti sona erdi. Kanûnî Sultan Süleyman 1534'te Bağdat'ı fethetti ve bölge Birinci Dünya Savaşı'na kadar Osmanlı idaresinde kaldı.","1932'de bağımsızlığını kazanan Irak, son yıllarda savaşlar ve işgallerle büyük acılar yaşadı. Bağdat'taki İmâm-ı Âzam Ebû Hanîfe ve Abdülkādir-i Geylânî türbeleri, Kerbelâ'daki Hz. Hüseyin ve Necef'teki Hz. Ali makamları ile Selmân-ı Fârisî'nin kabri İslâm dünyasının en çok ziyaret edilen yerleri arasındadır."]},"IRN":{"id":"IRN","ad":"İran","g":"other","rel":{"rows":[["Müslüman",98.5,""],["Hristiyan",0.7,""],["Bahâî",0.3,""],["Dinsiz / ateist",0.3,""],["Diğer / belirtilmemiş",0.2,""]],"yr":"2020","src":"CIA World Factbook"},"pop":"89,2 milyon (2025 tahmini)","cap":"Tahran","oz":"Başşehri Tahran olan İran, Hz. Ömer döneminde Kādisiyye (636) ve Nihâvend (642) zaferleriyle fethedildi. 1501'de kurulan Safevî Devleti on iki imam Şiîliğini devlet mezhebi yaptı. Bugün halkın büyük çoğunluğu Şiîdir.","tdv":"iran","uzun":["İran, yaklaşık 1,6 milyon km² yüzölçümüyle büyük ölçüde dağlık bir yayla üzerinde yer alır. Nüfusun yaklaşık yarısını Farslar oluşturur; Azerbaycan Türkleri ve diğer Türk toplulukları nüfusun önemli bir bölümünü meydana getirir. Başşehri Tahran'dır.","Hz. Ömer döneminde Kādisiye (15/636) ve Nihâvend (21/642) zaferleriyle Sâsânî Devleti yıkıldı ve İslâm İran'da yayılmaya başladı. Fetihlerden sonraki asırlarda Horasan, Nişabur, Rey ve İsfahan Sünnî İslâm'ın büyük ilim merkezleri oldu; İmam Gazzâlî, Fahreddin Râzî ve pek çok muhaddis bu topraklarda yetişti.","Tâhirîler, Sâmânîler ve Gazneliler'den sonra Selçuklular, Tuğrul Bey döneminde İran coğrafyasını birleştirdi; Nizâmülmülk'ün Nizâmiye medreseleriyle Sünnî ilim geleneği güçlendi. Moğol istilasının ardından İlhanlılar, Timurlular, Karakoyunlular ve Akkoyunlular hüküm sürdü. 1501'de Şah İsmâil'in kurduğu Safevî Devleti Şiîliği devlet politikası hâline getirerek İran'ın mezhep yapısını kökten değiştirdi.","1979 devriminden sonra İran İslâm Cumhuriyeti kuruldu ve velâyet-i fakîh anlayışına dayanan bir yönetim oluşturuldu. Bugün nüfusun büyük çoğunluğu İsnâaşeriyye Şiîsidir; Kürt, Türkmen, Beluç ve Arap bölgelerinde önemli bir Sünnî nüfus yaşar."]},"IDN":{"id":"IDN","ad":"Endonezya","g":"islam","rel":{"rows":[["Müslüman",87.4,""],["Hristiyan",10.6,""],["Hindu",1.7,""],["Diğer / belirtilmemiş",0.8,""]],"yr":"2022","src":"CIA World Factbook"},"pop":"283,6 milyon (2025 tahmini)","cap":"Cakarta","oz":"Binlerce adadan oluşan, nüfus bakımından dünyanın en büyük Müslüman ülkesidir. İslâm, XII. yüzyıl başlarında tüccarlar aracılığıyla Sumatra'nın kuzeyine ulaştı ve XV. yüzyılda bölgeye hâkim oldu. Müslümanlar Şâfiî mezhebine bağlıdır.","tdv":"endonezya","uzun":["Endonezya, Güneydoğu Asya ile Avustralya arasında uzanan on binden fazla adadan oluşur ve dünyanın en kalabalık Müslüman ülkesidir. Başşehri Cakarta'dır; nüfusun yarıdan fazlası Cava adasında yaşar.","İslâm, XII. yüzyıldan itibaren Arap, Fars ve Hint Müslüman tüccarlarının Sumatra ve Cava kıyılarına gelmesiyle yayıldı. Sûfîler, davetçiler ve evlilik bağları bu süreçte önemli rol oynadı; Cava'da İslâm'ı yayan \"Vali Songo\" (dokuz veli) halk arasında derin saygı görür. Pasai, Malaka, Açe ve Demak sultanlıkları İslâm'ın merkezleri oldu.","Açe Sultanlığı XVI. yüzyılda Portekizlilere karşı Osmanlı Devleti'nden yardım istedi ve Kanûnî döneminde Osmanlı donanması bölgeye ulaştı. Hollanda sömürge yönetimine karşı Açe Savaşı gibi uzun direnişler verildi. Endonezya 17 Ağustos 1945'te bağımsızlığını ilan etti.","Pesantren denilen geleneksel medreseler dinî eğitimin temelidir. 1912'de kurulan Muhammediyye ve 1926'da kurulan Nehdatü'l-Ulemâ dünyanın en büyük Müslüman teşkilatları arasındadır. Halkın büyük çoğunluğu Sünnî ve Şâfiî'dir."]},"IND":{"id":"IND","ad":"Hindistan","g":"other","rel":{"rows":[["Hindu",79.8,""],["Müslüman",14.2,""],["Hristiyan",2.3,""],["Sih",1.7,""],["Diğer / belirtilmemiş",2.0,""]],"yr":"2011","src":"CIA World Factbook"},"pop":"1,42 milyar (2025 tahmini)"},"ISL":{"id":"ISL","ad":"İzlanda","g":"other","rel":{"rows"
