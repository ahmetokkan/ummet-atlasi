keler ve Susular başlıca etnik gruplardır; nüfusun yaklaşık yüzde 85'i Müslümandır.","İslâm, XI. yüzyılda Mağrib'den gelen Müslüman tüccarlar aracılığıyla bölgeye ulaştı. Fulaniler 1725 civarında Futa Calon'da \"almami\" unvanlı hükümdarların yönettiği bağımsız bir İslâm devleti (imamlık) kurdu; bu devlet Batı Afrika'da İslâm eğitiminin önemli merkezlerinden biri oldu.","Fransız sömürgesi olan Gine 2 Ekim 1958'de bağımsızlığını ilan etti. Müslümanların çoğu Mâlikî mezhebine bağlıdır; Kādiriyye ve Ticâniyye tarikatları yaygındır."]},"GTM":{"id":"GTM","ad":"Guatemala","g":"other","rel":{"rows":[["Hristiyan",88.1,""],["Dinsiz / ateist",11.0,""],["Diğer / belirtilmemiş",0.9,""]],"yr":"2023","src":"CIA World Factbook"},"pop":"18,3 milyon (2024 tahmini)"},"GRD":{"id":"GRD","ad":"Grenada","g":"other","rel":{"rows":[["Hristiyan",86.4,""],["Dinsiz / ateist",5.7,""],["Yerel/geleneksel inançlar",1.2,""],["Diğer / belirtilmemiş",6.8,""]],"yr":"2011","src":"CIA World Factbook"},"pop":"115 bin (2024 tahmini)"},"GRC":{"id":"GRC","ad":"Yunanistan","g":"other","rel":{"rows":[["Hristiyan",85.5,"81–90"],["Dinsiz / ateist",9.5,"4–15"],["Müslüman",2.0,""],["Diğer / belirtilmemiş",4.0,""]],"yr":"2015","src":"CIA World Factbook"},"pop":"10,4 milyon (2025 tahmini)"},"GHA":{"id":"GHA","ad":"Gana","g":"other","rel":{"rows":[["Hristiyan",71.3,""],["Müslüman",19.9,""],["Yerel/geleneksel inançlar",3.2,""],["Dinsiz / ateist",1.1,""],["Diğer / belirtilmemiş",4.5,""]],"yr":"2021","src":"CIA World Factbook"},"pop":"35,3 milyon (2025 tahmini)"},"DEU":{"id":"DEU","ad":"Almanya","g":"other","rel":{"rows":[["Hristiyan",47.4,""],["Dinsiz / ateist",43.8,""],["Müslüman",3.7,""],["Diğer / belirtilmemiş",5.1,""]],"yr":"2022","src":"CIA World Factbook"},"pop":"84,0 milyon (2025 tahmini)"},"GEO":{"id":"GEO","ad":"Gürcistan","g":"other","rel":{"rows":[["Hristiyan",86.3,""],["Müslüman",10.7,""],["Dinsiz / ateist",0.5,""],["Diğer / belirtilmemiş",2.4,""]],"yr":"2014","src":"CIA World Factbook"},"pop":"4,9 milyon (2024 tahmini)"},"GMB":{"id":"GMB","ad":"Gambiya","g":"islam","rel":{"rows":[["Müslüman",96.4,""],["Hristiyan",3.5,""],["Dinsiz / ateist",0.1,""]],"yr":"","src":"CIA World Factbook"},"pop":"2,5 milyon (2024 tahmini)","cap":"Banjul","oz":"Gambiya nehri vadisinde uzanan, Senegal ile çevrili küçük bir Batı Afrika ülkesidir. İslâm, XI. yüzyılın ortalarında Murâbıtların etkisiyle bölgeye ulaştı. Müslümanların tamamı Mâlikîdir.","tdv":"gambia","uzun":["Gambiya, Batı Afrika'da Gambiya nehri boyunca uzanan dar bir ülkedir ve neredeyse tamamen Senegal toprakları ile çevrilidir. En kalabalık topluluk Mandingolardır ve halkın yüzde 95'ten fazlası Müslümandır.","İslâm XI. yüzyılda Murâbıtlar hareketiyle bölgeye ulaştı; sonradan gelen Mandinka ve Fulbe toplulukları zaten Müslümandı. XIX. yüzyılda Maba Diakhu Ba'nın önderlik ettiği hareket İslâm'ı nehir vadisinde daha da güçlendirdi.","İngiliz sömürgesi olan Gambiya 18 Şubat 1965'te bağımsız oldu. Mâlikî mezhebi ile Ticâniyye ve Kādiriyye tarikatları dinî hayatta etkilidir; aile hukukuna dair konularda şer'î mahkemeler karar verir."]},"GAB":{"id":"GAB","ad":"Gabon","g":"other","rel":{"rows":[["Hristiyan",80.2,""],["Müslüman",10.8,""],["Dinsiz / ateist",7.0,""],["Yerel/geleneksel inançlar",1.1,""],["Diğer / belirtilmemiş",0.9,""]],"yr":"","src":"CIA World Factbook"},"pop":"2,5 milyon (2025 tahmini)"},"FRA":{"id":"FRA","ad":"Fransa","g":"other","rel":{"rows":[["Hristiyan",50.0,""],["Dinsiz / ateist",33.0,""],["Müslüman",4.0,""],["Budist",2.0,""],["Yahudi",1.0,""],["Diğer / belirtilmemiş",10.0,""]],"yr":"2021","src":"CIA World Factbook"},"pop":"68,5 milyon (2025 tahmini)"},"SPM":{"id":"SPM","ad":"Saint Pierre ve Miquelon","g":"other","rel":{"rows":[["Hristiyan",99.0,""],["Diğer / belirtilmemiş",1.0,""]],"yr":"","src":"CIA World Factbook"},"pop":"5 bin (2025 tahmini)"},"WLF":{"id":"WLF","ad":"Wallis ve Futuna Adaları","g":"other","rel":{"rows":[["Hristiyan",99.0,""],["Diğer / belirtilmemiş",1.0,""]],"yr":"","src":"CIA World Factbook ailesi yarı bağımsız bir yönetim kurdu; Süveyş Kanalı 1869'da açıldı. 1882'de İngiliz işgaline uğrayan Mısır 1922'de bağımsızlığını kazandı, 1953'te cumhuriyet ilan edildi.","Kahire'deki Ezher Camii ve Üniversitesi, X. yüzyıldan beri İslâm dünyasının en köklü ilim merkezlerinden biridir. Nüfusun büyük çoğunluğu Sünnî Müslüman olup Şâfiî ve Hanefî mezhepleri yaygındır; Kıptî Hristiyanlar önemli bir azınlıktır. Kahire'deki Karâfe kabristanı ve Mukattam eteğinde Ukbe b. Âmir gibi sahâbîlerin, İmam Şâfiî gibi büyük âlimlerin kabirleri bulunur."]},"ECU":{"id":"ECU","ad":"Ekvador","g":"other","rel":{"rows":[["Hristiyan",88.6,""],["Dinsiz / ateist",8.2,""],["Diğer / belirtilmemiş",3.3,""]],"yr":"2023","src":"CIA World Factbook"},"pop":"18,5 milyon (2025 tahmini)"},"DOM":{"id":"DOM","ad":"Dominik Cumhuriyeti","g":"other","rel":{"rows":[["Hristiyan",80.3,""],["Dinsiz / ateist",18.5,""],["Diğer / belirtilmemiş",1.2,""]],"yr":"2023","src":"CIA World Factbook"},"pop":"10,9 milyon (2025 tahmini)"},"DMA":{"id":"DMA","ad":"Dominika","g":"other","rel":{"rows":[["Hristiyan",83.7,""],["Dinsiz / ateist",9.4,""],["Yerel/geleneksel inançlar",1.1,""],["Diğer / belirtilmemiş",5.7,""]],"yr":"2011","src":"CIA World Factbook"},"pop":"75 bin (2024 tahmini)"},"DJI":{"id":"DJI","ad":"Cibuti","g":"islam","rel":{"rows":[["Müslüman",94.0,""],["Diğer / belirtilmemiş",6.0,""]],"yr":"","src":"CIA World Factbook"},"pop":"1,0 milyon (2025 tahmini)","cap":"Cibuti","oz":"Bâbülmendep Boğazı'nın batı kıyısında küçük bir ülkedir. İslâm, VII-VIII. yüzyıllarda Arabistan'dan gelen Müslümanlarla bölgeye girdi. Müslümanların büyük çoğunluğu Şâfiîdir.","tdv":"cibuti","uzun":["Cibuti, Bâbülmendeb Boğazı'nın batı kıyısında, stratejik konumdaki küçük bir Afrika ülkesidir. Nüfusun büyük bölümünü Afarlar ve İsâlar (Somali kökenli) oluşturur ve halkın yarısına yakını başşehir Cibuti'de yaşar.","İslâm, VII-VIII. yüzyıllarda Arabistan'dan gelen göçmenler aracılığıyla bu topraklara ulaştı. XVI. yüzyılda Portekiz etkisine giren bölge daha sonra Osmanlı nüfuzu altına geçti.","Fransa XIX. yüzyılda bölgeye yerleşti; Cibuti 1977'de bağımsızlığını kazandı. Halkın tamamına yakını Şâfiî mezhebine bağlı Sünnî Müslümandır."]},"GRL":{"id":"GRL","ad":"Grönland","g":"other","rel":{"rows":[],"note":"Evanjelik Lüteriyen; geleneksel İnuit inançları da sürer.","src":"CIA World Factbook"},"pop":"58 bin (2024 tahmini)"},"FRO":{"id":"FRO","ad":"Faroe Adaları","g":"other","rel":{"rows":[["Hristiyan",87.0,""],["Dinsiz / ateist",3.7,""],["Diğer / belirtilmemiş",9.8,""]],"yr":"2011","src":"CIA World Factbook"},"pop":"53 bin (2024 tahmini)"},"DNK":{"id":"DNK","ad":"Danimarka","g":"other","rel":{"rows":[["Hristiyan",71.4,""],["Dinsiz / ateist",24.3,""],["Müslüman",4.3,""]],"yr":"2024","src":"CIA World Factbook"},"pop":"6,1 milyon (2025 tahmini)"},"CZE":{"id":"CZE","ad":"Çek Cumhuriyeti","g":"other","rel":{"rows":[["Dinsiz / ateist",56.9,""],["Hristiyan",13.0,""],["Diğer / belirtilmemiş",30.1,""]],"yr":"2021","src":"CIA World Factbook"},"pop":"10,8 milyon (2025 tahmini)"},"CYN":{"id":"CYN","ad":"KKTC","g":"turk","rel":{"note":"Nüfusun büyük çoğunluğu Sünnî-Hanefî Müslüman Kıbrıs Türkleridir. (KKTC için güvenilir bir yüzde verisi bulunamadı.)","rows":[]},"pop":"","cap":"Lefkoşa","oz":"Akdeniz'in üçüncü büyük adası olan Kıbrıs'a ilk İslâm seferi Hz. Osman döneminde Muâviye komutasında yapıldı; bu sefere katılan Ümmü Harâm adada şehid olup defnedildi. Ada 1570-1571'de Osmanlılar tarafından fethedildi. 1974 Barış Harekâtı'ndan sonra 15 Kasım 1983'te Kuzey Kıbrıs Türk Cumhuriyeti kuruldu.","tdv":"kibris","uzun":["Kıbrıs, adını yer altı zenginliklerinden bakır madeninden alır. Doğu Akdeniz'de, Türkiye kıyılarına yaklaşık 70 km uzaklıkta bulunan ada 9251 km² yüzölçümüne sahiptir ve jeolojik olarak Anadolu'ya bağlıdır. Akdeniz iklimi hâkimdir.","Hz. Muâviye, Bizans'a karşı denizden de sefer yapılması gerektiğini halifeye kabul ettirerek 28 (649) yılında adaya ilk İslâm seferini düzenledi. Seferde bulunan Ümmü Harâm bint Milhân karaya çıkarken hayvanından düşerek şehid oldu ve adaya defnedildi. Kabri bugün Larnaka'da \"Hala Sultan Tekkesi\" adıyla ziyaret edilmektedir.","Ada 1570'te Lefkoşa'nın, 1571'de Magosa'nın fethiyle Osmanlı topraklarına katıldı. Osmanlı yönetimi feodal düzeni kaldırdı, Anadolu'dan Türk nüfus yerleştirdi ve cemaatlere dinî özerklik tanıdı. Ada 1878'de İngiliz idaresine devredildi.","1974 Barış Harekâtı'nın ardından adanın kuzeyinde Kıbrıs Türk toplumu kendi devletini kurdu ve 15 Kasım 1983'te Kuzey Kıbrıs Türk Cumhuriyeti ilan edildi. KKTC'de dinî hizmetler Din İşleri Başkanlığı tarafından yürütülür; Lefkoşa'daki Selimiye Camii (eski Ayasofya Katedrali) ve Magosa'daki Lala Mustafa Paşa Camii adanın en önemli dinî yapılarıdır."]},"CYP":{"id":"CYP","ad":"Kıbrıs","g":"other","rel":{"rows":[["Hristiyan",94.0,""],["Müslüman",1.8,""],["Budist",1.0,""],["Dinsiz / ateist",0.6,""],["Diğer / belirtilmemiş",2.5,""]],"yr":"2011","src":"CIA World Factbook"},"pop":"1,3 milyon (2025 tahmini)","sah":["ummu-haram"]},"CUB":{"id":"CUB","ad":"Küba","g":"other","rel":{"rows":[["Hristiyan",58.9,""],["Dinsiz / ateist",23.2,""],["Yerel/geleneksel inançlar",17.6,""],["Budist",0.5,"<1"],["Hindu",0.5,"<1"],["Yahudi",0.5,"<1"],["Müslüman",0.5,"<1"],["Diğer / belirtilmemiş",0.5,"<1"]],"yr":"2020","src":"CIA World Factbook"},"pop":"10,1 milyon (2025 tahmini)"},"HRV":{"id":"HRV","ad":"Hırvatistan","g":"other","rel":{"rows":[["Hristiyan",87.4,""],["Dinsiz / ateist",6.4,""],["Müslüman",1.3,""],["Diğer / belirtilmemiş",5.0,""]],"yr":"2021","src":"CIA World Factbook"},"pop":"4,1 milyon (2025 tahmini)"},"CIV":{"id":"CIV","ad":"Fildişi Sahili","g":"other","rel":{"rows":[["Müslüman",42.9,""],["Hristiyan",33.9,""],["Dinsiz / ateist",19.1,""],["Yerel/geleneksel inançlar",3.6,""],["Diğer / belirtilmemiş",0.5,""]],"yr":"2014","src":"CIA World Factbook"},"pop":"31,9 milyon (2025 tahmini)"},"CRI":{"id":"CRI","ad":"Kosta Rika","g":"other","rel":{"rows":[["Hristiyan",69.9,""],["Dinsiz / ateist",27.0," 25 tahmini)"},"CHN":{"id":"CHN","ad":"Çin","g":"other","rel":{"rows":[["Dinsiz / ateist",52.1,""],["Yerel/geleneksel inançlar",21.9,""],["Budist",18.2,""],["Hristiyan",5.1,""],["Müslüman",1.8,""],["Hindu",0.1,"<0,1"],["Yahudi",0.1,"<0,1"],["Diğer / belirtilmemiş",0.7,""]],"yr":"2021","src":"CIA World Factbook"},"pop":"1,41 milyar (2025 tahmini)"},"MAC":{"id":"MAC","ad":"Makao","g":"other","rel":{"rows":[["Yerel/geleneksel inançlar",58.9,""],["Budist",17.3,""],["Dinsiz / ateist",15.4,""],["Hristiyan",7.2,""],["Diğer / belirtilmemiş",1.2,""]],"yr":"2020","src":"CIA World Factbook"},"pop":"644 bin (2024 tahmini)"},"HKG":{"id":"HKG","ad":"Hong Kong","g":"other","rel":{"rows":[["Dinsiz / ateist",54.3,""],["Budist",27.9,""],["Hristiyan",12.0,""],["Müslüman",4.2,""],["Hindu",1.4,""],["Sih",0.2,""]],"yr":"2016","src":"CIA World Factbook"},"pop":"7,3 milyon (2025 tahmini)"},"CHL":{"id":"CHL","ad":"Şili","g":"other","rel":{"rows":[["Hristiyan",74.5,""],["Dinsiz / ateist",25.7,""],["Diğer / belirtilmemiş",1.0,""]],"yr":"2024","src":"CIA World Factbook"},"pop":"19,1 milyon (2025 tahmini)"},"TCD":{"id":"TCD","ad":"Çad","g":"islam","rel":{"rows":[["Müslüman",52.1,""],["Hristiyan",44.1,""],["Dinsiz / ateist",2.8,""],["Yerel/geleneksel inançlar",0.3,""],["Diğer / belirtilmemiş",0.7,""]],"yr":"","src":"CIA World Factbook"},"pop":"19,7 milyon (2025 tahmini)","cap":"Encamena","oz":"Orta Afrika'da, başşehri Encamena olan eski bir Fransız sömürgesidir. İslâm, XI. yüzyıl başlarında Çad gölü çevresindeki Kânem hükümdarlarının Müslüman olmasıyla girdi ve ticaret yollarıyla yayıldı. Müslümanlar daha çok kuzey, doğu ve orta bölgelerde yaşar.","tdv":"cad","uzun":["Çad, yaklaşık 1,28 milyon km² yüzölçümüyle Orta Afrika'nın büyük ülkelerindendir; topraklarının yarısı çöldür. Kuzeyde ağırlıkla Müslüman Araplar ve Tubular, güneyde Hristiyan ve yerel inançlara bağlı topluluklar yaşar.","İslâm XI. yüzyılın başlarında Çad gölü çevresindeki hükümdarların Müslüman olmasıyla bölgeye ulaştı. Kānem-Bornu Sultanlığı'nda İslâm yönetim ve ticarette önemli yer edindi; Vaday ve Bagirmi sultanlıkları da İslâm'ın yayılmasında etkili oldu. Kānem-Bornu sultanları Osmanlı Devleti ile de ilişkiler kurdu.","Fransa 1900'lerde bölgeye hâkim oldu; Çad 11 Ağustos 1960'ta bağımsız oldu, ancak kuzey-güney gerginliği uzun süre istikrarsızlığa yol açtı. Müslümanlar nüfusun yarıdan fazlasını oluşturur; Arapça eğitim veren okullar dinî hayatın önemli parçasıdır."]},"CAF":{"id":"CAF","ad":"Orta Afrika Cumhuriyeti","g":"other","rel":{"rows":[["Hristiyan",73.2,""],["Müslüman",13.8,""],["Yerel/geleneksel inançlar",12.0,""],["Dinsiz / ateist",0.7,""],["Bahâî",0.2,""]],"yr":"2020","src":"CIA World Factbook"},"pop":"5,8 milyon (2025 tahmini)"},"CPV":{"id":"CPV","ad":"Yeşil Burun Adaları","g":"other","rel":{"rows":[["Hristiyan",81.7,""],["Dinsiz / ateist",15.6,""],["Müslüman",1.3,""],["Diğer / belirtilmemiş",1.6,""]],"yr":"2021","src":"CIA World Factbook"},"pop":"611 bin (2024 tahmini)"},"CAN":{"id":"CAN","ad":"Kanada","g":"other","rel":{"rows":[["Hristiyan",53.3,""],["Dinsiz / ateist",34.6,""],["Müslüman",4.9,""],["Hindu",2.3,""],["Sih",2.1,""],["Budist",1.0,""],["Yahudi",0.9,""],["Yerel/geleneksel inançlar",0.8,""]],"yr":"2021","src":"CIA World Factbook"},"pop":"39,2 milyon (2025 tahmini)"},"CMR":{"id":"CMR","ad":"Kamerun","g":"other","rel":{"rows":[["Hristiyan",66.3,""],["Müslüman",30.6,""],["Yerel/geleneksel inançlar",1.3,""],["Dinsiz / ateist",1.2,""],["Diğer / belirtilmemiş",0.7,""]],"yr":"2022","src":"CIA World Factbook"},"pop":"31,5 milyon (2025 tahmini)"},"KHM":{"id":"KHM","ad":"Kamboçya","g":"other","rel":{"rows":[["Budist",97.1,""],["Müslüman",2.0,""],["Hristiyan",0.3,""],["Diğer / belirtilmemiş",0.5,""]],"yr":"2019","src":"CIA World Factbook"},"pop":"17,2 milyon (2025 tahmini)"},"MMR":{"id":"MMR","ad":"Myanmar","g":"other","rel":{"rows":[["Budist",87.9,""],["Hristiyan",6.2,""],["Müslüman",4.3,""],["Yerel/geleneksel inançlar",0.8,""],["Hindu",0.5,""],["Dinsiz / ateist",0.1,""],["Diğer / belirtilmemiş",0.2,""]],"yr":"2014","src":"CIA World Factbook"},"pop":"57,9 milyon (2025 tahmini)"},"BDI":{"id":"BDI","ad":"Burundi","g":"other","rel":{"rows":[["Hristiyan",93.9,""],["Müslüman",3.4,""],["Dinsiz / ateist",1.3,""],["Diğer / belirtilmemiş",1.3,""]],"yr":"","src":"CIA World Factbook"},"pop":"13,6 milyon (2024 tahmini)"},"BFA":{"id":"BFA","ad":"Burkina Faso","g":"islam","rel":{"rows":[["Müslüman",63.8,""],["Hristiyan",26.3,""],["Yerel/geleneksel inançlar",9.0,""],["Dinsiz / ateist",0.7,""],["Diğer / belirtilmemiş",0.2,""]],"yr":"2019","src":"CIA World Factbook"},"pop":"23,5 milyon (2025 tahmini)","cap":"Uagadugu","oz":"1984'e kadar Yukarı Volta adıyla bilinen, başkenti Uagadugu olan bir Batı Afrika ülkesidir. İslâm, XIV. yüzyılda Müslüman tüccarlar aracılığıyla geldi. Müslümanlar Mâlikî mezhebine bağlıdır; Kādiriyye ve Ticâniyye tarikatları yaygındır.","tdv":"burkina-faso","uzun":["Burkina Faso, Batı Afrika'da denize kıyısı olmayan, büyük kısmı plato şeklinde bir ülkedir. Kuzeyi kurak, güneyi daha yağışlıdır. Mosiler başta olmak üzere pek çok etnik grup yaşar ve halkın çoğu tarım ve hayvancılıkla geçinir.","İslâm XIV. yüzyılda Müslüman tüccarlar aracılığıyla bölgeye ulaştı ve önce kuzeydeki Fulaniler arasında benimsendi. Songay hâkimiyeti döneminde Mosiler arasında da yayıldı; XVIII. yüzyılda bazı Mosi krallarının Müslüman olmasıyla güç kazandı.","Fransa 1897'de ülkeyi işgal etti ve \"Yukarı Volta\" adıyla yönetti; ülke 1960'ta bağımsız oldu. Müslümanlar 1950'lerden itibaren teşkilatlanarak camiler ve Kur'an kursları açtı ve bugün nüfusun en büyük dinî topluluğunu oluşturur."]},"BGR":{"id":"BGR","ad":"Bulgaristan","g":"other","rel":{"rows":[["Hristiyan",64.7,""],["Müslüman",9.8,""],["Dinsiz / ateist",4.7,""],["Diğer / belirtilmemiş",20.8,""]],"yr":"2021","src":"CIA World Factbook"},"pop":"6,7 milyon (2025 tahmini)"},"BRN":{"id":"BRN","ad":"Brunei","g":"islam","rel":{"rows":[["Müslüman",82.1,""],["Hristiyan",6.7,""],["Budist",6.3,""],["Diğer / belirtilmemiş",4.9,""]],"yr":"2021","src":"CIA World Factbook"},"pop":"492 bin (2024 tahmini)","cap":"Bandar Seri Begawan","oz":"Borneo adasının kuzeyinde, Güneydoğu Asya'da küçük bir Müslüman sultanlıktır. Resmî din İslâm'dır; Müslümanlar Şâfiî mezhebine bağlıdır.","tdv":"bruney","uzun":["Bruney, Borneo adasının kuzeybatı kıyısında yer alan, petrol ve doğalgaz bakımından zengin küçük bir sultanlıktır. Topraklarının büyük kısmı tropikal ormanlarla kaplıdır. Nüfusun çoğunluğunu Malaylar oluşturur.","İslâm, yerli hükümdar Alang Betatar'ın Müslüman olup sultanlık kurmasıyla yayıldı; Sultan Şerif Ali'nin kurduğu hanedan dinin yerleşmesini hızlandırdı. Sultan Bolkiah döneminde (1473-1521) Bruney, Borneo'nun büyük bölümüne ve Filipinler'in bazı kısımlarına hükmeden bir deniz gücü oldu.","İngiliz himayesinden sonra 1 Ocak 1984'te bağımsızlığını ilan etti. Resmî dini İslâm'dır ve halkın çoğunluğu Şâfiî mezhebine bağlıdır; Din İşleri Bakanlığı ve İslâm Davet Merkezi dinî hayatı yönlendirir."]},"BRA":{"id":"BRA","ad":"Brezilya","g":"other","rel":{"rows":[["Hristiyan",83.7,""],["Dinsiz / ateist",9.3,""],["Yerel/geleneksel inançlar",0.1,""],["Diğer / belirtilmemiş",7.4,""]],"yr":"2022","src":"CIA World Factbook"},"pop":"221,4 milyon (2025 tahmini)"},"BWA":{"id":"BWA","ad":"Botsvana","g":"other","rel":{"rows":[["Hristiyan",79.1,""],["Dinsiz / ateist",15.2,""],["Yerel/geleneksel inançlar",4.1,""],["Diğer / belirtilmemiş",1.7,""]],"yr":"2011","src":"CIA World Factbook"},"pop":"2,5 milyon (2025 tahmini)"},"BIH":{"id":"BIH","ad":"Bosna-Hersek","g":"islam","rel":{"rows":[["Müslüman",50.7,""],["Hristiyan",45.9,""],["Dinsiz / ateist",1.1,""],["Diğer / belirtilmemiş",2.3,""]],"yr":"2013","src":"CIA World Factbook"},"pop":"3,7 milyon (2025 tahmini)","cap":"Saraybosna","oz":"1991'de bağımsızlığını ilan eden eski Yugoslavya cumhuriyetlerinden biridir. İslâm, Osmanlı hâkimiyetiyle girdi; Bosna, Fâtih Sultan Mehmed döneminde fethedildi ve İslâmlaşma önce şehirlerde sonra köylerde yayıldı. Boşnaklar Sünnî-Hanefî Müslümandır.","tdv":"bosna-hersek","uzun":["Bosna-Hersek, 51 bin km² yüzölçümüyle Sırbistan, Karadağ ve Hırvatistan arasında yer alır ve Adriyatik'e kısa bir kıyısı vardır. Topraklarının çoğu dağlıktır. Müslüman Boşnaklar nüfusun yaklaşık yarısını oluşturur.","Osmanlılar XV. yüzyılda Bosna'yı fethederek sancak hâline getirdi. İslâm şehirlerde ve köylerde hızla yayıldı; Katolik kilisesinin baskısı altındaki Bogomillerin İslâm'ı kabul etmesi bu süreçte önemli rol oynadı. Saraybosna, Mostar ve Banyaluka camiler, medreseler, köprüler ve çarşılarla Osmanlı şehirleri olarak gelişti.","1878 Berlin Kongresi'nden sonra Avusturya-Macaristan bölgeyi idaresine aldı ve 1908'de ilhak etti. Yugoslavya döneminde Müslümanlar dinî kimliklerini korumaya çalıştı. 1992'de bağımsızlığını ilan eden Bosna-Hersek, Sırp saldırılarıyla başlayan ve Srebrenitsa soykırımı dahil büyük acılara yol açan bir savaş yaşadı; savaş 1995 Dayton Antlaşması ile sona erdi.","Bugün Bosna-Hersek İslâm Birliği, reîsü'l-ulemâ başkanlığında Müslümanların dinî hizmetlerini yürütür. Savaşta yıkılan birçok cami ve köprü, özellikle Mostar Köprüsü ve Ferhadiye Camii yeniden inşa edildi. Saraybosna'daki Gazi Hüsrev Bey Camii ve medresesi Balkanlar'ın en önemli İslâm eserlerindendir."]},"BOL":{"id":"BOL","ad":"Bolivya","g":"other","rel":{"rows":[["Hristiyan",84.6,""],["Dinsiz / ateist",8.4,""],["Diğer / belirtilmemiş",7.0,""]],"yr":"2023","src":"CIA World Factbook"},"pop":"12,4 milyon (2025 tahmini)"},"BTN":{"id":"BTN","ad":"Bhutan","g":"other","rel":{"rows":[["Budist",75.3,""],["Hindu",22.1,""],["Diğer / belirtilmemiş",2.6,""]],"yr":"2005","src":"CIA World Factbook"},"pop":"893 bin (2025 tahmini)"},"BEN":{"id":"BEN","ad":"Benin","g":"other","rel":{"rows":[["Hristiyan",48.5,""],["Müslüman",27.7,""],["Yerel/geleneksel inançlar",14.2,""],["Dinsiz / ateist",5.8,""],["Diğer / belirtilmemiş",2.6,""]],"yr":"2013","src":"CIA World Factbook"},"pop":"15,2 milyon (2025 tahmini)"},"BLZ":{"id":"BLZ","ad":"Belize","g":"other","rel":{"rows":[["Hristiyan",73.3,""],["Dinsiz / ateist",15.5,""],["Diğer / belirtilmemiş",11.1,""]],"yr":"2010","src":"CIA World Factbook"},"pop":"422 bin (2025 tahmini)"},"BEL":{"id":"BEL","ad":"Belçika","g":"other","rel":{"rows":[["Hristiyan",59.4,""],["Dinsiz / ateist",29.3,""],["Müslüman",6.8,""],["Diğer / belirtilmemiş",1.7,""]],"yr":"2018","src":"CIA World Factbook"},"pop":"12,0 milyon (2025 tahmini)"},"BLR":{"id":"BLR","ad":"Beyaz Rusya","g":"other","rel":{"rows":[["Hristiyan",55.4,""],["Dinsiz / ateist",41.1,""],["Diğer / belirtilmemiş",3.5,""]],"yr":"2011","src":"CIA World Factbook"},"pop":"9,5 milyon (2025 tahmini)"},"BRB":{"id":"BRB","ad":"Barbados","g":"other","rel":{"rows":[["Hristiyan",75.6,""],["Dinsiz / ateist",20.6,""],["Yerel/geleneksel inançlar",1.0,""],["Diğer / belirtilmemiş",2.7,""]],"yr":"2010","src":"CIA World Factbook"},"pop":"304 bin (2024 tahmini)"},"BGD":{"id":"BGD","ad":"Bangladeş","g":"islam","rel":{"rows":[["Müslüman",91.0,""],["Hindu",8.0,""],["Diğer / belirtilmemiş",1.0,""]],"yr":"2022","src":"CIA World Factbook"},"pop":"174,4 milyon (2025 tahmini)","cap":"Dakka","oz":"1971'de Pakistan'dan ayrılarak bağımsız olan, başşehri Dakka olan bir Güney Asya ülkesidir. İslâm, XIII. yüzyılın başında Türk komutan Muhammed Bahtiyâr Halacî'nin Bengal'i fethiyle yayıldı. Müslümanların neredeyse tamamı Sünnîdir (Hanefî); tasavvuf yaygındır.","tdv":"benglades","uzun":["Bangladeş, Hint yarımadasının doğusunda, Ganj ve Brahmaputra nehirlerinin oluşturduğu verimli bir ovada yer alır. Dünyanın en kalabalık ülkelerinden biridir; muson yağmurları, sel ve tayfunlar her yıl büyük zararlara yol açar.","Bengal'de İslâm'ın ilk davetçileri çoğunlukla sûfîlerdi ve tasavvuf halk arasında derin kök saldı. XIII. yüzyılın başında Türk komutan Bahtiyar Halacî bölgeyi fethetti; Bengal 1340'ta bağımsız bir sultanlık oldu ve 1576'da Babürlülerin hâkimiyetine girdi.","İngiliz döneminde Müslümanlar siyasî ve sosyal ağırlıklarını yitirdi; 1906'da Dakka'da Müslüman Birliği kuruldu. 1947'de Bengal'in doğusu \"Doğu Pakistan\" olarak Pakistan'a katıldı; 1971'deki savaşın ardından bağımsız Bangladeş kuruldu.","Halkın büyük çoğunluğu Sünnî-Hanefî Müslümandır ve tasavvuf dinî hayatta önemli bir yer tutar. Sylhet'teki Şah Celâl türbesi ülkenin en önemli ziyaretgâhıdır. Nüfusun yaklaşık yüzde onu Hindu'dur."]},"BHR":{"id":"BHR","ad":"Bahreyn","g":"islam","rel":{"rows":[["Müslüman",74.2,""],["Diğer / belirtilmemiş",25.9,""]],"yr":"2020","src":"CIA World Factbook"},"pop":"1,6 milyon (2024 tahmini)","cap":"Menâme","oz":"Basra Körfezi'nde 35 adadan oluşan bir emirliktir; başşehri Menâme'dir. İslâm, Hz. Peygamber'in 8. hicrî yılda Alâ b. Hadramî'yi göndermesiyle bölgeye barış yoluyla girdi. Müslümanların %55-60 kadarı Şiî, %40-45 kadarı Sünnîdir (Mâlikî ve Hanbelî).","tdv":"bahreyn","uzun":["Bahreyn, Basra Körfezi'nde otuz beş kadar adadan oluşan küçük bir ülkedir; adı Arapçada \"iki deniz\" anlamına gelir. Nüfusun önemli bir kısmını yabancı çalışanlar oluşturur. Başşehri Menâme'dir.","Hz. Peygamber, 8 (630) yılında Alâ b. Hadramî'yi bir davet mektubuyla Bahreyn hâkimi Münzir b. Sâvâ'ya gönderdi; Münzir ve halkın çoğu Müslüman oldu. Hz. Ebû Bekir döneminde çıkan irtidat hareketi yine Alâ b. Hadramî komutasındaki kuvvetlerce bastırıldı.","Sonraki asırlarda bölgede Emevîler, Abbâsîler, Karmatîler, Portekizliler, Osmanlılar ve İranlılar etkili oldu; 1783'te Âl-i Halîfe hâkimiyeti başladı. Osmanlı Devleti 1913'te bölge üzerindeki haklarından vazgeçti; İngiliz himayesine giren Bahreyn 15 Ağustos 1971'de bağımsızlığını ilan etti.","Resmî din İslâm'dır ve vatandaşların neredeyse tamamı Müslümandır. Nüfusun yarıdan fazlası Ca'ferî Şiî, geri kalanı Mâlikî ve Hanbelî Sünnî'dir; yönetimdeki Âl-i Halîfe ailesi Sünnî'dir."]},"BHS":{"id":"BHS","ad":"Bahamalar","g":"other","rel":{"rows":[["Hristiyan",94.9,""],["Dinsiz / ateist",1.9,""],["Diğer / belirtilmemiş",3.2,""]],"yr":"2010","src":"CIA World Factbook"},"pop":"415 bin (2025 tahmini)"},"AZE":{"id":"AZE","ad":"Azerbaycan","g":"turk","rel":{"rows":[["Müslüman",97.3,""],["Hristiyan",2.6,""]],"yr":"2020","src":"CIA World Factbook"},"pop":"10,7 milyon (2025 tahmini)","cap":"Bakü","oz":"Azerbaycan, Hz. Ömer döneminde 22/642'de fethedildi ve Hz. Osman'ın bölgeye asker yerleştirmesiyle İslâm yayılmaya başladı. Türk boylarının yerleşmesiyle bir Türk yurdu hâline geldi. Müslümanların yaklaşık %70'i Ca'ferî (Şiî), geri kalanı Sünnîdir.","tdv":"azerbaycan","uzun":["Azerbaycan, Kafkasya'nın doğusunda, Hazar Denizi kıyısında yer alır. 1828 Türkmençay ve 1829 Edirne antlaşmalarıyla tarihî Azerbaycan, Aras nehri boyunca ikiye bölündü; kuzeyi Rusya'ya, güneyi İran'a kaldı. Bugünkü Azerbaycan Cumhuriyeti'nin nüfusunun büyük çoğunluğunu Azerbaycan Türkleri oluşturur ve başşehri Bakü'dür.","Bölge Hz. Ömer döneminde 22 (642) yılında fethedildi ve İslâm hızla yayıldı. 1029'dan itibaren Oğuz Türkmenleri bölgeye gelmeye başladı; Tuğrul Bey'in 1054'te bölgeye hâkim olmasıyla Türkleşme hız kazandı.","Şah İsmâil döneminde Safevîler Tebriz'i başşehir yaparak bölgeye hâkim oldu ve Osmanlılarla uzun mücadeleler yaşandı. Çaldıran Zaferi'yle Tebriz bir süre Osmanlı idaresine geçti ve bölge iki devlet arasında el değiştirdi. XIX. yüzyılda kuzey Azerbaycan Rusya tarafından ilhak edildi.","Sovyet döneminde dinî hayat ağır biçimde kısıtlandı; medreseler kapatıldı, Arap alfabesi yasaklandı ve camilerin çoğu kapatıldı. 1991'de bağımsızlıktan sonra camiler yeniden açıldı ve din eğitimi canlandı. Nüfusun çoğunluğu Caferî Şiî, önemli bir kısmı Sünnî'dir."]},"AUT":{"id":"AUT","ad":"Avusturya","g":"other","rel":{"rows":[["Hristiyan",63.9,""],["Dinsiz / ateist",22.4,""],["Müslüman",8.3,""],["Yahudi",0.1,""],["Diğer / belirtilmemiş",5.4,""]],"yr":"2021","src":"CIA World Factbook"},"pop":"9,2 milyon (2025 tahmini)"},"AUS":{"id":"AUS","ad":"Avustralya","g":"other","rel":{"rows":[["Hristiyan",43.9,""],["Dinsiz / ateist",38.4,""],["Müslüman",3.2,""],["Hindu",2.7,""],["Budist",2.4,""],["Diğer / belirtilmemiş",9.4,""]],"yr":"2021","src":"CIA World Factbook"},"pop":"27,5 milyon (2025 tahmini)"},"IOA":{"id":"IOA","ad":"Australian Indian Ocean Territories","g":"other","rel":{"rows":[],"note":"Bu bölge için din dağılımı verisi bulunamadı.","src":""},"pop":""},"HMD":{"id":"HMD","ad":"Heard Adası ve McDonald Adaları","g":"other","rel":{"rows":[],"note":"Bu bölge için din dağılımı verisi bulunamadı.","src":""},"pop":""},"NFK":{"id":"NFK","ad":"Norfolk Adası","g":"other","rel":{"rows":[["Hristiyan",62.3,""],["Dinsiz / ateist",26.7,""],["Diğer / belirtilmemiş",10.9,""]],"yr":"2016","src":"CIA World Factbook"},"pop":"2 bin (2021 tahmini)"},"ATC":{"id":"ATC","ad":"Ashmore ve Cartier Adaları","g":"other","rel":{"rows":[],"note":"Bu bölge için din dağılımı verisi bulunamadı.","src":""},"pop":""},"ARM":{"id":"ARM","ad":"Ermenistan","g":"other","rel":{"rows":[["Hristiyan",95.2,""],["Diğer / belirtilmemiş",2.7,""]],"yr":"2022","src":"CIA World Factbook"},"pop":"3,0 milyon (2025 tahmini)"},"ARG":{"id":"ARG","ad":"Arjantin","g":"other","rel":{"rows":[["Hristiyan",79.6,""],["Dinsiz / ateist",18.9,""],["Diğer / belirtilmemiş",1.5,""]],"yr":"2019","src":"CIA World Factbook"},"pop":"45,4 milyon (2025 tahmini)"},"ATG":{"id":"ATG","ad":"Antigua ve Barbuda","g":"other","rel":{"rows":[["Hristiyan",76.5,""],["Dinsiz / ateist",5.9,""],["Diğer / belirtilmemiş",17.7,""]],"yr":"2011","src":"CIA World Factbook"},"pop":"103 bin (2024 tahmini)"},"AGO":{"id":"AGO","ad":"Angola","g":"other","rel":{"rows":[["Hristiyan",79.2,""],["Dinsiz / ateist",12.3,""],["Diğer / belirtilmemiş",8.6,""]],"yr":"2014","src":"CIA World Factbook"},"pop":"39,0 milyon (2025 tahmini)"},"AND":{"id":"AND","ad":"Andorra","g":"other","rel":{"rows":[["Hristiyan",89.5,""],["Dinsiz / ateist",1.7,""],["Diğer / belirtilmemiş",8.8,""]],"yr":"2020","src":"CIA World Factbook"},"pop":"85 bin (2024 tahmini)"},"DZA":{"id":"DZA","ad":"Cezayir","g":"islam","rel":{"rows":[["Müslüman",99.0,""],["Diğer / belirtilmemiş",0.5,"<1"]],"yr":"2012","src":"CIA World Factbook"},"pop":"47,7 milyon (2025 tahmini)","cap":"Cezayir","oz":"Akdeniz'den Büyük Sahrâ'ya uzanan, Afrika'nın en büyük ülkelerinden biridir. Arap fatihler VII. yüzyılın ortalarından itibaren bölgeye geldi ve Berberîler zamanla Müslüman oldu. Halkın çoğunluğu Mâlikîdir; Osmanlı döneminde şehirlerde Hanefî fıkhı da güçlendi.","tdv":"cezayir","sah":["ukbe-nafi"],"uzun":["Cezayir, Akdeniz kıyısından Büyük Sahra'nın içlerine uzanan geniş bir ülkedir ve Afrika'nın en büyük ülkesidir. Nüfusun büyük bölümü verimli kuzeyde yaşar. Halkın tamamına yakını Müslümandır; resmî dil Arapça olmakla birlikte önemli bir kesim Berberîce konuşur.","VII. yüzyılın ortalarında Ukbe b. Nâfi' öncülüğündeki Müslüman ordular bölgeye ilerledi ve İslâm Berberîler arasında yayıldı. Ukbe b. Nâfi'nin kabri bugün kendi adıyla anılan Sîdî Ukbe kasabasındadır. Rüstemîler, Fâtımîler, Hammâdîler, Murâbıtlar ve Muvahhidler gibi devletler döneminde Tilimsan, Bicâye ve Konstantin ilim ve ticaret merkezleri oldu.","İspanyol saldırılarına karşı Oruç ve Hızır Reis kardeşler Cezayir'e geldi; Hızır Reis (Barbaros Hayreddin Paşa) Osmanlı himayesine girdi ve Cezayir 1534'ten sonra Osmanlı beylerbeyiliği oldu. Osmanlı yönetimi 1830'a kadar sürdü.","Fransa 1830'da Cezayir'i işgal etti; Emîr Abdülkādir'in uzun direnişi ve 1954'te başlayan kurtuluş savaşı 1962'de bağımsızlıkla sonuçlandı. Bu mücadelede bir milyondan fazla insan şehid oldu. Dinî hayatta Mâlikî mezhebi ve tarikatlar belirleyicidir; Cem'iyyetü'l-ulemâ'nın ıslahat hareketi sömürge döneminde İslâmî kimliğin korunmasında büyük rol oynadı."]},"ALB":{"id":"ALB","ad":"Arnavutluk","g":"islam","rel":{"rows":[["Müslüman",58.8,""],["Hristiyan",16.8,""],["Dinsiz / ateist",2.5,""],["Diğer / belirtilmemiş",21.9,""]],"yr":"2011","src":"CIA World Factbook"},"pop":"2,6 milyon (2025 tahmini)","cap":"Tiran","oz":"Balkanların batısında, Adriyatik kıyısında bir Avrupa ülkesidir. İslâm, Osmanlı fetihleriyle bölgeye girdi; fetih 1571'de tamamlandı. Müslümanların çoğu Sünnî-Hanefî, bir kısmı Bektaşîdir.","tdv":"arnavutluk","uzun":["Arnavutluk, Balkan yarımadasının batısında, Adriyatik kıyısında yer alır; başşehri Tiran'dır. Nüfusun büyük çoğunluğunu Arnavutlar oluşturur; Kosova, Kuzey Makedonya ve diğer ülkelerde de önemli bir Arnavut nüfusu yaşar.","Osmanlılar 1385 Savra savaşından sonra bölgede hâkimiyet kurmaya başladı; İskender Bey'in direnişi ve Venedik rekabeti fethi uzattı, 1501'de Draç'ın alınmasıyla fetih büyük ölçüde tamamlandı. Osmanlı döneminde İslâm yaygınlaştı ve halkın çoğunluğu Müslüman oldu; birçok Arnavut devlet adamı Osmanlı yönetiminde üst görevlere yükseldi.","1912'de bağımsızlığını kazanan ülkede Müslümanlar 1923'te kendi dinî teşkilatlarını kurdu. Enver Hoca'nın 1944'te başlayan komünist rejimi döneminde 1967'de bütün dinî yapılar kapatıldı ve ülke kendini \"dünyanın ilk ateist devleti\" ilan etti; camiler yıkıldı veya başka amaçlarla kullanıldı.","1990'da komünist rejimin çökmesiyle din özgürlüğü yeniden tanındı. Camiler onarıldı, yenileri açıldı ve din eğitimi yeniden başladı. Bugün nüfusun çoğunluğu Müslümandır; Tiran'daki Ethem Bey Camii ve yeni inşa edilen Namazgâh Camii ülkenin simge yapılarıdır."]},"AFG":{"id":"AFG","ad":"Afganistan","g":"islam","rel":{"rows":[["Müslüman",99.7,""],["Diğer / belirtilmemiş",0.3,"<0,3"]],"yr":"2009","src":"CIA World Factbook"},"pop":"49,5 milyon (2025 tahmini)","cap":"Kâbil","oz":"Denize kıyısı olmayan, başşehri Kâbil olan bir Orta Asya ülkesidir. İslâm, Hz. Osman veya Muâviye döneminde Abdurrahman b. Semüre'nin seferleriyle bölgeye ulaştı. Halkın neredeyse tamamı Müslümandır; çoğunluk Hanefî Sünnî, %15-20 kadarı Şiîdir.","tdv":"afganistan","uzun":["Afganistan, Asya'da denize kıyısı olmayan dağlık bir ülkedir; ortada Hindukuş dağları, kuzeyde verimli ovalar, güneybatıda çöller bulunur. Peştu ve Derî resmî dillerdir. Peştun, Tacik, Özbek, Türkmen ve Hazara gibi pek çok etnik grup bir arada yaşar.","İslâm bölgeye Hz. Osman ve Muâviye dönemlerindeki fetihlerle ulaştı ve kısa sürede yayıldı. Sâmânîlerden sonra Sebüktegin'in kurduğu Gazneli Devleti, Gazneli Mahmud döneminde Hindistan'a kadar uzanan bir İslâm devletine dönüştü. Gazneliler'in ardından Gurlular ve Hârizmşahlar bu topraklarda hüküm sürdü; Herat, Belh ve Gazne büyük ilim ve kültür merkezleri oldu.","Ahmed Şah Dürrânî XVIII. yüzyılda ilk Afgan devletini kurdu; ülke XIX. yüzyılda İngiliz müdahalelerine maruz kaldı ve 1919'da bağımsızlığı tanındı. 1979 Sovyet işgaline karşı verilen mücadele uzun bir iç savaşa dönüştü ve ülke son yıllarda da istikrarsızlıkla mücadele etmektedir.","Halkın neredeyse tamamı Müslümandır; çoğunluk Hanefî mezhebine bağlı olup önemli bir Şiî azınlık da bulunur. Nakşibendî, Kâdirî ve Çiştî tarikatları dinî ve sosyal hayatta etkilidir. Belhli sûfîler ve Belh'te doğan Mevlânâ Celâleddin-i Rûmî'nin ailesi, bu toprakları İslâm düşünce tarihinde özel bir yere taşımıştır."]},"KAS":{"id":"KAS","ad":"Siachen Buzulu","g":"other","rel":{"rows":[],"note":"Bu bölge için din dağılımı verisi bulunamadı.","src":""},"pop":""},"SXM":{"id":"SXM","ad":"Sint Maarten","g":"other","rel":{"rows":[["Hristiyan",82.2,""],["Dinsiz / ateist",7.9,""],["Hindu",5.2,""],["Müslüman",1.1,""],["Diğer / belirtilmemiş",3.7,""]],"yr":"2011","src":"CIA World Factbook"},"pop":"47 bin (2025 tahmini)"},"TUV":{"id":"TUV","ad":"Tuvalu","g":"other","rel":{"rows":[["Hristiyan",94.2,""],["Bahâî",1.5,""],["Dinsiz / ateist",0.4,""],["Diğer / belirtilmemiş",3.9,""]],"yr":"2017","src":"CIA World Factbook"},"pop":"12 bin (2025 tahmini)"},"DTR":{"id":"DTR","ad":"Doğu Türkistan","g":"turk","rel":{"rows":[["Müslüman halklar (Uygur, Kazak, Hui, Kırgız…)",56],["Han Çinlileri ve diğerleri",44]],"note":"Çin 2020 nüfus sayımındaki etnik dağılıma göre yaklaşık değer; Çin resmî din istatistiği yayımlamaz.","src":"Çin 2020 nüfus sayımı (etnik dağılım)"},"pop":"25,9 milyon (2020 sayımı)","cap":"Urumçi","oz":"Tarım havzası ve Taklamakan Çölü'nü içine alan, Uygur ve Kazak Türklerinin yurdu olan geniş bir bölgedir. Karahanlıların Müslüman olmasıyla Türkler İslâm medeniyet dairesine girdi; Kaşgar önemli bir ilim merkezi oldu. Bölge 1884'te Sincan adıyla Çin'e bağlandı ve 1955'ten beri Sincan Uygur Özerk Bölgesi adıyla Çin Halk Cumhuriyeti'nin yönetimindedir.","tdv":"turkistan","uzun":["Doğu Türkistan, yaklaşık 1,8 milyon km² yüzölçümüyle bugün Çin Halk Cumhuriyeti hâkimiyetinde bulunan geniş bir bölgedir. Nüfusunun çoğunluğunu Uygur ve Kazak Türkleri oluşturur. Bölgenin ortasında yaklaşık 500 bin km²'lik Taklamakan Çölü yer alır; Kâşgar, Yarkend ve Hoten tarihî İpek Yolu'nun önemli durakları olmuştur.","Karahanlılar, İslâm'ı kabul eden ilk büyük Türk devletidir ve topraklarının önemli bir kısmı Doğu Türkistan'dadır. Satuk Buğra Han'ın Müslüman olmasıyla İslâm Kâşgar merkezli olarak Türkler arasında hızla yayıldı; Satuk Buğra Han'ın türbesi Artuş'tadır. Kaşgarlı Mahmud ve Yûsuf Has Hâcib bu bölgenin yetiştirdiği büyük âlimlerdendir.","Çin 1759'da Kâşgar'ı işgal etti ve 1884'te bölgeyi \"Sincan\" adıyla vilayet hâline getirdi. Yakub Bey Kâşgar ve Yarkend'de bağımsız bir yönetim kurdu ve Osmanlı Devleti'ne bağlılığını bildirdi. 1933'te Kâşgar'da, 1944'te Gulca'da Doğu Türkistan Cumhuriyeti ilan edildiyse de bu devletler uzun ömürlü olmadı ve 1949'da bölge Çin tarafından yeniden işgal edildi.","1955'ten beri \"Sincan Uygur Özerk Bölgesi\" adıyla Çin'e bağlıdır. Uygur Türkleri dinlerini ve kültürlerini yaşamak konusunda ağır kısıtlamalar ve baskılarla karşı karşıyadır; birçok cami ve türbe kapatılmış ya da yıkılmıştır. Buna rağmen halkın büyük çoğunluğu Sünnî-Hanefî Müslüman kimliğini korumaktadır."]}},"sahabe":[{"id":"ebu-eyyub","ad":"Ebû Eyyûb el-Ensârî (Eyüp Sultan)","ulke":"TUR","yer":"İstanbul, Eyüp","durum":"kabir","ozet":"Medine'ye hicretinde Hz. Peygamber'i yedi ay evinde misafir eden Ensâr'dan sahâbîdir. Bedir'den itibaren gazvelere katıldı. İlk İstanbul kuşatmasında hastalanarak 49 (669) yılında vefat etti ve vasiyeti üzerine surlara yakın bir yere defnedildi.","tdv":"ebu-eyyub-el-ensari","not":"Kabrin yerinin fetihten sonra Akşemseddin tarafından tespit edildiği rivayet edilir.","xy":[484.31,120.06],"uzun":["Ebû Eyyûb Hâlid b. Zeyd el-Ensârî, Hazrec kabilesinin Neccâroğulları koluna mensuptur. Babası Zeyd b. Küleyb, annesi Hind (Zehrâ) bint Sa'd'dır. Hicretten yaklaşık iki yıl önce eşi Ümmü Eyyûb ile birlikte Müslüman oldu ve Medine'de İslâm'ı ilk kabul edenler arasında yer aldı. 622 yılındaki İkinci Akabe Biatı'nda bulundu.","Hicretten sonra Hz. Peygamber onu Mus'ab b. Umeyr ile kardeş ilan etti. Medine'ye gelen Resûlullah, devesinin çöktüğü yerdeki evinde yedi ay misafir kaldı; bu yüzden kendisine \"Mihmandâr-ı Nebî\" denildi. Bedir, Uhud, Hendek, Hayber, Mekke'nin fethi ve Huneyn gibi neredeyse bütün gazvelere katıldı; bazı geceler Peygamber'in çadırının çevresinde nöbet tuttu. Vahiy kâtipleri arasında bulundu ve ilmiyle tanındığından pek çok dinî soruya fetva verdi.","Hz. Ebû Bekir ve Hz. Ömer dönemlerinde Suriye, Filistin, Mısır ve Kıbrıs seferlerine katıldı. Hz. Osman'ın kuşatıldığı günlerde Hz. Ali'nin tavsiyesiyle Medine'de bir süre imamlık yaptı; Hz. Ali Irak'a gidince onu şehirde vekil bıraktı. İhtiyarlığına rağmen her yıl bir sefere katılmaya gayret etti. Hadis rivayetinde son derece titizdi; bilmediği bir hadisi öğrenmek için Medine'den Mısır'a kadar gittiği anlatılır.","Katıldığı son sefer, Müslümanların ilk İstanbul kuşatmasıdır. Kuşatma sürerken hastalanarak 49 (669) yılında vefat etti. Vasiyeti üzerine surlara yakın bir yere defnedildi. İstanbul'un fethinden sonra kabrin yerinin Akşemseddin tarafından belirlendiği Osmanlı kaynaklarında anlatılır; Türkiye'de \"Eyüp Sultan\" olarak anılır ve türbesi bugün en çok ziyaret edilen yerlerdendir."]},{"id":"ebu-seybe","ad":"Ebû Şeybe el-Hudrî","ulke":"TUR","yer":"İstanbul, Ayvansaray","durum":"kabir","ozet":"Hz. Peygamber'in sohbetinde bulunmuş bir sahâbîdir. İstanbul kuşatmasına katılarak burada şehid oldu. Kabri Ayvansaray'da, surların içindedir.","tdv":"ebu-seybe-el-hudri","xy":[484.31,120.06]},{"id":"diyarbakir","ad":"Diyarbakır şehidleri","ulke":"TUR","yer":"Diyarbakır, Hz. Süleyman Camii","durum":"rivayet","ozet":"Hz. Ömer döneminde Diyarbakır'ın fethinde şehid düşen Hâlid b. Velîd'in oğlu Süleyman ile birlikte yirmi yedi sahâbînin Hz. Süleyman Camii'nin yanındaki türbede yattığı rivayet edilir.","not":"Bu bilgi halk arasındaki rivayete dayanır; TDV İslâm Ansiklopedisi'nde doğrulayan bir madde bulunamadı.","xy":[513.62,130.02]},{"id":"ummu-haram","ad":"Ümmü Harâm bint Milhân (Hala Sultan)","ulke":"CYP","yer":"Larnaka, Hala Sultan Tekkesi","durum":"kabir","ozet":"Enes b. Mâlik'in teyzesi ve Ubâde b. Sâmit'in eşidir. Hz. Osman döneminde Kıbrıs'a giden ilk İslâm donanmasıyla adaya çıkarken bindiği hayvandan düşerek vefat etti. Kabri Larnaka yakınındaki Tuzla'da, Hala Sultan Tekkesi'ndedir.","tdv":"ummu-haram","xy":[496.39,140.11],"uzun":["Ümmü Harâm bint Milhân, Hazrec kabilesinin Neccâroğulları koluna mensup bir sahâbiyedir. Kız kardeşi, Enes b. Mâlik'in annesi Ümmü Süleym'dir; kardeşleri Harâm ve Süleym Bi'rimaûne olayında şehid düşmüştür. Hz. Peygamber'e biat eden kadınlar arasında yer aldı ve Ubâde b. Sâmit ile evlendi.","Hz. Peygamber Kubâ'ya gittiğinde zaman zaman onun evinde misafir olur, orada dinlenirdi. Ümmü Harâm, Peygamber'in uykusundan gülümseyerek uyandığı ve ümmetinden bir topluluğun denizde sefere çıkacağını müjdelediği olayı aktarmıştır. Kendisi de bu topluluktan olmak için dua istemiş ve Peygamber ona bu müjdeyi vermiştir. Savaşlarda yaralılara hizmet ettiği de nakledilir.","Eşi Ubâde ile birlikte Suriye'deki fetihlere katıldı. 28 (649) yılında, Hz. Osman döneminde Muâviye komutasında Kıbrıs'a gönderilen ilk İslâm donanmasında yer aldı. Adaya çıktıktan sonra bindiği hayvandan düşerek vefat etti; böylece Peygamber'in müjdesi gerçekleşmiş oldu. \"Hala Sultan\" adı, Arapçada teyze anlamına gelen \"hâle\" kelimesinden gelir.","Vefat ettiği yere defnedildi. Kabri Larnaka yakınındaki Tuzla'da, Hala Sultan Tekkesi olarak bilinir. Kaynaklarda salih bir kadının kabri olarak anıldığı ve yalnız Müslümanların değil başka dinlerden insanların da burayı ziyaret ettiği belirtilir. Kabir bugün de ziyaret edilmektedir."]},{"id":"ebu-bekir","ad":"Hz. Ebû Bekir","ulke":"SAU","yer":"Medine, Ravza-i Mutahhara","durum":"kabir","ozet":"İlk halife ve Hz. Peygamber'in hicret arkadaşıdır; \"Sıddîk\" lakabıyla anılır. 13 (634) yılında Medine'de vefat etti ve Hz. Peygamber'in yanına defnedildi.","tdv":"ebu-bekir","xy":[512.44,173.85],"uzun":["Hz. Ebû Bekir, Fil Vak'ası'ndan yaklaşık üç yıl sonra Mekke'de doğdu; Hz. Peygamber'den iki üç yaş küçüktü. Annesi Ümmü'l-Hayr Selmâ ile babası Ebû Kuhâfe de daha sonra Müslüman oldu. \"Atîk\" ve \"Sıddîk\" lakaplarıyla tanınır. Ticaretle uğraşır, kervanlarla Suriye ve Yemen'e giderdi; İslâm'ı ilk kabul edenlerdendir.","Mekke döneminde Kureyş'in ileri gelenlerinden birçok kişinin Müslüman olmasına vesile oldu. İşkence gören köleleri satın alıp âzat etti; Bilâl-i Habeşî bunlardandır. Hicret sırasında Hz. Peygamber ile birlikte Sevr mağarasında saklandı ve \"yâr-ı gār\" diye anıldı. Mi'rac haberini tereddütsüz tasdik etmesi üzerine \"Sıddîk\" lakabını aldı. Bedir, Uhud, Hudeybiye, Huneyn ve Tebük'te bulundu; 9 (631) yılında hac emîri olarak görevlendirildi.","Hz. Peygamber'in vefatından sonra 11 (632) yılında halife seçildi. Üsâme b. Zeyd ordusunu sefere göndererek Peygamber'in kararını uyguladı. Zekât vermeyi reddeden ve sahte peygamberlere uyan kabileleri, Hâlid b. Velîd gibi komutanlar aracılığıyla itaate getirdi. Irak ve Suriye fetihlerini başlattı ve Kur'ân-ı Kerîm'in bir mushaf hâlinde toplanmasını sağladı.","13 (634) yılının Cemâziyelâhir ayında hastalandı ve Hz. Ömer'i halife olarak belirledi. 22 Cemâziyelâhir 13 (23 Ağustos 634) tarihinde altmış üç yaşında vefat etti. Cenaze namazını Hz. Ömer kıldırdı. Vasiyeti üzerine Hz. Peygamber'in yanına, Hücre-i Saâdet'e defnedildi."]},{"id":"omer","ad":"Hz. Ömer","ulke":"SAU","yer":"Medine, Ravza-i Mutahhara","durum":"kabir","ozet":"İkinci halifedir; \"Fârûk\" lakabıyla anılır. Döneminde Suriye, Irak, İran ve Mısır fethedildi. 23 (644) yılında şehid edildi ve Hz. Peygamber ile Hz. Ebû Bekir'in yanına defnedildi.","tdv":"omer","xy":[512.44,173.85],"uzun":["Hz. Ömer, Ebû Hafs künyesiyle bilinen ve Kureyş'in Adî koluna mensup bir sahâbîdir. Mekke'de doğdu, annesi Mahzûmoğulları'ndandır. İslâm'a başlangıçta şiddetle karşı çıktı. Bi'setin altıncı yılında (616) Müslüman olduğu rivayet edilir; onun Müslüman olması Mekke'deki Müslümanlara büyük güç verdi.","Müslüman olduktan sonra Hz. Peygamber'in en yakın yardımcılarından biri oldu. Medine'ye hicret etti; Bedir, Uhud, Hendek, Hudeybiye ve diğer önemli olaylarda bulundu. Kızı Hafsa Hz. Peygamber ile evlendi. Bazı görüşlerinin âyetlerle teyit edildiği nakledilir; hakkı bâtıldan ayırdığı için \"Fârûk\" lakabıyla anıldı.","Hz. Ebû Bekir'in vefatı üzerine 13 (634) yılında halife oldu ve \"emîrü'l-mü'minîn\" unvanını kullanan ilk halife oldu. Döneminde Kādisiye, Yermük ve Nihâvend zaferleri kazanıldı; Kudüs (17/638) ve Mısır fethedildi. Hicrî takvim kullanılmaya başlandı, divan teşkilatı kuruldu, valilik ve kadılık görevleri düzenlendi. Adaleti ve sade yaşayışıyla örnek gösterilir.","23 (644) yılında Ebû Lü'lüe adlı bir köle tarafından sabah namazında hançerle yaralandı. Üç gün sonra, 26 Zilhicce 23 (3 Kasım 644) tarihinde vefat etti; cenaze namazını Suheyb b. Sinân kıldırdı. Hz. Âişe'nin izniyle Hz. Peygamber ve Hz. Ebû Bekir'in yanına defnedildi."]},{"id":"osman","ad":"Hz. Osman","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Üçüncü halifedir; Hz. Peygamber'in iki kızıyla evlendiği için \"Zinnûreyn\" diye anılır. Kur'an-ı Kerîm'i çoğaltarak İslâm beldelerine gönderdi. 35 (656) yılında evinde şehid edildi ve Bakî'de defnedildi.","tdv":"osman","xy":[512.44,173.85],"uzun":["Hz. Osman, Kureyş'in Ümeyyeoğulları koluna mensup bir sahâbîdir. Fil Vak'ası'ndan altı yıl sonra doğdu. Babası Affân, zengin bir tüccardı. Hz. Ebû Bekir'in daveti üzerine Müslüman oldu ve İslâm'ı ilk kabul edenler arasında yer aldı. Ailesinin baskılarına rağmen dininden dönmedi.","Hz. Peygamber'in kızı Rukıyye ile evlendi ve onunla birlikte Habeşistan'a, sonra Medine'ye hicret etti. Bedir'e hasta eşinin başında kaldığı için katılamadı, fakat ganimetten pay verildi. Rukıyye'nin vefatından sonra Peygamber'in diğer kızı Ümmü Gülsüm ile evlendi ve \"iki nur sahibi\" anlamında Zinnûreyn diye anıldı. Hudeybiye'de elçi olarak Mekke'ye gönderildi; Tebük seferinin hazırlıklarına büyük bağışta bulundu ve vahiy kâtipleri arasında yer aldı.","Hz. Ömer'in vefatından sonra şûranın kararıyla 23 (644) yılında halife seçildi. Halifeliği döneminde İran'ın büyük kısmı, Horasan ve Kuzey Afrika'nın bir bölümü fethedildi; Kıbrıs alındı ve Zâtüssavârî deniz zaferi kazanıldı. En önemli hizmeti, Kur'ân-ı Kerîm'i çoğaltarak nüshalarını İslâm beldelerine göndermesidir.","Halifeliğinin son yıllarında çeşitli şehirlerden gelen şikâyetler ve kışkırtmalar arttı. Medine'de evi kuşatıldı ve 35 (656) yılının Zilhicce ayında evinde Kur'an okurken şehid edildi. Cennetü'l-Bakî'nin yanındaki Haşşükevkeb denilen yere defnedildi; burası sonradan Bakî'ye katıldı."]},{"id":"hamza","ad":"Hz. Hamza","ulke":"SAU","yer":"Medine, Uhud","durum":"kabir","ozet":"Hz. Peygamber'in amcasıdır; \"Seyyidü'ş-şühedâ\" (şehidlerin efendisi) diye anılır. 3 (625) yılında Uhud Savaşı'nda şehid düştü ve Uhud'da defnedildi.","tdv":"hamza","xy":[512.44,173.85],"uzun":["Hz. Hamza, 569 veya 570 yılında Mekke'de doğdu; Hz. Peygamber'in amcasıdır. Babası Abdülmuttalib, annesi Hâle bint Vüheyb'dir. Peygamber ile aynı kadından, Süveybe'den süt emdikleri için aynı zamanda süt kardeşidir. Güçlü ve cesur bir avcı olarak tanınırdı.","Nübüvvetin ikinci veya altıncı yılında Müslüman olduğu rivayet edilir. Ebû Cehil'in Hz. Peygamber'e hakaret ettiğini duyunca avdan dönerken Kâbe'de onu yayıyla yaraladı ve İslâm'ı kabul ettiğini açıkça ilan etti. Onun Müslüman olması Mekke'deki Müslümanlara güç verdi ve müşrikleri temkinli olmaya zorladı.","Hicretten sonra Hz. Peygamber onu Zeyd b. Hârise ile kardeş ilan etti. 1 (623) yılında Sîfülbahr seriyyesinin komutanlığına getirildi; Ebvâ, Zülüşeyre ve Kaynukā gazvelerinde Peygamber'in sancağını taşıdı. Bedir Savaşı'nda (2/624) öne çıkan kahramanlardandı; teke tek çarpışmada Şeybe b. Rebîa'yı öldürdü.","Uhud Gazvesi'nde (3/625) kahramanca savaştı. Ordunun dağıldığı sırada Vahşî b. Harb'in attığı mızrakla şehid düştü; bedenine yapılan işkence Hz. Peygamber'i derinden üzdü. Peygamber onun cenaze namazını kıldırdı, \"şehidlerin efendisi\" diye andı ve Uhud'da defnettirdi. Türbesinin sonradan Abbâsî Halifesi Nâsır-Lidînillâh'ın annesi tarafından yaptırıldığı rivayet edilir."]},{"id":"musab","ad":"Mus'ab b. Umeyr","ulke":"SAU","yer":"Medine, Uhud","durum":"kabir","ozet":"Akabe biatından sonra Hz. Peygamber'in Medine'ye öğretmen olarak gönderdiği sahâbîdir. Uhud'da sancağı taşırken şehid düştü.","tdv":"musab-b-umeyr","xy":[512.44,173.85],"uzun":["Mus'ab b. Umeyr, Kureyş'in Abdüddâroğulları koluna mensup, varlıklı bir ailenin çocuğudur. Gençliğinde güzel giyimi ve rahat yaşayışıyla tanınırdı. İslâm'ın ilk yıllarında Müslüman oldu, fakat ailesinin tepkisinden çekindiği için bir süre imanını gizledi. Ailesi durumu öğrenince onu hapsetti, ancak dininden döndüremedi.","Nübüvvetin beşinci yılında Habeşistan'a hicret etti. Birinci Akabe Biatı'ndan sonra (621) Medinelilerin isteği üzerine Hz. Peygamber onu Medine'ye ilk muallim olarak gönderdi. Uhud Gazvesi'nde İslâm sancağını taşıdı.","Medine'de Es'ad b. Zürâre'nin evinde kaldı. Kur'an bilgisi ve tatlı dili sayesinde Üseyd b. Hudayr ve Sa'd b. Muâz gibi ileri gelenlerin Müslüman olmasına vesile oldu. Es'ad ile birlikte cuma ve vakit namazlarını kıldırdı. Ertesi yıl Mekke'ye giderek Hz. Peygamber'e Medine'deki gelişmeleri anlattı ve İkinci Akabe Biatı'nın hazırlanmasında rol oynadı.","Uhud'da (3/625) iki eli kesildiği hâlde sancağı göğsüne bastırarak tutmaya çalışırken şehid düştü. Kefen bulunamadığı için bedeni kısa bir örtüyle sarıldı; başı örtülünce ayakları açıkta kaldı, ayaklarının üzerine izhir otu konuldu. Uhud şehidleri arasında defnedildi. Sahâbîler sonraki bolluk yıllarında onu sık sık hatırladılar."]},{"id":"hatice","ad":"Hz. Hatice","ulke":"SAU","yer":"Mekke, Cennetü'l-Muallâ","durum":"kabir","ozet":"Hz. Peygamber'in ilk eşi ve ilk Müslümandır. Hicretten yaklaşık üç yıl önce Mekke'de vefat etti ve Hacûn'daki Muallâ kabristanına defnedildi.","tdv":"hatice","xy":[513.13,183.71],"uzun":["Hz. Hatice, 556 yılında Mekke'de doğan Kureyşli bir hanımdır. Soyu Kusay'da Hz. Peygamber'in soyuyla birleşir; babası Huveylid Kureyş'in ileri gelenlerindendir. İffeti sebebiyle İslâm'dan önce \"Tâhire\" lakabıyla anılırdı. Ticaretle uğraşan varlıklı bir kadındı.","Daha önce iki evlilik yapmış ve dul kalmıştı. Dürüstlüğüyle tanınan Hz. Muhammed'i önce ticaret kervanını yönetmeye, ardından evliliğe davet etti. Evlendiklerinde yaklaşık kırk yaşındaydı. Bu evlilikten Kāsım, Zeyneb, Rukıyye, Ümmü Gülsüm ve Fâtıma doğdu; Kāsım küçük yaşta vefat etti.","Hz. Peygamber Hira'da ilk vahyi alıp eve döndüğünde onu teskin etti, güzel huylarını sayarak Allah'ın onu mahcup etmeyeceğini söyledi. Eşini amcasının oğlu Varaka b. Nevfel'e götürdü ve Peygamber'e ilk iman eden kişi oldu. Müşriklerin uyguladığı boykot sırasında Şi'b-i Ebû Tâlib'de yıllarca sıkıntıya katlandı ve servetini İslâm davası için harcadı.","Hicretten yaklaşık üç yıl önce, 10 Ramazan'da (619) vefat etti ve Mekke'deki Hacûn (Cennetü'l-Muallâ) kabristanına defnedildi. Kısa süre sonra Ebû Tâlib'in de vefatıyla bu yıl \"hüzün yılı\" olarak anıldı. Hz. Peygamber onu ömrü boyunca vefayla andı. Kabri üzerindeki Osmanlı dönemi türbesi 1926'da yıktırılmıştır."]},{"id":"fatima","ad":"Hz. Fâtıma","ulke":"SAU","yer":"Medine","durum":"rivayet","ozet":"Hz. Peygamber'in kızı, Hz. Ali'nin eşi, Hz. Hasan ve Hz. Hüseyin'in annesidir. Hz. Peygamber'den birkaç ay sonra 11 (632) yılında Medine'de vefat etti.","tdv":"fatima","not":"Kabrinin Cennetü'l-Bakî'de mi yoksa kendi evinde mi olduğu konusunda farklı rivayetler vardır.","xy":[512.44,173.85],"uzun":["Hz. Fâtıma, Hz. Peygamber ile Hz. Hatice'nin kızıdır. Nübüvvetten yaklaşık bir yıl önce (609) Mekke'de doğduğu kabul edilir; bazı tarihçiler Kâbe'nin yeniden inşa edildiği 605 yılını verir. \"Zehrâ\" ve \"Betûl\" lakaplarıyla anılır; babasına olan bağlılığı sebebiyle \"Ümmü Ebîhâ\" künyesi verilmiştir. Hicretten sonra Medine'ye göç etti.","Hicretin 2. yılında (624) Hz. Ali ile evlendi. Bu evlilikten Hasan, Hüseyin, Muhassin, Ümmü Gülsüm ve Zeyneb dünyaya geldi. Hz. Peygamber'in nesli onun çocukları aracılığıyla devam etmiştir. Evliliklerinin ilk yıllarındaki küçük anlaşmazlıklar Peygamber'in arabuluculuğuyla giderilmiştir.","Uhud'da yaralılara baktı ve babasının yüzündeki yaranın kanını durdurmaya çalıştı. Hz. Peygamber onu çok sever, onu sevindirenin kendisini sevindirdiğini söylerdi. Cennet kadınlarının hanımefendisi olacağını müjdelemiştir. Hayâsı, edebi ve sade yaşayışıyla Müslüman kadınlar için örnek kabul edilir.","Hz. Peygamber'in vefatından yaklaşık beş buçuk ay sonra, 3 Ramazan 11 (632) tarihinde vefat etti. Cenazesini Hz. Ali yıkadı; vasiyeti üzerine geceleyin defnedildi. TDV'ye göre Cennetü'l-Bakî'ye defnedilmiştir; kabrinin kendi evinde olduğu yönünde başka rivayetler de vardır."]},{"id":"abbas","ad":"Hz. Abbas","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Hz. Peygamber'in amcasıdır. Mekke'nin fethinden önce Müslüman oldu. 32 (653) yılında Medine'de vefat etti.","tdv":"abbas-b-abdulmuttalib","xy":[512.44,173.85],"uzun":["Hz. Abbas, Hz. Peygamber'in amcasıdır ve Hâşimoğulları'ndan Abdülmuttalib'in oğludur. Peygamber'den iki üç yaş büyüktür ve onunla birlikte büyüdü. Câhiliye döneminde hacılara su dağıtma (sikāye) görevini yürütürdü. Abbâsî hânedanı onun soyundan gelir.","TDV'nin naklettiğine göre İkinci Akabe Biatı'nda (622) Hz. Peygamber'in yanında bulunarak Medinelilerden yeğenini koruyacaklarına dair söz aldı. Müslüman oluşu konusunda farklı rivayetler vardır; daha yaygın görüşe göre Bedir'den sonra veya Mekke'nin fethinden kısa süre önce açıkça Müslüman olmuş, ancak her zaman yeğenini desteklemiştir.","Mekke'nin fethi sırasında Ebû Süfyân'ın Müslüman olmasına aracılık etti. Huneyn'de, gür sesiyle dağılan Müslümanları Peygamber'in etrafında toplamasıyla tanınır. Hz. Ömer, kuraklık yılında onu vesile kılarak yağmur duasına çıkmıştır.","Kaynaklara göre 32 (653) yılında Medine'de vefat etti; cenaze namazını Hz. Osman kıldırdı ve Cennetü'l-Bakî'ye defnedildi."]},{"id":"hasan","ad":"Hz. Hasan","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Hz. Peygamber'in torunu, Hz. Ali ile Hz. Fâtıma'nın büyük oğludur. Halifeliği Muâviye'ye bırakarak Müslümanlar arasında barışı sağladı. 49 (669) yılında Medine'de vefat etti.","tdv":"hasan","xy":[512.44,173.85],"uzun":["Hz. Hasan, 3 (625) yılında Medine'de doğdu. Babası Hz. Ali, annesi Hz. Fâtıma'dır; onların büyük oğludur. Hz. Peygamber ona Hasan adını ve Ebû Muhammed künyesini verdi. Doğumunun yedinci gününde akîka kurbanı kesildi ve saçının ağırlığınca gümüş yoksullara dağıtıldı.","Hz. Peygamber'in çok sevdiği torunlarındandı; Peygamber'in ona ve kardeşi Hüseyin'e olan düşkünlüğü birçok rivayette anlatılır. Hz. Ebû Bekir onu Peygamber'e benzediği için severdi; Hz. Ömer divanda ona Bedir gazilerine verilen miktarda pay ayırdı. Hz. Osman döneminde kardeşiyle birlikte Horasan seferine katıldı ve kuşatma günlerinde halifeyi korumak üzere görevlendirildi.","Hz. Ali'nin şehadetinden sonra (40/661) Kûfe'de halife olarak kendisine biat edildi. Muâviye büyük bir ordu hazırlayınca savaş yerine belirlediği şartlarla hilâfeti ona bıraktı. 41 (661) yılındaki bu barışla Müslümanlar arasında kan dökülmesi önlendi ve o yıl \"birlik yılı\" (âmü'l-cemâa) olarak anıldı.","Barıştan sonra Medine'ye dönerek siyasetten uzak bir hayat sürdü. Rivayete göre zehirlenerek 28 Safer 49 (7 Nisan 669) tarihinde vefat etti. Vasiyeti üzerine Cennetü'l-Bakî'de annesi Hz. Fâtıma'nın yanına defnedildi."]},{"id":"aise","ad":"Hz. Âişe","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Hz. Peygamber'in eşi, Hz. Ebû Bekir'in kızıdır. En çok hadis rivayet eden sahâbîlerdendir. 58 (678) yılında Medine'de vefat etti.","tdv":"aise","xy":[512.44,173.85],"uzun":["Hz. Âişe, Hz. Ebû Bekir ile Ümmü Rûmân'ın kızıdır. Babasının lakabına nispetle \"Sıddîka\" diye de anılır. Nübüvvetin dördüncü yılında (614) Mekke'de doğduğu kabul edilir.","Hz. Peygamber ile nikâhı hicretten önce Mekke'de kıyıldı; evlilikleri hicretin 2. yılında (624) Medine'de gerçekleşti. Kur'an'ın Peygamber'in eşlerini müminlerin anneleri olarak nitelemesiyle \"Ümmü'l-mü'minîn\" unvanıyla anılır. Hz. Peygamber vefat ettiğinde onun odasında bulunuyordu ve Peygamber bu odaya defnedildi.","Kur'an, sünnet, fıkıh, Arap dili, şiir ve tarih alanlarında geniş bilgisiyle tanınır. 2210 hadis rivayet etmiş, Medine'de kadınların ve erkeklerin başvurduğu bir ilim merkezi olmuştur. Cemel Vak'ası'ndan (36/656) sonra Medine'de siyasetten uzak bir hayat sürdü. Hz. Peygamber'den sonra yaklaşık kırk yedi yıl yaşadı.","17 Ramazan 58 (14 Temmuz 678) tarihinde Medine'de vefat etti. Cenaze namazını Ebû Hüreyre kıldırdı. Vasiyeti üzerine Cennetü'l-Bakî'ye defnedildi."]},{"id":"osman-mazun","ad":"Osman b. Maz'ûn","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"İlk Müslümanlardan ve Habeşistan muhacirlerindendir. Hicretin 2. yılında vefat etti; Bakî'e defnedilen ilk muhacirdir.","tdv":"osman-b-mazun","xy":[512.44,173.85],"uzun":["Osman b. Maz'ûn, Kureyş'in Cumahoğulları koluna mensuptur ve Ebü's-Sâib künyesiyle anılır. Hz. Ebû Bekir aracılığıyla İslâm'ı kabul eden ilk on üç kişiden biridir. Oğlu Sâib ile kardeşleri Kudâme ve Abdullah da ilk Müslümanlar arasındadır.","Birinci Habeşistan hicretine katıldı. Mekke'de Müslümanların rahatladığı yönündeki asılsız bir haber üzerine geri döndü ve bir süre Velîd b. Mugīre'nin himayesine girdi. Arkadaşlarının işkence gördüğünü görünce bu himayeyi reddederek yalnız Allah'ın himayesine güvendiğini söyledi. Medine'ye hicret etti; Hz. Peygamber onu Ensâr'dan biriyle kardeş ilan etti ve Bedir'de oğluyla birlikte bulundu.","İbadete çok düşkün, haramdan son derece sakınan biriydi; Câhiliye döneminde bile içki içmezdi. Dünyadan tamamen el etek çekmek istediğinde Hz. Peygamber buna izin vermedi; ona oruç tutmasını, eşinin, misafirinin ve nefsinin haklarını gözetmesini tavsiye etti.","Bedir'den sonra 2 (624) yılında vefat etti; Medine'de vefat eden ilk muhacirdir. Hz. Peygamber onun ölümüne çok üzüldü, naaşını öptü ve onu Bakî'ye defnetti. Kabrinin başına bir taş koyarak yerini belirledi; Bakî bu definle kabristan olmaya başladı."]},{"id":"abdurrahman-avf","ad":"Abdurrahman b. Avf","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Cennetle müjdelenen on sahâbîden biridir. Cömertliği ve ticaretiyle tanındı. 32 (652) yılında Medine'de vefat etti.","tdv":"abdurrahman-b-avf","xy":[512.44,173.85],"uzun":["Abdurrahman b. Avf, Kureyş'in Zühreoğulları koluna mensuptur ve Fil Vak'ası'ndan yaklaşık on yıl sonra Mekke'de doğdu. Câhiliye dönemindeki adını Hz. Peygamber Abdurrahman olarak değiştirdi. Genç yaşta ticarete atıldı ve güzel ahlakıyla tanındı. Hz. Ebû Bekir'in davetiyle Müslüman oldu ve ilk sekiz Müslümandan biri sayıldı.","Mekke'deki baskılar yüzünden önce Habeşistan'a, sonra Medine'ye hicret etti. Hz. Peygamber onu Ensâr'dan Sa'd b. Rebî' ile kardeş ilan etti. Bütün gazvelere katıldı; Uhud'da yirmiden fazla yara aldı. 6 (628) yılında Dûmetülcendel seriyyesinin komutanlığına getirildi. Cennetle müjdelenen on sahâbîden biridir.","Hz. Ebû Bekir ve Hz. Ömer dönemlerinde danışmanlık, hac emîrliği ve beytülmâl görevlerinde bulundu. Hz. Ömer'in kurduğu altı kişilik şûrada adaylıktan çekilip seçimi yürüttü ve Hz. Osman'ın halife seçilmesini sağladı. Büyük servetini Allah yolunda harcamasıyla tanınır; bir kervanın tamamını bağışladığı rivayet edilir.","Yetmiş beş yaşlarında, 32 (652) yılında Medine'de vefat etti; cenaze namazını Hz. Osman kıldırdı ve Cennetü'l-Bakî'ye defnedildi. TDV'nin belirttiğine göre Siirt'in Pervari ilçesindeki halk da mezarının Yukarı Balcılar köyünde olduğuna inanır; Türkiye'de başka yerlerde de ona nispet edilen kabirler vardır."]},{"id":"sad","ad":"Sa'd b. Ebû Vakkās","ulke":"SAU","yer":"Medine, Cennetü'l-Bakî","durum":"kabir","ozet":"Cennetle müjdelenen on sahâbîden ve Kādisiyye fâtihidir. 55 (675) yılında Akīk'teki evinde vefat etti, Medine'ye getirilip Bakî'e defnedildi.","tdv":"sad-b-ebu-vakkas","xy":[512.44,173.85],"uzun":["Sa'd b. Ebû Vakkās, 592 yılında Mekke'de doğdu. Babası Zühreoğulları'ndan, annesi Hamne bint Süfyân Ümeyyeoğulları'ndandı. On yedi veya on dokuz yaşında Müslüman oldu; annesi dininden dönmedikçe onunla konuşmayacağına yemin ettiği hâlde imanından vazgeçmedi. İslâm uğrunda ilk kan döken kişi olarak anılır.","Hz. Peygamber'den önce Medine'ye hicret etti. Râbiğ ve Batn-ı Nahle seriyyelerine katıldı, Harrâr seriyyesinde komutanlık yaptı. Bedir'de ve diğer bütün gazvelerde bulundu; Uhud'da attığı oklarla öne çıktı ve Peygamber'in iltifatına mazhar oldu. Cennetle müjdelenen on sahâbîden biridir.","Hz. Ömer döneminde Irak cephesinin başkomutanı oldu ve 15 (636) yılında Kādisiye'de Sâsânîleri yendi. Medâin'in fethinden sonra Celûlâ'yı kazandı ve Kûfe şehrini kurdu; 17-21 (638-642) yıllarında burada vali olarak bulundu. Hz. Osman döneminde bir süre yeniden Kûfe valiliğine getirildi.","Son yıllarını Medine yakınındaki Akīk vadisinde geçirdi ve gözlerini kaybetti. 55 (675) yılında Akīk'te vefat etti. Vasiyeti üzerine Bedir'de giydiği eski cübbeye sarıldı, Medine'ye getirilerek Cennetü'l-Bakî'ye defnedildi."]},{"id":"ibn-abbas","ad":"Abdullah b. Abbas","ulke":"SAU","yer":"Tâif","durum":"kabir","ozet":"Hz. Peygamber'in amcasının oğludur; tefsir ve fıkıhta otoritedir. Hac emirliği ve Basra valiliği yaptı. Yetmiş yaşlarında Tâif'te vefat etti.","tdv":"abdullah-b-abbas","xy":[514.74,184.2],"uzun":["Abdullah b. Abbas, Hz. Peygamber'in amcası Abbas'ın oğludur. Hicretten yaklaşık üç yıl önce, Müslümanların Şi'b-i Ebû Tâlib'de kuşatma altında olduğu yıllarda Mekke'de doğdu. Annesi, Hz. Hatice'den sonra ilk Müslüman olan kadınlardan Ümmü'l-Fazl Lübâbe'dir. Peygamber'in eşi Hz. Meymûne'nin yeğenidir.","Doğduğunda babası onu Hz. Peygamber'e götürdü ve Peygamber onun için dua etti. Peygamber'in yanında kalmaya, söz ve davranışlarını öğrenmeye büyük özen gösterdi. Hz. Peygamber vefat ettiğinde on üç yaşlarındaydı.","Çok hadis rivayet eden sahâbîlerdendir; yaklaşık 1660 hadis nakletmiştir. Tefsirdeki üstünlüğü ilk dönemden itibaren kabul edildi ve \"Tercümânü'l-Kur'ân\" diye anıldı; Arap dili ve nesep bilgisiyle de tanınır. Mekke'de fıkıh otoritesi oldu; İkrime, Mücâhid, Atâ ve Saîd b. Cübeyr gibi büyük tâbiîleri yetiştirdi. Hz. Osman döneminde hac emîrliği, Hz. Ali döneminde Basra valiliği yaptı.","Yetmiş yaşlarında, 68 (687-88) yılında Tâif'te vefat etti. Cenaze namazını Muhammed b. Hanefiyye kıldırdı. Kabri Tâif'tedir ve şehirde onun adını taşıyan bir cami bulunur."]},{"id":"meymune","ad":"Hz. Meymûne","ulke":"SAU","yer":"Mekke yakınında, Serif","durum":"kabir","ozet":"Hz. Peygamber'in eşlerindendir. 51 (671) yılında, nikâhının kıyıldığı Serif'te vefat etti ve oraya defnedildi.","tdv":"meymune","xy":[512.77,183.13],"uzun":["Hz. Meymûne, Hz. Peygamber'in son evlendiği hanımıdır. 590 yılı civarında doğduğu kabul edilir; asıl adı Berre idi, Peygamber adını Meymûne olarak değiştirdi. Annesi Hind bint Avf'tır. Kız kardeşleri arasında İbn Abbas'ın annesi Ümmü'l-Fazl Lübâbe ve Hâlid b. Velîd'in annesi Lübâbe es-Suğrâ vardır.","İslâm'dan önce iki evlilik yapmıştı. İkinci eşinin vefatından sonra Hz. Peygamber ile evlenmek istediğini bildirdi ve Peygamber bunu kabul etti. Nikâh 7 (629) yılının Zilkade ayında, Umretü'l-kazâ dönüşünde Mekke-Medine yolundaki Serif mevkiinde kıyıldı.","Kendisinden 76 hadis rivayet edilmiş, bunların bir kısmı Buhârî ve Müslim'de yer almıştır. Rivayetlerini yeğenleri İbn Abbas ve Yezîd b. Esam gibi isimler nakletmiştir. Hz. Âişe onun takvasını ve akrabalık bağlarına gösterdiği özeni övmüştür. İbn Abbas, Peygamber'in gece ibadetini görmek için zaman zaman teyzesi Meymûne'nin evinde kalmıştır.","51 (671) yılında vefat etti ve nikâhının kıyıldığı Serif'te defnedildi. Cenaze namazını Abdullah b. Abbas kıldırdı. Kabri Serif'teki Nüveyriye mevkiinde, üstü açık bir duvarla çevrili olarak bulunur."]},{"id":"ukbe-amir","ad":"Ukbe b. Âmir el-Cühenî","ulke":"EGY","yer":"Kahire, Mukattam Mezarlığı","durum":"kabir","ozet":"Suffe ashabından, kıraat ve fıkıh bilen bir sahâbîdir. Usta bir okçu ve hadis râvisiydi; Muâviye döneminde Mısır valiliği yaptı. Mukattam Mezarlığı'ndaki kabri bugün de ziyaret edilir.","tdv":"ukbe-b-amir","xy":[490.06,155.83],"uzun":["Ukbe b. Âmir el-Cühenî, Cüheyne kabilesinden bir sahâbîdir. Müslüman olmadan önce çölde çobanlık yapıyordu. Hz. Peygamber'in hicret ettiğini duyunca Medine'ye gitti ve bedevîler gibi yalnızca bağlılık yemini etmekle yetinmeyip muhacirler gibi hicret biatı yaptı.","Bir süre çölde kaldıktan sonra Suffe ashabına katılarak dinî bilgisini derinleştirdi. Gazvelere katıldı ve zekât toplamak üzere görevlendirildi. Hz. Peygamber'in iki kişi arasındaki bir anlaşmazlığı ona çözdürmesi, ilmine duyulan güvenin göstergesi sayılır.","Peygamber'in vefatından sonra fetihlere katıldı; Dımaşk'ın fethini Hz. Ömer'e müjdelemek üzere gönderildi. Mısır'ın fethinde bulundu ve 44 (664) yılında Muâviye tarafından Mısır valiliğine atandı. Kıraat, fıkıh, ferâiz ve hadis alanlarında tanındı; rivayetleri Kütüb-i Sitte'nin tamamında yer alır. Usta bir okçu olduğu da bilinir.","Mısır'da vefat etti ve Kahire'deki Mukattam Mezarlığı'na defnedildi. 1066 (1655) yılında Osmanlı Mısır valisi Silâhdar Mehmed Paşa kabrinin yanına küçük bir mescid yaptırdı. Kabri bugün de ziyaret edilmektedir."]},{"id":"amr-as","ad":"Amr b. Âs","ulke":"EGY","yer":"Kahire, Mukattam eteği","durum":"rivayet","ozet":"Mısır'ı fethedip valisi olan sahâbîdir. Filistin fethinde de büyük rol oynadı. Doksan yaşını aşmış olarak Mısır'da vefat etti.","tdv":"amr-b-as","not":"Mısır'da vefat ettiği kesindir; kabrinin Mukattam eteğinde olduğu rivayet edilir.","xy":[490.06,155.83],"uzun":["Amr b. Âs, Kureyş'in Sehmoğulları koluna mensuptur ve Mekke'de doğdu. Müslüman olmadan önce Mekke'nin ticaret ve siyaset hayatında önemli bir yeri vardı; Habeşistan'a hicret eden Müslümanların geri verilmesini istemek için Necâşî'ye elçi olarak gönderilmişti. Uhud ve Hendek'te Kureyş süvarilerine komuta etti. 1 Safer 8 (31 Mayıs 629) tarihinde, Mekke'nin fethinden önce Medine'ye giderek Müslüman oldu.","Hz. Peygamber onu Zâtüsselâsil seriyyesinin başına getirdi. Ardından Umman hükümdarlarını İslâm'a davet etmek ve zekât toplamak üzere oraya gönderdi. Peygamber'in vefatı sırasında Umman'daydı; haberi alınca Medine'ye dönüp Hz. Ebû Bekir'e biat etti.","Hz. Ebû Bekir döneminde Filistin fethini yönetti; Ecnâdeyn ve Yermük savaşlarına katıldı. Hz. Ömer döneminde Filistin'i tamamen İslâm hâkimiyetine aldı. Halifeyi ikna ederek Mısır seferine çıktı; Babilon'u ve 21 (642) yılında İskenderiye'yi alarak Mısır'ı fethetti ve \"Mısır fâtihi\" olarak anıldı. Valilikten bir süre uzak kaldıktan sonra 38 (658) yılında yeniden Mısır valisi oldu.","Hâricîler aynı gün Hz. Ali, Muâviye ve Amr'ı öldürmeyi planladı; o gün namazı kıldırmaya Amr yerine başkası çıktığı için kurtuldu. 43 (664) yılında Ramazan Bayramı günü, doksan yaşını aşmış olarak Mısır'da vefat etti ve oğlu Abdullah tarafından defnedildi. TDV kabrinin tam yerini belirtmez; Mukattam eteğinde olduğu rivayet edilir."]},{"id":"halid","ad":"Hâlid b. Velîd","ulke":"SYR","yer":"Humus","durum":"kabir","ozet":"Hz. Peygamber'den \"Seyfullah\" (Allah'ın kılıcı) unvanını aldı. Irak ve Suriye fetihlerinde, Ecnâdeyn ve Yermük zaferlerinde komutandı. Humus'ta vefat etti; kabri oradadır.","tdv":"halid-b-velid","xy":[504.48,140.66],"uzun":["Hâlid b. Velîd, 583-587 yılları arasında Mekke'de doğdu ve Kureyş'in Mahzûmoğulları koluna mensuptu. Babası Velîd b. Mugīre kabilenin ileri gelenlerindendi; annesi Hz. Meymûne'nin kız kardeşiydi. Uzun süre İslâm'a karşı savaştı. Hudeybiye'den sonra düşüncesi değişti ve 8 Safer 8 (31 Mayıs 629) tarihinde Medine'ye giderek Müslüman oldu.","Katıldığı ilk savaş olan Mûte'de (8/629), üç komutanın şehadetinden sonra orduyu büyük bir yıkımdan kurtardı; bunun üzerine Hz. Peygamber ona \"Seyfullah\" (Allah'ın kılıcı) unvanını verdi. Mekke'nin fethinde (8/630) bir kolun komutanı olarak şehre girdi ve Nahle'deki Uzzâ putunu yıktı.","Hz. Ebû Bekir döneminde irtidat hareketlerini bastırmakla görevlendirildi; Tuleyha ve Müseylime'ye karşı yapılan savaşlarda belirleyici rol oynadı. Ardından Irak'a gönderildi ve Hîre, Enbâr ve Aynüttemr gibi yerleri fethetti. Suriye cephesine geçerek Ecnâdeyn (13/634), Fihl, Dımaşk ve Yermük (15/636) zaferlerinde öne çıktı.","Hz. Ömer 17 (638) veya 18 (639) yılında onu komutanlıktan aldı; bundan sonra Ebû Ubeyde'nin emrinde görev yaptı. Ömrünün son yıllarını Humus'ta geçirdi ve 21 (642) yılında orada vefat etti. Kabri Humus'tadır; üzerine Hâlid b. Velîd Camii yapılmıştır."]},{"id":"bilal","ad":"Bilâl-i Habeşî","ulke":"SYR","yer":"Şam, Bâbüssağîr Kabristanı","durum":"kabir","ozet":"Hz. Peygamber'in ilk müezzinidir. İşkencelere rağmen imanından dönmedi; Hz. Ebû Bekir onu satın alıp âzat etti. Peygamber'in vefatından sonra Suriye'ye gitti ve Dımaşk'ta vefat etti.","tdv":"bilal-i-habesi","xy":[503.39,144.6],"uzun":["Bilâl b. Rebâh el-Habeşî, Habeş asıllı bir sahâbîdir. Hicretten yaklaşık kırk yıl önce köle bir ailenin çocuğu olarak dünyaya geldi; babası Rebâh, annesi Hamâme de köleydi. Cumahoğulları'ndan Ümeyye b. Halef'in kölesiydi.","Hz. Ebû Bekir aracılığıyla Müslüman oldu ve imanını açıkça ilan eden ilk yedi kişiden biri oldu. Ümeyye onu öğle sıcağında kızgın kumlara yatırıp göğsüne büyük bir kaya koydurarak dininden döndürmeye çalıştı; Bilâl her seferinde \"Ehad, ehad\" (Allah birdir) diyerek dayandı. Hz. Ebû Bekir onu satın alıp âzat etti.","Hicretin birinci veya ikinci yılında ezan meşru kılınınca ilk ezanı o okudu ve Hz. Peygamber'in müezzini oldu. Bedir dahil bütün gazvelere katıldı; Mekke'nin fethinde Kâbe'nin damına çıkarak ezan okudu. Sabah ezanına \"es-salâtü hayrun mine'n-nevm\" ifadesini eklemesi Peygamber tarafından onaylandı.","Hz. Peygamber'in vefatından sonra ezan okumadığı rivayet edilir. Hz. Ömer döneminde Suriye'ye giderek fetihlere katıldı. 20 (641) yılında altmış küsur yaşında Dımaşk'ta vefat etti ve Bâbüssağîr Kabristanı'na defnedildi."]},{"id":"ebud-derda","ad":"Ebü'd-Derdâ","ulke":"SYR","yer":"Şam, Bâbüssağîr Kabristanı","durum":"kabir","ozet":"Ensâr'dan, Kur'an'ı Hz. Peygamber hayattayken ezberleyen sahâbîdir. Dımaşk'ın ilk kadısı oldu. 32 (652) yılında Dımaşk'ta vefat etti.","tdv":"ebud-derda","not":"İstanbul'da Eyüp ve Üsküdar'da adına birer makam kabir vardır.","xy":[503.39,144.6],"uzun":["Ebü'd-Derdâ Uveymir b. Kays, Hazrec kabilesine mensup Ensâr'dan bir sahâbîdir. Ticaretle uğraşırken arkadaşı Abdullah b. Revâha'nın etkisiyle Müslüman oldu; Ensâr'dan İslâm'a en son girenlerden biri olduğu rivayet edilir. Hz. Peygamber onu Selmân-ı Fârisî ile kardeş yaptı.","Müslüman olduktan sonra ticaretle ibadeti bir arada yürütemeyeceğini anlayıp kendini ibadete verdi. Hz. Peygamber hayattayken Kur'ân-ı Kerîm'i ezberledi ve tamamını Peygamber'e okudu. Uhud'dan sonraki gazvelere katıldı.","Yermük Savaşı'nda ordu kadısı olarak görev yaptı. Hz. Ömer'in emriyle Dımaşk'ın ilk kadısı oldu ve aynı zamanda Kur'an öğretimini sürdürdü; kıraat halkalarına çok sayıda öğrenci katılırdı. Zühdü, dünya malına değer vermeyişi ve hikmetli sözleriyle tanınır.","32 (652) yılında Dımaşk'ta vefat etti ve Bâbüssağîr Kabristanı'na defnedildi. 1938'de Muâviye'nin kabrinin yakınında, biri ona ait olduğu düşünülen iki mezar taşı bulundu. İstanbul'da Eyüp ve Üsküdar'da adına makam kabirleri bulunur."]},{"id":"muaviye","ad":"Muâviye b. Ebû Süfyân","ulke":"SYR","yer":"Şam, Bâbüssağîr Kabristanı","durum":"kabir","ozet":"Vahiy kâtiplerinden biridir; uzun yıllar Suriye valiliği yaptı ve Emevî Devleti'ni kurdu. İlk İslâm donanmasını kurdurdu. 60 (680) yılında Dımaşk'ta vefat etti.","tdv":"muaviye-i","xy":[503.39,144.6],"uzun":["Muâviye b. Ebû Süfyân, 602 veya 603 yılında Mekke'de doğdu. Babası Ebû Süfyân, annesi Hind bint Utbe'dir; kız kardeşi Ümmü Habîbe Hz. Peygamber'in eşi olduğu için Peygamber'in kayınbiraderidir. Babasının İslâm'a karşı mücadele ettiği bir ortamda büyüdü ve Mekke'nin fethi sırasında babasıyla birlikte Müslüman oldu.","Müslüman olduktan sonra Hz. Peygamber'in kâtipleri arasında yer aldı. Peygamber'in vefatından sonra Suriye'ye gönderilen ordularda görev yaptı. Hz. Ömer onu 17 (638) yılında Ürdün, ertesi yıl Dımaşk valisi yaptı. Filistin'in sahil şehirlerini aldı ve Bizans tersanelerinden yararlanarak İslâm donanmasının ilk birliklerini kurdu.","Hz. Osman döneminde Suriye'nin tamamının valisi oldu ve 28 (649) yılında Kıbrıs seferini düzenledi. Sıffîn ve Hakem Vak'ası'ndan sonra, Hz. Hasan'ın hilâfeti bırakmasıyla 41 (661) yılında halife oldu ve Emevî Devleti'ni kurdu. Döneminde 49 (669) yılında ilk İstanbul kuşatması yapıldı, doğuda Kâbil, Buhara ve Semerkant'a seferler düzenlendi, Kuzey Afrika'da Kayrevan kuruldu. Oğlu Yezîd'i veliaht tayin ederek hilâfeti hânedana dayalı bir yönetime dönüştürdü.","60 (680) yılının Receb ayında Dımaşk'ta vefat etti ve Bâbüssağîr Kabristanı'na defnedildi. Aynı gün yerine oğlu Yezîd geçti."]},{"id":"ammar","ad":"Ammâr b. Yâsir","ulke":"SYR","yer":"Rakka yakınında, Sıffîn","durum":"kabir","ozet":"İlk Müslümanlardan Yâsir ile Sümeyye'nin oğludur; ailesiyle birlikte ağır işkencelere uğradı. Hz. Ömer döneminde Kûfe valisi oldu. Hz. Ali'nin safında Sıffîn Savaşı'nda şehid edildi ve oraya defnedildi.","tdv":"ammar-b-yasir","xy":[510.45,136.72],"uzun":["Ammâr b. Yâsir, Ebü'l-Yakzân künyesiyle anılır. Babası Yâsir Yemen'den Mekke'ye gelmiş, Mahzûmoğulları'nın himayesine girerek Sümeyye ile evlenmişti. Ammâr, Dârülerkam döneminde Müslüman oldu ve imanını açıkça ilan eden ilk yedi kişiden biri oldu. Annesi, babası ve kardeşi de Müslüman oldu.","Ailenin Mekke'de koruyucusu olmadığı için Kureyşliler onlara ağır işkenceler yaptı. Annesi Sümeyye Ebû Cehil tarafından öldürülerek İslâm'ın ilk şehidi oldu, babası Yâsir de işkence altında can verdi. Dayanılmaz işkence altında müşriklerin istediği sözleri söylemek zorunda kalan Ammâr, Hz. Peygamber'e geldiğinde Peygamber onun kalbinin imanla dolu olduğunu söyledi ve bu konuda âyet indi.","Medine'de Mescid-i Nebevî'nin inşasında büyük gayret gösterdi. Peygamber'in bütün savaşlarına katıldı; Yemâme'de bir kulağını kaybetti. Hz. Ömer onu 21 (641-42) yılında Kûfe valiliğine atadı; bu dönemde Nihâvend ve Hûzistan fetihlerinde bulundu.","Cemel ve Sıffîn'de Hz. Ali'nin safında yer aldı. Doksan yaşını aşmış olmasına rağmen Sıffîn'de savaşırken 37 (657) yılında şehid edildi. Hz. Ali'nin kıldırdığı cenaze namazından sonra Sıffîn'de, bugünkü Rakka yakınlarında defnedildi."]},{"id":"ebu-ubeyde","ad":"Ebû Ubeyde b. Cerrâh","ulke":"JOR","yer":"Ürdün Vadisi, Ebû Ubeyde köyü","durum":"kabir","ozet":"Cennetle müjdelenen on sahâbîden biridir; Hz. Peygamber ona \"Emînü'l-ümme\" (ümmetin güvenilir kişisi) dedi. Suriye ordularının başkomutanı olarak Dımaşk ve Kudüs'ün fethinde bulundu. 18 (639) yılında Amvâs vebasında vefat etti.","tdv":"ebu-ubeyde-b-cerrah","xy":[501.58,148.84],"uzun":["Ebû Ubeyde Âmir b. Abdullah b. Cerrâh, Kureyş'in Fihr koluna mensuptur. 583 yılında Mekke'de doğdu. Hz. Peygamber'in davetinin ilk günlerinde, Dârülerkam dönemi başlamadan önce Hz. Ebû Bekir aracılığıyla Müslüman oldu. Kureyş'in baskısına uğradı ve ikinci Habeşistan hicretine katıldı.","Medine'ye hicret edince Hz. Peygamber onu Sa'd b. Muâz ile kardeş yaptı. Bedir ve Uhud dahil bütün gazvelere katıldı; Uhud'da Peygamber'in yanından ayrılmayanlar arasındaydı. Necran'a gönderildiğinde Peygamber onun için \"bu ümmetin emini\" dedi; bu yüzden \"Emînü'l-ümme\" lakabıyla anıldı. Cennetle müjdelenen on sahâbîden biridir.","Hz. Ebû Bekir döneminde devletin mali işlerini yürüttü, ardından Suriye'ye gönderilen ordulardan birinin komutanı oldu. Hz. Ömer onu Suriye ordularının başkomutanlığına getirdi; Dımaşk, Humus, Halep, Antakya ve Kudüs gibi şehirler onun döneminde fethedildi. Fethedilen bölgeleri ömrünün sonuna kadar vali olarak yönetti.","18 (639) yılında Amvâs veba salgınına yakalandı ve vefat etti. Kabri bugün Ürdün Vadisi'ndeki kendi adını taşıyan köydedir. Memlük Sultanı Baybars 1277'de kabrin üzerine bir kubbe yaptırdı; yanındaki mescid XX. yüzyılda Ürdün krallarınca yeniden yaptırılıp genişletildi."]},{"id":"muaz","ad":"Muâz b. Cebel","ulke":"JOR","yer":"İrbid, Muâz b. Cebel köyü","durum":"kabir","ozet":"Kur'an ve fıkıh bilgisiyle tanınan Ensâr'dan sahâbîdir. Hz. Peygamber onu Yemen'e elçi, zekât memuru ve kadı olarak gönderdi. 18 (639) yılında Amvâs vebasında vefat etti.","tdv":"muaz-b-cebel","xy":[502.24,147.7],"uzun":["Muâz b. Cebel, Hazrec kabilesine mensup Ensâr'dan bir sahâbîdir ve Ebû Abdurrahman künyesiyle anılır. 603 yılında Medine'de doğduğu kaydedilir. On sekiz yaşında Müslüman oldu ve İkinci Akabe Biatı'na katıldı. Kabilesindeki gençlerle birlikte putları devirerek onların âcizliğini göstermeye çalıştı.","Hz. Peygamber onu Abdullah b. Mes'ûd ile kardeş yaptı. Tâif ve Huneyn dışındaki gazvelerin hemen hepsine katıldı. Mekke'nin fethinden sonra şehirde Kur'an ve dinî bilgileri öğretmekle görevlendirildi. Kur'an'ın tamamını ezberleyen sahâbîlerdendir; Peygamber onu helâli ve haramı en iyi bilen kişi olarak övmüştür.","9 (630) yılında Hz. Peygamber onu Yemen'e elçi, zekât memuru ve kadı olarak gönderdi. Yemen'de Esved el-Ansî'nin isyanının bastırılmasında rol oynadı. Suriye fetihlerine katıldı; Hz. Ömer döneminde Ebü'd-Derdâ ve Ubâde b. Sâmit ile birlikte Suriye'ye öğretmen olarak gönderildi. Ebû Ubeyde'nin vefatından sonra ordunun başına geçti.","18 (639) yılında Amvâs veba salgınında iki oğlu ve eşleriyle birlikte vefat etti. Kabri bugün Ürdün'ün İrbid vilayetinde, kendi adını taşıyan köydedir; üzerine küçük bir mescid ve türbe yapılmıştır."]},{"id":"surahbil","ad":"Şürahbîl b. Hasene","ulke":"JOR","yer":"Ürdün Vadisi, Vâdilyâbis köyü","durum":"kabir","ozet":"Habeşistan muhacirlerindendir; Hz. Peygamber'in vahiy kâtipliğini yaptı. Ecnâdeyn ve Yermük'te komutandı. 18 (639) yılında Amvâs vebasında vefat etti.","tdv":"surahbil-b-hasene","not":"Kabrinin Kilis'te olduğu yönündeki rivayetler TDV'ye göre doğru değildir.","xy":[501.58,148.84],"uzun":["Şürahbîl b. Hasene, 573-574 yıllarında Mekke'de doğdu; aslen Kinde kabilesindendir. Babası erken öldüğü için annesi Hasene'nin adıyla anıldı. Okuma yazma bilmesi sayesinde Mekke'de itibar gördü. Yaklaşık otuz beş yaşında ailesiyle birlikte Müslüman oldu.","İlk Müslümanlarla birlikte baskıya uğradı ve ikinci kafileyle Habeşistan'a hicret etti. 7 (628) yılında Hayber Gazvesi sırasında Medine'ye geldi. Birçok seriyye ve gazveye katıldı, Hz. Peygamber'in vahiy kâtipliğini yaptı ve bazı antlaşma metinlerini yazdı.","Hz. Ebû Bekir döneminde Suriye'ye gönderilen dört ordudan birinin komutanı oldu. Busrâ'nın kuşatılmasında bulundu, Ecnâdeyn'de (13/634) sağ kanadı yönetti. Fihl ve Dımaşk'ın fethinde, Yermük zaferinde (15/636) önemli görevler üstlendi; Kudüs'ün teslim alınışında Hz. Ömer'le birlikte şehre girdi. Akkâ, Sûr ve Taberiye'yi fethetti.","18 (639) yılında Amvâs veba salgınında vefat etti. Kabri, Ürdün'deki Vâdilyâbis köyünde bir caminin son cemaat yerinde özel bir bölmededir. TDV'ye göre kabrinin Kilis'te olduğu yönündeki rivayetler doğru değildir."]},{"id":"dirar","ad":"Dırâr b. Ezver","ulke":"JOR","yer":"Ürdün Vadisi, Dırâr köyü","durum":"kabir","ozet":"Esedoğulları'ndan, 630'da Medine'ye gelip Müslüman olan sahâbîdir. Hâlid b. Velîd'in ordusunda Ridde savaşları ve fetihlerde yer aldı. Kabri Dırâr köyünde küçük bir mescidin içindedir.","tdv":"dirar-b-ezver","xy":[501.58,148.84],"uzun":["Dırâr b. Ezver, Esedoğulları'nın varlıklı bir kolundandır. Babasının \"eğri boyunlu\" anlamındaki Ezver lakabıyla tanındı. 9 (630) yılında kabilesinin heyetiyle Medine'ye gelerek Hz. Peygamber'in huzurunda şiir okudu ve Müslüman oldu. Peygamber onu bazı kabilelere elçi olarak gönderdi.","Tuleyha b. Huveylid peygamberlik iddiasında bulununca Dırâr, Esedoğulları'nın durumunu izlemekle görevlendirildi. Peygamber'in vefatından sonra kabilesindeki Müslümanları Tuleyha'ya karşı toplamaya çalıştı.","Hâlid b. Velîd'in ordusunda yalancı peygamberlere karşı yapılan savaşlarda ve fetihlerde yer aldı; 12 (633) yılındaki Yemâme Savaşı'nda büyük kahramanlık gösterdi. Irak ve Suriye fetihlerinde de bulundu.","13 (634) yılında Ecnâdeyn'de şehid düştüğü anlaşılmaktadır; bazı tarihçiler ise 18 (639) yılında vefat ettiğini kaydeder. Kabri Ürdün Vadisi'ndeki Dırâr köyünde, küçük bir mescidin içindedir."]},{"id":"zeyd-harise","ad":"Zeyd b. Hârise","ulke":"JOR","yer":"Kerek, Mûte yakınında (el-Mezâr)","durum":"kabir","ozet":"Hz. Peygamber'in âzatlısı ve evlatlığıdır; adı Kur'an'da geçen tek sahâbîdir. 8 (629) yılında Mûte Savaşı'nda ordunun ilk komutanı olarak şehid düştü.","tdv":"zeyd-b-harise","xy":[501.85,152.14],"uzun":["Zeyd b. Hârise, Yemen kökenli Kelb kabilesine mensup bir sahâbîdir ve Ebû Üsâme künyesiyle anılır. Çocukken annesiyle akrabalarını ziyarete giderken kaçırıldı ve Ukâz panayırında köle olarak satıldı. Hz. Hatice onu satın alıp Hz. Peygamber'e hediye etti. Ailesi onu fidye ile geri almaya geldiğinde Peygamber'in yanında kalmayı tercih etti.","Hz. Peygamber onu Kâbe'nin yanında evlatlık edindiğini ilan etti ve âzat etti; bir süre \"Zeyd b. Muhammed\" diye anıldı. Ahzâb sûresindeki âyetle evlatlıkların kendi babalarının adıyla çağrılması emredilince yeniden babasının adıyla anıldı. Peygamber'e ilk iman edenlerdendir; Kur'ân-ı Kerîm'de adı geçen tek sahâbîdir.","Bedir, Uhud, Hendek, Hudeybiye ve Hayber'e katıldı; Bedir zaferinin müjdesini Medine'ye o getirdi. Birçok seriyyede komutanl
