":"Hz. İbrahim A.S.","il":"El Halil","u":"PSX","oz":"Peygamberlerin atası, \"Halîlullah\" diye anılan peygamberdir.","not":"Halil'deki Haram-ı İbrâhîmî'de (Mahpele mağarası) eşi Sâre, oğlu İshak ve torunu Yâkub ile birlikte yattığına inanılır. Farklı rivayetler bulunmaktadır.","q":"İbrahim","xy":[500.26,151.0],"uzun":["Hz. İbrâhim, Kur'ân-ı Kerîm'de \"Halîlullah\" (Allah'ın dostu) diye anılan büyük peygamberlerdendir. Rivayetlere göre Nemrud döneminde doğdu. Yıldızlara, aya ve güneşe bakarak bunların batıp kaybolduğunu görünce ilâh olamayacaklarını söyledi ve bir tek Allah'a yöneldi. Babası Âzer'in put yapımcısı olması, putperestliğe karşı mücadelesini daha da belirgin kıldı.","Kavmi bayram için şehir dışına çıktığında putların çoğunu kırdı ve baltayı büyük putun boynuna astı. Sorguya çekilince bunu büyük putun yaptığını söyleyerek kavmini düşünmeye sevk etti. Nemrud onu ateşe attırdı; Allah'ın \"Ey ateş, İbrâhim'e serin ve selâmet ol\" emriyle ateş ona zarar vermedi.","Eşi Sâre ve yeğeni Lût ile birlikte Harran'a, oradan Filistin ve Mısır'a hicret etti. Hâcer'den olan oğlu İsmâil ile annesini Mekke'ye, bugünkü Kâbe'nin bulunduğu yere bıraktı. Daha sonra oğluyla birlikte Kâbe'nin temellerini yükseltti ve insanları hacca çağırmakla görevlendirildi.","Ehl-i sünnet kaynaklarının çoğunluğuna göre oğlu İsmâil'i kurban etmekle imtihan edildi ve teslimiyetini gösterdi; Allah oğlunun yerine bir koç gönderdi. Kurban ibadeti ve haccın birçok menâsiki bu hatırayı yaşatır. Müslümanlar her namazda okunan salli-bârik dualarında onu Hz. Peygamber ile birlikte anar.","Kur'an onun nerede vefat ettiğini bildirmez; İslâmî kaynaklarda 175 veya 200 yaşında vefat ettiği nakledilir. Naaşı Hebron'da, eşi Sâre'nin yanına defnedildi; şehir bu yüzden onun lakabıyla \"el-Halîl\" diye anılır. Kabrinin bulunduğu Harem-i İbrâhîmî'de Hz. İshak, Hz. Ya'kūb ve eşlerinin kabirleri de bulunur."]},{"k":"p","ad":"Hz. İshak A.S.","il":"El Halil","u":"PSX","oz":"Hz. İbrâhim ile Hz. Sâre'nin oğlu olan peygamberdir.","not":"Halil'deki Haram-ı İbrâhîmî'de yattığına inanılır. Farklı rivayetler bulunmaktadır.","q":"İshak","xy":[500.26,151.0],"uzun":["Hz. İshak, Hz. İbrâhim ile Hz. Sâre'nin oğludur. Kur'an'a göre melekler, ayakta duran Sâre'ye ve İbrâhim'e İshak'ı, ardından da onun oğlu Ya'kūb'u müjdelediler. Yaşlı olan Sâre bu müjdeye şaşırdı.","Kur'ân-ı Kerîm'de on yedi yerde, çoğunlukla babası İbrâhim ile birlikte anılır. Kendisine vahiy gönderildiği, hidayete erdirildiği ve sâlihlerden olduğu bildirilir. Kur'an'ın üslubu, İshak'ın kurban imtihanından sonra ikinci çocuk olarak müjdelendiğine işaret eder.","Evliliğinden sonra ikiz çocukları oldu; bunlardan Ya'kūb İsrâiloğulları'nın atası olan peygamberdir. Hz. İshak'ın soyundan pek çok peygamber gelmiştir.","İslâmî kaynaklara göre 170 yaşında vefat etti ve çocukları onu babası İbrâhim'in yanına, Hebron'daki mağaraya defnetti. Kabri bugün el-Halîl şehrindeki Harem-i İbrâhîmî'dedir."]},{"k":"p","ad":"Hz. Sare","il":"El Halil","u":"PSX","oz":"Hz. İbrâhim'in eşi ve Hz. İshak'ın annesidir.","not":"Halil'deki Haram-ı İbrâhîmî'de yattığına inanılır. Farklı rivayetler bulunmaktadır.","q":"Sare","xy":[500.26,151.0],"uzun":["Hz. Sâre, Hz. İbrâhim'in ilk eşi ve Hz. İshak'ın annesidir. İbrâhim'e ilk iman edenlerdendir ve onunla birlikte Harran'dan Filistin'e, oradan Mısır'a hicret etmiştir.","Uzun yıllar çocuğu olmadı ve Hâcer'i İbrâhim'e verdi; Hâcer'den İsmâil dünyaya geldi. Kur'an'a göre yaşlılığında melekler ona ve İbrâhim'e İshak'ı, ardından da Ya'kūb'u müjdeledi; o da bu müjdeye hayretle karşılık verdi (Hûd 11/71-73).","TDV'nin İbrâhim maddesine göre Hz. İbrâhim vefat edince Hebron'da Sâre'nin yanına defnedilmiştir. Kabri, el-Halîl şehrindeki Harem-i İbrâhîmî'de, Hz. İbrâhim'in kabrinin karşısındadır."]},{"k":"p","ad":"Hz. Davud A.S.","il":"Kudüs","u":"PSX","oz":"Kendisine Zebur verilen peygamber ve hükümdardır.","not":"Kudüs'teki Sion tepesinde ona nispet edilen makam bulunur. Farklı rivayetler bulunmaktadır.","q":"Davud","xy":[500.58,150.19],"uzun":["Hz. Dâvûd, İsrâiloğulları'na gönderilen ve kendisine Zebûr verilen peygamberdir. Beytlehem'de yaşayan Yahûdâ soyundandır. Tâlût'un ordusu Câlût ile karşılaştığında genç Dâvûd, sapanıyla Câlût'u öldürdü; bu olay Bakara sûresinde anlatılır.","Tâlût'tan sonra hükümdar oldu, Kudüs'ü başşehir yaptı ve devleti adaletle yönetti. Kur'an'a göre kendisine hükümdarlık, hikmet ve doğru hüküm verme yeteneği bahşedildi. Zebûr'u gür ve güzel sesiyle okurdu.","Kur'an, ona demirin yumuşatıldığını ve zırh yapmayı öğrendiğini, dağların ve kuşların onunla birlikte Allah'ı tesbih ettiğini bildirir. İbadete son derece düşkündü; Hz. Peygamber, bir gün oruç tutup bir gün yemesini ve gecenin bir kısmında kalkıp ibadet etmesini en sevimli namaz ve oruç olarak övmüş, elinin emeğiyle geçinmesini örnek göstermiştir.","Kaynaklara göre kırk yıl hüküm sürdü ve Kudüs'te defnedildi. Kudüs'te Sion tepesinde bulunan ve Osmanlı döneminde Nebî Dâvûd Camii olarak kullanılan yapı, kabri olarak ziyaret edilmiştir; farklı rivayetler bulunmaktadır."]},{"k":"p","ad":"Hz. Nuh A.S. Makamı","il":"Şırnak","u":"TUR","oz":"Tufandan sonra gemisi Cûdî'ye oturan peygamberdir.","not":"Cizre'deki makam ona nispet edilir. Farklı rivayetler bulunmaktadır.","q":"Nuh Makamı","xy":[519.55,132.02],"uzun":["Hz. Nûh, Kur'ân-ı Kerîm'de ülü'l-azm olarak anılan beş büyük peygamberden biridir. Adı Kur'an'da kırk üç yerde geçer ve 71. sûre onun adını taşır. Kavmi putlara tapmaya başlayınca onları tevhide çağırdı ve bu davetini çok uzun yıllar sürdürdü.","Kavmi onu dinlemedi, alaya aldı ve tehdit etti. Allah'ın emriyle bir gemi yaptı; iman edenler ve her hayvan türünden birer çift gemiye bindirildi. Tûfan inkârcıları helâk etti; Nûh ve beraberindekiler kurtuldu, iman etmeyen oğlu ise boğulanlar arasında kaldı.","Kur'an'a göre tûfandan sonra gemi Cûdî dağına oturdu (Hûd 11/44). Bu dağ Şırnak'ın Cizre ilçesi yakınındadır ve İslâmî kaynaklarda asırlardır geminin indiği yer olarak anılır. İnsanlık oğulları Sâm, Hâm ve Yâfes'in soyundan yeniden çoğalmıştır.","Kabrinin yeri bilinmemektedir; TDV, Mekke'de Mescid-i Harâm'da, Kerek'te, Cizre'de veya Necef'te olduğuna dair rivayetler bulunduğunu nakleder. Cizre'deki Nûh Nebî Camii ve türbesi, Cûdî'ye yakınlığı sebebiyle onun makamı olarak ziyaret edilmektedir."]},{"k":"p","ad":"Meryem Ana Makamı","il":"İzmir","u":"TUR","oz":"Hz. Îsâ'nın annesi Hz. Meryem'e nispet edilen yerdir.","not":"Efes yakınındaki Meryem Ana Evi olarak bilinir. Farklı rivayetler bulunmaktadır.","q":"Meryem Ana Makamı","xy":[480.37,129.33],"uzun":["Hz. Meryem, Kur'ân-ı Kerîm'de adı doğrudan anılan tek kadındır ve onun adını taşıyan bir sûre vardır. Annesi, doğacak çocuğunu mabede adamıştı; kız doğunca adını Meryem koydu ve onu şeytandan korunması için Allah'a emanet etti (Âl-i İmrân 3/35-37).","Mabede teslim edildikten sonra himayesi için kura çekildi ve kura Hz. Zekeriyyâ'ya çıktı. Zekeriyyâ, onun mihrabında her seferinde Allah katından gelen rızıklar buldu. Kur'an, onu Allah'ın seçtiği ve âlemlerin kadınlarına üstün kıldığı bir kul olarak anar.","Melek ona Allah'tan bir kelime olan Îsâ'yı müjdeledi; o, kendisine hiçbir erkeğin dokunmadığını söyleyince Allah'ın dilediğini \"ol\" diyerek yarattığı bildirildi. Doğum sancısı başlayınca bir hurma ağacına yaslandı; kavmi onu kınayınca beşikteki Îsâ konuşarak annesinin temizliğine şahitlik etti.","Kur'an ve İslâmî kaynaklar hayatının sonrasına dair ayrıntı vermez; bir rivayete göre Hz. Îsâ'dan sonra altı yıl yaşamıştır. İzmir Selçuk'taki Bülbüldağı'ndaki ev, Hristiyan geleneğine göre son yıllarını geçirdiği yer olarak ziyaret edilir. TDV, bu evin Hristiyan rivayetlerine dayandığını, İslâmî bir dayanağı bulunmadığını ve arkeolojik bulguların yapının daha geç bir döneme ait olduğunu gösterdiğini belirtir."]},{"k":"p","ad":"Hz. Havva Valide","il":"Cidde","u":"SAU","oz":"İnsanlığın annesi Hz. Havvâ'ya nispet edilen kabirdir.","not":"Cidde'deki bu kabir XX. yüzyılda kaldırılmıştır. Farklı rivayetler bulunmaktadır.","q":"Havva Valide","xy":[511.39,183.49],"uzun":["Hz. Havvâ, ilk insan ve ilk peygamber Hz. Âdem'in eşidir. Kur'ân-ı Kerîm onun yaratılışını ayrıntılı anlatmaz, yalnızca Âdem'in eşi olarak anar. Bazı hadislerde geçen kaburga kemiği ifadesini âlimlerin bir kısmı mecazi olarak yorumlamıştır.","Kur'an'a göre şeytan hem Âdem'i hem Havvâ'yı kandırdı ve ikisi yasak ağaçtan yedi; Kur'an bu ilk hatada kadını tek sorumlu tutmaz. İkisi de hatalarını anlayıp \"Rabbimiz, biz kendimize zulmettik\" diyerek tövbe ettiler ve yeryüzüne indirildiler.","Kābil, Hâbil ve Şît onun çocuklarıdır. Bazı İslâmî rivayetlere göre Havvâ yirmi batında kırk çocuk dünyaya getirmiş ve insanlık onların neslinden çoğalmıştır.","Kur'an dışı İslâmî rivayetlere göre Âdem'den bir yıl sonra vefat etti ve onun yanına defnedildi. TDV'ye göre Cidde'de ona nispet edilen ve Evliya Çelebi'nin de ziyaret ettiği bir kabir vardı; bu kabir sonradan yıktırılmıştır. Asıl kabrinin yeri bilinmemektedir; şehrin adının da bu kabirle ilişkilendirildiği rivayet edilir."]},{"k":"p","ad":"Hz. Harun A.S.","il":"Ma'an Valiliği","u":"JOR","oz":"Hz. Mûsâ'nın kardeşi ve yardımcısı olan peygamberdir.","not":"Ürdün'de Petra yakınındaki Hârûn dağında ona nispet edilen makam bulunur. Farklı rivayetler bulunmaktadır.","q":"Harun","xy":[501.17,154.92],"uzun":["Hz. Hârûn, Hz. Mûsâ'nın ağabeyidir ve Kur'ân-ı Kerîm'de güzel konuşan biri olarak anılır. Mûsâ'nın duası üzerine ona yardımcı ve peygamber olarak verildi. Mûsâ Tûr'a gittiğinde kavminin başına onu vekil bıraktı.","Mûsâ ile birlikte apaçık delillerle Firavun'a gönderildi ve tebliğde kardeşinin sözcüsü ve destekçisi oldu. Firavun'un sihirbazları yenilip iman edince \"Mûsâ ve Hârûn'un Rabbine iman ettik\" dediler.","Mûsâ'nın yokluğunda Sâmirî'nin yaptığı altın buzağıya kavmi tapınca Hârûn onları uyardı, ancak sözünü dinletemedi. Kur'an'a göre Mûsâ dönünce kavim arasında ayrılık çıkmasından korktuğunu söyledi. Ehl-i sünnet âlimleri, Hârûn'un bu olayda hiçbir kusuru olmadığını vurgular.","İslâmî rivayetlere göre Hz. Mûsâ'dan önce, Tîh çölündeki yıllarda bir dağda vefat etti. Kabrinin bulunduğuna inanılan yer, Ürdün'de Petra'nın yakınındaki Cebel-i Hârûn'un zirvesindedir ve üzerinde küçük bir türbe bulunur."]},{"k":"p","ad":"Hz. Musa A.S.","il":"Kudüs","u":"PSX","oz":"Kendisine Tevrat verilen, İsrâiloğulları'nı Mısır'dan çıkaran peygamberdir.","not":"Eriha yolu üzerindeki Nebî Mûsâ makamı ona nispet edilir. Farklı rivayetler bulunmaktadır.","q":"Musa","xy":[500.58,150.19],"uzun":["Hz. Mûsâ, İsrâiloğulları'na gönderilen ve kendisine Tevrat indirilen ülü'l-azm bir peygamberdir. Firavun'un İsrâiloğulları'nın erkek çocuklarını öldürttüğü bir dönemde doğdu. Annesi, Allah'ın ilhamıyla onu bir sandığa koyup nehre bıraktı; sandık Firavun'un ailesi tarafından bulundu ve Firavun'un eşi Âsiye'nin isteğiyle hayatı bağışlandı. Hiçbir sütanneyi kabul etmeyince kendi annesine geri verildi.","Gençliğinde kazara bir Mısırlının ölümüne sebep olunca Medyen'e gitti. Orada su başında iki kıza yardım etti ve onlardan biriyle evlenip yıllarca burada kaldı. Ailesiyle Mısır'a dönerken Tûr dağı civarında gördüğü ateşin yanında Allah ona seslendi ve peygamberlikle görevlendirildi; kendisine asâ ve yed-i beyzâ mucizeleri verildi.","Kardeşi Hârûn ile Firavun'a giderek İsrâiloğulları'nın serbest bırakılmasını istedi. Sihirbazlar onun asâsı karşısında yenilip iman etti. Firavun inkârda direnince İsrâiloğulları geceleyin yola çıktı; deniz yarıldı, onlar geçti, Firavun ve ordusu boğuldu.","Kendisine levhalar ve Tevrat verildi. Allah ile aracısız konuştuğu için \"Kelîmullah\" diye anılır. İsrâiloğulları'nın itaatsizliği yüzünden kırk yıl Tîh çölünde kaldılar; Kur'an'da adı en çok geçen peygamberdir.","İslâmî rivayetlere göre Hârûn'dan sonra vefat etti ve ruhunun kutsal topraklara yakın bir yerde alınmasını istedi. Hz. Peygamber'den nakledilen bir hadiste kabrinin yol kenarındaki kırmızı kum tepesinin yanında olduğu bildirilir. Kudüs ile Erîhâ arasındaki Nebî Mûsâ makamı bu rivayetle ilişkilendirilen ziyaret yeridir; TDV kabrin yerinin kesin olarak bilinmediğini, bunların rivayet olduğunu belirtir."]},{"k":"p","ad":"Hz. Yakub A.S.","il":"El Halil","u":"PSX","oz":"Hz. İshak'ın oğlu, İsrâiloğulları'nın atası olan peygamberdir.","not":"Halil'deki Haram-ı İbrâhîmî'de yattığına inanılır. Farklı rivayetler bulunmaktadır.","q":"Yakub","xy":[500.26,151.0],"uzun":["Hz. Ya'kūb, Hz. İshak'ın oğlu ve Hz. İbrâhim'in torunudur. Kur'an'da hem Ya'kūb hem de İsrâil adıyla anılır; \"İsrâiloğulları\" adı ona nispetle verilmiştir.","On iki oğlu oldu ve İsrâiloğulları bu oğulların soyundan geldi. Oğulları arasında en çok Yûsuf'u severdi; Yûsuf'un kaybolması onu derin bir hüzne boğdu ve gözlerine ak düştü. Bu ayrılığa \"sabr-ı cemîl\" (güzel sabır) ile karşılık verdi ve yalnız Allah'a sığındı; Yûsuf'un gömleği yüzüne sürülünce gözleri yeniden gördü.","Kıtlık yıllarında oğulları Mısır'a gitti ve sonunda Yûsuf, babasını ve kardeşlerini Mısır'a getirtti. Kur'an'a göre vefatından önce oğullarına \"Benden sonra kime kulluk edeceksiniz?\" diye sordu; onlar da atalarının ilâhı olan tek Allah'a kulluk edeceklerini söylediler (Bakara 2/133).","147 yaşında vefat etti ve vasiyeti üzerine Hebron'daki mağaraya, babası ve dedesinin yanına defnedildi. Kabri bugün el-Halîl'deki Harem-i İbrâhîmî'dedir."]},{"k":"p","ad":"Hz. Yusuf A.S.","il":"El Halil","u":"PSX","oz":"Hz. Yâkub'un oğlu, Mısır'da yüksek mevkiye ulaşan peygamberdir.","not":"Nablus'ta da ona nispet edilen bir kabir vardır. Farklı rivayetler bulunmaktadır.","q":"Yusuf","xy":[500.26,151.0],"uzun":["Hz. Yûsuf, Hz. Ya'kūb'un oğludur. Kur'an'da onun hayatı, \"kıssaların en güzeli\" diye nitelenen Yûsuf sûresinde baştan sona anlatılır. Babasının onu çok sevmesi ve gördüğü rüya sebebiyle kardeşleri onu kıskandı ve bir kuyuya attılar; ardından geçen bir kervan onu bulup Mısır'a götürdü ve sattı.","Mısır'da Kur'an'da \"Azîz\" diye anılan yöneticinin evine satıldı ve güvenilirliği sayesinde evin işleri ona bırakıldı. Azîz'in eşinin isteğini Allah korkusuyla reddetti; iftiraya uğrayarak suçsuz yere zindana atıldı. Zindanda da tevhidi anlattı ve arkadaşlarının rüyalarını yorumladı.","Hükümdarın rüyasını yedi bolluk ve yedi kıtlık yılı olarak yorumladı ve Mısır'ın hazinelerinin başına getirildi. Kıtlık yıllarında erzak almaya gelen kardeşlerine kendini tanıttı, onları affetti ve babası Ya'kūb ile ailesini Mısır'a getirtti; böylece çocukken gördüğü rüya gerçekleşti.","İslâmî kaynaklara göre 110 yaşında vefat etti; naaşı mermer bir sandukaya konularak Nil kıyısına defnedildi. Kemiklerinin daha sonra Filistin'e götürüldüğü de rivayet edilir. TDV, kabrinin el-Halîl'de olduğu yönündeki geleneği de nakleder; farklı rivayetler bulunmaktadır."]},{"k":"p","ad":"Hz. Eyüp A.S. Sabır Makamı","il":"Şanlıurfa","u":"TUR","oz":"Hz. Eyyûb'un hastalığı sırasında kaldığı yer olarak ziyaret edilen makamdır.","not":"Farklı rivayetler bulunmaktadır.","q":"Eyüp Sabır Makamı","xy":[510.5,132.3]},{"k":"p","ad":"Hz. İsmail A.S.","il":"Mekke","u":"SAU","oz":"Hz. İbrâhim'in oğlu, Kâbe'yi babasıyla birlikte inşa eden peygamberdir.","not":"Kâbe'nin yanındaki Hicr-i İsmâil'de defnedildiği rivayet edilir.","q":"İsmail","xy":[513.13,183.71],"uzun":["Hz. İsmâil, Hz. İbrâhim'in Hâcer'den olan oğludur ve babasının yaşlılığında ettiği duanın karşılığı olarak dünyaya geldi. Küçük yaşta annesiyle birlikte, babası tarafından bugünkü Kâbe'nin bulunduğu kurak vadiye bırakıldı. Susuzluk içinde kalan Hâcer'in Safâ ile Merve arasında koşması ve ardından zemzem suyunun çıkması bu hatıraya dayanır.","Kur'an, kurban edilmek istenen oğlun adını açıkça belirtmez; ancak TDV, Kur'an'ın ifadeleri ve haccın menâsikiyle bağlantısı sebebiyle bunun İsmâil olduğu görüşünü destekler. Babasının rüyasını duyunca \"Babacığım, emrolunduğun şeyi yap; inşallah beni sabredenlerden bulacaksın\" dedi. Allah, onun yerine bir koç göndererek teslimiyetlerini kabul etti; bu yüzden \"Zebîhullah\" diye anılır.","Babasıyla birlikte Kâbe'nin temellerini yükseltti ve taş taşıyarak inşaatta çalıştı. Kur'an, ikisinin bu sırada ettikleri duayı aktarır. Arapların nesebi ona dayanır; Hz. Peygamber de onun soyundandır.","TDV'ye göre 137 yaşında vefat etti ve Kâbe'nin yanındaki Hicr'e, annesi Hâcer'in yanına defnedildi. Ömrünün sonuna kadar Kâbe'nin hizmeti ve bakımı onda kaldı."]},{"k":"p","ad":"Hz. Cercis A.S.","il":"Hakkâri","u":"TUR","oz":"Cercîs adıyla anılan bir peygambere nispet edilir.","not":"Musul'da da ona nispet edilen bir makam vardır. Farklı rivayetler bulunmaktadır.","q":"Cercis","xy":[523.5,131.36]},{"k":"p","ad":"Hz. Hud A.S.","il":"Mekke","u":"SAU","oz":"Âd kavmine gönderilen peygamberdir.","not":"Yemen'deki Hadramut'ta da ona nispet edilen bir kabir vardır. Farklı rivayetler bulunmaktadır.","q":"Hud","xy":[513.13,183.71],"uzun":["Hz. Hûd, Kur'ân-ı Kerîm'e göre Âd kavmine gönderilen peygamberdir; soyu Hz. Nûh'a bağlanır. Âd kavmi, Ahkāf bölgesinde yaşayan, sağlam yapılar inşa eden, güçlü ve zengin bir topluluktu. Kur'an'da onun adını taşıyan bir sûre vardır.","Kavmini hiçbir ücret istemeden yalnız Allah'a kulluğa ve tövbeye çağırdı. Kavmi gücüne ve servetine güvenerek putlarını bırakmadı, onu akılsızlıkla ve yalancılıkla suçladı ve tehdit ettiği azabı getirmesini istedi.","Allah, inkârları sebebiyle Âd kavmini yedi gece sekiz gün süren dondurucu bir kasırgayla helâk etti. Kavim, vadilerine doğru gelen bulutu yağmur bulutu sanarak sevindi; ancak gelen azaptı. Yalnız Hûd ve ona iman edenler kurtuldu.","Kabrinin yeri hakkında farklı rivayetler bulunmaktadır. TDV'ye göre bir rivayette Mekke'de Kâbe ile zemzem arasına defnedilmiştir; Yemen'deki Hadramut bölgesinde, Dımaşk'ta Emevî Camii'nde ve Filistin'de olduğu da nakledilir. Hadramut'taki kabri bugün de önemli bir ziyaret yeridir."]},{"k":"p","ad":"Hz. Süleyman A.S.","il":"Kudüs","u":"PSX","oz":"Hz. Dâvûd'un oğlu, peygamber ve hükümdardır.","not":"Farklı rivayetler bulunmaktadır.","q":"Süleyman","xy":[500.58,150.19],"uzun":["Hz. Süleyman, Hz. Dâvûd'un oğludur ve hem peygamber hem hükümdar olarak İsrâiloğulları'na gönderilmiştir. Kur'an'da on yedi yerde anılır ve şükreden, sâlih, hikmet sahibi bir kul olarak tanıtılır. Allah ona babası gibi peygamberlik, hükümdarlık, hikmet ve ilim verdi.","Kur'an'a göre Allah onun duasını kabul ederek ona kimseye verilmemiş bir mülk bahşetti. Rüzgâr emrine verildi; bina yapan ve dalgıçlık eden cinler ona hizmet etti. Kuşların ve hayvanların dilini bilirdi; bir karıncanın arkadaşlarını uyarmasını işitince tebessüm edip Allah'a şükretti.","Hüdhüd kuşunun getirdiği haber üzerine Sebe melikesi Belkıs'ı tek Allah'a davet eden bir mektup gönderdi. Belkıs onun sarayına geldi, billur zemini su sanıp eteklerini topladı, ardından gerçeği görerek Süleyman ile birlikte âlemlerin Rabbine teslim oldu. Kudüs'teki mabedi, bugünkü Mescid-i Aksâ'nın bulunduğu yerde, insanlar ve cinlerin çalışmasıyla inşa ettirdi.","Kur'an'a göre asâsına dayanmış hâlde vefat etti; cinler, asâyı kemiren bir kurt onu yere düşürünce ancak öldüğünü anladılar. Kırk yıl hüküm sürdüğü nakledilir. Kudüs'te, babası Dâvûd'un yakınına defnedildiği rivayet edilir; Harem-i Şerif içinde ona nispet edilen bir makam (Kürsî-i Süleyman) bulunur."]},{"k":"p","ad":"Hz. Nebi Samuel A.S.","il":"Doğu Kudüs","u":"PSX","oz":"Samuel (Şemûil) peygambere nispet edilen makamdır.","not":"Kudüs'ün kuzeyindeki Nebî Samuel tepesindedir. Farklı rivayetler bulunmaktadır.","q":"Nebi Samuel","xy":[500.63,150.19]},{"k":"s","ad":"Hz. Malik bin Eşter R.A.","il":"Kahramanmaraş","u":"TUR","not":"Halk arasında sahabeye nispet edilen bir kabir veya türbedir. Farklı rivayetler bulunmaktadır.","q":"Malik bin Eşter","xy":[505.17,130.34]},{"k":"s","ad":"Hz. Yuşa R.A.","il":"Gaziantep","u":"TUR","not":"Hz. Yûşa'ya nispet edilen kabirlerden biridir. TDV'ye göre Yûşa'nın İstanbul'dan Kuzey Afrika'ya kadar birçok yerde kabri olduğu ileri sürülür.","q":"Yuşa","xy":[505.83,133.33]},{"k":"s","ad":"Hz. Abdurrahman bin Avf R.A.","il":"Erzurum","u":"TUR","not":"TDV'ye göre Abdurrahman b. Av 32.04]},{"k":"e","ad":"Şeyh Ali Zülfo (Şeyh Ali Zülfikar)","il":"Adana","u":"TUR","not":"Halk arasında bu zâta nispet edilen türbe veya kabirdir. Farklı rivayetler bulunmaktadır.","q":"Şeyh Ali Zülfo","xy":[501.96,132.04]},{"k":"e","ad":"Akşemseddin Hz. (Muhammed bin Hamza)","il":"Bolu","u":"TUR","oz":"Fâtih Sultan Mehmed'in hocası, İstanbul'un fethinde bulunan âlim ve mutasavvıftır; Ebû Eyyûb el-Ensârî'nin kabrini tespit ettiği rivayet edilir.","not":"Halk arasında bu zâta nispet edilen türbe veya kabirdir. Farklı rivayetler bulunmaktadır.","q":"Akşemseddin","xy":[491.52,121.8],"uzun":["Akşemseddin'in asıl adı Şemseddin Muhammed b. Hamza'dır; 792 (1390) yılında Şam'da doğdu. Yedi yaşında babasıyla birlikte Anadolu'ya gelerek Amasya'nın Kavak ilçesine yerleşti. Hâfız oldu, dinî ilimleri tahsil etti ve Osmancık Medresesi'nde müderrislik yaptı; tıp ilmini de derinlemesine öğrendi.","Manevî bir rehber arayışıyla önce Halep'e yöneldiyse de gördüğü bir rüya üzerine Ankara'ya dönüp Hacı Bayram-ı Velî'ye intisap etti. Ağır bir riyazetin ardından kısa sürede hilâfet aldı ve Bayramiyye'nin Şemsiyye kolunun kurucusu oldu.","İstanbul kuşatması sırasında Fâtih Sultan Mehmed'in yanında bulundu ve zor günlerde yazdığı mektuplarla padişahın ve ordunun manevî gücünü yükseltti. Fetihten sonra Ayasofya'da ilk cuma hutbesini okudu ve Fâtih'in isteğiyle Ebû Eyyûb el-Ensârî'nin kabrini buldu. Hastalıkların gözle görülmeyen canlılar yoluyla bulaştığı fikrini Batı'dan çok önce ileri sürdüğü kabul edilir; Maddetü'l-hayât, Risâletü'n-nûriyye ve Makāmât-ı Evliyâ eserlerindendir.","863 (1459) yılı Şubat ayında Bolu'nun Göynük ilçesinde vefat etti ve buraya defnedildi. Türbesi bugün de ziyaret edilmektedir; oğulları da aynı türbede yatmaktadır."]},{"k":"e","ad":"Mevlana Celaleddin Rumi Hz.","il":"Konya","u":"TUR","oz":"Mesnevî'nin yazarı, Mevlevîliğin pîri büyük mutasavvıf ve şairdir (ö. 1273).","not":"Halk arasında bu zâta nispet edilen türbe veya kabirdir. Farklı rivayetler bulunmaktadır.","q":"Mevlana Celaleddin Rumi","xy":[493.46,129.98],"uzun":["Mevlânâ Celâleddîn-i Rûmî, 604 (1207) yılında Horasan'ın Belh şehrinde doğdu. Babası, \"Sultânü'l-ulemâ\" diye anılan âlim Bahâeddin Veled'dir. Aile uzun bir yolculuktan sonra Anadolu Selçuklu Sultanı Alâeddin Keykubad'ın daveti üzerine 626 (1229) civarında Konya'ya yerleşti. Mevlânâ Halep ve Şam'da tahsilini tamamladı, babasının vefatından sonra müderrisliğe başladı ve Seyyid Burhâneddin'den tasavvufî terbiye aldı.","Hayatının dönüm noktası 642 (1244) yılında Konya'ya gelen Şems-i Tebrîzî ile karşılaşması oldu. Şems ile yaptığı sohbetler onu aşk ve semâ ağırlıklı bir hayata yöneltti. Şems'in ortadan kaybolması Mevlânâ'da derin bir acı bıraktı; Dîvân-ı Kebîr'deki şiirlerin büyük kısmı bu dönemde söylendi. Daha sonra Selâhaddîn-i Zerkûb ve Hüsâmeddin Çelebi ile sohbetlerini sürdürdü.","En önemli eseri, Hüsâmeddin Çelebi'nin teşvikiyle yazdığı Farsça Mesnevî'dir; Dîvân-ı Kebîr, Fîhi Mâ Fîh, Mecâlis-i Seb'a ve Mektûbât diğer eserleridir. Düşüncesinin kaynağı Kur'an ve Sünnet'tir; Mesnevî \"Kur'an'ın Farsça tefsiri\" diye nitelenmiştir. Kulun benliğinden sıyrılarak Hakk'a ulaşmasını, aklın yetersiz kaldığı yerde aşkın yol gösterdiğini anlatır. \"Ben yaşadıkça Kur'an'ın kölesiyim, Hz. Muhammed'in yolunun toprağıyım\" sözü onun bu bağlılığını özetler.","5 Cemâziyelâhir 672 (17 Aralık 1273) tarihinde Konya'da vefat etti. Ölüm gününü sevgiliye kavuşma vakti olarak gördüğü için bu güne \"Şeb-i Arûs\" (düğün gecesi) denir. Cenazesine farklı din ve mezheplerden çok sayıda insan katıldı. Konya'daki Yeşil Türbe ve etrafındaki Mevlânâ Külliyesi bugün Türkiye'nin en çok ziyaret edilen yerlerindendir."]},{"k":"e","ad":"Merkez Efendi Hz.","il":"İstanbul","u":"TUR","oz":"Halvetî şeyhi, Mesir macununun ilk hazırlayıcısı olarak bilinen mutasavvıftır.","not":"Halk arasında bu zâta nispet edilen türbe veya kabirdir. Farklı rivayetler bulunmaktadır.","q":"Merkez Efendi","xy":[484.31,120.06],"uzun":["Merkez Efendi'nin asıl adı Mûsâ Muslihuddin'dir; muhtemelen 868 (1463-64) yılında Denizli'nin Sarı Mahmudlu köyünde doğdu. İlk tahsilini memleketinde yaptıktan sonra Bursa'da yaklaşık on beş yıl ilim tahsil etti ve 898 (1493) yılında İstanbul'a geldi.","İstanbul'da Halvetî şeyhi Sünbül Sinan Efendi'ye intisap etti. \"Merkez\" lakabını, şeyhinin sorduğu bir soruya \"Kâinatın merkezi insan, insanın merkezi kalptir\" mealinde verdiği cevaba duyduğu memnuniyetten aldığı rivayet edilir. Sünbül Efendi'den hilâfet alarak irşada başladı.","Şeyhinin isteğiyle Hafsa Sultan'ın Manisa'daki külliyesine gönderildi ve burada uzun yıllar irşad faaliyetinde bulundu. Mesir macunuyla ilgili rivayetler meşhurdur; TDV bu rivayetlerin çağdaş kaynaklarla tam uyuşmadığını belirtir. Sünbül Efendi'nin vefatından sonra (936/1529) İstanbul'a dönerek Koca Mustafa Paşa Dergâhı'nda şeyhlik makamına geçti.","959 (1552) yılında vefat etti ve Mevlânakapı dışındaki dergâhının yanına defnedildi. Türbesi, yanındaki ayazmasıyla birlikte İstanbul'un en önemli ziyaretgâhlarından biridir."]},{"k":"e","ad":"Şeyh Bedrettin Hz.","il":"Malatya","u":"TUR","not":"Halk arasında bu zâta nispet edilen türbe veya kabirdir. Farklı rivayetler bulunmaktadır.","q":"Şeyh Bedrettin","xy":[508.22,128.45]},{"k":"e","ad":"İbrahim Tennuri Hz.","il":"Kayseri","u":"TUR","not":"Halk arasında bu zâta nispet edilen türbe veya kabirdir. Farklı rivayetler bulunmaktadır.","q":"İbrahim Tennuri","xy":[502.38,127.8]},{"k":"e","ad":"Saruhan Bey Hz.","il":"Manisa","u":"TUR","not":"Halk arasında bu zâta nispet edilen türbe veya kabirdir. Farklı rivayetler bulunmaktadır.","q":"Saruhan Bey","xy":[482.3,127.82]},{"k":"e","ad":"Haki Baba Hz.","il":"Manisa","u":"TUR","not":"Halk arasında bu zâta nispet edilen türbe veya kabirdir. Farklı rivayetler bulunmaktadır.","q":"Haki Baba","xy":[482.3,127.82]},{"k":"e","ad":"Eroğlu Nuri Yahşi Hz.","il":"Antalya","u":"TUR","not":"Halk arasında bu zâta nispet edilen türbe veya kabirdir. Farklı rivayetler bulunmaktadır.","q":"Eroğlu Nuri şeyhlerden feyz aldı ve uzun yıllar şehir şehir dolaşarak kendisini anlayacak bir dost aradı. Bu gezgin hayatı sebebiyle \"Şems-i Perende\" (uçan Şems) diye de anıldığı rivayet edilir.","642 (1244) yılında Konya'ya geldi ve Mevlânâ ile karşılaştı. Aralarındaki derin dostluk Mevlânâ'nın hayatını kökten değiştirdi; Mevlânâ ders ve vaazlarını bırakarak onunla sohbete daldı. Bu durum çevrede kıskançlığa yol açtı ve Şems bir süre Konya'dan ayrılıp Şam'a gitti; Mevlânâ'nın oğlu Sultan Veled onu geri getirdi.","Sohbetleri Makālât adıyla derlenmiştir. Bu eserde Kur'an'a ve Hz. Peygamber'in sünnetine bağlılığı, gösterişten uzak samimi bir kulluğu ve kalbin uyanıklığını vurgular.","645 (1247) yılı civarında Konya'da ortadan kayboldu. Akıbeti hakkında farklı rivayetler bulunmaktadır; bir rivayete göre şehid edilerek Konya'daki bir kuyuya atılmış, bugünkü makamının bulunduğu yere defnedilmiştir. Konya'daki Şems-i Tebrîzî Camii ve türbesi onun makamı olarak ziyaret edilir; İran'ın Hoy şehrinde de ona nispet edilen bir kabir bulunur."]},{"k":"e","ad":"Seyyid Ahmet İzzet Efendi Hz. (Lokmacı Dede)","il":"İstanbul","u":"TUR","not":"Halk arasında bu zâta nispet edilen türbe veya kabirdir. Farklı rivayetler bulunmaktadır.","q":"Seyyid Ahmet İzzet Efendi","xy":[484.31,120.06]},{"k":"e","ad":"Muhammed Bin Abdullah El Buhari Hz.","il":"Ankara","u":"TUR","not":"Halk arasında bu zâta nispet edilen türbe veya kabirdir. Farklı rivayetler bulunmaktadır.","q":"Muhammed Bin Abdullah El Buhari","xy":[493.79,124.23]},{"k":"e","ad":"Manisa Mevlevihane ve Yatırlar","il":"Manisa","u":"TUR","not":"Halk arasında bu zâta nispet edilen türbe veya kabirdir. Farklı rivayetler bulunmaktadır.","q":"Manisa Mevlevihane ve Yatırlar","xy":[482.3,127.82]},{"k":"e","ad":"Nasreddin Hoca Hz.","il":"Konya","u":"TUR","oz":"Fıkralarıyla tanınan, Akşehir'de yaşamış halk bilgesidir.","not":"Halk arasında bu zâta nispet edilen türbe veya kabirdir. Farklı rivayetler bulunmaktadır.","q":"Nasreddin Hoca","xy":[493.46,129.98 . Farklı rivayetler bulunmaktadır.","q":"İbrahim Hakkı","xy":[518.67,130.38],"uzun":["İbrâhim Hakkı Erzurûmî, 1115 (1703) yılında Erzurum'un Hasankale ilçesinde doğdu. Babası Derviş Osman Efendi, Siirt yakınlarındaki Tillo'ya giderek İsmâil Fakîrullah'a intisap etti. İbrâhim Hakkı dokuz yaşındayken Tillo'ya götürüldü.","Tillo'nun büyük mürşidi İsmâil Fakîrullah'ın yanında hem ilim hem tasavvuf eğitimi aldı. Şeyhinin vefatına kadar ona hizmet etti; ardından İstanbul'a giderek Sultan I. Mahmud ile görüştü ve saray kütüphanesinden faydalandı.","1170 (1757) yılında tamamladığı Mârifetnâme, dinî ilimlerle birlikte astronomi, anatomi, fizyoloji ve tıp gibi pek çok ilmi ele alan ansiklopedik bir eserdir. \"Hak şerleri hayreyler, zannetme ki gayreyler\" diye başlayan tevekkül manzumesi asırlardır dilden dile dolaşır.","1194 (1780) yılında Tillo'da vefat etti ve kendi planladığı türbeye, şeyhi İsmâil Fakîrullah'ın kubbesi altına defnedildi. Türbenin kubbesine yılda iki kez güneş ışığının düşecek şekilde yapıldığı bilinir; Mart ve Eylül aylarında görülen bu ışık hadisesi binlerce ziyaretçiyi Tillo'ya çeker."]},{"k":"e","ad":"Bedir Muhtar Hz.","il":"Aksaray","u":"TUR","not":"Halk arasında bu zâta nispet edilen türbe veya kabirdir. Farklı rivayetler bulunmaktadır.","q":"Bedir Muhtar","xy":[497.1,128.96]},{"k":"e","ad":"Ahmed-i Sarban Hz.","il":"Tekirdağ","u":"TUR","not":"Halk arasında bu zâta nispet edilen türbe veya kabirdir. Farklı rivayetler bulunmaktadır.","q":"Ahmed-i Sarban","xy":[480.76,120.21]},{"k":"e","ad":"Seyyid İshak Çelebi Hz.","il":"Manisa","u":"TUR","not":"Halk arasında bu zâta nispet edilen türbe veya kabirdir. Farklı rivayetler bulunmaktadır.","q":"Seyyid İshak Çelebi","xy":[482.3,127.82]},{"k":"e","ad":"Eşrefoğlu Rumi Hz.","il":"Bursa","u":"TUR","oz":"Eşrefiyye tarikatının kurucusu, Müzekki'n-nüfûs'un yazarı mutasavvıftır.","not":"Halk arasında bu zâta nispet edilen türbe veya kabirdir. Farklı rivayetler bulunmaktadır.","q":"Eşrefoğlu Rumi","xy":[484.79,123.25],"uzun":["Eşrefoğlu Rûmî'nin asıl adı Abdullah'tır; Hz. Peygamber'in soyundan geldiği rivayet edilen, âlim ve şeyh yetiştirmiş bir aileye mensuptur. Ailesi Mısır ve Suriye üzerinden Anadolu'ya göç ederek İznik'e yerleşti. İleri yaşta Bursa'da medrese tahsiline başladı.","Medreseyi bırakıp manevî yola yöneldi ve Emîr Sultan'ın yönlendirmesiyle Hacı Bayram-ı Velî'nin dergâhına girdi. Yıllarca hizmet ettikten sonra Hacı Bayram onu damadı yaptı ve İznik'e halife olarak gönderdi. Daha sonra Hama'da Şeyh Hüseyin el-Hamevî'den Kādirî hilâfeti aldı; Kādiriyye'nin Eşrefiyye kolu ona nispet edilir.","Türkçe yazdığı Müzekki'n-nüfûs, nefis terbiyesine dair asırlarca okunan bir ahlâk kitabıdır. Yunus Emre'nin tesirini taşıyan Divan'ı ve Tarîkatnâme'si de vardır; \"Eşrefoğlu Rûmî, sen dahi bunda kalmayasın\" gibi ilâhileri bugün de okunur.","874 (1469-70) yılında İznik'te vefat etti ve dergâhının hazîresine defnedildi. Dergâhı sonradan camiye çevrildi; türbesi İznik'in en önemli ziyaret yerlerindendir."]},{"k":"e","ad":"Habib Baba Hz. (Timurtaş Baba)","il":"Erzurum","u":"TUR","not":"Halk arasında bu zâta nispet edilen türbe veya kabirdir. Farklı rivayetler bulunmaktadır.","q":"Habib Baba","xy":[516.41,123.78]},{"k":"e","ad":"Ertuğrul Gazi Hz.","il":"Bilecik","u":"TUR","oz":"Osman Gazi'nin babası, Kayı boyunun beyidir.","not":"Halk arasında bu zâta nispet edilen türbe veya kabirdir. Farklı rivayetler bulunmaktadır.","q":"Ertuğrul Gazi","xy":[487.7,123.55]},{"k":"e","ad":"Şeyh ül Ümran Hz.","il":"Bolu","u":"TUR","not":"Halk arasında bu zâta nispet edilen türbe veya kabirdir. Farklı rivayetler bulunmaktadır.","q":"Şeyh ül Ümran","xy":[491.52,121.8]},{"k":"e","ad":"Şeyh Maksud Hz.","il":"Şanlıurfa","u":"TUR","not":"Halk arasında bu zâta nispet edilen türbe veya kabirdir. Farklı rivayetler bulunmaktadır.","q":"Şeyh Maksud","xy":[510.5,132.3]},{"k":"e","ad":"Şah Bey Hz. (Şeyh Beğ)","il":"Samsun","u":"TUR","not":"Halk arasında bu zâta nispet edilen türbe veya kabirdir. Farklı rivayetl , Sikkînî'nin kolu Bayramî Melâmîliği olarak devam etti.","833 (1430) yılında Ankara'da vefat etti ve kendi adını taşıyan caminin yanına defnedildi. Türbesi Ankara'nın en önemli ziyaretgâhıdır; caminin bitişiğinde Roma dönemine ait Augustus Mabedi bulunur."]},{"k":"e","ad":"Somuncu Baba Hz.","il":"Aksaray","u":"TUR","oz":"Hacı Bayram-ı Velî'nin şeyhi olan mutasavvıf Hâmidüddin Aksarâyî'dir.","not":"Halk arasında bu zâta nispet edilen türbe veya kabirdir. Farklı rivayetler bulunmaktadır.","q":"Somuncu Baba","xy":[497.1,128.96],"uzun":["Somuncu Baba'nın asıl adı Hamîdüddin Aksarâyî'dir ve Hamîd-i Velî diye de anılır; çağdaşı Kemal Ümmî'nin bir mersiyesinden adının Abdullah olduğu da anlaşılmaktadır. Kaynakların çoğu onu Kayserili olarak gösterir. Erdebil'de Alâeddin Erdebîlî'ye intisap etti ve şeyhinin emriyle Anadolu'ya dönerek Bursa'ya yerleşti.","Bursa'da kendini gizleyerek yaşadı; pişirdiği somunları sokak sokak dağıttığı için \"Somuncu Baba\" lakabını aldı. Yıldırım Bayezid'in yaptırdığı Ulucami'nin açılışında Emîr Sultan'ın tavsiyesiyle ilk hutbeyi okudu ve Fâtiha sûresini yedi farklı şekilde tefsir ederek dinleyenleri hayran bıraktı. Ardından şöhretten kaçarak Bursa'dan ayrıldı.","Hacı Bayram-ı Velî, Somuncu Baba'ya intisap ederek tasavvuf yoluna girdi ve onun en önemli halifesi oldu. Şeyhiyle birlikte hacca gitti ve onun izniyle Ankara'ya yerleşti. Molla Fenârî gibi âlimlerin de onun çevresinde bulunduğu nakledilir.","815 (1412) yılında vefat etti. TDV'ye göre Abdurrahman el-Askerî onun Aksaray'da Kızıltepe üzerindeki türbesine defnedildiğini yazar; bazı araştırmalar ise kabrinin Malatya Darende'de olduğunu ileri sürer. Farklı rivayetler bulunmakla birlikte Aksaray'daki türbe asırlardır ziyaret edilmektedir."]},{"k":"e","ad":"Arap Baba Hz. (Kahireli Albay - Niğde)","il":"Niğde","u":"TUR","not":"Halk arasında bu zâta nispet edilen türbe veya kabirdir. Farklı rivayetler bulunmaktadır.","q":"Arap Baba","xy":[499.25,130.44]},{"k":"e","ad":"Piri Mehmet Paşa Hz.","i t ve ahlâk konuları \"şeriat, tarikat, marifet, hakikat\" kapıları çerçevesinde anlatılır; eserin yazarlığı tartışmalıdır. TDV, onunla ilgili sonraki dönemlere ait bazı inanç ve rivayetlerin tarihî şahsiyetinden ayrı değerlendirilmesi gerektiğini belirtir.","669 (1271) civarında Sulucakarahöyük'te vefat ettiği tahmin edilmektedir. Bektaşîlik tarikatı XVI. yüzyılda Balım Sultan tarafından bugünkü şekliyle teşkilatlandırıldı. Türbesi ve dergâhı Nevşehir'in Hacıbektaş ilçesindedir."]},{"k":"e","ad":"Ahi Evran-ı Veli Hz.","il":"Kırşehir","u":"TUR","oz":"Ahîlik teşkilatının kurucusu kabul edilen mutasavvıf ve esnaf önderidir.","not":"Halk arasında bu zâta nispet edilen türbe veya kabirdir. Farklı rivayetler bulunmaktadır.","q":"Ahi Evran-ı Veli","xy":[497.77,125.75],"uzun":["Ahî Evran'ın asıl adı Şeyh Nasîrüddin Mahmûd b. Ahmed el-Hûyî'dir. İran'ın Hoy şehrinde doğduğu ve Asya'nın iç kesimlerinden Anadolu'ya gelen mutasavvıflardan olduğu bilinir. Tarihî bir kişilik olmakla birlikte hayatı menkıbelerle iç içedir.","Bir süre Denizli, Konya ve Kayseri'de yaşadı ve pek çok şehir ve kasabayı dolaştı. Bu yolculuklar sırasında esnaf ve sanatkârları ahlâk ve meslek kurallarına göre teşkilatlandıran Ahîlik teşkilatının kuruluşunda ve yayılmasında önemli rol oynadı. Debbağlık yaptığı rivayeti onun debbağ esnafının piri olarak anılmasına yol açtı.","Daha sonra Kırşehir'e yerleşti ve ömrünün sonuna kadar burada kaldı. Hacı Bektaş-ı Velî ile yakınlığı Vilâyetnâme'de anlatılır; XIV. yüzyılın başında Gülşehrî onun hakkında bir mesnevi kaleme almıştır.","Ölüm tarihi kesin olarak bilinmemektedir; araştırmalarda 1262 ile 1300-1317 yılları arası ileri sürülmüştür ve doksan üç yıl yaşadığı rivayet edilir. Kırşehir'deki Ahî Evran Zâviyesi ve türbesi Osmanlı döneminde esnafın manevî merkezi olmuştur; Ahîlik Haftası her yıl onun adıyla kutlanır."]},{"k":"e","ad":"Kılıçarslan Hz. Türbesi (Sultan II. Kılıçarslan)","il":"Aksaray","u":"TUR","not":"Halk arasında bu zâta nispet edilen türbe veya kab     var inp = e.target.closest("#visitDate"); if (!inp || !inp.value) return;
    var key = inp.getAttribute("data-vkey"); if (!V[key]) return;
    var d = new Date(inp.value + "T12:00:00"); if (isNaN(d) || d > new Date()) return;
    V[key].d = d.toISOString(); saveV();
    var sp = document.querySelector("#visitBtn span"); if (sp) sp.textContent = "Ziyaret ettim · " + trDate(V[key].d);
  });
  function markRows() {
    document.querySelectorAll("[data-sah],[data-tb]").forEach(function (r) {
      var key = r.hasAttribute("data-sah") ? "s:" + r.getAttribute("data-sah") : (TB[+r.getAttribute("data-tb")] ? tkey(TB[+r.getAttribute("data-tb")]) : "");
      r.classList.toggle("visited", !!V[key]);
    });
  }
  function closeSheet() { sheet.hidden = true; scrim.hidden = true; if (lastFocus) lastFocus.focus({ preventScroll: true }); }
  scrim.onclick = closeSheet;
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !sheet.hidden) closeSheet(); });
  var sy = null;
  sheet.addEventListener("touchstart", function (e) { if (sheet.scrollTop <= 0) sy = e.touches[0].clientY; }, { passive: true });
  sheet.addEventListener("touchend", function (e) { if (sy != null && e.changedTouches[0].clientY - sy > 80) closeSheet(); sy = null; });

  /* ---------- ziyaretlerim ---------- */
  var TBKEY = {}; TB.forEach(function (t) { TBKEY[tkey(t)] = t.i; });
  function vxy(k) {
    if (k.indexOf("s:") === 0) { var s = SAH[k.slice(2)]; return s && s.xy; }
    var i = TBKEY[k]; return i != null ? TB[i].xy : null;
  }
  function visitsMap(keys) {
    var pts = keys.map(function (k) { return { k: k, xy: vxy(k) }; }).filter(function (p) { return p.xy; });
    if (!pts.length) return "";
    var xs = pts.map(function (p) { return p.xy[0]; }), ys = pts.map(function (p) { return p.xy[1]; });
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    var ar = 1.6, w = Math.max(x1 - x0, 30) * 1.35, hh = Math.max(y1 - y0, 18) * 1.35;
    if (w / hh < ar) w = hh * ar; else hh = w / ar;
    var cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, vx = cx - w / 2, vy = cy - hh / 2;
    var r = w / 140;
    var g = ['<path d="' + DATA.sphere + '" fill="#16324f"/>', '<g stroke="#0e2238" stroke-width="' + (w / 900).toFixed(3) + '">'];
    DATA.shapes.forEach(function (s) { g.push('<path d="' + s.d + '" fill="' + (s.id === "TUR" ? "#3b4f68" : "#2c4360") + '"/>'); });
    g.push("</g>");
    if (w < 120) g.push('<g fill="none" stroke="#5a7394" stroke-width="' + (w / 1200).toFixed(3) + '">' + PROV.map(function (p) { return '<path d="' + p.d + '"/>'; }).join("") + "</g>");
    pts.forEach(function (p) { g.push('<circle data-vgo="' + esc(p.k) + '" cx="' + p.xy[0] + '" cy="' + p.xy[1] + '" r="' + r.toFixed(2) + '" fill="#26a269" stroke="#fff" stroke-width="' + (r * 0.3).toFixed(2) + '" style="cursor:pointer"><title>' + esc(V[p.k].ad) + "</title></circle>"); });
    return '<div class="mapcard vmap"><svg viewBox="' + vx.toFixed(2) + " " + vy.toFixed(2) + " " + w.toFixed(2) + " " + hh.toFixed(2) + '" role="img" aria-label="Ziyaret ettiğin yerlerin haritası">' + g.join("") + "</svg></div>";
  }
  function renderVisits() {
    pageBar("Ziyaretlerim");
    var keys = Object.keys(V).sort(function (a, b) { return V[b].d < V[a].d ? -1 : 1; });
    var h = '<div class="hero"><h1>Ziyaretlerim</h1><span class="tag">' + CHECK + keys.length + ' yer</span></div>';
    if (!keys.length) {
      h += '<p class="empty">Henüz bir yer işaretlemedin. Bir türbe, kabir veya mekânın kartını açıp “Ziyaret ettim olarak işaretle” düğmesine dokunduğunda burada listelenir.</p>';
    } else {
      var byC = {}; keys.forEach(function (k) { var u = V[k].u || "TUR"; (byC[u] = byC[u] || []).push(k); });
      var cs = Object.keys(byC).sort(function (a, b) { return byC[b].length - byC[a].length; });
      h += '<div class="facts">' + '<div class="fact"><small>Toplam</small><b>' + keys.length + ' yer</b></div><div class="fact"><small>Ülke</small><b>' + cs.length + "</b></div></div>";
      h += visitsMap(keys);
      h += cs.map(function (u) {
        return '<section><h2>' + esc(C[u] ? C[u].ad : u) + ' <span class="n">' + byC[u].length + '</span></h2><div class="sahlist">' + byC[u].map(function (k) {
          var v = V[k];
          return '<button type="button" class="row visited" data-vgo="' + esc(k) + '"><span class="t"><b>' + esc(v.ad) + "</b><small>" + esc(v.k + " · " + v.yer + " · " + trDate(v.d)) + "</small></span>" + CHV + "</button>";
        }).join("") + "</div></section>";
      }).join("");
      h += '<p class="src">İşaretlerin yalnızca bu cihazda saklanır.</p>';
    }
    page.innerHTML = h; home.hidden = true; page.hidden = false; window.scrollTo(0, 0);
  }
  page.addEventListener("click", function (e) {
    var b = e.target.closest("[data-vgo]"); if (!b) return;
    var k = b.getAttribute("data-vgo"), v = V[k]; if (!v) return;
    if (k.indexOf("s:") === 0) goCountry(v.u, null, { sah: k.slice(2) });
    else if (TBKEY[k] != null) goCountry(TB[TBKEY[k]].u, null, { tb: TBKEY[k] });
  });

  /* ---------- routing ---------- */
  var homeScroll = 0;
  function route() {
    closeSheet();
    var m = /^#u-([A-Z]{3})$/.exec(location.hash);
    if (location.hash === "#ziyaretlerim") { if (!home.hidden) homeScroll = window.scrollY; fromHome = true; renderVisits(); }
    else if (m && C[m[1]]) { if (!home.hidden) homeScroll = window.scrollY; renderCountry(m[1]); }
    else { page.hidden = true; home.hidden = false; homeBar(); window.scrollTo(0, homeScroll); fromHome = false; }
  }
  window.addEventListener("hashchange", route);
  route();

  if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude/.test(location.hostname)) {
    try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}
  }
})();
</script>

</body>
</html>
